<meta charset="utf-8">
<!-- ── Política de Segurança de Conteúdo (CSP) ────────────────────────────
     Limita de ONDE o navegador pode carregar código e PARA ONDE pode enviar
     dados. Com ela, um script injetado não consegue mandar dados de atleta
     para um servidor de terceiros, nem carregar código de outro domínio.

     LIMITE CONHECIDO E ACEITO: o app é um arquivo único com handlers inline
     (onclick) e estilos inline, então 'unsafe-inline' é obrigatório em script
     e style — a CSP NÃO bloqueia script injetado no próprio HTML. Quem cobre
     esse lado é o escape (esc) e a validação de URL (urlSegura). O ganho aqui
     é impedir origem externa, exfiltração, <base>, <object> e envio de forms.

     Se for adicionar um serviço novo, inclua o domínio aqui — senão ele é
     bloqueado silenciosamente e só aparece no console. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com data:;
  img-src 'self' data: blob: https://firebasestorage.googleapis.com https://*.googleapis.com;
  media-src 'self' data: blob:;
  worker-src 'self' blob:;
  connect-src 'self' blob: https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://firebasestorage.googleapis.com https://cdnjs.cloudflare.com https://*.workers.dev;
  frame-src 'none';
  object-src 'none';
  base-uri 'none';
  form-action 'none';
">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- a barra de status do aparelho acompanha o tema; o script abaixo acerta o
     valor no boot e `definirTema` o atualiza quando o usuário troca -->
<meta name="theme-color" content="#F4F2EE">
<title>Meros360</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icone-m360-192.png" sizes="192x192" type="image/png">
<!-- vários tamanhos: o iOS escolhe o mais próximo do aparelho. Sem o tamanho
     certo ele redimensiona outro e, às vezes, reaproveita um antigo do cache -->
<link rel="apple-touch-icon" sizes="180x180" href="./icone-m360-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="./icone-m360-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="./icone-m360-152.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script>
/* Tema ANTES da primeira pintura. Se isto rodasse junto com o resto do app, o
   aparelho desenharia a tela clara e só depois trocaria para a escura — o
   "flash branco" que todo app de tema escuro tem quando esquecem deste passo.
   Guardado em localStorage, que pode estourar (navegação privada, site data
   bloqueado), então tudo vai dentro de try. */
(function(){
  var p='sistema';
  try{ p=localStorage.getItem('parcial-tema')||'sistema'; }catch(_){}
  function aplica(){
    var escuro=p==='escuro';
    if(p==='sistema'){ try{ escuro=matchMedia('(prefers-color-scheme:dark)').matches; }catch(_){ escuro=false; } }
    document.documentElement.dataset.tema=escuro?'escuro':'claro';
    try{ var m=document.querySelector('meta[name="theme-color"]');
      if(m)m.content=escuro?'#0C0E11':'#F4F2EE'; }catch(_){}
  }
  aplica();
  /* seguindo o sistema, acompanha a troca sem precisar reabrir o app */
  try{ matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(){ if(p==='sistema')aplica(); }); }catch(_){}
  window.__temaPref=function(novo){ if(novo){ p=novo; try{localStorage.setItem('parcial-tema',novo)}catch(_){} } aplica(); return p; };
})();
</script>

<style>
/* ── TEMA ──────────────────────────────────────────────────────────────────
   Toda cor do app sai daqui. O tema escuro redefine ESTES MESMOS nomes, então
   nada mais precisa saber que ele existe — e é por isso que cor solta no meio
   do CSS ou num style inline é bug: ela não vira no escuro.

   Há um único bloco escuro, em `[data-tema="escuro"]`. O atributo é escrito no
   <html> antes da primeira pintura (ver o script no <head>), inclusive quando
   a preferência é "seguir o sistema" — assim não existe o mesmo bloco escrito
   duas vezes, uma para a media query e outra para a escolha manual, que é como
   essas duas versões começam a divergir. */
:root{
  color-scheme:light;
  /* superfícies, da mais ao fundo para a mais à frente */
  --deck:#F4F2EE; --card:#FFF; --card-2:#F4F2EE;
  --line:#E4E0D8; --line-forte:#CFC9BE;
  /* texto */
  --ink:#141A1F; --ink-2:#5E6A74; --ink-3:#8C959D;
  /* acentos */
  --clock:#D92D23; --rope:#E8A900; --water:#0E6E8C; --ok:#157F58;
  --rope-ink:#8A6700;            /* amarelo não tem contraste como TEXTO no claro */
  /* fundos dos avisos e destaques */
  --water-bg:#EFF6FA; --clock-bg:#FDF3F2; --ok-bg:#EFF8F3; --rope-bg:#FDF8E8;
  /* cartão-herói do relatório: escuro nos dois temas, por isso tem cor própria */
  --lead-bg:#141A1F; --lead-ink:#F4F2EE; --lead-2:#B9C2C9;
  --veu:rgba(18,24,28,.45);      /* véu atrás das folhas */
  /* texto POR CIMA de um acento colorido. No claro os acentos são escuros e
     pedem texto branco; no escuro eles clareiam e passam a pedir texto escuro.
     O amarelo é claro nos dois temas, então tem valor fixo. */
  --sobre-acento:#fff; --sobre-amarelo:#1B1406;
  /* elevação e raios */
  --sh:0 1px 2px rgba(20,26,31,.04),0 6px 18px rgba(20,26,31,.05);
  --sh-2:0 10px 30px rgba(20,26,31,.13);
  --r:16px; --r-sm:11px; --r-lg:20px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --disp:'Barlow Condensed',ui-sans-serif,system-ui,sans-serif;
  --body:'Barlow',ui-sans-serif,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
:root[data-tema="escuro"]{
  color-scheme:dark;
  --deck:#0C0E11; --card:#15181D; --card-2:#1D2127;
  --line:#272C34; --line-forte:#3A424C;
  --ink:#EEF1F4; --ink-2:#9BA5B0; --ink-3:#6F7A85;
  /* os acentos sobem de luminosidade: o azul e o verde do tema claro foram
     escolhidos para contrastar com branco e somem no fundo escuro */
  --clock:#FF6257; --rope:#F5C33B; --water:#56B6D6; --ok:#43C293;
  --rope-ink:#F5C33B;
  --water-bg:#10242D; --clock-bg:#2B1715; --ok-bg:#0F2620; --rope-bg:#282211;
  --lead-bg:#1D2127; --lead-ink:#EEF1F4; --lead-2:#9BA5B0;
  --veu:rgba(0,0,0,.62);
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.32);
  --sh-2:0 12px 34px rgba(0,0,0,.55);
  --sobre-acento:#0C0E11;
}

/* ── Cartão do treino da vez ───────────────────────────────────────────────

.hero{display:block;width:100%;text-align:left;border:0;border-radius:var(--r-lg);padding:18px;margin:14px 0;
  color:var(--lead-ink);background:
    repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px),

  repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px),

  border-radius:var(--r-sm);padding:13px;font-weight:700;font-size:15.5px}
/* célula do calendário: quadrada e sem o tamanho mínimo do botão comum */
.cal-d{min-height:0;padding:0;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-family:var(--body);font-weight:400;letter-spacing:0}
/* os três números do topo do relatório */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kpi-t{display:block;padding:14px 6px;text-align:center;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-sm);min-height:0;font-family:var(--body);text-transform:none;letter-spacing:0}
.kpi-t:disabled{opacity:1;cursor:default}
.kpi-t .v{font-family:var(--mono);font-weight:700;font-size:21px;line-height:1.1}
.kpi-t .v.mini{font-size:16px;line-height:1.3}   /* cabe a faixa inteira, nas duas linhas */
.kpi-t .l{font-family:var(--disp);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
/* ── O RELATÓRIO COMO DOCUMENTO ────────────────────────────────────────────
   Cabeçalho que identifica, seções numeradas, prosa antes do número e fecho
   de metodologia. É o que separa um relatório que se entrega ao técnico de uma
   tela de aplicativo que se rola. */
.doc-cap{margin:14px 0 6px}
.doc-cap h1{font-size:27px;line-height:1.05;letter-spacing:-.01em}
/* rastreabilidade recolhida: o gatilho é discreto, o número é que manda */
.ficha-det>summary{cursor:pointer;font-size:11.5px;color:var(--ink-3);
  margin-top:4px;list-style:none;display:inline-flex;align-items:center;gap:4px}
.ficha-det>summary::-webkit-details-marker{display:none}
.ficha-det>summary::before{content:'▸';font-size:9px;transition:transform .12s}
.ficha-det[open]>summary::before{transform:rotate(90deg)}
.ficha-det>summary:hover{color:var(--ink-2)}
.ficha-det table{margin-top:4px}
/* assinatura do documento: logo + nome, acima do título */
.doc-logo{display:flex;align-items:center;gap:11px;margin:0 0 12px;
  padding-bottom:11px;border-bottom:1px solid var(--line)}
.doc-logo img{height:46px;width:auto;display:block;flex:none}
.doc-logo div{display:flex;flex-direction:column;line-height:1.2}
.doc-logo b{font-family:var(--disp);font-size:17px;letter-spacing:.01em}
.doc-logo span{font-size:11.5px;color:var(--ink-2);letter-spacing:.055em;text-transform:uppercase}
.doc-sub{font-size:14.5px;color:var(--ink-2);margin-top:5px}
.doc-ident{width:100%;margin-top:13px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.doc-ident td{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.doc-ident tr:last-child td{border-bottom:0}
.doc-ident td.rot{width:42%;color:var(--ink-2);font-family:var(--disp);font-size:12.5px;
  letter-spacing:.08em;text-transform:uppercase;padding-right:10px}
.doc-sec{margin:24px 0 0}
.doc-h{display:flex;align-items:baseline;gap:9px;font-size:21px;margin:0 0 3px}
.doc-n{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ink-3);
  border:1.5px solid var(--line-forte);border-radius:7px;padding:1px 7px;flex:0 0 auto}
.doc-sec[data-dom="prova"] .doc-n{color:var(--rope-ink);border-color:var(--rope)}
.doc-sec[data-dom="perf"] .doc-n{color:var(--water);border-color:var(--water)}
.doc-sec[data-dom="carga"] .doc-n{color:var(--clock);border-color:var(--clock)}
.doc-lead{font-size:14.5px;color:var(--ink-2);margin:0 0 4px;max-width:62ch}
.doc-meta{margin:26px 0 0;padding-top:14px;border-top:2px solid var(--ink)}
.doc-meta h3{font-size:15px;margin-bottom:6px}
.doc-meta p{font-size:13px;color:var(--ink-2);margin:0 0 7px;max-width:70ch;line-height:1.5}
/* ── SUPERFÍCIES ───────────────────────────────────────────────────────────
   Peso visual sem imagem. O app é um arquivo só e roda à beira da piscina,
   onde o sinal é ruim: uma foto decente custaria centenas de KB justamente
   onde ela precisa aparecer rápido. As faixas diagonais evocam as raias e
   pesam zero.
   `--agua` existe para que o mesmo gradiente sirva nos dois temas: no escuro
   ele escurece junto, em vez de virar um bloco claro no meio da tela. */
:root{--agua1:#0E4C63; --agua2:#0B2F42; --agua3:#122634;}
:root[data-tema="escuro"]{--agua1:#0B3A4C; --agua2:#082431; --agua3:#0C1A24;}
.sup-agua{color:var(--lead-ink);border:0;background:
  repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px),
  linear-gradient(145deg,var(--agua1) 0%,var(--agua2) 55%,var(--agua3) 100%)}
.sup-agua .eyebrow,.sup-agua .muted,.sup-agua .xs{color:var(--lead-2)}
.sup-agua .eyebrow{color:var(--lead-2)}
/* brilho discreto para cartão claro que precisa de destaque sem virar bloco */
.sup-brilho{background:
  radial-gradient(120% 100% at 0% 0%,var(--card-2) 0%,transparent 60%),var(--card)}
/* a marca em destaque: o tempo é o herói da tela de Marcas */
.pb-tile{flex:1 1 150px;min-width:142px;border-radius:14px;padding:12px 13px;
  background:radial-gradient(130% 120% at 0% 0%,var(--card-2) 0%,transparent 65%),var(--card);
  border:1px solid var(--line);transition:border-color .12s}
.pb-tile.alvo{border-color:var(--rope);box-shadow:inset 3px 0 0 var(--rope)}
.pb-tile .t-num{font-family:var(--mono);font-size:26px;font-weight:800;letter-spacing:-.6px;
  margin:2px 0;font-variant-numeric:tabular-nums;line-height:1}
.faixa-eq{display:flex;align-items:center;gap:7px;margin:11px 0 0;font-family:var(--disp);
  font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.faixa-eq .pt{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
/* faixa da semana */
.dias{display:flex;gap:6px;margin-top:11px}
.dia{flex:1;text-align:center;font-family:var(--disp);font-size:12.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:9px 0;border-radius:10px;border:1.5px solid var(--line);color:var(--ink-3)}
.dia.prog{border-style:dashed;border-color:var(--water);color:var(--water)}
.dia.ok{background:var(--ok);border-color:var(--ok);color:var(--sobre-acento)}
.dia.hj{box-shadow:0 0 0 2px var(--deck),0 0 0 4px var(--clock)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-family:var(--mono);font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:var(--card-2)}
.chip.best{border-color:var(--rope);background:var(--rope-bg);font-weight:700}
.item{border-left:3px solid var(--line);padding:9px 0 9px 12px;margin:10px 0}
.item.sel{border-left-color:var(--clock);background:var(--clock-bg)}
.item .d{font-family:var(--disp);font-weight:700;font-size:19px;text-transform:uppercase}
.item .i{font-family:var(--mono);font-size:13px;color:var(--water);font-weight:700}
.blk{margin:17px 0 4px;display:flex;align-items:center;gap:9px}
.blk .ln{flex:1;height:1px;background:var(--line)}
.lst{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;
  text-align:left;background:none;border-left:none;border-right:none;border-top:none;border-radius:0;
  text-transform:none;font-family:var(--body);font-size:16px;font-weight:400;letter-spacing:0;padding-left:2px}
.av{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--card-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:16px}
.sheet{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;
  background:var(--veu);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .inner{background:var(--card);width:100%;max-width:560px;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px 16px calc(20px + var(--sab));
  transform:translateY(16px);transition:transform .22s;max-height:88vh;overflow:auto}
.sheet.on .inner{transform:translateY(0)}
.grab{width:38px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
.btnlink{display:flex;align-items:center;justify-content:center;text-decoration:none;font-family:var(--body);
  font-weight:600;font-size:15.5px;border:1px solid var(--ink);
  background:var(--ink);color:var(--card);border-radius:var(--r-sm);padding:13px 16px;min-height:48px;width:100%;margin-top:9px}
.btnlink.zap{background:#25D366;border-color:#1EA952;color:#062B14}
.btnlink.out{background:var(--card);color:var(--ink)}
.destin{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.hide{display:none!important}
.doc-rodape{display:none}   /* so existe no papel */
/* o tamanho da marca do rodapé mora FORA do @media print de propósito: se o
   bloco de impressão não se aplicar por qualquer motivo, a imagem de 512px
   não explode na tela */
.doc-rodape img{height:13px;width:13px;display:block}
.ficha th,.ficha td{border:1px solid var(--line);text-align:center;padding:6px 3px;font-size:13.5px}
.ficha td.nome{text-align:left;font-weight:600}
svg.chart{width:100%;height:auto;display:block}
.note{padding:12px 14px;border-left:3px solid var(--water);background:var(--water-bg);font-size:14px;border-radius:0 10px 10px 0}
.note.warn{border-color:var(--clock);background:var(--clock-bg)}
.note.ok{border-color:var(--ok);background:var(--ok-bg)}
/* acordeão (seções recolhíveis) — achata cards aninhados no corpo p/ ficar clean */
.acc-h{cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 15px;width:100%;border:0;background:none;color:inherit;text-align:left;border-radius:0;text-transform:none;letter-spacing:0}
.acc-h .tit{font-family:var(--disp);text-transform:uppercase;letter-spacing:.03em;font-size:17px;font-weight:700}
.acc-chev{font-family:var(--disp);font-size:20px;color:var(--ink-2);transition:transform .15s;display:inline-block}
.accbody{padding:2px 15px 15px}
.accbody>.card,.accbody .card{border:0;box-shadow:none;margin:0;padding:0;background:none}
.accbody .card+.card{margin-top:12px}
/* O cartão dentro do acordeão é ACHATADO (padding:0, sem borda, sem fundo) para
   não virar caixa dentro de caixa. Só que esse `padding:0` tem a mesma
   especificidade do `padding-left:19px` do trilho e vem depois — ganhava, e o
   espaço reservado à barra de cor sumia. A barra, que é absoluta em left:0,
   passava POR CIMA da primeira letra de cada linha: no relatório do Bruno as
   iniciais de "Projeção", "Tempo" e "50 peito" estavam escondidas atrás dela. */
.accbody .card[data-dom]{padding-left:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:390px){
  .grid2{grid-template-columns:1fr}

  nav button b{font-size:17px}
}
/* P3-B — faixa que separa os três níveis do documento */
.doc-nivel{margin:22px 0 2px;padding:7px 0 5px;border-top:2px solid var(--line-forte);
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.doc-nivel span{display:inline-block;background:var(--ink);color:var(--sobre-acento);
  padding:2px 7px;border-radius:4px;margin-right:7px;letter-spacing:.06em}
/* P3-A — o resumo executivo é a folha 1 e termina nela */
.pagina-um{margin-top:10px}
@media print{
  /* O papel é sempre claro. Sem isto, quem está no tema escuro imprime o laudo
     com fundo preto — ou, pior, sai em branco porque a impressora descarta os
     fundos e sobra texto claro sobre papel branco. */
  :root,:root[data-tema="escuro"]{
    --deck:#fff; --card:#fff; --card-2:#F4F2EE; --line:#D8D3C9; --line-forte:#B9B3A8;
    --ink:#101418; --ink-2:#4A545D; --ink-3:#7B848C;
    --clock:#B4241C; --rope:#9A7300; --water:#0B5A73; --ok:#13694A; --rope-ink:#8A6700;
    --water-bg:#F2F8FB; --clock-bg:#FDF4F3; --ok-bg:#F1F8F4; --rope-bg:#FCF8EA;
    --lead-bg:#fff; --lead-ink:#101418; --lead-2:#4A545D;
    --sh:none; --sh-2:none;
  }
  /* SUPERFÍCIES ESCURAS VIRAM PAPEL. Os gradientes de água entraram na v122 e
     esta regra não os acompanhou: o texto ficava escuro (--lead-ink já era
     preto aqui) sobre o azul profundo do gradiente, que a impressora manda
     para o papel. Dava a página ilegível do PDF.
     Em papel, destaque se faz com MOLDURA, não com fundo — fundo colorido a
     impressora descarta ou gasta tinta à toa. */
  :root,:root[data-tema="escuro"]{--agua1:#fff; --agua2:#fff; --agua3:#fff;}
  .report-lead,.hero,.sup-agua,.sup-brilho,.pb-tile{
    background:#fff!important;color:var(--ink)!important;
    border:1px solid var(--line)!important;border-radius:8px!important}
  .report-lead .muted,.report-meta,.sup-agua .muted,.hero-meta,.hero-data{color:var(--ink-2)!important}
  .report-meta b{color:var(--ink)!important}
  .hero-badge,.hero-cta{background:none!important;color:var(--ink)!important;border:1px solid var(--line)!important}
  /* O trilho de domínio é FUNDO, e fundo não imprime. Vira borda, que imprime. */
  .card[data-dom]{border-left:3px solid var(--dom)!important;padding-left:9px!important}
  .card[data-dom]::before{display:none!important}
  /* Etiquetas com fundo preto e texto branco sumiam no papel: o fundo cai, o
     texto branco fica sobre branco. Em papel elas viram contorno. */
  .tag,.pill,.chip,.dia{background:none!important;color:var(--ink)!important;border:1px solid var(--line-forte)!important}
  .z{background:none!important}
  nav,header,.noprint{display:none!important}
  body{padding:0;background:#fff}
  main,#app{max-width:100%!important;padding:0!important;margin:0!important}
  .card{box-shadow:none;border:0;border-top:1px solid #e5e2db;border-radius:0;margin:0;padding:11px 2px;background:#fff}
  .card:first-child{border-top:0}
  .eyebrow{font-size:10.5px}
  h2,h3,.eyebrow{page-break-after:avoid}
  svg,.grid3{break-inside:avoid}   /* tabela longa PODE partir: quem não parte é a linha (tr) */
  details:not([open])>*:not(summary){display:block!important}
  details summary{display:none!important}
  /* P3-A — o resumo executivo ocupa a folha 1 e fecha nela */
  .pagina-um{break-after:page;page-break-after:always}
  .pagina-um .doc-sec{margin-top:10px}
  .doc-nivel{break-before:auto;page-break-before:auto;break-after:avoid;page-break-after:avoid;
    background:none!important;color:var(--ink-2)!important;border-top:1.5px solid var(--line-forte)!important}
  .doc-nivel span{background:none!important;color:var(--ink)!important;border:1px solid var(--line-forte)!important;padding:1px 5px!important}
  /* P3-B — PÁGINAS QUASE VAZIAS. `break-inside:avoid` em TODO cartão empurrava
     um cartão alto inteiro para a folha seguinte e deixava meia folha em
     branco. Cartão curto continua atômico; cartão alto pode partir, desde que
     não parta no meio de um título, de uma linha de tabela ou de um gráfico. */
  .card{break-inside:auto;page-break-inside:auto}
  .card.tight,.kpi,.note,.grid2,.grid3{break-inside:avoid;page-break-inside:avoid}
  tr,li{break-inside:avoid;page-break-inside:avoid}
  thead{display:table-header-group}
  /* o documento impresso quebra por SEÇÃO, não no meio de uma ideia */
  .doc-sec{break-inside:auto;page-break-inside:auto;margin-top:16px}
  .doc-h,.doc-lead{break-after:avoid;page-break-after:avoid}
  .doc-cap h1{font-size:22px}
  .doc-ident{margin-bottom:4px}
  .doc-meta{break-before:auto}
  .acc-h{padding:10px 0!important}
  .accbody{padding:0!important}
  /* rodapé repetido: num PDF que circula entre técnico e atleta, cada folha
     solta precisa dizer de quem é e de quando */
  .doc-rodape{position:fixed;bottom:0;left:0;right:0;font-size:9px;color:var(--ink-3);
    border-top:1px solid var(--line);padding-top:4px;display:flex!important;
    align-items:center;gap:10px;background:#fff}
  .doc-rodape .rod-marca{display:flex;align-items:center;gap:5px;flex:none}
  .doc-rodape .rod-marca img{height:13px;width:13px;display:block}
  .doc-rodape .rod-marca b{color:var(--ink);font-family:var(--disp);letter-spacing:.02em}
  .doc-rodape .rod-url{color:var(--ink-2)}
  .doc-rodape .rod-quem{flex:1;text-align:center}
  .doc-rodape .rod-ver{flex:none}
  /* a faixa da equipe é navegação de TELA; no papel a equipe aparece na
     tabela de identificação, embaixo do nome do atleta */
  .faixa-eq{display:none!important}
  /* A margem de 16mm no topo era apertada demais: o navegador desenha o
     cabeçalho dele (data e título) dentro da margem, e numa página de
     continuação a borda do primeiro cartão caía em cima desse texto — era a
     "sobreposição" da página 2. 20mm no topo e 18mm embaixo dão folga para o
     cabeçalho do navegador E para o nosso rodapé fixo, que agora é mais alto
     por causa da marca. */
  @page{margin:20mm 12mm 18mm}
}

async function enviarConfirmacaoFirebase(user){
  if(!user)return{ok:false,code:'auth/user-token-expired'};

/* ── CAIXA-PRETA: o pro_ como estava ANTES da primeira sincronia ────────────
   Por que isto existe, e por que roda aqui, antes de tudo:

   A persistência offline guarda no navegador uma cópia de cada documento já
   lido. Se o pro_ foi sobrescrito no servidor, essa cópia local AINDA é a
   versão anterior — mas só até o aparelho sincronizar. Aí ela é substituída,
   e a última chance de recuperar vai com ela.

   A página recuperar.html resgata isso de fora do app. Só que ela não serve
   para quem usa o app INSTALADO na tela de início do iPhone: ali o
   armazenamento é isolado do Safari, e a página aberta no navegador não vê o
   cache do app instalado. Para chegar nele é preciso abrir o app — que é
   exatamente o que destrói a cópia.

   Então o app tira a fotografia ele mesmo, no instante em que abre: lê o
   cache ANTES de a sincronia acontecer. É uma corrida contra o SDK, e dá para
   ganhar com folga, porque a sobrescrita dele depende de autenticar e ir à
   rede. Se perdermos, não aparece nada — nunca atrapalha.

   Só leitura, e a conexão fecha na hora, para não travar uma eventual
   migração de esquema do próprio SDK. */
let CAIXA_PRETA=null;
const CAIXA_TODAS={};          /* todas as cópias de pro_ achadas, por id */
const _CAIXA_PRONTA=(async()=>{
  try{
    if(typeof indexedDB==='undefined'||!FB_CONFIG.projectId)return;
    const nome=`firestore/[DEFAULT]/${FB_CONFIG.projectId}/main`;
    // Nunca crie um banco vazio antes do SDK: ele parece um esquema antigo
    // incompleto e fazia o primeiro acesso quebrar em deleteObjectStore.
    if(typeof indexedDB.databases!=='function')return;
    const existente=(await indexedDB.databases()).find(d=>d.name===nome&&d.version>0);
    if(!existente)return;
    const db=await new Promise((res,rej)=>{
      const r=indexedDB.open(nome,existente.version);
      r.onupgradeneeded=()=>{r.transaction.abort();rej(new Error('cache ainda não inicializado'));};
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
      r.onblocked=()=>rej(new Error('bloqueado'));
      setTimeout(()=>rej(new Error('tempo esgotado')),4000);
    });
    db.onversionchange=()=>db.close();
    try{
      const lojas=[...db.objectStoreNames].filter(n=>/^remoteDocuments/.test(n));
      for(const loja of lojas){
        const st=db.transaction(loja,'readonly').objectStore(loja);
        const regs=await new Promise((res,rej)=>{const r=st.getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
        for(const reg of regs){
          /* o app grava o documento inteiro como JSON num campo só, então o
             payload aparece no cache como texto reconhecível — não dependemos
             do formato interno do SDK, que muda de versão para versão. */
          const txt=JSON.stringify(reg);
          if(!/\\"pbs\\"|\\"garmin\\"/.test(txt))continue;
          const id=(txt.match(/documents\\?\/[^/\\]+\\?\/(pro_[A-Za-z0-9_-]+)/)||[])[1];
          if(!id)continue;
          /* achado o documento certo, desce na estrutura até a string JSON */
          let obj=null;
          const cava=(v,d)=>{ if(obj||d>8||v==null)return;
            if(typeof v==='string'){ if(v.length>20&&v[0]==='{'){ try{const o=JSON.parse(v); if(o&&('pbs'in o||'garmin'in o))obj=o;}catch(_){} } return; }
            if(typeof v!=='object')return;
            for(const k of Object.keys(v))cava(v[k],d+1); };
          cava(reg,0);
          /* ⚠️ GUARDAR TODAS, uma por documento. A versão anterior atribuía a
             CAIXA_PRETA dentro do laço e ficava só com a ÚLTIMA encontrada —
             e o cache de um administrador tem VÁRIOS pro_, porque abrir a
             ficha de um atleta lê o pro_ dele. Se a última não fosse a do
             próprio usuário, a conferência via `id !== pro_<meu uid>` não
             fazia nada, em silêncio, justamente para quem mais precisava. */
          if(obj&&(!CAIXA_TODAS[id]||JSON.stringify(obj).length>JSON.stringify(CAIXA_TODAS[id].pro).length))
            CAIXA_TODAS[id]={id,pro:obj,em:Date.now()};
        }
      }
    } finally { db.close(); }
  }catch(_){ /* sem cache, sem IndexedDB, aba privada: segue a vida */ }
})();

/* ── Campos de segurança espelhados (Fase 1 do P0) ─────────────────────────
   As regras do Firestore NÃO conseguem ler dentro de `v` (é uma string JSON).
   Por isso os campos que decidem autorização — dono, equipe, perfil, aprovado —
   são gravados também como campos REAIS do documento. Só assim a regra pode
   exigir "você não pode mudar o seu próprio perfil" ou "só o técnico da equipe
   escreve nos treinos dela". Enquanto as regras novas não são publicadas isto
   é inócuo: só acrescenta campos. */
function camposSeguranca(k,v){
  const o={dono:null,donoEmail:null,equipe:null,perfil:null,aprovado:null,categoria:null};
  const val=(v&&typeof v==='object'&&!Array.isArray(v))?v:{};
  if(k.startsWith('pro_')){
    /* ⚠️ O DONO VEM DO CONTEÚDO, não da chave — e é esta linha que transforma
       a trava do cliente numa garantia do SERVIDOR. A regra do Firestore exige
       `dono == request.auth.uid`; tirando o dono da chave, gravar os dados de
       um atleta dentro de pro_<outro> passava, porque a chave era a "certa".
       Tirando do conteúdo, o documento denuncia a si mesmo e a gravação é
       recusada no servidor, mesmo vinda de um app desatualizado.
       A chave fica de reserva só para documentos antigos, ainda sem `_dono`.
       O split corta o sufixo das versões diárias (pro_<uid>_bk3). */
    o.dono=val._dono||k.slice(4).split('_')[0]||null;
  }
  else if(k.startsWith('pt_')){ o.dono=(k.slice(3).split('_')[0]||null);o.geradorVersao=val.origem?.tipo==='gerador'?(val.origem.versao||null):null; }
  else if(k.startsWith('u_')){
    o.dono=val.id||null;                       /* uid do Firebase, para casar com request.auth.uid */
    o.equipe=val.equipe||null;
    o.perfil=val.perfil||null;
    o.aprovado=val.aprovado===true;
  }
  else if(k.startsWith('eq_')){
    o.equipe=k.split('_')[1]||null;
    /* só o documento da equipe em si tem tecnicoEmail. É o que permite à regra
       reconhecer o responsável técnico da equipe. Criar uma afiliação pública
       nunca concede este papel a um atleta comum ou PRO. */
    o.donoEmail=val.tecnicoEmail?String(val.tecnicoEmail).toLowerCase():null;
  }
  else if(k.startsWith('time_')){
    /* Catálogo público criado por atleta: o uid espelhado permite às regras
       limitar criação/edição ao próprio dono sem expor ou conceder gestão. */
    o.dono=val.dono||k.slice(5)||null;
    o.categoria='time';
  }
  return o;
}
/* ── Trava de tamanho ───────────────────────────────────────────────────────
   Documento do Firestore tem teto RÍGIDO de 1 MiB. Como a gravação é otimista
   (a tela atualiza antes da confirmação), estourar o limite fazia o app parar
   de salvar em silêncio. Agora avisa antes e recusa com mensagem clara. */
const LIM_DOC=1048576, LIM_SEGURO=900000, LIM_AVISO=650000;
function bytesDe(s){ try{ return new Blob([s]).size; }catch(_){ return (s||'').length; } }
function checaTamanho(k,json){
  const b=bytesDe(json);
  if(b>LIM_SEGURO){
    toast(`Não salvei: "${k}" ficou com ${(b/1024).toFixed(0)} KB e o limite por documento é 1024 KB. Remova anexos (fotos/PDFs) das sessões fora d'água.`);
    console.warn('DB.set BLOQUEADO por tamanho',k,b);
    return {ok:false,bytes:b};
  }
  if(b>LIM_AVISO)toast(`Atenção: "${k}" já está com ${(b/1024).toFixed(0)} KB de 1024 KB. Convém remover anexos antigos.`);
  return {ok:true,bytes:b};
}
/* Medidor usado na tela de Diagnóstico — evita ter que abrir o console. */
function tamanhoDados(obj){
  const o=obj||{}, itens=Object.keys(o).map(k=>({secao:k,bytes:bytesDe(JSON.stringify(o[k]||null))}))
    .sort((a,b)=>b.bytes-a.bytes);
  const total=bytesDe(JSON.stringify(o));
  return {total,pct:total/LIM_DOC*100,itens};
}

   não fechava, nenhum aviso aparecia, e o usuário só podia concluir que tinha
   falhado — e redigitar, criando duplicata.

   O dado não se perdia: o Firestore aplica a gravação no cache local na hora
   e sincroniza sozinho depois. O defeito era só não contar isso a ninguém.

   Então: espera um tempo curto pela confirmação do servidor e, se ela não
   vier, segue em frente dizendo a verdade — "salvo neste aparelho, sincroniza
   quando a internet voltar". Se a gravação falhar DEPOIS, o app avisa aí. */
const ESPERA_SERVIDOR=2500;
let _pendentes=0;
async function gravarComEspera(k,v){
  const p=DB.set(k,v);
  const marcador={};
  /* Se já há gravação pendente, o servidor comprovadamente não está
     respondendo: esperar de novo só somaria segundos de botão travado. Uma
     gravação costuma vir em par (Saúde + pro_), e sem isto a segunda cobrava
     a espera inteira outra vez. */
  const espera=_pendentes>0?200:ESPERA_SERVIDOR;
  const r=await Promise.race([p,new Promise(res=>setTimeout(()=>res(marcador),espera))]);
  if(r!==marcador)return r;                       /* servidor confirmou a tempo */
  _pendentes++; marcarSincronia();
  p.then(ok=>{ _pendentes--; marcarSincronia();
      if(ok===false)alerta('Uma gravação não foi aceita',`O servidor recusou a gravação de <b>${esc(k)}</b>. Os dados continuam neste aparelho — confira a conexão e a sua sessão.`); })
   .catch(()=>{ _pendentes--; marcarSincronia(); });
  return 'pendente';
}

  const n=_pendentes+(typeof pendenciasSaude==='function'?pendenciasSaude():0);
  if(n>0){ pm.textContent=`sincronizando ${n}`; pm.className='pill clock'; }
  else { pm.textContent=MODO; pm.className='pill '+(EMREDE?'tec':''); }

async function checarVersaoNova(){
  if(_avisouVersao||!/^https?:$/.test(location.protocol))return;
  try{
    const r=await fetch(location.pathname+'?cb='+Date.now(),
      {cache:'no-store',headers:{'Range':'bytes=0-20000'}});
    if(!r.ok&&r.status!==206)return;
    const m=(await r.text()).match(/const VER='([^']+)'/);
    if(!m||m[1]===VER)return;
    _avisouVersao=true;
    const d=document.createElement('div');
    d.id='avisoVersao';
    d.style.cssText='position:fixed;left:10px;right:10px;bottom:14px;z-index:9999;background:#0f2438;color:#fff;'
      +'border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:14px;'
      +'box-shadow:0 6px 24px rgba(0,0,0,.3)';
    d.innerHTML=`<span style="flex:1;line-height:1.3">Versão <b>${esc(m[1])}</b> disponível — você está na ${VER}.</span>

      <button onclick="document.getElementById('avisoVersao').remove()" aria-label="Fechar" style="border:0;background:transparent;color:#fff;opacity:.65;font-size:20px;line-height:1;padding:0 2px">×</button>`;
    document.body.appendChild(d);
  }catch(_){}
}

/* ── Service worker ────────────────────────────────────────────────────────
   Dá instalação de verdade (ícone, tela cheia), funcionamento sem internet —
   útil à beira da piscina — e resolve o cache do GitHub Pages: o sw.js busca
   o HTML pela REDE PRIMEIRO, então versão nova chega na hora.
   Quando o navegador encontra um sw.js diferente, avisamos com a mesma faixa

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){

}

function anexosPendentes(){

/* Move o que já está gravado em base64 para o Storage. Idempotente: roda de
   novo sem duplicar, porque só toca no que ainda é data:. */
async function migrarAnexos(){
  const st=document.getElementById('migAnexoSt');
  const diz=(t,c)=>{ if(st){st.className='xs '+(c||'muted'); st.innerHTML=t;} };
  if(!fst)return diz('Armazenamento de arquivos indisponível neste modo.','muted');
  if(!S.u)return;
  let n=0, falhas=0, nt=0;
  const total=anexosPendentes();
  for(const s of ((S.pro&&S.pro.seco)||[])){
    for(const campo of ['img','arquivo']){
      if(!ehDataURL(s[campo]))continue;
      diz(`Movendo… ${n+falhas+1} de ${total}`);
      const u=await subirAnexo(anexoPro(S.u.id,s.id,campo==='img'?'image/jpeg':'application/pdf'),s[campo]);
      if(u){ s[campo]=u; n++; } else falhas++;
    }
  }
  if(n)await salvarPro();
  /* PDFs de treino da equipe: só quem pode escrever neles */
  if(ehGestor()&&S.u.equipe){
    for(const meta of (S.tridx||[])){
      let t; try{ t=await DB.get(kTr(S.u.equipe,meta.id)); }catch(_){ continue; }
      if(!t||!ehDataURL(t.pdf))continue;
      diz(`Movendo PDFs de treino… ${nt+1}`);
      const u=await subirAnexo(anexoTreino(S.u.equipe,t.id),t.pdf);
      if(u){ t.pdf=u; await DB.set(kTr(S.u.equipe,t.id),t); nt++; } else falhas++;
    }
  }
  const partes=[];
  if(n)partes.push(`${n} anexo(s) seus`);
  if(nt)partes.push(`${nt} PDF(s) de treino`);
  diz(falhas?`Movidos ${partes.join(' e ')||'nenhum'}. <b>${falhas} falharam.</b> Se falharam todos, o <b>Storage não está ativo</b> no Firebase — ele exige o plano Blaze. Nada foi perdido: os anexos seguem no cadastro e o app continua controlando o tamanho.`
    :(partes.length?`<b>Pronto: ${partes.join(' e ')} movidos.</b> O espaço do documento foi liberado.`
      :'Nada a mover.'),falhas?'warn':'muted');
  render();
}

function fmt(ms,curto){
  if(ms==null||isNaN(ms))return'—';
  const cs=Math.floor(Math.abs(ms)/10),s=Math.floor(cs/100),c=cs%100,m=Math.floor(s/60),sg=s%60,sn=ms<0?'-':'';
  if(m>0)return`${sn}${m}:${String(sg).padStart(2,'0')}.${String(c).padStart(2,'0')}`;
  return`${sn}${curto?sg:String(sg).padStart(2,'0')}.${String(c).padStart(2,'0')}`;
}
function parseTempo(x){
  if(x==null||x==='')return null;
  const t=String(x).trim().replace(/["″]/g,'').replace(/['′h]/g,':').replace(',','.');
  const p=t.split(':').map(n=>parseFloat(n)).filter(n=>!isNaN(n));
  if(!p.length)return null;
  if(p.length===1)return Math.round(p[0]*1000);
  if(p.length===2)return Math.round((p[0]*60+p[1])*1000);
  return Math.round((p[0]*3600+p[1]*60+p[2])*1000);
}
/* Igual a parseTempo, mas usa a DISTÂNCIA para desfazer a ambiguidade de "1.09":
   num 100m, 1,09s é impossível → interpreta como 1:09 (min:seg). Se já vier com
   ":" ou "'" (min explícito), respeita. Evita o "1.08" virar 1,08s. */
function parseTempoDist(x,dist){
  if(x==null||x==='')return null;
  const s=String(x).trim();
  if(/[:'′h]/.test(s))return parseTempo(s);                 // separador de minuto explícito
  const m=s.replace(',','.').match(/^(\d{1,2})\.(\d{2})$/);  // "M.SS" com 2 dígitos após o ponto
  if(m&&dist){
    const seg=parseFloat(s.replace(',','.'));
    if(seg<dist*0.4 && +m[2]<60) return Math.round((+m[1]*60 + +m[2])*1000);  // rápido demais p/ a distância → min:seg
  }
  return parseTempo(s);
}

/* ---------- CPF ---------- */
function cpfLimpo(c){return(c||'').replace(/\D/g,'')}
/* Senha nova: aceita frases longas e não impõe teto artificial de 8 caracteres.
   Login continua aceitando contas antigas; esta regra vale só para criação/troca. */
function senhaForte(s){ return typeof s==='string' && s.length>=10 && s.length<=72 && /[A-Za-zÀ-ÿ]/.test(s) && /\d/.test(s); }
/* duração: texto "hh:mm:ss" / "mm:ss" / "45" (min) → minutos (decimal); e o inverso */
function hmsParaMin(txt){
  if(txt==null||txt==='')return null;
  const p=String(txt).trim().replace(',','.').split(':').map(x=>parseFloat(x)).filter(x=>!isNaN(x));
  if(!p.length)return null;
  let seg = p.length===1?p[0]*60 : p.length===2?p[0]*60+p[1] : p[0]*3600+p[1]*60+p[2];
  return +(seg/60).toFixed(2);
}
function minParaHMS(min){
  if(min==null||isNaN(min))return '';
  let s=Math.round(min*60), h=Math.floor(s/3600); s-=h*3600; const m=Math.floor(s/60), sg=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(sg).padStart(2,'0');
}
/* horas flexível (SONO): "7:30"=7,5 · "5h45"=5,75 · "7.5"/"7,5"/"7" → horas; nunca NaN */
function horasFlex(txt){
  if(txt==null||txt==='')return null;
  const s=String(txt).trim().toLowerCase().replace(',','.').replace(/h/g,':').replace(/[^0-9:.]/g,'');
  if(s.includes(':')){ const p=s.split(':'); const h=parseFloat(p[0])||0, m=parseFloat(p[1])||0; return +(h+m/60).toFixed(2); }
  const n=parseFloat(s); return isNaN(n)?null:n;
}
/* duração em MINUTOS (como o relógio mostra):
   "46:17" (mm:ss, treino <1h) = 46,28 · "1:15:30" (hh:mm:ss) = 75,5 · "90" (min) = 90. Nunca NaN. */
/* DURAÇÃO DE SESSÃO em minutos. O "a:b" é ambíguo e os dois sentidos aparecem
   de verdade: "46:17" é 46min17s (um treino de piscina) e "1:10" é 1h10 (uma
   sessão de musculação). Antes tudo virava mm:ss, então 1:10 virava 1,17 min —
   uma sessão de um minuto, que não existe.
   Desempate por grandeza, não por formato: sessão de 1 a 6 MINUTOS não existe,
   mas de 1 a 6 HORAS existe. Então primeiro campo ≤ 6 ⇒ hh:mm. */
function durMin(txt){
  if(txt==null||txt==='')return null;
  let s=String(txt).trim().toLowerCase().replace(',','.');
  s=s.replace(/(\d)\s*h\s*(\d+)\s*(?:min)?/,'$1:$2').replace(/(\d)\s*h\b/,'$1:00');  /* 1h10, 2h */
  s=s.replace(/\s*min\b/,'').replace(/[^0-9:.]/g,'');
  if(s.includes(':')){
    const p=s.split(':').map(x=>parseFloat(x)||0);
    if(p.length>=3)return +(p[0]*60+p[1]+p[2]/60).toFixed(2);          /* hh:mm:ss */
    return +(p[0]<=6?(p[0]*60+p[1]):(p[0]+p[1]/60)).toFixed(2);        /* hh:mm | mm:ss */
  }
  const n=parseFloat(s); return isNaN(n)?null:n;
}
/* esportes do treino extra (fora d'água / cross-training do atleta) */
const SECO_TIPOS=['Musculação','Bicicleta','Corrida','Funcional','Core','Mobilidade','Outro'];
function cpfValido(c){
  c=cpfLimpo(c); if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;
  let s=0; for(let i=0;i<9;i++)s+=+c[i]*(10-i);
  let d=(s*10)%11; if(d===10)d=0; if(d!==+c[9])return false;
  s=0; for(let i=0;i<10;i++)s+=+c[i]*(11-i);
  d=(s*10)%11; if(d===10)d=0; return d===+c[10];
}
const cpfMasc=c=>{c=cpfLimpo(c);return c.length===11?`${c.slice(0,3)}.${c.slice(3,6)}.${c.slice(6,9)}-${c.slice(9)}`:c};

/* ---------- senha ---------- */
async function hash(txt,sal){
  const dado=sal+'::'+txt;
  if(typeof crypto!=='undefined'&&crypto.subtle){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(dado));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  let h=5381; for(let i=0;i<dado.length;i++)h=((h<<5)+h+dado.charCodeAt(i))>>>0;
  return 'f'+h.toString(16);
}

/* idade (em anos) a partir da data de nascimento YYYY-MM-DD */
function idadeDe(nasc){
  if(!nasc)return null;
  const d=new Date(nasc+'T00:00:00'); if(isNaN(d))return null;
  const h=new Date(); let a=h.getFullYear()-d.getFullYear();
  const m=h.getMonth()-d.getMonth(); if(m<0||(m===0&&h.getDate()<d.getDate()))a--;
  return a;
}
/* idade para exibir — calcula do nascimento; cai para o campo antigo se preciso */
function anos(u){ const a=idadeDe(u&&u.nascimento); return a!=null?a:((u&&u.idade!=null)?u.idade:'—'); }

function traduzErroFB(code){
  const m={
    'auth/email-already-in-use':'Já existe conta com este e-mail',
    'auth/invalid-email':'E-mail inválido',
    'auth/weak-password':'Senha muito fraca. Use ao menos 10 caracteres, com letras e números',

  };

/* Cadastro no modo em rede (Firebase). Cria a conta de verdade e só depois
   valida CPF/equipe — assim as liberações não precisam ficar públicas.
   Se a validação falhar, a conta recém-criada é removida. */
async function cadastrarFB(dados){
  const {perfil,equipe,nome,email,nascimento,telefone,senha,senha2,tipo,cpf,nivel}=dados;
  const atleta=perfil==='atleta'||perfil==='pro', semEquipe=!equipe;
  if(!equipe&&!semEquipe)return toast('Informe o nome da equipe');
  if(!nome||nome.split(/\s+/).length<2)return toast('Informe nome e sobrenome');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return toast('E-mail inválido');
  const id=idadeDe(nascimento);
  if(!nascimento||id==null||id>110)return toast('Data de nascimento inválida');
  if(id<IDADE_MINIMA)return toast(`O cadastro é para maiores de ${IDADE_MINIMA} anos. Menor de idade só com o responsável — fale com o administrador.`);
  if(!telValido(telefone))return toast('Telefone inválido — use DDD + número');
  if(!senhaForte(senha))return toast('Use uma senha de 10 a 72 caracteres, com letras e números');
  if(senha!==senha2)return toast('As senhas não conferem');

  /* Para os dois tipos de atleta, equipe/clube é apenas afiliação pública. O vínculo que dá
     acesso aos treinos de um técnico é escolhido separadamente, já dentro do
     app. Técnico pode começar sem equipe e receber um convite de grupo. */
  const em=email.toLowerCase(), eqSlug=atleta?'':slug(equipe);
  const afiliacao=atleta&&equipe?`cat:${slug(equipe)}`:null;
  let cred;
  try{ cred=await fauth.createUserWithEmailAndPassword(em,senha); }
  catch(e){ return toast(traduzErroFB(e.code)); }
  const abortar=async msg=>{ try{await cred.user.delete()}catch(_){} return toast(msg); };

  let eq=eqSlug?await DB.get(kEq(eqSlug)):null;
  let nivelFinal=nivel||'Master';
  if(perfil==='tecnico'){
    /* Equipes são criadas exclusivamente pelo administrador. Isso impede que
       alguém invente uma equipe durante o cadastro e vire gestor sem revisão. */
    if(eqSlug&&!eq)return abortar('Equipe não encontrada. Crie a conta sem equipe e depois crie um grupo privado ou receba um convite.');
  }else{
    /* Cadastro livre: a afiliação não depende de técnico e não concede acesso
       compartilhado. O atleta escolhe um técnico depois, se quiser. */
    if(cpf&&!cpfValido(cpf))return abortar('CPF inválido');
    nivelFinal=nivel||'Master';
  }

  /* o id do perfil é o uid do Firebase — é ele que amarra a privacidade
     dos dados PRO (o dono e o administrador global leem pro_<uid>). */
  /* Ninguém nasce aprovado no vínculo operacional. Atleta e PRO independentes
     usam o app normalmente; se escolherem um técnico depois, ele aprova só o
     compartilhamento dos treinos. */
  const u={id:cred.user.uid,perfil,equipe:eqSlug||null,equipeNome:eq?eq.nome:null,
    afiliacao,afiliacaoNome:atleta&&equipe?equipe.trim():null,nome:nome.trim(),
    email:em,nascimento,idade:id,telefone:soDig(telefone),
    tipo:perfil==='tecnico'?null:(tipo||'piscina'),cpf:cpfLimpo(cpf||''),
    nivel:perfil==='tecnico'?null:nivelFinal,ativo:true,aprovado:false,criadoEm:Date.now()};
  if(!await DB.set(kUser(u.email),u))return abortar('Não consegui salvar seu perfil. Tente novamente.');
  if(u.aprovado||!FB)await transacao(kEqUsers(eqSlug),us=>{us=us||[]; if(!us.includes(u.email))us.push(u.email); return us;});
  if(perfil==='tecnico')await registrarTecnicoDev(u);
  const envio=await enviarConfirmacaoFirebase(cred.user);   /* confirma o e-mail por link */
  S.emailPendente=em; S.vista='verificar'; S.u=null; render();
  toast(envio.ok?'Conta criada. Confirme o e-mail para continuar.':'Conta criada, mas o e-mail não saiu. Veja o aviso e tente novamente.');
}
/* fila global de técnicos, para o desenvolvedor enxergar e liberar */

  const lst=await DB.get('dev_tecnicos')||[];
  if(!lst.some(x=>x.email===u.email)){ lst.push({email:u.email,nome:u.nome,equipeNome:u.equipeNome,em:Date.now()}); await DB.set('dev_tecnicos',lst); }
}

}

/* ── O CHAPÉU FICA GUARDADO POR APARELHO ───────────────────────────────────
   Preferência de VISTA, como o tema: o celular da beira da piscina pode
   abrir no comando da equipe e o computador de casa, na área de atleta.
   Por isso localStorage e não o cadastro — e por e-mail, porque dois
   usuários podem dividir o mesmo aparelho.
   localStorage estoura em navegação privada e com dados de site bloqueados,
   então leitura e escrita vão dentro de try: sem ele, o app simplesmente
   abre no chapéu de técnico, que é o padrão seguro. */
const _kChapeu=u=>'parcial-chapeu-'+((u&&u.email)||'').toLowerCase();
function chapeuSalvo(u){
  if(!u||u.perfil!=='tecnico')return false;
  try{ return localStorage.getItem(_kChapeu(u))==='atleta'; }catch(_){ return false; }
}
function guardarChapeu(u,atleta){
  if(!u||u.perfil!=='tecnico')return;
  try{ localStorage.setItem(_kChapeu(u),atleta?'atleta':'tecnico'); }catch(_){}
}
/* troca de chapéu zera o que estava aberto: treino, competição, atleta
   selecionado. Sem isso a tela nova herda a navegação da anterior. */
function _limparContexto(){
  /* ⚠️ _limparLaudo() PRIMEIRO, e não é detalhe: quando o técnico ou o
     administrador está vendo o relatório/marcas de um atleta, S.pro APONTA PARA
     OS DADOS DAQUELE ATLETA. Zerar S.laudoAtleta sem devolver S.pro deixava
     o app convencido de que os dados do outro eram os do próprio usuário —
     na vista de atleta dele, com permissão de escrita no pro_ dele.
     Era assim que as marcas de um atleta apareciam para outro, e era assim
     que um currículo ABMN importado em seguida se somava ao do colega. */
  _limparLaudo();
  S.aba='treinos'; S.sub=null; S.provaSel=null; S.atletaSel=null;
  S.treino=null; S.comp=null; S.laudoAtleta=null; S.pilha=[];
}

async function aplicarReset(tok,senha,senha2){
  if(!senha||senha.length<6)return toast('Mínimo de 6 caracteres');
  if(senha!==senha2)return toast('As senhas não conferem');
  const t=await DB.get(kTok(tok));
  if(!t)return toast('Link inválido');
  if(Date.now()>t.exp)return toast('Link expirado — peça outro');
  const u=await DB.get(kUser(t.email)); if(!u)return toast('Conta não encontrada');
  u.sal=novoSal(); u.senha=await hash(senha,u.sal);

function copiar(t){

}

async function carregarDados(){
  if(!S.u)return;
  const eq=S.u.equipe;
  const pessoais=temDadosPessoais()&&!ehGestor()?((await DB.get(kPTrIdx(S.u.id)))||[]):[];
  if(!eq){
    S.eq=null; S.tridx=pessoais; S.cidx=[]; S.libs=[]; S.elenco=[]; S.treino=null; S.comp=null; S.tecnico=null;
    /* ⚠️ Sem equipe o fluxo saltava `carregarSemana` e ia direto para o return.
       Resultado: `_semDocs` ficava vazio para sempre, `feitoConhecido` sempre
       devolvia null, e o PRO independente — o cadastro padrão de quem escolhe
       "ainda não tenho equipe" — via "0 de 1" e "treino de hoje" mesmo depois
       de marcar tudo como feito. `carregarSemana` não usa `eq` quando o treino
       é pessoal, que é o único caso possível aqui. */
    await carregarSemana(null,S.tridx);
    if(temDadosPessoais()&&!S.laudoAtleta)S.pro=comDono(await DB.get(kPro(S.u.id)),S.u.id)||proVazio(S.u.id);
    await juntarSaude();
    if(temDadosPessoais()&&!S.laudoAtleta)S._proCenso=censoPro(S.pro);   /* referência da trava anti-apagamento */
    if(temDadosPessoais()&&!S.laudoAtleta)S._proCarregado=JSON.stringify(S.pro);  /* estado íntegro do dia, p/ a versão diária */
    if(temDadosPessoais()&&!S.laudoAtleta)S._sauCenso=censoSaude(S.pro);        /* referência da trava de Saúde */
    return;
  }
  /* Enquanto aguarda aprovação, o usuário não tem permissão para os dados da
     equipe. Evita leituras negadas e mantém apenas o nome necessário à espera. */
  if(S.u.aprovado===false&&['atleta','pro','tecnico'].includes(S.u.perfil)){
    S.eq=await DB.get(kEq(eq)); S.tridx=pessoais; S.cidx=[]; S.libs=[]; S.elenco=[]; S.treino=null; S.comp=null; S.tecnico=null;
    await carregarSemana(eq,S.tridx);   /* mesmo motivo do ramo sem equipe */
    if(temDadosPessoais()&&!S.laudoAtleta)S.pro=comDono(await DB.get(kPro(S.u.id)),S.u.id)||proVazio(S.u.id);
    await juntarSaude();
    return;
  }
  S.tridx=[...((await DB.get(kTrIdx(eq)))||[]),...pessoais].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  S.cidx=await DB.get(kCIdx(eq))||[];
  /* de-duplica o índice de competições por id (recuperações/fusões antigas podiam repetir) */
  {const vis=new Set(),lim=[]; for(const c of S.cidx){ if(c&&c.id&&!vis.has(c.id)){vis.add(c.id);lim.push(c);} }
   if(lim.length!==S.cidx.length){ S.cidx=lim; try{await DB.set(kCIdx(eq),lim);}catch(_){}} }
  S.libs=await DB.get(kLib(eq))||[];
  let emails=await DB.get(kEqUsers(eq))||[];
  /* O elenco aprovado continua no índice compacto. Para o gestor, uma consulta
     pelo campo espelhado `equipe` acrescenta cadastros pendentes sem permitir
     que o candidato edite a lista inteira da equipe. */
  S.erroPendentes=false;
  if(FB&&ehGestor())try{
    const snaps=await Promise.all(['atleta','pro'].map(perfil=>fdb.collection('kv').where('equipe','==',eq).where('perfil','==',perfil).get())), todos=new Set(emails);
    snaps.forEach(s=>s.forEach(d=>{if(d.id.startsWith('u_'))todos.add(d.id.slice(2).toLowerCase())})); emails=[...todos];
  }catch(e){S.erroPendentes=true;console.warn('carregar pendentes',e.message)}
  const elenco=[];
  for(const em of emails){const u=await DB.get(kUser(em)); if(u&&u.perfil!=='tecnico')elenco.push(u)}
  S.elenco=elenco.sort((a,b)=>a.nome.localeCompare(b.nome));
  const meus=ehGestor()?S.tridx:S.tridx.filter(t=>(t.para||[]).includes(S.u.id));
  /* atualiza o treino/competição ABERTO (mostra edições remotas) sem jogar
     de volta pro primeiro da lista — era o que causava o "volta sozinho". */
  if(S.treino){const t2=await lerTreinoUsuario(S.treino.id); if(t2)S.treino=t2;}
  else if(meus[0])S.treino=await lerTreinoUsuario(meus[0].id);
  await carregarSemana(eq,meus);
  if(temPro())await carregarCompFuturas(eq);
  if(S.comp){const c2=await DB.get(kCmp(eq,S.comp.id)); if(c2)S.comp=c2;}
  else if(S.cidx[0])S.comp=await DB.get(kCmp(eq,S.cidx[0].id));
  if(temDadosPessoais()&&!S.laudoAtleta)S.pro=comDono(await DB.get(kPro(S.u.id)),S.u.id)||proVazio(S.u.id);
    await juntarSaude();
  if(temDadosPessoais()&&!S.laudoAtleta)S._proCenso=censoPro(S.pro);   /* referência da trava anti-apagamento */
    if(temDadosPessoais()&&!S.laudoAtleta)S._proCarregado=JSON.stringify(S.pro);  /* estado íntegro do dia, p/ a versão diária */
    if(temDadosPessoais()&&!S.laudoAtleta)S._sauCenso=censoSaude(S.pro);        /* referência da trava de Saúde */
  if(!S.laudoAtleta)try{ await receberABMNdoTecnico(); }catch(_){}
  if(!S.laudoAtleta)try{ await conferirCaixaPreta(); }catch(_){}
  S.tecnico=(S.u.perfil!=='tecnico'&&S.eq?.tecnicoEmail)?await DB.get(kUser(S.eq.tecnicoEmail)):null;
}
/* ── A FOTOGRAFIA DO CACHE VALE MAIS QUE A DO SERVIDOR? ─────────────────────
   Compara o que o servidor acabou de entregar com a cópia que estava no cache
   antes da sincronia. Se o cache tinha uma coleção cheia e o servidor entrega
   vazia, alguma gravação apagou — e o usuário é avisado ENQUANTO ainda dá para
   desfazer, em vez de descobrir semanas depois.
   Só acusa coleção que foi para ZERO: 40 dias virando 38 é uso normal. */
async function conferirCaixaPreta(){
  if(!temDadosPessoais()||!S.pro)return;
  try{ await _CAIXA_PRONTA; }catch(_){}
  /* escolhe A MINHA entre as cópias achadas — nunca a de outro atleta, que no
     cache de um administrador está lado a lado com a minha */
  CAIXA_PRETA=CAIXA_TODAS['pro_'+S.u.id]||null;
  if(!CAIXA_PRETA)return;
  const faltando=[];
  for(const k of COLECOES_PRO){
    const cache=Array.isArray(CAIXA_PRETA.pro[k])?CAIXA_PRETA.pro[k].length:0;
    const agora=Array.isArray(S.pro[k])?S.pro[k].length:0;
    if(cache>=3&&agora===0)faltando.push({campo:k,n:cache});
  }
  S.caixaFalta=faltando.length?faltando:null;
}

  if(!S.caixaFalta)return'';
  const l=S.caixaFalta.map(f=>`<b>${f.n}</b> em ${f.campo}`).join(', ');
  return`<div class="note warn" style="margin:10px 0"><b>O que está no servidor tem menos do que a cópia guardada neste aparelho.</b>
    <div class="xs" style="margin-top:4px">A cópia local tem ${l}, e o servidor devolveu vazio. Isso quase sempre é dado apagado por defeito.</div>

/* ── O CONTEXTO ADMINISTRATIVO SOBREVIVE À SINCRONIA ───────────────────────
   `assumirEquipe` reaponta S.u.equipe EM MEMÓRIA para a equipe que o
   administrador está gerindo. A sincronia de 12 segundos relia o cadastro do
   banco e o escrevia inteiro por cima — devolvendo a equipe de origem. O
   efeito era o app "voltar sozinho" para a equipe antiga no meio do trabalho
   em outra, e não havia como gerir equipe nenhuma além da própria.
   O cadastro GRAVADO continua intocado: o que se preserva aqui é só a vista. */
function mesclaUsuarioSincronia(atual,doBanco,adminOrig){
  if(!doBanco)return atual;
  if(adminOrig&&atual){
    doBanco.equipe=atual.equipe;
    doBanco.equipeNome=atual.equipeNome;
    doBanco.aprovado=true;          /* o administrador não espera aprovação */
  }
  return doBanco;
}
async function sincronizar(sil){
  if(S.u)sincronizarFilaSaude(S.u.id);
  if(!S.u)return;
  /* A sincronia SILENCIOSA nunca interrompe quem está preenchendo algo: nem
     escrevendo treino, nem com uma folha aberta, nem com qualquer campo em
     edição ou alterado e ainda não salvo (usuarioDigitando). Ela volta a
     rodar sozinha em 12s, então nada fica desatualizado por muito tempo. */
  if(sil&&(S.sub==='novo'||usuarioDigitando()||document.getElementById('sheet')?.classList.contains('on')))return;
  const u=await DB.get(kUser(S.u.email));
  if(u)S.u=mesclaUsuarioSincronia(S.u,u,S.adminOrig);
  await carregarDados(); if(S.u.equipe&&S.u.aprovado!==false)ligarSincronia(); if(!sil)toast('Atualizado'); render();
}
setInterval(()=>{if(S.u&&!usuarioDigitando())sincronizar(true)},12000);

/* Sincronia instantânea (Firebase): qualquer alteração feita por outra
   pessoa recarrega os dados aqui em ~0,3s. Ignora os ecos das próprias
   gravações. Fica ligada uma vez, após o login. */
let _fbSnap=null,_fbEq=null,_fbTimer=null;
function desligarSincronia(){
  if(_fbSnap)try{_fbSnap()}catch(_){}
  _fbSnap=null; _fbEq=null; clearTimeout(_fbTimer); _fbTimer=null;
}
/* ── Varredura segura da coleção kv ────────────────────────────────────────
   As regras novas impedem ler o pro_ de OUTRAS pessoas (dados de saúde), e no
   Firestore uma consulta à coleção inteira é negada POR INTEIRO quando um só
   documento do resultado é ilegível — não vem "filtrada". Ou seja, um
   `collection('kv').get()` passaria a falhar para todo mundo, derrubando o
   Diagnóstico, a recuperação de equipes e a sincronia.
   Solução: varrer por FAIXAS de id (dev_, eq_, u_) e ler só o NOSSO pro_.
   Devolve algo com forEach/docs/size, para as telas não precisarem mudar. */
async function varrerKv(){
  const docs=[], vistos=new Set(), FP=firebase.firestore.FieldPath.documentId();
  /* Uma consulta de coleção é negada POR INTEIRO quando um só documento do
     resultado é ilegível. Então cada faixa pedida tem que caber exatamente no
     que as regras liberam para ESTE usuário: pedir 'eq_' inteiro (todas as
     equipes) ou 'u_' inteiro (todos os cadastros) derruba tudo para quem não
     é dev — foi o que derrubou a sincronia e o varrerKv. */
  const faixa=async (a,b)=>{ try{
      const s=await fdb.collection('kv').orderBy(FP).startAt(a).endAt(b).get();
      s.forEach(d=>{ if(!vistos.has(d.id)){vistos.add(d.id);docs.push(d);} });
    }catch(e){ console.warn('varrerKv',a,e.message); } };
  const um=async id=>{ if(!id||vistos.has(id))return; try{
      const d=await fdb.collection('kv').doc(id).get();
      if(d.exists){vistos.add(d.id);docs.push(d);} }catch(_){} };

  await faixa('dev_','dev_');                 /* liberado a qualquer logado */
  const eq=(S.u&&S.u.equipe)||'';
  if(ehAdmin()){
    await faixa('eq_','eq_'); await faixa('u_','u_');
  }else{
    if(eq)await faixa('eq_'+eq,'eq_'+eq+'');   /* só a MINHA equipe */
    await um('u_'+String((S.u&&S.u.email)||'').toLowerCase());
    /* gestor lê os cadastros da equipe um a um (a lista está em _users) */
    if(ehGestor()&&eq){ try{ for(const em of (await DB.get(kEqUsers(eq))||[]))
      await um('u_'+String(em).toLowerCase()); }catch(_){} }
  }
  await um('pro_'+((S.u&&S.u.id)||''));
  return { docs, size:docs.length, forEach:f=>docs.forEach(f) };
}
function ligarSincronia(){
  if(!FB)return;
  if(S.u&&S.u.aprovado===false)return;
  const eq=(S.u&&S.u.equipe)||''; if(!eq)return;   /* sem equipe, nada a escutar */
  if(_fbSnap&&_fbEq===eq)return;
  desligarSincronia();
  /* NAO usar consulta aqui. Numa CONSULTA o Firestore exige que os filtros
     PROVEM de antemao que todo resultado e legivel — ele nao avalia documento
     a documento. Uma faixa por id nao prova isso, entao a escuta inteira era
     negada ("sync Missing or insufficient permissions"), mesmo restrita a
     propria equipe e mesmo para o dev.
     Escutamos entao DOCUMENTOS especificos: no doc a regra e avaliada
     individualmente. Estes tres mudam sempre que alguem mexe em treino,
     competicao ou elenco — que e o que justifica a sincronia instantanea. O
     resto continua entrando pela sincronia de 12s. */
  const bateu=s=>{
    if(s.metadata.hasPendingWrites||usuarioDigitando())return;
    clearTimeout(_fbTimer); _fbTimer=setTimeout(()=>{if(S.u&&!usuarioDigitando())sincronizar(true)},350);
  };
  const erro=e=>console.warn('sync',e.message);
  const offs=[];
  for(const k of [kTrIdx(eq),kCIdx(eq),kEqUsers(eq)]){
    try{ offs.push(fdb.collection('kv').doc(fkey(k)).onSnapshot(bateu,erro)); }catch(e){ erro(e); }
  }
  _fbEq=eq; _fbSnap=()=>offs.forEach(f=>{try{f()}catch(_){}});
}
/* ── CENSO DO pro_: QUANTAS ENTRADAS TINHA QUANDO CARREGOU ──────────────────
   O pro_ é gravado inteiro a cada salvarPro(), então uma gravação com o objeto
   errado não corrompe um campo: apaga tudo o que não estiver nele. Foi o que
   aconteceu quando o espelho de outro atleta foi gravado por cima — o objeto
   do espelho não tem check-in nem Garmin, e esses dados simplesmente deixaram
   de existir, sem erro e sem aviso.
   O censo é tirado no carregamento e comparado na gravação. Não custa leitura
   nenhuma: é só a contagem do que já estava em memória. */
const COLECOES_PRO=['resultados','garmin','exames','bioimp','seco'];
function censoPro(pro){
  const c={pbs:Object.keys((pro&&pro.pbs)||{}).length};
  for(const k of COLECOES_PRO)c[k]=Array.isArray(pro&&pro[k])?pro[k].length:0;
  return c;
}
/* só acusa o APAGAMENTO EM MASSA (tinha 3+, vai a zero). Apagar um item, ou
   esvaziar uma lista curta, é operação normal e não pode virar alarme. */
function perdasPro(censo,pro){
  if(!censo)return [];
  const novo=censoPro(pro), out=[];
  for(const k in censo)if(censo[k]>=3&&novo[k]===0)out.push(`${k} (${censo[k]}→0)`);
  return out;
}
async function salvarPro(op){
  /* temDadosPessoais, não temPro: todo atleta tem pro_ para gravar os próprios
     treinos, mesmo sem equipe — as abas avançadas é que seguem temPro. */
  if(!(S.u&&temDadosPessoais()))return;
  /* ── TRAVA CONTRA GRAVAR O ATLETA ERRADO ─────────────────────────────────
     S.pro é o único objeto de dados pessoais do app, e no modo espelho ele
     aponta para OUTRO atleta. Qualquer salvarPro() nessa janela escrevia os
     dados do outro dentro de kPro(S.u.id) — contaminação permanente, e com
     cópia no kPerf, onde o técnico também passava a ver.
     A trava fica AQUI, e não em cada um dos ~24 pontos que chamam esta
     função, porque um ponto novo esquecido traria o bug de volta. E ela olha
     a MARCA NO DADO (_espelho), não o estado de navegação: se um caminho
     futuro zerar S.laudoAtleta sem devolver S.pro, continua travado. */
  if(S.laudoAtleta||(S.pro&&S.pro._espelho)){
    console.warn('salvarPro bloqueado: S.pro é o espelho de',S.laudoAtleta||S.pro._espelho);
    toast('Não gravei: esta tela é a do atleta, não a sua.');
    return false;
  }
  /* ── PROVA DE DONO ───────────────────────────────────────────────────────
     A trava do espelho é por EXCLUSÃO: ela só pega o que foi marcado. Esta é
     por INCLUSÃO — o objeto precisa dizer que é meu. Pega qualquer caminho em
     que dados alheios cheguem a S.pro, inclusive os que eu não previ: uma
     restauração de arquivo errado, uma versão antiga recuperada do cache, uma
     tela nova que esqueça de limpar o contexto.
     Documento antigo, ainda sem `_dono`, é carimbado em vez de recusado — a
     esta altura as duas travas acima já garantiram que não é espelho. */
  if(S.pro&&S.pro._dono&&S.pro._dono!==S.u.id){
    console.warn('salvarPro bloqueado: pro_ é de',S.pro._dono,'e eu sou',S.u.id);
    alerta('Gravação bloqueada','Os dados abertos nesta tela <b>pertencem a outra conta</b>, e por isso não foram gravados nos seus.<br><br>Feche e abra o app: ele recarrega os seus dados do servidor. Nada seu foi alterado.');
    return false;
  }
  if(S.pro&&!S.pro._dono)S.pro._dono=S.u.id;
  /* segunda rede: mesmo com o espelho resolvido, nenhuma gravação apaga
     coleções inteiras sem que o dono mande. `op.apagando` é o consentimento
     explícito de quem apaga de propósito (zerar marcas, apagar conta). */
  const perdas=(op&&op.apagando)?[]:perdasPro(S._proCenso,S.pro);
  if(perdas.length){
    console.warn('salvarPro bloqueado: apagaria',perdas);
    alerta('Gravação bloqueada',`Esta gravação apagaria <b>${esc(perdas.join(', '))}</b> dos seus dados, e isso quase sempre é defeito, não intenção.<br><br>Nada foi alterado. Feche e abra o app: ele recarrega os seus dados do servidor. Se o problema voltar, exporte um backup em <b>Conta › Dados e backup</b> antes de continuar e me avise.`);
    return false;
  }
  /* gravou de verdade → os rascunhos dos campos cumpriram o papel e devem sair,
     senão o formulário se repreenche sozinho no render seguinte. */
  limparRascunhos();
  /* A Saúde sai do pro_ assim que o documento próprio estiver confirmado
     (`_sauOk`). Antes disso ela continua aqui, senão uma falha no meio da
     migração apagaria justamente o que a separação existe para proteger. */
  const okPro=await gravarComEspera(kPro(S.u.id),S._sauOk?semSaude(S.pro):S.pro);
  if(okPro===false)return false;
  /* snapshot visível ao técnico (desempenho + carga + composição p/ a assinatura de sprint;
     SEM Saúde: Garmin (VFC/sono) e exames laboratoriais ficam só no pro_ privado) */
  if(S.u.equipe&&S.u.aprovado!==false)await gravarComEspera(kPerf(S.u.equipe,S.u.id),{nome:S.u.nome,nivel:S.u.nivel||null,
    pbs:S.pro.pbs||{},resultados:S.pro.resultados||[],seco:S.pro.seco||[],alvos:S.pro.alvos||null,
    bioimp:S.pro.bioimp||[],prontidao:(typeof prontidaoSubj==='function'?prontidaoSubj(7):null),
    /* o técnico precisa saber se o atleta está bem para ajustar a carga. Vai só
       o PLACAR (0-100) e a origem — VFC/sono/exames continuam privados. */
    prontidaoGar:(typeof prontidaoGarmin==='function'?(()=>{const p=prontidaoGarmin(S.pro,null);return p?{score:p.score,dias:p.dias}:null;})():null),
    at:Date.now()});
  /* o censo acompanha o que acabou de ser gravado: quem apaga um item por vez
     não topa com a trava no último, e o que ficou gravado é a nova referência */
  S._proCenso=censoPro(S.pro);
  /* sem await: a versão do dia é rede de segurança, não pode atrasar o salvar
     nem derrubá-lo se falhar (documento grande demais, por exemplo) */
  guardarVersaoDoDia();
  return true;
}
/* Grava a fatia de hoje uma única vez por dia, com o estado COMO FOI
   CARREGADO — não com o de agora. A diferença é o que permite desfazer um
   estrago feito hoje mesmo: se a primeira gravação do dia já for a ruim, a
   fatia ainda guarda o estado íntegro de antes dela. */
/* ── VER E VOLTAR ───────────────────────────────────────────────────────────
   Guardar versão sem um jeito óbvio de voltar seria metade do trabalho: em
   14/10 havia cópia no cache do celular e eu levei horas para chegar nela. */
async function abrirVersoes(){
  if(!S.u)return;
  sheet('<h2>Versões guardadas</h2><p class="small muted">Procurando…</p>');
  const achadas=[];
  for(const s of [0,1,2,3,4,5,6,'undo']){
    try{ const v=await DB.get(kProBk(S.u.id,s)); if(v&&v.pro)achadas.push({slot:s,...v}); }catch(_){}
  }
  achadas.sort((a,b)=>(b.em||0)-(a.em||0));
  const agora=censoPro(S.pro);
  const br=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'—';
  const linha=(rot,de,para)=>de===para?'':`<div class="row xs" style="padding:3px 0"><span class="grow">${rot}</span>
    <span style="color:${para>de?'var(--clock)':'var(--ink-2)'}"><b>${de}</b> → ${para}</span></div>`;
  const blocos=achadas.map(v=>{
    const c=v.censo||{};
    const difs=Object.keys(c).map(k=>linha(k,c[k],agora[k]||0)).join('');
    const rotulo=v.slot==='undo'?'antes da última restauração':`${DIAS_BK[v.slot]} · ${br(v.dia)}`;
    return `<div class="card" style="margin:10px 0">
      <div class="row"><b class="grow">${esc(rotulo)}</b><span class="xs muted">${esc(v.ver||'')}</span></div>
      ${difs?`<div class="xs muted" style="margin:6px 0 2px">o que mudou de lá para cá</div>${difs}`
            :'<div class="xs muted" style="margin-top:6px">Idêntica ao que você tem agora.</div>'}
      <button class="sm full" style="margin-top:8px" onclick="restaurarVersao(${typeof v.slot==='string'?`'${v.slot}'`:v.slot})">Restaurar esta</button>
    </div>`;}).join('');
  sheet(`<h2>Versões guardadas</h2>
    ${achadas.length?`<p class="small muted" style="margin:6px 0 2px">Uma cópia por dia, como os dados estavam ao abrir o app. A mais antiga é substituída automaticamente.</p>${blocos}`
      :'<div class="note" style="margin:10px 0"><b>Ainda não há versões.</b> A primeira é guardada na próxima vez que você salvar algo. A partir daí, uma por dia.</div>'}
    <div class="note warn" style="margin:10px 0">Restaurar <b>substitui</b> os seus dados de hoje pelos daquele dia. O estado atual é guardado antes, como <b>“antes da última restauração”</b> — então dá para voltar atrás.</div>
    <button class="primary full" onclick="fecharSheet()">Fechar</button>`);
}
async function restaurarVersao(slot){return restaurarVersaoSeguro(slot);}
/* Lê o documento de Saúde e o funde em S.pro. A forma em memória não muda —
   as ~38 telas continuam lendo S.pro.garmin, S.pro.exames e companhia. O que
   mudou é de ONDE vem e para onde vai.

   Enquanto `pro_<uid>_sau` não existir, vale o que está no pro_ (contas
   antigas) e a migração acontece na primeira gravação de Saúde. O pro_ só
   para de carregar essas listas depois que o documento novo estiver
   confirmado — senão uma falha no meio da migração apagaria o que ela deveria
   proteger. */
async function juntarSaude(){return juntarSaudeSeguro();}
/* Única porta de escrita da Saúde. Mesmas travas do salvarPro, aplicadas só
   às listas de Saúde — e nenhuma outra função escreve aqui. */
async function salvarSaude(op){return salvarSaudeSeguro(op);}
function censoSaude(o){ const c={}; for(const k of CAMPOS_SAUDE)c[k]=Array.isArray(o&&o[k])?o[k].length:0; return c; }
/* ── DOIS APARELHOS, UM DOCUMENTO ───────────────────────────────────────────
   Reproduzido em teste: o celular faz o check-in do dia; o notebook, que
   tinha carregado de manhã, lança um exame e grava o SEU objeto inteiro por
   cima. O check-in do celular some — em silêncio, porque três dias virando
   dois não é apagamento em massa e a trava do censo não acusa.

   É o jeito como o app grava: documento inteiro a cada salvar, o último a
   escrever ganha. O conserto é não escrever por cima: antes de gravar, relê o
   servidor e UNE as listas pela chave natural de cada uma — o dia, no caso da
   série de Saúde; o id, no caso de exames, bioimpedância e fora d'água.

   Em empate o meu prevalece campo a campo, então o que eu acabei de editar
   vale, e o que o outro aparelho acrescentou sobrevive. Apagar é a exceção:
   quando a intenção É remover, a união ressuscitaria o item, então a gravação
   com `apagando` é autoritativa e não mescla. */
function unirPorChave(remoto,local,chave){
  const m=new Map();
  for(const x of (remoto||[]))if(x&&x[chave]!=null)m.set(x[chave],x);
  for(const x of (local||[]))if(x&&x[chave]!=null)
    m.set(x[chave],Object.assign({},m.get(x[chave])||{},x));
  return [...m.values()];
}
function mesclarSaude(remoto,local){
  if(!remoto)return local;
  const o=Object.assign({},local);
  o.garmin=unirPorChave(remoto.garmin,local.garmin,'data');
  for(const k of ['exames','bioimp','seco'])o[k]=unirPorChave(remoto[k],local[k],'id');
  return o;
}
async function guardarVersaoDoDia(){
  try{
    if(!EMREDE||!S.u||!S._proCarregado)return;
    const dia=hoje();
    if(S._bkDia===dia)return;                 /* já guardei hoje nesta sessão */
    S._bkDia=dia;
    const base=JSON.parse(S._proCarregado);
    if(base&&base._espelho)return;            /* nunca versiona o de outro */
    if(base&&base._dono&&base._dono!==S.u.id)return;
    const slot=new Date().getDay();
    await DB.set(kProBk(S.u.id,slot),
      {_dono:S.u.id,em:Date.now(),dia,ver:VER,censo:censoPro(base),pro:base});
  }catch(e){ console.warn('versão do dia',e&&e.message); }
}

async function confirmarEmailAgora(){
  /* Sem sessão esta função estourava e virava um "Não consegui verificar
     agora" que não explicava nada. A sessão expira em ~1h, e quem espera o
     e-mail chegar passa desse tempo com facilidade. */
  if(FB&&fauth&&!fauth.currentUser)
    return alerta('Sessão expirada','Para conferir a confirmação eu preciso da sua sessão, e ela expirou. Entre de novo com o <b>mesmo e-mail e senha</b> do cadastro — se o link já foi aberto, você entra direto.');
  try{
    await fauth.currentUser.reload();
    if(!fauth.currentUser.emailVerified)return toast('A confirmação ainda não apareceu. Abra o link recebido e tente de novo.');
    await fauth.currentUser.getIdToken(true);
    const em=(fauth.currentUser.email||'').toLowerCase(),u=await DB.get(kUser(em));
    if(!u)return toast('Perfil não encontrado');
    if(u.ativo===false)return toast('Esta conta está desativada. Fale com o administrador.');
    u.confirmacaoEmail={status:'confirmado',atualizadoEm:Date.now(),erro:null};
    if(await DB.set(kUser(em),u)===false)return toast('Não consegui confirmar o perfil. Tente novamente.');
    await entrarSessao(u);toast('E-mail confirmado. Bem-vindo!');
  }catch(e){toast('Não consegui verificar agora. Tente novamente.');}
}

  await DB.set(kUser(S.u.email),S.u); fecharSheet(); toast('Senha alterada');
}

/* =====================================================================
   NAVEGAÇÃO
   ===================================================================== */
/* ── Preservação do que o usuário digitou ──────────────────────────────────
   render() reconstrói #app inteiro via innerHTML. Como a sincronia silenciosa
   roda a cada 12s (e também ao eco de uma gravação de outra pessoa), qualquer
   campo digitado e ainda NÃO salvo era apagado no meio do preenchimento. Havia
   uma proteção (S.escrevendo), mas escrita à mão em apenas 4 textareas — todo
   o resto do app ficava desprotegido (Saúde "lançar à mão", marcas, etc.).

   Duas camadas, de propósito:
   1) a sincronia automática NÃO interrompe quem está digitando;
   2) se um render acontecer mesmo assim, os campos alterados e a posição do
      cursor são restaurados. Trocar de tela descarta os rascunhos. */
const _sujos=new Map(); let _rota='';
const _ehCampo=el=>!!el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)&&el.type!=='file'&&el.type!=='button';
function _rotaAtual(){ return [S.vista,S.aba,S.sub,S.provaSel,S.atletaSel].join('|'); }
document.addEventListener('input',e=>{
  const el=e.target; if(!_ehCampo(el)||!el.id)return;
  _sujos.set(el.id,(el.type==='checkbox'||el.type==='radio')?el.checked:el.value);
},true);
/* usado pela sincronia: há algo em edição que não pode ser perdido? */
function usuarioDigitando(){
  return S.escrevendo || _ehCampo(document.activeElement) || _sujos.size>0;
}
function _capturaFoco(){
  const a=document.activeElement;
  if(!a||!a.id||!/^(INPUT|TEXTAREA)$/.test(a.tagName))return null;
  let s=null,e=null; try{ s=a.selectionStart; e=a.selectionEnd; }catch(_){}
  return {id:a.id,s,e};
}
function _restauraCampos(foco){
  for(const [id,val] of _sujos){
    const el=document.getElementById(id); if(!_ehCampo(el))continue;
    if(el.type==='checkbox'||el.type==='radio'){ if(el.checked!==val)el.checked=val; }
    else if(el.value!==val)el.value=val;
  }
  if(foco){
    const el=document.getElementById(foco.id);
    if(el)try{ el.focus(); if(foco.s!=null&&el.setSelectionRange)el.setSelectionRange(foco.s,foco.e); }catch(_){}
  }
}

const ESTILOS=[[/borbol|golfin|\bfly\b|\bbf\b/i,'borboleta'],[/costas?|\bcs\b/i,'costas'],
 [/peito|\bpt\b|bruç/i,'peito'],[/medley|\bmd\b|4\s*estilos/i,'medley'],[/livre|crawl|\bcr\b|\bfr\b/i,'livre']];
const RECURSOS=[[/pernad|perna|kick/i,'pernada'],[/braçad|braço|pull/i,'braçada'],[/educativ|técnic|drill/i,'técnica'],
 [/palmar|paddle/i,'palmar'],[/saíd|partida|start/i,'saída'],[/vira|turn/i,'virada'],[/filipin|pullout|submers/i,'filipina'],
 [/progressiv/i,'progressivo'],[/boia|pull\s*buoy/i,'boia']];
const CABECA=/^(aquecimen|aquec|warm|ativa|t[ée]cnic|educativ|parte\s*princip|principal|s[ée]rie|conjunto|main|set\b|tiros?\b|velocidad|aer[óo]bi|limiar|soltura|volta[\s-]*[àa]?\s*calma|volta calma|desaquec|pr[ée][\s-]*principal|complemento|final|regenerat|poliment|core|seco|dryland|travessia|simula|prepara|recupera|trote|bloco\s+princip|prova\s*teste|teste\s*de\s*prova)/i;

function interpretar(txt){
  const blocos=[]; let atual={id:uid(),titulo:'TREINO',itens:[]}; let mult=1;
  /* CONTEXTO do bloco: o título MAIS as linhas soltas já lidas nele. O "3x
     BROKEN" costuma vir sozinho numa linha, entre o título e a série — e a
     linha da série não repete a palavra. Sem carregar esse contexto para
     frente, as duas ficam sem ligação e o broken não é reconhecido. */
  let ctx=atual.titulo;
  const notaPref=/^(obs|observ|nota|aten|import|lembr|foco|dica)\b/i;
  const multLine=/^(\d{1,2})\s*[x×]\s*:?\s*$/i;   /* "2x", "2x:", "3 x" sozinho = o bloco repete N vezes */
  for(const raw of (txt||'').split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    const ehHeader=!notaPref.test(l)&&CABECA.test(l);
    if(ehHeader){
      if(atual.itens.length)blocos.push(atual);
      atual={id:uid(),titulo:l.replace(/[:•\-–]+\s*$/,'').toUpperCase(),itens:[]}; mult=1;  /* novo bloco zera o multiplicador */
      ctx=atual.titulo;                                                                     /* …e o contexto */
      /* a linha de cabeçalho só vira TAMBÉM um item se traz uma série explícita (NxDist),
         ex.: "Principal 8x50". Um título com número solto ("Simulação — 200 Livre") é só título. */
      if(!/\d{1,3}\s*[x×]\s*\d{2,5}/.test(l))continue;
    }
    const mm=l.match(multLine);
    if(mm){ mult=Math.min(+mm[1],12)||1; continue; }   /* linha "Nx" define o multiplicador do bloco */
    /* linha que é só descanso/observação vira NOTA (não se perde) */
    const soRest=/^(descanso|pausa|rest|intervalo|recupera)/i.test(l)&&!/\d\s*[x×]\s*\d/.test(l);
    const it=soRest?null:linhaParaItem(l,ctx);
    if(it){ if(mult>1){it.rodadas=Math.min((it.rodadas||1)*mult,12); it.vol=(it.rodadas||1)*it.reps*it.dist;} atual.itens.push(it); }
    else if(!ehHeader){ atual.itens.push({id:uid(),nota:true,texto:l,vol:0}); ctx+=' '+l; }
  }
  if(atual.itens.length)blocos.push(atual);
  return blocos.length?blocos:[{id:uid(),titulo:'TREINO',itens:[]}];
}
/* descanso em vários formatos → milissegundos */
function parsePausa(l){

  if(m)return +m[1]*60000;
  m=l.match(/(?:pausa|rest|descanso|recup\w*)\s*(?:de\s*)?(\d{1,3})\s*(?:["″]|s\b|seg\w*)?/i);
  if(m)return +m[1]*1000;
  m=l.match(/(\d{1,3})\s*["″]\s*(?:de\s*)?(?:pausa|descanso)/i);
  if(m)return +m[1]*1000;

}

   Simula a prova em trechos com descanso curto: broken de 50 = 25 + 25 com
   10s de pausa; de 100 = 4×25 ou 2×50; de 200 = 4×50. NÃO é uma série de N
   tiros — é UM tiro reconstruído, e o que interessa é o tempo da PROVA.
   "3x BROKEN 50" são três brokens de 50, ou seja três RODADAS.

   O broken só existe onde o técnico ESCREVEU broken (ou quebrado) — é o
   treino que manda, não um botão de conversão. O app chegou a oferecer
   "marcar como broken" em qualquer série parecida, e isso só criava chance
   de transformar tiros soltos em prova simulada por engano. */
const BROKEN_PADRAO={50:25,100:25,200:50,400:100,800:100,1500:100};
