<style>
:root{
  --deck:#F2EFE9; --ink:#12181C; --ink-2:#5A6670; --line:#D8D3C9;
  --clock:#E0342A; --rope:#F2B705; --water:#0E6E8C; --ok:#1B7F5A; --card:#FFF;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --disp:'Barlow Condensed',ui-sans-serif,system-ui,sans-serif;
  --body:'Barlow',ui-sans-serif,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --sh:0 1px 0 var(--line),0 2px 12px rgba(18,24,28,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--deck);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-bottom:calc(76px + var(--sab));-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--disp);font-weight:700;margin:0;line-height:1.06}
h1{font-size:30px;text-transform:uppercase} h2{font-size:23px;text-transform:uppercase}
h3{font-size:17px;text-transform:uppercase;letter-spacing:.02em}
.eyebrow{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.t{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .small{font-size:14px} .xs{font-size:12.5px}
.center{text-align:center}
header{position:sticky;top:0;z-index:30;background:var(--deck);border-bottom:1px solid var(--line);padding-top:var(--sat)}
.rope{height:6px;background:repeating-linear-gradient(90deg,var(--rope) 0 14px,var(--ink) 14px 28px)}
.hbar{display:flex;align-items:center;gap:9px;padding:9px 0 10px;min-height:52px}
.brand{font-family:var(--disp);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.06em}
.brand span{color:var(--clock)}
.pill{font-family:var(--disp);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--ink);
  border-radius:999px;padding:3px 10px;font-weight:600;white-space:nowrap;background:none;color:var(--ink);min-height:0}
.pill.pro{border-color:var(--rope);background:var(--rope)}
.pill.tec{border-color:var(--water);color:var(--water)}
.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0;box-shadow:var(--sh)}
.card.tight{padding:11px 13px}
.row{display:flex;gap:10px;align-items:center} .row.wrap{flex-wrap:wrap}
.sep{height:1px;background:var(--line);margin:13px 0}
button{font-family:var(--disp);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;
  border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:11px;padding:12px 15px;cursor:pointer;
  min-height:46px;transition:transform .06s,background .12s}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--water);outline-offset:2px}
button.primary{background:var(--ink);color:var(--deck)}
button.danger{border-color:var(--clock);color:var(--clock)}
button.ghost{border-color:var(--line);color:var(--ink-2);font-weight:500}
button.sm{padding:8px 12px;font-size:14px;border-radius:9px;min-height:38px}
button.full{width:100%}
input,select,textarea{font-family:var(--body);font-size:16px;width:100%;padding:12px 13px;border:1.5px solid var(--line);
  border-radius:11px;background:var(--card);color:var(--ink);min-height:46px;-webkit-appearance:none;appearance:none}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%235A6670' stroke-width='1.8' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--water)}
textarea{min-height:170px;font-family:var(--mono);font-size:15px;line-height:1.6}
label{display:block;font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 5px}
.field{margin:12px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt button{flex:1;min-width:96px;font-size:14px;padding:11px 8px}
.opt button.on{background:var(--ink);color:var(--deck);border-color:var(--ink)}
.perfil{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;padding:16px;border-radius:14px;
  text-transform:none;font-family:var(--body);font-size:16px;font-weight:400;letter-spacing:0;background:var(--card)}
.perfil .ic{font-family:var(--disp);font-size:26px;font-weight:700;width:44px;height:44px;flex:0 0 44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;background:var(--deck);border:1.5px solid var(--line)}
.perfil b{font-family:var(--disp);font-size:20px;text-transform:uppercase;display:block;line-height:1.1}
.perfil.on{border-color:var(--ink);border-width:2px}
.perfil.on .ic{background:var(--ink);color:var(--deck);border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-family:var(--disp);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);text-align:left;
  padding:7px 5px;border-bottom:1.5px solid var(--line);font-weight:600}
td{padding:8px 5px;border-bottom:1px solid var(--line)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
td input{padding:7px 5px;font-family:var(--mono);font-size:15px;text-align:center;border-radius:8px;min-height:40px}
.z{display:inline-block;font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 8px;border-radius:6px;border:1.5px solid}
.z1{border-color:#8FA3AD;color:#5A6670} .z2{border-color:var(--water);color:var(--water)}
.z3{border-color:var(--rope);color:#9A7300} .z4{border-color:var(--clock);color:var(--clock)}
.tag{font-family:var(--disp);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--deck);
  padding:3px 8px;border-radius:6px;display:inline-block}
.tag.w{background:var(--water)} .tag.r{background:var(--clock)} .tag.y{background:var(--rope);color:var(--ink)}
.tag.o{background:none;border:1.5px solid var(--line);color:var(--ink-2)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1.5px solid var(--ink);z-index:40;
  padding-bottom:var(--sab)}
.navin{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;border:none;border-radius:0;background:none;padding:9px 1px 10px;font-size:11px;letter-spacing:.04em;
  color:var(--ink-2);min-height:0}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--clock)}
nav button b{display:block;font-size:19px;line-height:1.2;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(88px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--deck);
  padding:11px 18px;border-radius:999px;font-family:var(--disp);letter-spacing:.05em;text-transform:uppercase;font-size:14px;
  z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.empty{text-align:center;padding:36px 16px;color:var(--ink-2)}
.empty .big{font-family:var(--disp);font-size:22px;text-transform:uppercase;color:var(--ink);margin-bottom:6px}
.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--water)}
.kpi .v{font-family:var(--mono);font-weight:700;font-size:25px;line-height:1}
.kpi .l{font-family:var(--disp);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-family:var(--mono);font-size:13.5px;border:1px solid var(--line);border-radius:7px;padding:3px 8px;background:var(--card)}
.chip.best{border-color:var(--rope);background:#FFFCF0;font-weight:700}
.item{border-left:3px solid var(--line);padding:9px 0 9px 12px;margin:10px 0}
.item.sel{border-left-color:var(--clock);background:#FFFAF9}
.item .d{font-family:var(--disp);font-weight:700;font-size:19px;text-transform:uppercase}
.item .i{font-family:var(--mono);font-size:13px;color:var(--water);font-weight:700}
.blk{margin:17px 0 4px;display:flex;align-items:center;gap:9px}
.blk .ln{flex:1;height:1px;background:var(--line)}
.lst{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;
  text-align:left;background:none;border-left:none;border-right:none;border-top:none;border-radius:0;
  text-transform:none;font-family:var(--body);font-size:16px;font-weight:400;letter-spacing:0;padding-left:2px}
.av{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--deck);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:16px}
.sheet{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(18,24,28,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .inner{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + var(--sab));
  transform:translateY(16px);transition:transform .22s;max-height:88vh;overflow:auto}
.sheet.on .inner{transform:translateY(0)}
.grab{width:38px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
.btnlink{display:flex;align-items:center;justify-content:center;text-decoration:none;font-family:var(--disp);
  font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;border:1.5px solid var(--ink);
  background:var(--ink);color:var(--deck);border-radius:11px;padding:12px 15px;min-height:46px;width:100%;margin-top:9px}
.btnlink.zap{background:#25D366;border-color:#1EA952;color:#062B14}
.btnlink.out{background:var(--card);color:var(--ink)}
.destin{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.hide{display:none!important}
.ficha th,.ficha td{border:1px solid var(--line);text-align:center;padding:6px 3px;font-size:13.5px}
.ficha td.nome{text-align:left;font-weight:600}
svg.chart{width:100%;height:auto;display:block}
.note{padding:11px 13px;border-left:3px solid var(--water);background:#F4FAFC;font-size:14px;border-radius:0 8px 8px 0}
.note.warn{border-color:var(--clock);background:#FFF6F5}
.note.ok{border-color:var(--ok);background:#F4FBF8}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{nav,header,.noprint{display:none!important}body{padding:0;background:#fff}.card{break-inside:avoid;box-shadow:none}}
</style>

<header id="hdr" class="hide">
  <div class="rope"></div>
  <div class="wrap hbar">
    <button class="sm ghost hide" id="btnVoltar" onclick="voltar()" aria-label="Voltar" style="padding:8px 11px;font-size:18px;line-height:1">‹</button>
    <div class="brand">PAR<span>CIAL</span><small style="font-size:9px;opacity:.5;font-weight:600;margin-left:4px">v21</small></div>
    <button class="pill" id="pRole" onclick="abrirConta()">—</button>
    <div class="grow"></div>
    <button class="pill" id="pModo" onclick="abrirModo()">·</button>
    <button class="sm ghost" onclick="sincronizar(false)">↻</button>
  </div>
</header>

<main class="wrap" id="app"></main>
<nav class="hide" id="nav"><div class="navin" id="navin"></div></nav>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)fecharSheet()">
  <div class="inner"><div class="grab"></div><div id="sheetBody"></div></div>
</div>

<!-- Firebase (SDK "compat" — funciona em <script> comum, sem build).
     Só entra em ação quando FB_CONFIG estiver preenchido lá embaixo. -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
/* =====================================================================
   PARCIAL v04 — natação  ·  iPhone-first
   Perfis: atleta · atleta PRO · técnico
   ===================================================================== */
const VER='v21';
/* ─────────────────────────────────────────────────────────────
   CÓDIGO MESTRE DO PERFIL PRO — troque este valor para revogar
   o acesso ou liberar para outra pessoa. Independe do técnico.
   ───────────────────────────────────────────────────────────── */
const CODIGO_PRO='BARBATO-PRO-2026';
/* Leitura por IA (OCR de PDF-imagem + laudo). Cole aqui a URL do seu Cloudflare
   Worker — veja backend/BACKEND-IA.md. Vazio = recurso desligado. */
const IA_URL='';
const temIA=()=>!!IA_URL;

/* ─────────────────────────────────────────────────────────────
   DESENVOLVEDOR — quem aprova e gere os TÉCNICOS do app.
   Use o MESMO e-mail da sua conta no app (pode listar mais de um).
   Cadastro de técnico entra pendente até um desenvolvedor liberar.
   ───────────────────────────────────────────────────────────── */
const DEV_EMAILS=['barbato.bruno@gmail.com'];
function ehDev(){ return !!(S.u&&DEV_EMAILS.includes((S.u.email||'').toLowerCase())); }

/* ---------- armazenamento (nuvem do app, com reserva em memória) ---------- */
const MEM={};

/* ─────────────────────────────────────────────────────────────
   FIREBASE — sincronia entre pessoas (técnico + atletas).
   Cole aqui a configuração do SEU projeto:
     Console do Firebase › ⚙ Configurações do projeto › Seus apps › SDK.
   Enquanto os campos estiverem vazios, o app roda só neste aparelho
   (ótimo para testar). Preenchido + publicado no GitHub Pages = todo
   mundo que abrir o mesmo endereço passa a compartilhar os dados,
   cada um com a sua conta.
   ───────────────────────────────────────────────────────────── */
const FB_CONFIG={
  apiKey:'AIzaSyDhi2wF_9CmIquSPWNpanPKe1Z9gMoBk-o',
  authDomain:'parcial-cdb0e.firebaseapp.com',
  projectId:'parcial-cdb0e',
  storageBucket:'parcial-cdb0e.firebasestorage.app',
  messagingSenderId:'612432062815',
  appId:'1:612432062815:web:f4fca1e40b64ab823f2eea'
};
let FB=null, fdb=null, fauth=null;
try{
  if(FB_CONFIG.apiKey && typeof firebase!=='undefined'){
    firebase.initializeApp(FB_CONFIG);
    fdb=firebase.firestore(); fauth=firebase.auth();
    FB=true;
  }
}catch(e){ console.warn('Firebase não iniciou:',e.message); }

const NUVEM=(typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function');
let LOCAL=false;
try{ if(!FB&&!NUVEM&&typeof localStorage!=='undefined'){localStorage.setItem('__t','1');localStorage.removeItem('__t');LOCAL=true} }catch(e){}
const PFX='parcial_';
/* Firestore não aceita '/' em id de documento; as chaves do app não têm,
   mas trocamos por precaução. */
const fkey=k=>k.replace(/\//g,'∕');
const DB={
  async get(k,sh=true){
    if(FB){
      if(k==='sessao'){try{const v=localStorage.getItem(PFX+'sessao');return v?JSON.parse(v):null}catch(e){return null}}
      try{const s=await fdb.collection('kv').doc(fkey(k)).get();return s.exists?JSON.parse(s.data().v):null}
      catch(e){console.warn('DB.get',k,e.message);return null}
    }
    if(NUVEM){try{const r=await window.storage.get(k,sh);return r?JSON.parse(r.value):null}catch(e){return null}}
    if(LOCAL){try{const v=localStorage.getItem(PFX+k);return v?JSON.parse(v):null}catch(e){return null}}
    return MEM[k]!==undefined?JSON.parse(MEM[k]):null;
  },
  async set(k,v,sh=true){
    if(FB){
      if(k==='sessao'){try{localStorage.setItem(PFX+'sessao',JSON.stringify(v));return true}catch(e){return false}}
      try{
        await fdb.collection('kv').doc(fkey(k)).set({
          v:JSON.stringify(v),
          dono:k.startsWith('pro_')?(fauth.currentUser?fauth.currentUser.uid:null):null,
          equipe:k.startsWith('eq_')?k.split('_')[1]:null,
          at:firebase.firestore.FieldValue.serverTimestamp()
        });
        return true;
      }catch(e){toast('Falha ao salvar');console.warn('DB.set',k,e.message);return false}
    }
    if(NUVEM){try{await window.storage.set(k,JSON.stringify(v),sh);return true}catch(e){toast('Falha ao salvar');return false}}
    if(LOCAL){try{localStorage.setItem(PFX+k,JSON.stringify(v));return true}
      catch(e){toast('Memória cheia — exporte um backup');return false}}
    MEM[k]=JSON.stringify(v); return true;
  }
};
const EMREDE=!!(FB||NUVEM);
const MODO=EMREDE?'em rede':(LOCAL?'neste aparelho':'temporário');

function exportarBackup(){
  const dados={};
  if(LOCAL){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
    if(k&&k.startsWith(PFX))dados[k.slice(PFX.length)]=JSON.parse(localStorage.getItem(k))}}
  else Object.keys(MEM).forEach(k=>dados[k]=JSON.parse(MEM[k]));
  const pacote={app:'PARCIAL',versao:VER,em:new Date().toISOString(),dados};
  try{
    const url=URL.createObjectURL(new Blob([JSON.stringify(pacote,null,1)],{type:'application/json'}));
    const a=document.createElement('a'); a.href=url; a.download=`parcial-backup-${hoje()}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Backup gerado');
  }catch(e){
    sheet(`<h2>Backup</h2><p class="small muted">Copie e guarde este texto.</p>
      <textarea id="bkTxt" style="min-height:200px;font-size:11px">${esc(JSON.stringify(pacote))}</textarea>
      <button class="primary full" style="margin-top:10px" onclick="copiarTexto('bkTxt')">Copiar</button>`);
  }
}
async function importarBackup(inp){
  const f=inp.files[0]; if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    if(!j.dados)return toast('Arquivo não reconhecido');
    let n=0; for(const [k,v] of Object.entries(j.dados)){ await DB.set(k,v); n++ }
    toast(`${n} registros restaurados`);
    const ses=await DB.get('sessao',false);
    if(ses&&ses.email){const u=await DB.get(kUser(ses.email)); if(u)return entrarSessao(u)}
    S.vista='entrada'; render();
  }catch(e){ toast('Não consegui ler o backup') }
}
/* chaves */
const kUser=em=>`u_${em.toLowerCase()}`;
const kEq=eq=>`eq_${eq}`;                     /* {slug,nome,criadoEm,tecnicoEmail,codigoPro} */
const kEqUsers=eq=>`eq_${eq}_users`;          /* [emails] */
const kLib=eq=>`eq_${eq}_libs`;               /* liberações por CPF */
const kTrIdx=eq=>`eq_${eq}_tridx`;
const kTr=(eq,id)=>`eq_${eq}_tr_${id}`;
const kCIdx=eq=>`eq_${eq}_cidx`;
const kCmp=(eq,id)=>`eq_${eq}_cmp_${id}`;
const kPro=uid=>`pro_${uid}`;                 /* {pbs,garmin,seco,resultados} */
const kTok=t=>`tok_${t}`;

/* ---------- estado ---------- */
const S={
  vista:'entrada', perfilEscolhido:null, u:null, eq:null,
  aba:'treinos', sub:null, treino:null, tridx:[], cidx:[], comp:null,
  provaSel:null, atletaSel:null, pro:null, elenco:[], libs:[],
  escrevendo:false, selMulti:[], filtroNivel:'todos'
};
const NIVEIS=['Master','Águas Abertas','Condicionamento'];
S.pilha=[];

/* ---------- histórico de navegação ----------
   Cada mudança de tela guarda uma fotografia do estado. O botão voltar
   desfaz passo a passo até o começo do cadastro. */
function fotografia(){
  return{vista:S.vista,perfil:S.perfilEscolhido,aba:S.aba,sub:S.sub||null,
    atletaSel:S.atletaSel||null,provaSel:S.provaSel==null?null:S.provaSel,
    treinoId:S.treino?.id||null,compId:S.comp?.id||null};
}
function push(){
  const f=fotografia(),topo=S.pilha[S.pilha.length-1];
  if(topo&&JSON.stringify(topo)===JSON.stringify(f))return;
  S.pilha.push(f); if(S.pilha.length>50)S.pilha.shift();
  try{history.pushState({p:S.pilha.length},'')}catch(e){}
}
async function voltar(){
  if(document.getElementById('sheet').classList.contains('on'))return fecharSheet();
  const f=S.pilha.pop();
  if(!f){
    if(S.u)return toast('Você já está no início');

function fmt(ms,curto){
  if(ms==null||isNaN(ms))return'—';
  const cs=Math.floor(Math.abs(ms)/10),s=Math.floor(cs/100),c=cs%100,m=Math.floor(s/60),sg=s%60,sn=ms<0?'-':'';
  if(m>0)return`${sn}${m}:${String(sg).padStart(2,'0')}.${String(c).padStart(2,'0')}`;
  return`${sn}${curto?sg:String(sg).padStart(2,'0')}.${String(c).padStart(2,'0')}`;
}
function parseTempo(x){
  if(x==null||x==='')return null;
  const t=String(x).trim().replace(/["″]/g,'').replace(/['′h]/g,':').replace(',','.');
  const p=t.split(':').map(n=>parseFloat(n)).filter(n=>!isNaN(n));
  if(!p.length)return null;
  if(p.length===1)return Math.round(p[0]*1000);
  if(p.length===2)return Math.round((p[0]*60+p[1])*1000);
  return Math.round((p[0]*3600+p[1]*60+p[2])*1000);
}

/* ---------- CPF ---------- */
function cpfLimpo(c){return(c||'').replace(/\D/g,'')}
function cpfValido(c){
  c=cpfLimpo(c); if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;
  let s=0; for(let i=0;i<9;i++)s+=+c[i]*(10-i);
  let d=(s*10)%11; if(d===10)d=0; if(d!==+c[9])return false;
  s=0; for(let i=0;i<10;i++)s+=+c[i]*(11-i);
  d=(s*10)%11; if(d===10)d=0; return d===+c[10];
}
const cpfMasc=c=>{c=cpfLimpo(c);return c.length===11?`${c.slice(0,3)}.${c.slice(3,6)}.${c.slice(6,9)}-${c.slice(9)}`:c};

/* ---------- senha ---------- */
async function hash(txt,sal){
  const dado=sal+'::'+txt;
  if(typeof crypto!=='undefined'&&crypto.subtle){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(dado));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  let h=5381; for(let i=0;i<dado.length;i++)h=((h<<5)+h+dado.charCodeAt(i))>>>0;
  return 'f'+h.toString(16);
}

/* idade (em anos) a partir da data de nascimento YYYY-MM-DD */
function idadeDe(nasc){
  if(!nasc)return null;
  const d=new Date(nasc+'T00:00:00'); if(isNaN(d))return null;
  const h=new Date(); let a=h.getFullYear()-d.getFullYear();
  const m=h.getMonth()-d.getMonth(); if(m<0||(m===0&&h.getDate()<d.getDate()))a--;
  return a;
}

/* Cadastro no modo em rede (Firebase). Cria a conta de verdade e só depois
   valida CPF/código/equipe — assim as liberações não precisam ficar públicas.
   Se a validação falhar, a conta recém-criada é removida. */
async function cadastrarFB(dados){
  const {perfil,equipe,nome,email,nascimento,telefone,senha,senha2,tipo,cpf,codigoPro,nivel}=dados;
  if(!equipe)return toast('Informe o nome da equipe');
  if(!nome||nome.split(/\s+/).length<2)return toast('Informe nome e sobrenome');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return toast('E-mail inválido');
  const id=idadeDe(nascimento);
  if(!nascimento||id==null||id<8||id>110)return toast('Data de nascimento inválida');
  if(!telValido(telefone))return toast('Telefone inválido — use DDD + número');
  if(!senha||senha.length<6)return toast('A senha precisa de ao menos 6 caracteres');
  if(senha!==senha2)return toast('As senhas não conferem');

  const em=email.toLowerCase(), eqSlug=slug(equipe);
  let cred;
  try{ cred=await fauth.createUserWithEmailAndPassword(em,senha); }
  catch(e){ return toast(traduzErroFB(e.code)); }
  const abortar=async msg=>{ try{await cred.user.delete()}catch(_){} return toast(msg); };

  let eq=await DB.get(kEq(eqSlug));
  let nivelFinal=nivel||'Master';
  async function criarEquipe(dono){
    const nova={slug:eqSlug,nome:equipe.trim(),criadoEm:Date.now(),tecnicoEmail:dono,codigoPro:CODIGO_PRO};
    await DB.set(kEq(eqSlug),nova); await DB.set(kLib(eqSlug),[]);
    await DB.set(kTrIdx(eqSlug),[]); await DB.set(kCIdx(eqSlug),[]);
    return nova;
  }

  if(perfil==='tecnico'){
    if(!eq)eq=await criarEquipe(em);
    else if(!eq.tecnicoEmail){eq.tecnicoEmail=em;await DB.set(kEq(eqSlug),eq)}
  }else if(perfil==='pro'){
    const cod=(codigoPro||'').toUpperCase().replace(/\s/g,'');
    const aceito=cod===CODIGO_PRO.toUpperCase()||(eq&&eq.codigoPro&&cod===String(eq.codigoPro).toUpperCase());
    if(!aceito)return abortar('Código PRO inválido');
    if(!eq)eq=await criarEquipe(null);
    nivelFinal='Master';
  }else{
    /* cadastro livre: não precisa de liberação prévia. Entra pendente e o
       técnico (ou PRO em gestão) aprova depois. CPF é opcional. */
    if(!eq)return abortar('Equipe não encontrada. Confira o nome com seu técnico.');
    if(cpf&&!cpfValido(cpf))return abortar('CPF inválido');
    nivelFinal=nivel||'Master';
  }

  /* o id do perfil é o uid do Firebase — é ele que amarra a privacidade
     dos dados PRO (só o dono lê pro_<uid>). */
  const aprovInicial=perfil==='pro'?true:(perfil==='tecnico'?DEV_EMAILS.includes(em):false);
  const u={id:cred.user.uid,perfil,equipe:eqSlug,equipeNome:eq?eq.nome:equipe.trim(),nome:nome.trim(),
    email:em,nascimento,idade:id,telefone:soDig(telefone),
    tipo:perfil==='tecnico'?null:(tipo||'piscina'),cpf:cpfLimpo(cpf||''),
    nivel:perfil==='tecnico'?null:nivelFinal,ativo:true,aprovado:aprovInicial,criadoEm:Date.now()};
  await DB.set(kUser(u.email),u);
  const us=await DB.get(kEqUsers(eqSlug))||[]; if(!us.includes(u.email)){us.push(u.email);await DB.set(kEqUsers(eqSlug),us)}
  if(perfil==='tecnico')await registrarTecnicoDev(u);
  await entrarSessao(u);
  toast(u.aprovado?'Conta criada. Bem-vindo!':(perfil==='tecnico'?'Cadastro de técnico enviado. Aguarde a liberação do desenvolvedor.':'Cadastro enviado! Aguarde a liberação do técnico.'));
}

   gravações. Fica ligada uma vez, após o login. */
let _fbSnap=null,_fbTimer=null;
function ligarSincronia(){
  if(!FB||_fbSnap)return;
  _fbSnap=fdb.collection('kv').onSnapshot(s=>{
    if(s.metadata.hasPendingWrites||S.escrevendo)return;
    clearTimeout(_fbTimer); _fbTimer=setTimeout(()=>{if(S.u&&!S.escrevendo)sincronizar(true)},350);
  },e=>console.warn('sync',e.message));
}

/* =====================================================================
   INTERPRETADOR DE TREINO
   ===================================================================== */
const ESTILOS=[[/borbol|golfin|\bfly\b|\bbf\b/i,'borboleta'],[/costas?|\bcs\b/i,'costas'],
 [/peito|\bpt\b|bruç/i,'peito'],[/medley|\bmd\b|4\s*estilos/i,'medley'],[/livre|crawl|\bcr\b|\bfr\b/i,'livre']];
const RECURSOS=[[/pernad|perna|kick/i,'pernada'],[/braçad|braço|pull/i,'braçada'],[/educativ|técnic|drill/i,'técnica'],
 [/palmar|paddle/i,'palmar'],[/saíd|partida|start/i,'saída'],[/vira|turn/i,'virada'],[/filipin|pullout|submers/i,'filipina'],
 [/progressiv/i,'progressivo'],[/boia|pull\s*buoy/i,'boia']];
const CABECA=/^(aquecimen|aquec|warm|ativa|técnic|tecnic|educativ|principal|série|serie|conjunto|main|tiros?\b|velocidad|aeróbi|aerobi|limiar|soltura|volta[\s-]*à?\s*calma|volta calma|desaquec|pré[\s-]*principal|pre[\s-]*principal|complemento|final|regenerat|poliment|core|seco|dryland|travessia)/i;

function interpretar(txt){
  const blocos=[]; let atual={id:uid(),titulo:'TREINO',itens:[]};
  const notaPref=/^(obs|observ|nota|aten|import|lembr|foco|dica)\b/i;
  for(const raw of (txt||'').split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    const ehHeader=!notaPref.test(l)&&CABECA.test(l);
    if(ehHeader){
      if(atual.itens.length)blocos.push(atual);
      atual={id:uid(),titulo:l.replace(/[:•\-–]+\s*$/,'').toUpperCase(),itens:[]};
      if(!/\d/.test(l.replace(CABECA,'')))continue;
    }
    /* linha que é só descanso/observação vira NOTA (não se perde) */
    const soRest=/^(descanso|pausa|rest|intervalo|recupera)/i.test(l)&&!/\d\s*[x×]\s*\d/.test(l);
    const it=soRest?null:linhaParaItem(l);
    if(it)atual.itens.push(it);
    else if(!ehHeader)atual.itens.push({id:uid(),nota:true,texto:l,vol:0});
  }
  if(atual.itens.length)blocos.push(atual);
  return blocos.length?blocos:[{id:uid(),titulo:'TREINO',itens:[]}];
}
/* descanso em vários formatos → milissegundos */
function parsePausa(l){
  let m=l.match(/(?:pausa|rest|descanso|recup\w*)\s*(?:de\s*)?(\d{1,3})\s*(?:'|min|m\b)/i);
  if(m)return +m[1]*60000;
  m=l.match(/(?:pausa|rest|descanso|recup\w*)\s*(?:de\s*)?(\d{1,3})\s*(?:["″]|s\b|seg\w*)?/i);
  if(m)return +m[1]*1000;
  m=l.match(/(\d{1,3})\s*["″]\s*(?:de\s*)?(?:pausa|descanso)/i);
  if(m)return +m[1]*1000;
  return null;
}
function fmtPausa(ms){ const s=Math.round(ms/1000); if(s>=60){const m=Math.floor(s/60),r=s%60;return r?`${m}min${r}`:`${m}min`;} return s+'s'; }
function linhaParaItem(l){
  let rodadas=1,reps=1,dist=null;
  /* série dupla: "2x 4x50" → 2 rodadas de 4×50 */
  const m2=l.match(/(\d{1,2})\s*[x×]\s*(\d{1,3})\s*[x×]\s*(\d{2,5})/i);
  const mx=l.match(/(\d{1,3})\s*[x×]\s*(\d{2,5})/i);
  if(m2){rodadas=Math.min(+m2[1],12)||1;reps=+m2[2];dist=+m2[3]}
  else if(mx){reps=+mx[1];dist=+mx[2]}
  else{const md=l.match(/(?:^|[^\d.,:'])(\d{2,5})\s*(m\b|mts?\b|metros)?/i); if(md&&+md[1]>=25)dist=+md[1];else return null}
  if(!dist||dist<20)return null;
  let estilo='livre'; for(const[re,v]of ESTILOS){if(re.test(l)){estilo=v;break}}
  const tags=[]; for(const[re,v]of RECURSOS){if(re.test(l))tags.push(v)}
  let intervalo=null;
  const mi=l.match(/(?:sa[íi]da|int\.?|s\/|@|c\/)\s*(\d{1,2})\s*[:'′h]\s*(\d{2})/i)||l.match(/(\d{1,2})\s*[:'′h]\s*(\d{2})(?!\d)/);
  if(mi)intervalo=(+mi[1]*60+ +mi[2])*1000;
  const forte=/máxim|maxim|all\s*out|tiro|forte|sprint|ritmo de prova|\brp\b|9[0-9]\s*%|100\s*%/i.test(l);
  const parcial=/parcia|broken|quebrad|25\s*a\s*25|split/i.test(l)||(forte&&dist>=50&&dist<=100);
  const mo=l.match(/\(([^)]+)\)/); const obs=mo?mo[1].trim():'';
  return{id:uid(),rodadas,reps,dist,estilo,tags,intervalo,pausa:parsePausa(l),parcial,forte,obs,texto:l,vol:rodadas*reps*dist};
}
const volTreino=t=>(t.blocos||[]).reduce((a,b)=>a+b.itens.reduce((x,i)=>x+i.vol,0),0);
const piscinaLabel=p=>p==='AA'?'águas abertas':p==='LC50'?'piscina 50m':'piscina 25m';
/* aplica as regras de parcial de 25m conforme o tipo de treino:
   - águas abertas: sem parcial (usa ritmo /100m);
   - piscina 25m: mantém a parcial detectada nos tiros, se o técnico quiser;
   - piscina 50m: só nos tiros da SÉRIE PRINCIPAL, e só se o técnico quiser. */
function aplicarParciais(blocos,piscina,parcial25){
  const principalRe=/principal|série|serie|main|conjunto/i;
  for(const b of blocos){
    const ehPrincipal=principalRe.test(b.titulo||'');
    for(const it of b.itens){
      if(piscina==='AA')it.parcial=false;
      else if(piscina==='LC50')it.parcial=!!(it.parcial&&parcial25&&ehPrincipal);
      else it.parcial=!!(it.parcial&&parcial25);
    }
  }
}

/* =====================================================================
   MARCAS E ZONAS
   ===================================================================== */
const pbKey=(d,e,p)=>`${d} ${e} ${p||'SC25'}`;
function pbDe(dados,dist,estilo){
  if(!dados)return null;
  const p=dados.pbs||{};
  const c=Object.entries(p).filter(([k])=>{const[d,e]=k.split(' ');return +d===dist&&e===estilo}).map(([,v])=>v);
  if(c.length)return Math.min(...c);
  const p50=Object.entries(p).find(([k])=>k.startsWith(`50 ${estilo}`));
  if(p50&&dist>=25){const b=p50[1];
    if(dist===25)return b*.465; if(dist===100)return b*2.22; if(dist===200)return b*4.75;
    return b*(dist/50)*1.06}
  return null;
}
/* Zonas por %PB (velocidade relativa ao seu melhor tempo — é o que o app mede).
   Aproxima as zonas aeróbias A1/A2/A3 (base→ritmo→potência) e o ritmo de prova.
   Os cortes de %PB podem ser calibrados. */
function zona(p){ if(p==null)return null;
  if(p>=96)return{n:'ritmo de prova',c:'z4',dsc:'sprint / velocidade máxima'};
  if(p>=90)return{n:'A3',c:'z3',dsc:'potência aeróbica (perto do limiar)'};
  if(p>=84)return{n:'A2',c:'z2',dsc:'ritmo (aeróbico médio)'};
  return{n:'A1',c:'z1',dsc:'base aeróbica (leve)'} }
const ZONAS_INFO='Zonas por velocidade (%PB): A1 base aeróbica (leve) · A2 ritmo · A3 potência aeróbica (perto do limiar) · ritmo de prova = sprint. %PB = seu tempo em relação ao seu melhor — quanto mais perto de 100%, mais rápido.';

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
/* agrupa treinos por Ano → Mês, com mês recolhível (o mais recente já aberto) */
function grupoTreinos(lista,cardFn){
  if(!lista.length)return'';
  const ord=[...lista].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  if(S.mesAberto==null)S.mesAberto={[(ord[0].data||'').slice(0,7)]:true};
  const anos={};
  for(const t of ord){ const y=(t.data||'').slice(0,4)||'—',m=(t.data||'').slice(5,7)||'--';
    (anos[y]=anos[y]||{}); (anos[y][m]=anos[y][m]||[]).push(t); }
  let html='';
  for(const y of Object.keys(anos).sort((a,b)=>b.localeCompare(a))){
    html+=`<div class="blk" style="margin-top:14px"><h3>${y}</h3><div class="ln"></div></div>`;
    for(const m of Object.keys(anos[y]).sort((a,b)=>b.localeCompare(a))){
      const key=y+'-'+m, arr=anos[y][m], aberto=!!S.mesAberto[key];
      html+=`<button class="card tight lst" style="width:100%;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--deck)" onclick="S.mesAberto=Object.assign({},S.mesAberto,{'${key}':${!aberto}});render()">
        <span class="grow" style="text-align:left"><b style="text-transform:capitalize">${MESES[+m-1]||m}</b> <span class="xs muted">· ${arr.length} treino${arr.length>1?'s':''}</span></span>
        <span class="tag o">${aberto?'▲ recolher':'▼ ver'}</span></button>`;
      if(aberto)html+=arr.map(cardFn).join('');
    }
  }
  return html;
}

/* tempos de um item (achata rodadas se for série dupla) */
function temposItem(rec,item){
  if(!rec)return [];
  if((item.rodadas||1)>1)return (rec.rd||[]).flatMap(r=>(r.tempos||[]).filter(x=>x!=null));
  return (rec.tempos||[]).filter(x=>x!=null);
}
function linhaSerie(t,i,at,semCrono){
  if(i.nota)return`<div style="margin:2px 0 9px;padding:9px 12px;border-left:3px solid var(--rope);background:var(--deck);border-radius:0 9px 9px 0">
    <span class="small">${esc(i.texto)}</span></div>`;
  const rec=(t.registros?.[at.id]?.[i.id])||{};
  const aa=t.piscina==='AA';
  const multi=(i.rodadas||1)>1&&!aa;
  const rds=multi?Array.from({length:i.rodadas},(_,k)=>(rec.rd&&rec.rd[k])||{tempos:[],parciais:[]}):null;
  const ts=temposItem(rec,i);
  const logged=aa?(rec.ritmo100!=null):ts.length;
  const dadosPB=at.id===S.u.id?S.pro:null;
  const mel=ts.length?Math.min(...ts):null;
  const pct=(!aa&&dadosPB&&mel)?((pbDe(dadosPB,i.dist,i.estilo)||0)/mel*100)||null:null;
  const z=zona(pct);
  /* tiro de verdade → cronometrar; ativação/rodagem → opcional; aquec/soltura → nenhum */
  const eTiro=/\btiro\b|máxim|maxim|all\s*out|sprint|ritmo de prova|\brp\b|\ba[3-6]\b|9[0-9]\s*%|100\s*%/i.test(i.texto||'');
  const botao=semCrono?''
    :((eTiro||logged)
      ?`<button class="sm ghost" onclick="S.rd=0;abrirLancamento('${i.id}','${at.id}')">${logged?'Editar':'Lançar'}</button>`
      :`<button class="sm ghost" style="opacity:.55;font-size:12px" onclick="S.rd=0;abrirLancamento('${i.id}','${at.id}')">anotar tempo</button>`);
  const chips=aa
    ? (rec.ritmo100!=null?`<div class="chips"><span class="chip">ritmo /100m · ${fmt(rec.ritmo100,true)}</span></div>`:'')
    : multi
      ? rds.map((r,ri)=>(r.tempos||[]).some(x=>x!=null)?`<div class="chips" style="margin-top:4px"><span class="chip" style="background:var(--deck);font-weight:800">R${ri+1}</span>${r.tempos.map(x=>x==null?'':`<span class="chip ${x===mel?'best':''}">${fmt(x,true)}</span>`).join('')}</div>`:'').join('')
      : (ts.length?`<div class="chips">${(rec.tempos||[]).map((x,ix)=>x==null?'':
        `<span class="chip ${x===mel?'best':''}">${ix+1}· ${fmt(x,true)}${i.parcial&&rec.parciais&&rec.parciais[ix]!=null?` <span style="color:var(--water)">(${fmt(rec.parciais[ix],true)}+${fmt(x-rec.parciais[ix],true)})</span>`:''}</span>`).join('')}</div>`:'');
  return`<div class="item ${logged?'sel':''}">
    <div class="row" style="align-items:baseline;flex-wrap:wrap;gap:6px">
      <span class="grow" style="min-width:58%"><b>${esc(i.texto||((i.rodadas>1?i.rodadas+'x ':'')+(i.reps>1?i.reps+'×':'')+i.dist+' '+i.estilo))}</b></span>
      ${z?`<span class="z ${z.c}">${pct.toFixed(0)}%</span>`:''}
      ${botao}
    </div>
    ${chips}
  </div>`;
}

/* lê todos os campos digitados na ficha (para não perder nada) */
function lerCamposLancamento(reps,temParcial){
  const tempos=[],parciais=[];
  for(let k=0;k<reps;k++){
    const el=document.getElementById('lt'+k); tempos.push(el?parseTempo(el.value):null);
    if(temParcial){const ep=document.getElementById('lp'+k); parciais.push(ep?parseTempo(ep.value):null);}
  }
  return {tempos,parciais};
}
async function gravarReg(itemId,atletaId,rd,tempos,parciais){
  const t=await DB.get(kTr(S.u.equipe,S.treino.id))||S.treino;
  t.registros=t.registros||{}; t.registros[atletaId]=t.registros[atletaId]||{};
  const prev=t.registros[atletaId][itemId]||{};
  if(rd==null){
    t.registros[atletaId][itemId]={...prev,tempos,parciais,em:Date.now(),por:S.u.nome};
  }else{
    const item=(S.treino.blocos.flatMap(b=>b.itens)).find(x=>x.id===itemId);
    const nrd=(item&&item.rodadas)||1, arr=(prev.rd||[]).slice();
    while(arr.length<nrd)arr.push({tempos:[],parciais:[]});
    arr[rd]={tempos,parciais};
    t.registros[atletaId][itemId]={...prev,rd:arr,em:Date.now(),por:S.u.nome};
  }
  t.atualizado=Date.now();
  await DB.set(kTr(S.u.equipe,t.id),t); S.treino=t;
}
/* ✓ verde: grava o tempo daquela linha (e tudo que estiver digitado) na hora */
async function confTempo(itemId,atletaId,i,rd){
  const item=(S.treino.blocos.flatMap(b=>b.itens)).find(x=>x.id===itemId); if(!item)return;
  const {tempos,parciais}=lerCamposLancamento(item.reps,!!item.parcial);
  if(tempos[i]==null)return toast('Digite o tempo da linha '+(i+1)+' antes do ✓');
  await gravarReg(itemId,atletaId,rd==null?null:rd,tempos,parciais);
  toast('Tempo '+(i+1)+' salvo');
  abrirLancamento(itemId,atletaId);
}
/* ✕ vermelho: apaga o tempo daquela linha */
async function delTempo(itemId,atletaId,i,rd){
  const item=(S.treino.blocos.flatMap(b=>b.itens)).find(x=>x.id===itemId); if(!item)return;
  const {tempos,parciais}=lerCamposLancamento(item.reps,!!item.parcial);
  tempos[i]=null; if(item.parcial)parciais[i]=null;
  await gravarReg(itemId,atletaId,rd==null?null:rd,tempos,parciais);
  toast('Tempo '+(i+1)+' apagado');
  abrirLancamento(itemId,atletaId);
}

    if(!senha)return toast('Digite sua senha para confirmar');
    try{ await fauth.signInWithEmailAndPassword(u.email,senha); }   /* reautentica */
    catch(e){ return toast(traduzErroFB(e.code)); }
  }
  try{
    if(u.perfil==='tecnico'){
      const eq=await DB.get(kEq(u.equipe));
      if(eq&&eq.tecnicoEmail===u.email){ eq.tecnicoEmail=null; await DB.set(kEq(u.equipe),eq); }
    }
    const us=(await DB.get(kEqUsers(u.equipe))||[]).filter(e=>e!==u.email);
    await DB.set(kEqUsers(u.equipe),us);
    if(u.perfil!=='tecnico'&&u.cpf){                                 /* libera o CPF de volta */
      const libs=await DB.get(kLib(u.equipe))||[];
      const l=libs.find(x=>x.cpf===u.cpf); if(l){ l.usado=false; delete l.email; await DB.set(kLib(u.equipe),libs); }
    }
    if(u.perfil==='pro') await apagarChave(kPro(u.id));
    await apagarChave(kUser(u.email));
  }catch(e){ console.warn('apagar dados',e.message); }
  if(FB){ try{ await fauth.currentUser.delete(); }catch(e){ console.warn('apagar login',e.message); } }
  try{ localStorage.removeItem(PFX+'sessao'); }catch(e){}
  S.u=null; S.vista='entrada'; S.perfilEscolhido=null; S.treino=null; S.comp=null; S.pilha=[];
  fecharSheet(); toast('Conta apagada'); render();
}

function passoDe(p,piscina){
  if(p.tipo==='rev')return p.d;                      /* um parcial por percurso */
  if(piscina==='LC50')return p.dist>=800?100:50;
  return p.dist<=100?25:(p.dist<=400?50:100);
}
function nPassagens(p,piscina){
  if(p.tipo==='rev')return p.r||4;
  return Math.max(1,Math.round(p.dist/passoDe(p,piscina)));
}

async function lerBalizamento(inp){
  const f=inp.files[0]; if(!f)return;
  const st=document.getElementById('balStatus');
  if(f.type!=='application/pdf'){ if(st)st.textContent='Envie o balizamento em PDF (foto não dá para ler sem servidor) — ou cole o texto abaixo.'; return; }
  if(st)st.textContent='Lendo o balizamento…';
  try{
    const txt=await pdfTexto(f);
    const provas=parseBalizamentoTecnico(txt);
    if(!provas.length){ if(st)st.textContent='Não achei provas dos seus atletas. Confira os nomes no Elenco (devem bater com o balizamento) ou cole o texto abaixo.'; return; }
    await incorporar(provas);
    const n=provas.reduce((s,p)=>s+p.inscritos.length,0);
    if(st)st.textContent=`${provas.length} prova(s) e ${n} inscrição(ões) dos seus atletas importadas.`;
    toast('Balizamento carregado');
  }catch(e){ if(st)st.textContent='Não consegui ler o PDF: '+e.message; }
}
/* casa cada linha do balizamento (formato ABMN Competição) com os nomes do Elenco */
function parseBalizamentoTecnico(txt){
  const ESTIL=[[/livre|crawl/i,'livre'],[/costas?/i,'costas'],[/peito/i,'peito'],[/borbol/i,'borboleta'],[/medley/i,'medley']];
  const atletas=(S.elenco||[]).map(a=>({a,toks:a.nome.toLowerCase().split(/\s+/).filter(t=>t.length>=3)})).filter(x=>x.toks.length);
  const provas=[]; let cur=null,serie=1;
  for(const raw of txt.split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    if(/\bprova\b/i.test(l)&&/metros/i.test(l)){
      if(/revez|\d\s*x\s*\d/i.test(l)){ cur=null; continue; }
      const md=l.match(/prova\s*[-–:]?\s*(\d{2,4})\s*metros/i), mc=l.match(/(\d+)\s*[º°ªo]\s*prova/i);
      if(md){ let estilo='livre'; for(const[re,v]of ESTIL){if(re.test(l)){estilo=v;break;}}
        const cat=l.replace(/.*?metros/i,'').replace(/^\s*[a-zà-ú]+\s*/i,'').replace(/\(.*?\)/g,'').trim();
        cur={codigo:mc?mc[1]:null,dist:+md[1],estilo,categoria:cat,inscritos:[]}; provas.push(cur); serie=1;
      }
      continue;
    }
    const ms=l.match(/(\d+)\D{0,3}s[ée]rie/i); if(ms&&/s[ée]rie/i.test(l)){ serie=+ms[1]; continue; }
    if(!cur)continue;
    const low=l.toLowerCase(); const match=atletas.find(x=>x.toks.every(t=>low.includes(t)));
    if(match){
      const raia=parseInt(l,10), times=l.match(/\d{1,2}:\d{2}[.,]\d{2}|\b\d{1,2}[.,]\d{2}\b/g);
      cur.inscritos.push({serie,raia:isNaN(raia)?0:raia,nome:match.a.nome,equipe:'',inscricao:times?parseTempo(times[times.length-1]):null});
    }
  }
  return provas.filter(p=>p.inscritos.length);
}
async function colarBalizamento(){
  const t=document.getElementById('tBal').value; if(!t.trim())return toast('Cole o balizamento');
  const provas=[]; let p=null,serie=1;
  for(const raw of t.split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    const mp=l.match(/prova\s*n?º?\s*([\dA-Za-z]+)?\s*[-–:]?\s*(\d{2,4})\s*m?\s*(livre|costas|peito|borboleta|medley|crawl)/i);
    if(mp){p={codigo:mp[1]||null,dist:+mp[2],estilo:mp[3].toLowerCase()==='crawl'?'livre':mp[3].toLowerCase(),
      categoria:l.split(/[-–]/).slice(3).join('-').trim(),inscritos:[]};provas.push(p);serie=1;continue}
    const ms=l.match(/s[ée]rie\s*n?º?\s*(\d+)/i); if(ms){serie=+ms[1];continue}
    const mr=l.match(/^(\d{1,2})\s*[-–|\t]\s*([^\-–|\t]+?)\s*(?:[-–|\t]\s*([^\-–|\t]+?))?\s*(?:[-–|\t]\s*([\d:.,']+))?$/);
    if(mr&&p)p.inscritos.push({serie,raia:+mr[1],nome:mr[2].trim(),equipe:(mr[3]||'').trim(),inscricao:mr[4]||null});
  }
  if(!provas.length)return toast('Não reconheci o formato');
  await incorporar(provas); toast(`${provas.length} prova(s) importada(s)`);
}
async function incorporar(lista){
  await mutarComp(c=>{
    for(const p of lista){
      c.provas.push({id:uid(),tipo:'ind',codigo:p.codigo||null,dist:+p.dist||50,estilo:p.estilo||'livre',
        categoria:p.categoria||'',
        inscritos:(p.inscritos||[]).map(i=>({id:uid(),serie:+i.serie||1,raia:+i.raia||0,nome:i.nome||'',
          equipe:i.equipe||'',inscricao:typeof i.inscricao==='string'?parseTempo(i.inscricao):(i.inscricao||null),
          atletaId:acharAtleta(i.nome),parciais:[]})).sort((a,b)=>(a.serie-b.serie)||(a.raia-b.raia))});
    }
  });
}
function acharAtleta(nome){
  if(!nome)return null;
  const n=nome.trim().toLowerCase();
  const a=S.elenco.find(x=>x.nome.toLowerCase()===n)||S.elenco.find(x=>x.nome.toLowerCase().startsWith(n.split(' ')[0]));
  return a?a.id:null;
}

function telaProvaDetalhe(){
  const c=S.comp,p=c.provas[S.provaSel];
  const np=nPassagens(p,c.piscina),passo=passoDe(p,c.piscina);
  const cols=Array.from({length:np},(_,i)=>p.tipo==='rev'?`${i+1}º`:`${(i+1)*passo}m`);

  return`
  <div class="row" style="margin:16px 0 4px"><button class="sm ghost" onclick="voltar()">‹ Provas</button>
    <div class="grow"></div><button class="sm ghost" onclick="removerProva()">✕</button></div>

    <h2>${nomeProva(p)}</h2>
    <div class="small muted">${p.tipo==='rev'?`um parcial por percurso de ${p.d}m`:`parciais a cada ${passo}m`} · ${c.piscina}</div></div>

  ${p.inscritos.length?series.map(s=>{
    const gr=p.inscritos.filter(i=>(i.serie||1)===s);
    return`<div class="blk"><h3>Série ${s}</h3><div class="ln"></div></div>
    <div class="card tight" style="overflow-x:auto">
      <table class="ficha"><thead><tr><th>R</th><th style="text-align:left;min-width:96px">Atleta</th>
        ${cols.map(x=>`<th style="min-width:74px">${x}</th>`).join('')}<th>Δ insc.</th></tr></thead><tbody>
      ${gr.map(i=>{
        const ix=p.inscritos.indexOf(i),ps=i.parciais||[],fin=ps.length>=np?ps[np-1]:null;
        const dif=(fin&&i.inscricao)?fin-i.inscricao:null;
        return`<tr><td class="n"><b>${i.raia||'—'}</b></td>
          <td class="nome">${esc(prim(i.nome))}<div class="xs muted" style="font-weight:400">${esc(i.equipe||'')}</div></td>
          ${cols.map((_,k)=>`<td><input inputmode="decimal" placeholder="—" value="${ps[k]!=null?fmt(ps[k],true):''}"
            onchange="setParcial(${ix},${k},this.value)">
            ${k>0&&ps[k]!=null&&ps[k-1]!=null?`<div class="xs t" style="color:var(--water)">${fmt(ps[k]-ps[k-1],true)}</div>`:''}</td>`).join('')}
          <td class="n" style="color:${dif==null?'inherit':(dif<0?'var(--ok)':'var(--clock)')}">${dif==null?'—':(dif<0?'':'+')+fmt(dif,true)}</td></tr>`}).join('')}
      </tbody></table></div>`}).join(''):
    `<div class="empty"><div class="big">Sem inscritos</div><p class="small">Inclua os atletas desta prova.</p></div>`}

  <div class="row" style="margin-top:12px">
    <button class="ghost full" onclick="abrirInscricao()">+ Atleta</button>
    <button class="ghost full" onclick="compartilharProva()">WhatsApp</button>
  </div>
  ${leituraProva(p,np,passo)}
  <div style="height:20px"></div>`;
}
async function setParcial(ix,k,v){
  const ms=parseTempo(v),ip=S.provaSel;
  await mutarComp(c=>{const i=c.provas[ip].inscritos[ix]; i.parciais=i.parciais||[];
    while(i.parciais.length<k)i.parciais.push(null);

  await gravarResultadoPro(ix);
}

function leituraProva(p,np,passo){
  const comTempo=p.inscritos.filter(i=>(i.parciais||[]).filter(x=>x!=null).length>=2);
  if(!comTempo.length)return'';
  return`<div class="card"><div class="eyebrow">leitura dos trechos</div>
    ${comTempo.map(i=>{
      const ps=(i.parciais||[]).filter(x=>x!=null);
      const tr=ps.map((v,k)=>k===0?v:v-ps[k-1]);
      const melhor=Math.min(...tr.slice(1));
      const fin=ps.length>=np?ps[np-1]:null;
      return`<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
        <div class="row"><b>${esc(i.nome)}</b><div class="grow"></div>
          ${fin?`<span class="t" style="font-weight:700">${fmt(fin,true)}</span>`:''}</div>
        <div class="chips">${tr.map((t,k)=>`<span class="chip ${k>0&&t===melhor?'best':''}">${p.tipo==='rev'?(k+1)+'º':((k+1)*passo)+'m'} · ${fmt(t,true)}</span>`).join('')}</div>
        ${tr.length>1?`<div class="xs muted" style="margin-top:5px">Do primeiro ao último trecho: <b class="t">${(tr[tr.length-1]-tr[0])>0?'+':''}${fmt(tr[tr.length-1]-tr[0],true)}</b></div>`:''}
      </div>`}).join('')}</div>`;
}
function compartilharProva(){
  const c=S.comp,p=c.provas[S.provaSel],np=nPassagens(p,c.piscina),passo=passoDe(p,c.piscina);
  let t=`*${c.nome}* — ${brData(c.data)}\n${p.codigo?'Prova '+p.codigo+' · ':''}${nomeProva(p)}${p.categoria?' · '+p.categoria:''}\n`;
  p.inscritos.forEach(i=>{
    const ps=(i.parciais||[]).filter(x=>x!=null); if(!ps.length)return;
    const tr=ps.map((v,k)=>k===0?v:v-ps[k-1]);
    t+=`\n${i.raia?'Raia '+i.raia+' — ':''}${i.nome}\n  ${ps.map((v,k)=>`${p.tipo==='rev'?(k+1)+'º':((k+1)*passo)+'m'} ${fmt(v,true)}`).join(' | ')}`;
    t+=`\n  trechos: ${tr.map(x=>fmt(x,true)).join(' · ')}`;
    if(ps.length>=np&&i.inscricao){const d=ps[np-1]-i.inscricao; t+=`\n  ${d<0?'−':'+'}${fmt(Math.abs(d),true)} vs inscrição`}
  });
  enviar(t+`\n\nPARCIAL ${VER}`,destinosProva(p));
}

    ${lista.length?`<div class="sep"></div><div class="eyebrow">enviar direto para</div>
      ${lista.map(d=>`<a class="destin" href="https://wa.me/${telWa(d.tel)}?text=${enc}" target="_blank" rel="noopener">

function destinosTreino(t){
  if(ehGestor())
    return S.elenco.filter(a=>(t.para||[]).includes(a.id)).map(a=>({nome:a.nome,tel:a.telefone}));
  return S.tecnico?[{nome:S.tecnico.nome+' (técnico)',tel:S.tecnico.telefone}]:[];
}
function destinosProva(p){
  if(!ehGestor())return S.tecnico?[{nome:S.tecnico.nome+' (técnico)',tel:S.tecnico.telefone}]:[];
  const ids=[...new Set((p.inscritos||[]).map(i=>i.atletaId).filter(Boolean))];
  return S.elenco.filter(a=>ids.includes(a.id)).map(a=>({nome:a.nome,tel:a.telefone}));
}
function compartilharTreino(){
  const t=S.treino; if(!t)return;
  const alvo=ehGestor()?S.elenco.filter(a=>(t.para||[]).includes(a.id)):[S.u];
  let x=`*${t.titulo}* — ${brData(t.data)} · ${t.nivel||''}\n`;
  for(const b of t.blocos||[]){
    const ls=[];
    for(const i of b.itens){
      if(i.nota){ ls.push(`• ${i.texto}`); continue; }
      const partes=alvo.map(a=>{
        const r=t.registros?.[a.id]?.[i.id]; const ts=temposItem(r,i);
        return ts.length?`${alvo.length>1?prim(a.nome)+': ':''}${ts.map(y=>fmt(y,true)).join(' / ')}`:null}).filter(Boolean);
      ls.push(`${i.rodadas>1?i.rodadas+'x ':''}${i.reps>1?i.reps+'x':''}${i.dist} ${i.estilo}${i.intervalo?` saída ${fmtInt(i.intervalo)}`:''}${i.pausa?` desc ${fmtPausa(i.pausa)}`:''}${i.obs?` (${i.obs})`:''}${partes.length?'\n  '+partes.join('\n  '):''}`);
    }
    if(ls.length)x+=`\n_${b.titulo}_\n${ls.join('\n')}\n`;
  }
  enviar(x+`\nVolume: ${(volTreino(t)/1000).toFixed(1)}k · PARCIAL ${VER}`,destinosTreino(t));
}

async function enviarProvasParaMarcas(mcId){
  const mc=(S.u.competicoes||[]).find(x=>x.id===mcId); if(!mc)return;
  const comTempo=(mc.provas||[]).filter(p=>p.tempo);
  if(!comTempo.length)return toast('Nenhum tempo lançado ainda');
  S.pro=S.pro||{pbs:{},garmin:[],seco:[],resultados:[],exames:[],bioimp:[]};
  S.pro.resultados=S.pro.resultados||[];
  const existe=new Set(S.pro.resultados.map(r=>`${r.dist}|${r.estilo}|${r.piscina}|${r.data}|${r.tempo}`));
  let add=0;
  for(const p of comTempo){
    const k=`${p.dist}|${p.estilo}|${mc.piscina}|${mc.data}|${p.tempo}`;
    if(existe.has(k))continue; existe.add(k);
    S.pro.resultados.push({chave:'mc_'+mc.id+'_'+p.id,comp:mc.nome,data:mc.data,piscina:mc.piscina,
      prova:`${p.dist}m ${p.estilo}`,dist:p.dist,estilo:p.estilo,tempo:p.tempo,
      parciais:(p.parciais&&p.parciais.length)?p.parciais:[p.tempo],inscricao:p.inscricao||null});
    const pk=pbKey(p.dist,p.estilo,mc.piscina);
    if(!S.pro.pbs[pk]||p.tempo<S.pro.pbs[pk])S.pro.pbs[pk]=p.tempo;
    add++;
  }
  await salvarPro(); toast(add?`${add} tempo(s) enviado(s) para Marcas`:'Já estavam em Marcas'); render();
}
/* balizamento (start list) em PDF — extrai as provas do próprio atleta pelo nome */
/* Formato ABMN Competição: cabeçalho "Nº PROVA - <dist> METROS <estilo> <gênero>",
   séries "Nª SÉRIE ...", e linhas "raia matrícula faixa + NOME  EQUIPE  TEMPO".
   Casa a linha do atleta exigindo todos os nomes dele (>=3 letras) na linha. */
function parseBalizamento(txt,nome){
  const toks=(nome||'').toLowerCase().split(/\s+/).filter(t=>t.length>=3);
  const ESTIL=[[/livre|crawl/i,'livre'],[/costas?/i,'costas'],[/peito/i,'peito'],[/borbol/i,'borboleta'],[/medley/i,'medley']];
  let dist=null,estilo=null,serie=null; const out=[];
  for(const raw of txt.split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    if(/\bprova\b/i.test(l)&&/metros/i.test(l)){
      if(/revez|\d\s*x\s*\d/i.test(l)){ dist=null;estilo=null; continue; }   // pula revezamento
      const md=l.match(/prova\s*[-–:]?\s*(\d{2,4})\s*metros/i);
      if(md){ dist=+md[1]; estilo='livre'; for(const[re,v]of ESTIL){if(re.test(l)){estilo=v;break;}} serie=null; }
      continue;
    }
    const ms=l.match(/(\d+)\D{0,3}s[ée]rie/i); if(ms&&/s[ée]rie/i.test(l)){ serie=+ms[1]; continue; }
    if(!dist||!estilo||!toks.length)continue;
    const low=l.toLowerCase();
    if(toks.every(t=>low.includes(t))){
      const raia=parseInt(l,10);
      const times=l.match(/\d{1,2}:\d{2}[.,]\d{2}|\b\d{1,2}[.,]\d{2}\b/g);
      out.push({id:uid(),dist,estilo,serie,raia:isNaN(raia)?null:raia,inscricao:times?parseTempo(times[times.length-1]):null});
    }
  }
  return out;
}
async function importarBalizamento(inp){
  const f=inp.files&&inp.files[0]; if(!f)return; inp.value='';
  const mc=(S.u.competicoes||[]).find(x=>x.id===S.minhaComp); if(!mc)return;
  toast('Lendo o balizamento…');
  let txt; try{ txt=await pdfTexto(f); }catch(e){ return toast('Não consegui ler: '+e.message); }
  const provas=parseBalizamento(txt,S.u.nome);
  if(!provas.length)return toast('Não achei suas provas. Confira se seu nome está no PDF, ou lance à mão.');
  mc.provas=mc.provas||[];
  const ex=new Set(mc.provas.map(p=>`${p.dist}|${p.estilo}|${p.serie}|${p.raia}`));
  let add=0;
  for(const p of provas){ const k=`${p.dist}|${p.estilo}|${p.serie}|${p.raia}`; if(ex.has(k))continue; ex.add(k); mc.provas.push(p); add++; }
  await salvarUsuario(); toast(add?`${add} prova(s) importada(s)`:'Tudo já estava lançado'); render();
}

  const ent=Object.entries(pbs||{}).filter(([k])=>k.endsWith(' '+pis)).sort((a,b)=>a[0].localeCompare(b[0]));

/* ---------- leitura de PDF no navegador (pdf.js sob demanda) ---------- */
let _pdfjs=null;
function carregarPdfJs(){
  if(_pdfjs)return _pdfjs;
  _pdfjs=new Promise((res,rej)=>{
    if(window.pdfjsLib){res(window.pdfjsLib);return;}
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib)}catch(e){rej(e)}};
    s.onerror=()=>rej(new Error('sem conexão para o leitor de PDF'));
    document.head.appendChild(s);
  });
  return _pdfjs;
}
async function pdfTexto(file){
  const lib=await carregarPdfJs();
  const buf=await file.arrayBuffer();
  const pdf=await lib.getDocument({data:buf}).promise;
  let out='';
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    const linhas={};
    for(const it of tc.items){ const y=Math.round(it.transform[5]); (linhas[y]=linhas[y]||[]).push({x:it.transform[4],s:it.str}); }
    for(const y of Object.keys(linhas).map(Number).sort((a,b)=>b-a))
      out+=linhas[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ')+'\n';
  }
  return out;
}
/* extrai resultados do currículo On-Line da ABMN (histórico por competição) */
function parseABMN(txt){
  const ESTIL={LIVRE:'livre',PEITO:'peito',COSTAS:'costas',BORBOLETA:'borboleta',MEDLEY:'medley'};
  let comp='',pool='SC25'; const out=[];
  for(const raw of txt.split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    const mh=l.match(/^(.*?[A-Za-zÀ-ÿ].*?)\s*[-–]\s*(25|50)\s*METROS\s*$/i);
    if(mh&&!/melhores tempos|resultados por prova/i.test(mh[1])){ comp=mh[1].trim(); pool=mh[2]==='50'?'LC50':'SC25'; continue; }
    if(/melhores tempos/i.test(l)&&/(25|50)\s*metros/i.test(l)){ pool=/50\s*metros/i.test(l)?'LC50':'SC25'; continue; }
    if(/\d\s*[xX]\s*\d/.test(l))continue;                    // pula revezamentos
    const mp=l.match(/(\d{2,4})\s+(LIVRE|PEITO|COSTAS|BORBOLETA|MEDLEY)\s+MASC/i);
    const mt=l.match(/\b(\d{1,2}:\d{2}\.\d{2})\b/);
    const md=l.match(/\b(\d{2})\/(\d{2})\/(\d{4})\b/);
    if(mp&&mt&&md){
      const dist=+mp[1],estilo=ESTIL[mp[2].toUpperCase()]||'livre',tempo=parseTempo(mt[1]);
      if(tempo)out.push({comp,data:`${md[3]}-${md[2]}-${md[1]}`,piscina:pool,prova:`${dist}m ${estilo}`,dist,estilo,tempo,parciais:[],inscricao:null});
    }
  }
  return out;
}
async function importarABMN(inp){
  const f=inp.files&&inp.files[0]; if(!f)return; inp.value='';
  toast('Lendo o PDF…');
  let txt; try{ txt=await pdfTexto(f); }catch(e){ return toast('Não consegui ler: '+e.message); }
  const novos=parseABMN(txt);
  if(!novos.length)return toast('Nenhum resultado ABMN encontrado neste PDF.');
  S.pro=S.pro||{pbs:{},garmin:[],seco:[],resultados:[],exames:[],bioimp:[]};
  S.pro.resultados=S.pro.resultados||[];
  const existe=new Set(S.pro.resultados.map(r=>`${r.dist}|${r.estilo}|${r.piscina}|${r.data}|${r.tempo}`));
  let add=0;
  for(const r of novos){
    const k=`${r.dist}|${r.estilo}|${r.piscina}|${r.data}|${r.tempo}`;
    if(existe.has(k))continue; existe.add(k);
    r.chave='abmn_'+k.replace(/\|/g,'_'); S.pro.resultados.push(r); add++;
    const pk=pbKey(r.dist,r.estilo,r.piscina);
    if(!S.pro.pbs[pk]||r.tempo<S.pro.pbs[pk])S.pro.pbs[pk]=r.tempo;
  }
  await salvarPro(); toast(add?`${add} resultado(s) importado(s) da ABMN`:'Tudo já estava importado'); render();
}

/* agrupa os resultados de competição por prova+piscina para a linha do tempo */
function evolucaoProvas(pro){
  const g={};
  for(const r of (pro.resultados||[])){
    if(r.tempo==null||!r.data)continue;
    const k=pbKey(r.dist,r.estilo,r.piscina);
    (g[k]=g[k]||[]).push(r);
  }
  const out=[];
  for(const k of Object.keys(g)){
    const arr=g[k].slice().sort((a,b)=>a.data.localeCompare(b.data));
    if(arr.length<2)continue;
    const first=arr[0].tempo,last=arr[arr.length-1].tempo;
    out.push({key:k,prova:`${arr[0].dist}m ${arr[0].estilo}`,piscina:arr[0].piscina,
      pts:arr.map(r=>({rot:r.data.slice(8,10)+'/'+r.data.slice(5,7)+'/'+r.data.slice(2,4),v:r.tempo})),delta:last-first,melhora:last<first});
  }
  return out.sort((a,b)=>a.key.localeCompare(b.key));
}
/* mini gráfico de linha: menor tempo (melhor) fica em cima; verde melhora, vermelho piora */
function graficoLinha(pts){
  if(!pts||pts.length<2)return'';
  const W=600,H=150,P=30,n=pts.length;
  const vs=pts.map(p=>p.v),mx=Math.max(...vs),mn=Math.min(...vs),rg=(mx-mn)||1;
  const x=i=>P+(i*(W-2*P)/(n-1));
  const y=v=>P+((v-mn)/rg)*(H-2*P);
  const cor=pts[n-1].v<pts[0].v?'#1B7F5A':'#E0342A';
  const linha=pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" style="overflow:visible">
    <polyline points="${linha}" fill="none" stroke="${cor}" stroke-width="2.5"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5" fill="${cor}"/>
      <text x="${x(i).toFixed(1)}" y="${(y(p.v)-8).toFixed(1)}" font-size="10" fill="#12181C" text-anchor="middle" font-family="JetBrains Mono,monospace">${fmt(p.v,true)}</text>
      <text x="${x(i).toFixed(1)}" y="${H-P+14}" font-size="9" fill="#5A6670" text-anchor="middle" font-family="Barlow,sans-serif">${p.rot}</text>`).join('')}
  </svg>`;
}
function cardEvolucao(pro,eyebrow){
  const ev=evolucaoProvas(pro); if(!ev.length)return'';
  return`<div class="card"><div class="eyebrow">${eyebrow}</div>
    ${ev.map(e=>`<div style="margin-top:14px">
      <div class="row"><b>${e.prova} <span class="xs muted">${e.piscina}</span></b><div class="grow"></div>
        <span class="small" style="font-weight:700;color:${e.melhora?'var(--ok)':'var(--clock)'}">${e.melhora?'▼ melhorou':'▲ piorou'} ${fmt(Math.abs(e.delta),true)}</span></div>
      ${graficoLinha(e.pts)}</div>`).join('')}
    <div class="xs muted" style="margin-top:8px">Cada ponto é uma competição, na ordem cronológica (dia/mês/ano). Linha para baixo = tempo menor = melhorando.</div>
  </div>`;
}

function prontidao(){
  const g=[...(S.pro?.garmin||[])].sort((a,b)=>b.data.localeCompare(a.data));
  const h=g.filter(x=>x.hrv!=null),f=g.filter(x=>x.fc!=null);
  if(h.length<4&&f.length<4)return'<div class="small muted">Poucos dias para uma leitura confiável.</div>';
  const m=[];let alerta=false;
  if(h.length>=4){
    const rec=h.slice(0,3).reduce((t,x)=>t+x.hrv,0)/3;
    const base=h.slice(3,17).reduce((t,x)=>t+x.hrv,0)/Math.max(1,h.slice(3,17).length);
    const d=((rec-base)/base)*100;
    if(d<-8){m.push(`VFC ${Math.abs(d).toFixed(0)}% abaixo da linha de base.`);alerta=true}
    else if(d>8)m.push(`VFC ${d.toFixed(0)}% acima da linha de base — boa janela para intensidade.`);
    else m.push('VFC estável em relação à linha de base.');
  }
  if(f.length>=4){
    const rec=f.slice(0,3).reduce((t,x)=>t+x.fc,0)/3;
    const base=f.slice(3,17).reduce((t,x)=>t+x.fc,0)/Math.max(1,f.slice(3,17).length);
    if(rec>base+3){m.push(`FC de repouso ${(rec-base).toFixed(0)} bpm acima do habitual.`);alerta=true}
  }
  const sono=g.filter(x=>x.sono!=null).slice(0,7);
  if(sono.length>=3){const md=sono.reduce((t,x)=>t+x.sono,0)/sono.length;
    if(md<6.5){m.push(`Média de sono de ${md.toFixed(1)}h nos últimos dias.`);alerta=true}}
  return`<div class="note ${alerta?'warn':'ok'}">${m.join(' ')}</div>`;
}
async function arquivoGarmin(inp){
  let n=0;
  for(const f of inp.files){
    const txt=await f.text();
    n+=await importarGarmin(txt,true);
  }
  await salvarPro(); toast(`${n} dia(s) importado(s)`); render();

async function importarGarmin(raw,silencioso){
  if(!raw||!raw.trim()){if(!silencioso)toast('Cole os dados');return 0}
  let j; try{j=JSON.parse(raw)}catch(e){if(!silencioso)toast('JSON inválido');return 0}
  S.pro=S.pro||{pbs:{},garmin:[],seco:[],resultados:[],exames:[],bioimp:[]};
  const arr=Array.isArray(j)?j.flat():[j],mapa={};
  (S.pro.garmin||[]).forEach(x=>mapa[x.data]=x);
  let n=0;
  arr.forEach(o=>{
    if(!o||typeof o!=='object')return;
    const d=o.calendarDate||o.calendar_date||o.sleepStartTimestampLocal?.slice?.(0,10)||
      (o.startTimeLocal?String(o.startTimeLocal).slice(0,10):null);
    if(!d||!/^\d{4}-\d{2}-\d{2}/.test(d))return;
    const dia=d.slice(0,10);
    const g=mapa[dia]||{data:dia};
    if(o.restingHeartRate!=null)g.fc=Math.round(o.restingHeartRate);
    const hrv=o.hrvWeeklyAverage??o.lastNightAvg??o.avgOvernightHrv??o.weeklyAvg;
    if(hrv!=null)g.hrv=Math.round(hrv);
    if(o.sleepTimeSeconds!=null)g.sono=+(o.sleepTimeSeconds/3600).toFixed(1);
    if(o.deepSleepSeconds!=null&&o.sleepTimeSeconds==null)g.sono=+((o.deepSleepSeconds+(o.lightSleepSeconds||0)+(o.remSleepSeconds||0))/3600).toFixed(1);
    if((o.activityType==='lap_swimming'||o.activityType==='open_water_swimming')&&o.distance!=null)
      g.nado=(g.nado||0)+Math.round(o.distance/100);
    mapa[dia]=g;n++;
  });
  S.pro.garmin=Object.values(mapa);
  if(!silencioso){await salvarPro();toast(`${n} registro(s) lido(s)`);render()}
  return n;
}

let FOTO=null,SECOPDF=null;
function fotoSeco(inp){
  const f=inp.files[0]; if(!f)return;
  if(f.type==='application/pdf'){
    const p=document.getElementById('skPrev');
    if(f.size>500000){ SECOPDF=null; if(p)p.textContent='PDF grande demais (máx 500KB). Prefira uma foto.'; return; }
    const rp=new FileReader(); rp.onload=()=>{ SECOPDF=rp.result; FOTO=null; if(p)p.textContent='PDF anexado ✓'; }; rp.readAsDataURL(f); return;
  }
  const r=new FileReader();
  r.onload=()=>{
    SECOPDF=null;
    const img=new Image();
    img.onload=()=>{
      const max=760,esc2=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*esc2); cv.height=Math.round(img.height*esc2);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      FOTO=cv.toDataURL('image/jpeg',.6);
      const p=document.getElementById('skPrev');
      if(p)p.innerHTML=`<img src="${FOTO}" style="max-width:130px;border-radius:9px;border:1px solid var(--line)">`;
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

   PRO — RELATÓRIO DE PERFORMANCE

async function coletarEsforcos(){
  const out=[]; const ses=[];
  for(const meta of S.tridx.filter(t=>(t.para||[]).includes(S.u.id)).slice(0,25)){
    const t=await DB.get(kTr(S.u.equipe,meta.id)); if(!t)continue;
    if(!treinoFeito(t,S.u.id))continue;   /* só consolida treino marcado como feito */
    const sj=t.sessao&&t.sessao[S.u.id];
    if(sj&&sj.rpe!=null&&sj.dur)ses.push({data:t.data,tipo:'natação',load:sj.rpe*sj.dur});
    for(const b of t.blocos||[])for(const i of b.itens){
      const r=t.registros?.[S.u.id]?.[i.id]; if(!r)continue;
      const series=(i.rodadas||1)>1?(r.rd||[]):[r];
      for(const s of series)(s.tempos||[]).forEach((x,k)=>{ if(x==null)return;
        out.push({data:t.data,dist:i.dist,estilo:i.estilo,tags:i.tags,tempo:x,
          p1:i.parcial?(s.parciais?.[k]??null):null,forte:i.forte,vol:i.vol})});
    }
  }
  SESSOES=ses;
  return out.sort((a,b)=>a.data.localeCompare(b.data));
}
let ESF=null, SESSOES=[];
/* Carga total (session-RPE = duração × RPE) por modalidade, últimos N dias */
function cargaTotal(dias){
  dias=dias||28; const h0=new Date(hoje()+'T00:00:00');
  const dentro=d=>{const x=(h0-new Date(d+'T00:00:00'))/86400000;return x>=0&&x<dias;};
  let natacao=0,forca=0;
  for(const s of (SESSOES||[]))if(dentro(s.data))natacao+=s.load;
  for(const s of ((S.pro&&S.pro.seco)||[]))if(s.rpe!=null&&s.dur&&dentro(s.data))forca+=s.rpe*s.dur;
  const total=natacao+forca;
  return total>0?{natacao:Math.round(natacao),forca:Math.round(forca),total:Math.round(total)}:null;
}
function cardCargaTotal(){
  const c=cargaTotal(28); if(!c)return'';
  const pN=c.total?Math.round(c.natacao/c.total*100):0;
  return`<div class="card"><div class="eyebrow">carga total — 28 dias</div>
    <div class="grid3" style="margin-top:8px">
      <div class="kpi"><div class="v">${c.total}</div><div class="l">total (UA)</div></div>
      <div class="kpi"><div class="v">${c.natacao}</div><div class="l">natação ${pN}%</div></div>
      <div class="kpi"><div class="v">${c.forca}</div><div class="l">força ${100-pN}%</div></div>
    </div>
    <div class="xs muted" style="margin-top:8px">Carga da sessão = <b>duração × RPE</b> (UA = unidades arbitrárias). Põe natação e musculação na mesma escala. Preencha RPE e duração ao concluir cada treino e cada sessão de força.</div>
    ${(()=>{const t=tonelagem(28);return t?`<div class="xs" style="margin-top:6px;color:var(--ink-2)"><b>Tonelagem de força (28d):</b> ~${t.total.toLocaleString('pt-BR')} kg em ${t.sessoes} sessão(ões) — volume real de musculação (séries×reps×carga), quando a ficha traz as cargas.</div>`:'';})()}
  </div>`;
}
/* Força estruturada: transcrição livre da ficha → {exercício, séries, reps, carga}
   → tonelagem (séries×reps×carga). Best-effort; ignora exercícios sem carga (peso
   do corpo, tempo). Refina o session-RPE com a carga real de musculação. */
function parseForca(txt){
  if(!txt)return{itens:[],tonelagem:0};
  const itens=[]; let ton=0;

function chavesExame(ex){

/* data do exame: prioriza "Coleta:", depois "Data da coleta", depois a data
   mais repetida do documento (ignora a de nascimento). Nunca usa a de hoje à toa. */
function dataDoExame(txt){
  const norm=(d,m,a)=>`${a}-${m}-${d}`;
  let m=txt.match(/coleta\s*:?\s*(\d{2})\/(\d{2})\/(\d{4})/i)
      ||txt.match(/data\s*(?:d[ae]\s*)?coleta\s*:?\s*(\d{2})\/(\d{2})\/(\d{4})/i);
  if(m)return norm(m[1],m[2],m[3]);
  m=txt.match(/data\s*\/?\s*hora\s*:?\s*(\d{2})[.\/](\d{2})[.\/](\d{4})/i);   /* InBody */
  if(m)return norm(m[1],m[2],m[3]);
  /* fallback: data mais frequente (aceita / ou .), descartando nascimento e datas de emissão/liberação */
  const cont={};
  for(const linha of txt.split(/\r?\n/)){
    if(/nascimento|\bdn\b|\bd\.n\b|libera[çc]|emiss|impress/i.test(linha))continue;
    const achadas=linha.match(/\b(\d{2})[.\/](\d{2})[.\/](\d{4})\b/g)||[];
    for(const d of achadas){const p=d.split(/[.\/]/);cont[norm(p[0],p[1],p[2])]=(cont[norm(p[0],p[1],p[2])]||0)+1;}
  }
  const ord=Object.entries(cont).sort((a,b)=>(b[1]-a[1])||b[0].localeCompare(a[0]));
  return ord.length?ord[0][0]:hoje();
}
/* Lê laudo laboratorial. Formato comum (Sabin/Fleury/etc): o marcador é um
   título e o valor vem depois em "RESULTADO: x". Fallback: valor na mesma linha. */
function parseExame(txt){
  const linhas=txt.split(/\r?\n/).map(l=>l.trim());
  const vals={}; let atual=null;
  const num=s=>{const n=parseFloat(String(s).replace(/\./g,'#').replace(',','.').replace(/#/g,''));return isNaN(n)?null:n;};
  for(const l of linhas){
    if(!l)continue;
    const mr=l.match(/resultado\s*:?\s*([<>]?\s*-?[\d.,]+)/i);
    if(mr){ if(atual&&vals[atual]==null){const n=num(mr[1].replace(/[<>\s]/g,'')); if(n!=null)vals[atual]=n;} continue; }
    /* título de seção: linha curta que casa com um marcador conhecido */
    if(l.length<=60){
      const hit=MARC_LAB.find(([,,,re])=>re.test(l));
      if(hit){
        atual=hit[0];
        /* alguns laudos põem o valor na mesma linha do título */
        const inline=l.replace(hit[3],'').match(/(-?\d[\d.,]*)/);
        if(inline&&vals[atual]==null&&/\d/.test(inline[1])&&!/^\d{2}\/\d{2}/.test(l)){
          const n=num(inline[1]); if(n!=null&&/(:|\s{2,})/.test(l))vals[atual]=n;
        }
        continue;
      }
    }
  }
  return vals;
}

function fileB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(new Error('não consegui ler o arquivo'));r.readAsDataURL(file);});}
/* prepara o arquivo p/ IA: foto é reduzida (máx 1600px, JPEG) pra não estourar
   limite/tamanho; PDF vai como está. Devolve {data(base64), mime}. */
function arquivoParaIA(file){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type||'')){ fileB64(file).then(data=>res({data,mime:file.type||'application/pdf'})).catch(rej); return; }
    const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{ const max=1600,e=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement('canvas'); cv.width=Math.round(img.width*e); cv.height=Math.round(img.height*e);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res({data:(cv.toDataURL('image/jpeg',.85).split(',')[1]||''),mime:'image/jpeg'}); };
      img.onerror=()=>rej(new Error('não consegui abrir a imagem (formato não suportado?)'));
      img.src=r.result; };
    r.onerror=()=>rej(new Error('não consegui ler o arquivo'));
    r.readAsDataURL(file);
  });
}

/* gráfico de linha simples para série de marcador (neutro: nem alto nem baixo é "bom") */
function graficoSerie(pts,faixa){
  if(!pts||pts.length<2)return'';
  const W=600,H=120,P=26,n=pts.length;
  const vs=pts.map(p=>p.v);
  let mn=Math.min(...vs),mx=Math.max(...vs);
  if(faixa){ if(faixa.lo!=null)mn=Math.min(mn,faixa.lo); if(faixa.hi!=null)mx=Math.max(mx,faixa.hi); }
  const rg=(mx-mn)||1;

function tmbKatch(b){ if(!b||b.peso==null||b.gordura==null)return null; const lbm=b.peso*(1-b.gordura/100); return Math.round(370+21.6*lbm); }

/* laudo consolidado: liga saúde + composição + treino/desempenho e prioriza ações */
/* ── ESTADO DE PERFORMANCE (Prontidão · Capacidade · Tendência) ──────────────
   Modelo transparente a partir dos dados que já existem no app. */
function estadoPerformance(pro,comPct,sem){
  const md=(a,k)=>a.reduce((t,x)=>t+x[k],0)/Math.max(1,a.length);
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  /* Prontidão 0–100 (VFC/FC repouso/sono/carga) */
  const g=[...(pro.garmin||[])].sort((a,b)=>b.data.localeCompare(a.data));
  const h=g.filter(x=>x.hrv!=null),f=g.filter(x=>x.fc!=null);
  let pr=null;
  if(h.length>=4||f.length>=4){
    let s=72; const mot=[];
    if(h.length>=4){const d=(md(h.slice(0,3),'hrv')-md(h.slice(3,17),'hrv'))/md(h.slice(3,17),'hrv')*100;const c=cl(d*1.2,-22,16);s+=c;mot.push({c,txt:`VFC ${d>=0?'+':''}${d.toFixed(0)}% vs base`});}
    if(f.length>=4){const d=md(f.slice(0,3),'fc')-md(f.slice(3,17),'fc');const c=cl(-d*2,-14,8);s+=c;mot.push({c,txt:`FC repouso ${d>=0?'+':''}${d.toFixed(0)} bpm`});}
    const sn=g.filter(x=>x.sono!=null).slice(0,7);
    if(sn.length>=3){const m=md(sn,'sono');const c=m<6.5?-8:(m>=7.5?4:0);if(c){s+=c;mot.push({c,txt:`sono ${m.toFixed(1)}h`});}}
    if(sem&&sem.length>=2&&sem[sem.length-1].m>sem[sem.length-2].m*1.25){s-=8;mot.push({c:-8,txt:'volume +25%'});}
    pr={score:Math.round(cl(s,0,100)),mot,dias:Math.max(h.length,f.length)};
  }
  /* Capacidade: quão perto do melhor tempo os tiros recentes estão saindo */
  let cap=null;
  if(comPct.length){const a=comPct.slice(-15);cap={score:Math.round(cl(md(a,'pct'),0,100)),n:a.length};}
  /* Tendência: evolução em competição + tendência do %PB */
  let tend=null;
  const ev=(typeof evolucaoProvas==='function')?evolucaoProvas(pro):[];
  const net=ev.filter(e=>e.melhora).length-ev.filter(e=>!e.melhora).length;
  let pc=0;
  if(comPct.length>=4){const hf=Math.floor(comPct.length/2);pc=md(comPct.slice(hf),'pct')-md(comPct.slice(0,hf),'pct');}
  const sc=net+(pc>1?1:pc<-1?-1:0);
  if(ev.length||comPct.length>=4)tend={dir:sc>0?'↑':sc<0?'↓':'→',txt:sc>0?'capacidade melhorando':sc<0?'capacidade em queda — atenção':'capacidade estável',cor:sc>0?'var(--ok)':sc<0?'var(--clock)':'var(--ink-2)',nEv:ev.length,nPct:comPct.length};
  return {pr,cap,tend};
}
function cardEstado(pro,comPct,sem){
  const e=estadoPerformance(pro,comPct,sem);
  if(!e.pr&&!e.cap&&!e.tend)return'';
  const kpi=(v,l,cor)=>`<div class="kpi"><div class="v"${cor?` style="color:${cor}"`:''}>${v}</div><div class="l">${l}</div></div>`;
  const corPr=e.pr?(e.pr.score>=75?'var(--ok)':e.pr.score<55?'var(--clock)':''):'';
  return`<div class="card"><div class="eyebrow">estado de performance</div>
    <div class="grid3" style="margin-top:8px">

      ${kpi(e.cap?e.cap.score+'%':'—','capacidade')}
      ${kpi(e.tend?e.tend.dir:'—','tendência',e.tend?e.tend.cor:'')}
    </div>
    ${e.pr&&e.pr.mot.length?`<div class="small" style="margin-top:10px"><b>Prontidão</b> — ${e.pr.mot.map(m=>`${m.txt} <b style="color:${m.c>=0?'var(--ok)':'var(--clock)'}">${m.c>=0?'+':''}${Math.round(m.c)}</b>`).join(' · ')}</div>`:''}
    ${(function(){const cf=(n,a,m)=>n>=a?{t:'alta',c:'var(--ok)'}:n>=m?{t:'média',c:''}:{t:'baixa',c:'var(--clock)'};
      const ps=[]; if(e.pr){const c=cf(e.pr.dias,14,7);ps.push(`Prontidão <b style="color:${c.c}">${c.t}</b> <span class="xs muted">(${e.pr.dias} dias de VFC/FC)</span>`);}
      if(e.cap){const c=cf(e.cap.n,12,6);ps.push(`Capacidade <b style="color:${c.c}">${c.t}</b> <span class="xs muted">(${e.cap.n} tiros)</span>`);}
      if(e.tend){const base=Math.max(e.tend.nEv,e.tend.nPct>=8?2:e.tend.nPct>=4?1:0);const c=cf(base,3,1);ps.push(`Tendência <b style="color:${c.c}">${c.t}</b>`);}
      return ps.length?`<div class="small" style="margin-top:8px"><b>Confiança</b> — ${ps.join(' · ')}</div>`:'';})()}
    <div class="xs muted" style="margin-top:8px"><b>Prontidão</b>: quão pronto seu corpo está hoje (VFC, FC de repouso, sono, carga). <b>Capacidade</b>: quão perto do seu melhor tempo você está nadando. <b>Tendência</b>: se vem melhorando ou caindo.${e.tend?' '+e.tend.txt+'.':''} <span class="muted">Estimativa de apoio; a confiança sobe conforme você acumula dados.</span></div>
  </div>`;
}
/* Carga aguda × crônica (ACWR): volume dos últimos 7 dias / média semanal em 28 dias.
   Só conta treino marcado como feito. */
function cargaACWR(){
  const h0=new Date(hoje()+'T00:00:00');
  const meus=S.tridx.filter(t=>(t.para||[]).includes(S.u.id)&&t.data);
  const dias=t=>Math.floor((h0-new Date(t.data+'T00:00:00'))/86400000);
  let ag=0,cr28=0;
  for(const t of meus){const d=dias(t); if(d<0)continue;
    if(d<7)ag+=(t.vol||0);
    if(d<28)cr28+=(t.vol||0);}
  const cr=cr28/4;
  if(cr<=0)return null;
  return {ag,cr:Math.round(cr),acwr:ag/cr};
}
/* Composição × desempenho: massa magra + relação peso/potência (tempo/peso) */
function cardComposicaoRelativa(pro){
  const bio=[...(pro.bioimp||[])].filter(b=>b.peso!=null&&!bioSuspeita(b)).sort((a,b)=>a.data.localeCompare(b.data));
  if(!bio.length)return'';
  const ult=bio[bio.length-1];
  const magra=b=>b.gordura!=null?+(b.peso*(1-b.gordura/100)).toFixed(1):(b.musculo!=null?b.musculo:null);
  const lbm=magra(ult);
  const prefer=Object.entries(pro.pbs||{}).find(([k])=>/^50 /.test(k));
  const ref=prefer?{prova:prefer[0].replace(/ (SC25|LC50)$/,''),tempo:prefer[1]}:null;
  let nota='';
  if(bio.length>=2){const a=bio[0],lA=magra(a),lB=lbm,dP=ult.peso-a.peso;
    if(lA!=null&&lB!=null){const dL=lB-lA;
      nota=(dP<-0.5&&dL>=-0.3)?'Peso caiu mantendo (ou ganhando) massa magra — melhora da relação peso/potência.'
        :(dP>0.5&&dL<0.3)?'Peso subiu sem ganho de massa magra — atenção à composição.'
        :'Composição estável entre as medições.';}}
  return`<div class="card"><div class="eyebrow">composição × desempenho</div>
    <div class="grid3" style="margin-top:8px">
      <div class="kpi"><div class="v">${ult.peso}<span class="xs muted"> kg</span></div><div class="l">peso</div></div>
      <div class="kpi"><div class="v">${lbm!=null?lbm:'—'}<span class="xs muted">${lbm!=null?' kg':''}</span></div><div class="l">massa magra</div></div>
      <div class="kpi"><div class="v">${ref?fmt(ref.tempo,true):'—'}</div><div class="l">${ref?ref.prova:'melhor tempo'}</div></div>
    </div>
    ${nota?`<div class="note" style="margin-top:10px">${nota}</div>`:''}
    <div class="xs muted" style="margin-top:6px">Massa magra = peso × (1 − %gordura). Perder peso mantendo a massa magra melhora a relação peso/potência — costuma refletir em velocidade.</div>
  </div>`;
}
function cardCarga(){

function cardFingerprint(m){

  const legenda=dims.map(d=>`<tr><td>${d.eixo}</td><td class="n" style="font-weight:700">${d.score!=null?d.score:'—'}</td><td class="xs muted" style="padding-left:8px">${d.txt}</td></tr>`).join('');

function diagnostico(comPct,brk,sem,pro){

  const deltaMd=brk.length?brk.slice(-10).reduce((t,e)=>t+e.delta,0)/Math.min(brk.length,10):null;

    const base=h.slice(3,17).reduce((t,x)=>t+x.hrv,0)/Math.max(1,h.slice(3,17).length);

  if(regrediu.length)foco.push({t:'warn',txt:`Queda de rendimento em <b>${[...new Set(regrediu.map(e=>e.prova))].join(', ')}</b> ao longo das competições. Vale revisar a preparação específica dessas provas.`});
  if(!foco.length)foco.push({t:'',txt:'Ainda não há tiros suficientes registrados para um diagnóstico firme. Lance os tempos de mais algumas sessões.'});

    sessao=`Aquecimento\n400 livre\n6x50 pernada peito 1'05\n\nPrincipal — manutenção de velocidade\n6x50 peito ritmo de prova saída 3'00 (parciais 25/25)\n8x25 peito máximo pausa 45"\n4x50 peito broken 10" no 25\n\nSoltura\n300 livre`;

    sessao=`Aquecimento\n300 livre\n4x50 pernada peito 1'10\n\nPrincipal — velocidade\n10x25 peito máximo pausa 50"\n4x50 peito ritmo de prova saída 2'30\n2x50 peito com saída de bloco\n\nSoltura\n200 costas`;

async function compartilharRelatorio(){
  const pro=S.pro||{};
  const e=ESF||await coletarEsforcos();
  const tec=e.filter(x=>['pernada','técnica','braçada','filipina'].some(t=>x.tags.includes(t)));
  const int=e.filter(x=>!tec.includes(x));
  const comPct=int.map(x=>{const pb=pbDe(pro,x.dist,x.estilo);return{...x,pct:pb?pb/x.tempo*100:null}}).filter(x=>x.pct);
  const brk=int.filter(x=>x.p1!=null&&x.dist===50).map(x=>({...x,delta:x.tempo-2*x.p1}));
  const diag=diagnostico(comPct,brk,volumePorSemana(),pro);
  const semTags=s=>String(s).replace(/<[^>]+>/g,'');
  let t=`*Relatório de performance — ${S.u.nome}*\n${brData(hoje())}\n`;
  t+=`\n*Onde concentrar*\n`+diag.foco.slice(0,5).map(f=>'• '+semTags(f.txt)).join('\n')+'\n';
  const ev=evolucaoProvas(pro);
  if(ev.length)t+=`\n*Evolução em competições*\n`+ev.map(x=>`• ${x.prova} ${x.piscina}: ${x.melhora?'melhorou':'piorou'} ${fmt(Math.abs(x.delta),true)}`).join('\n')+'\n';
  const exUlt=[...(pro.exames||[])].sort((a,b)=>b.data.localeCompare(a.data))[0];
  if(exUlt){const fl=flagsExame(exUlt); if(fl.length)t+=`\n*Saúde — exame de ${brData(exUlt.data)}*\n`+fl.map(f=>'• '+semTags(f.txt)).join('\n')+'\n';}
  const bioUlt=[...(pro.bioimp||[])].sort((a,b)=>b.data.localeCompare(a.data))[0];
  if(bioUlt){const susp=bioSuspeita(bioUlt),tm=tmbDe(bioUlt),imc=imcDe(bioUlt),ps=[];
    if(bioUlt.peso!=null)ps.push(`peso ${bioUlt.peso}kg`);
    if(bioUlt.gordura!=null&&!susp)ps.push(`gordura ${bioUlt.gordura}%`);
    if(imc!=null)ps.push(`IMC ${imc}`); if(tm)ps.push(`TMB ~${tm}kcal`);
    t+=`\n*Composição — ${brData(bioUlt.data)}*\n${susp?`(bioimpedância com valor suspeito: ${susp} — verificar)\n`:''}${ps.join(' · ')||'—'}\n`;}
  const pbs=Object.entries(pro.pbs||{}).slice(0,8);
  if(pbs.length)t+=`\n*Melhores marcas*\n${pbs.map(([k,v])=>`  ${k}: ${fmt(v,true)}`).join('\n')}\n`;
  t+=`\n_Análise automática de apoio — não substitui avaliação médica._\nPARCIAL ${VER}`;
  enviar(t,S.tecnico?[{nome:S.tecnico.nome+' (técnico)',tel:S.tecnico.telefone}]:[]);
}
