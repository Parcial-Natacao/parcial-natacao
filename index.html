/* ── Fase 2 do P0: migração dos campos de segurança ─────────────────────────
   Reescreve dono/equipe/perfil/aprovado como campos REAIS em todos os
   documentos. Os dados (`v`) não são tocados. Precisa rodar DEPOIS que todos
   os clientes estiverem na v69+ e ANTES de publicar as regras novas — publicar
   antes disto tranca todos os usuários para fora do app. */
async function migrarCamposSeguranca(){
  /* Sem confirm(): em app instalado na tela de início (standalone) essa janela
     costuma ser suprimida e a função encerrava em silêncio. A operação só
     ACRESCENTA campos e é repetível, então não precisa de confirmação.
     O progresso vai dentro da própria folha — o toast fica atrás dela. */
  const diz=(txt,cor)=>{
    const el=document.getElementById('migStatus');
    if(el){ el.className='note '+(cor||''); el.innerHTML=txt; }
    try{ console.log('[migração]',String(txt).replace(/<[^>]+>/g,'')); }catch(_){}
  };
  if(!ehDev())return diz('Só o desenvolvedor pode rodar a migração.','warn');
  if(!FB)return diz('Disponível só no modo em rede (Firebase).','warn');
  diz('Varrendo o banco…');
  let snap;
  try{ snap=await varrerKv(); }
  catch(e){ return diz('Falha ao varrer: '+esc(e.message||String(e)),'warn'); }
  const todos=[]; snap.forEach(d=>todos.push(d));
  if(!todos.length)return diz('Nenhum documento encontrado.','warn');
  /* pro_ de OUTRA pessoa é intocável — por desenho, só o dono escreve nos
     próprios dados de saúde (nem o dev). E não precisa migrar: esses
     documentos já têm `dono`, que é o único campo que as regras novas exigem
     deles; o resto o próprio atleta preenche na gravação seguinte. Como o lote
     do Firestore é ATÔMICO, uma única escrita negada derrubava tudo. */
  const meu=(S.u&&S.u.id)||'';
  const docs=todos.filter(d=>!(d.id.startsWith('pro_')&&d.id.slice(4)!==meu));
  const pulados=todos.length-docs.length;
  let n=0, falhas=[];
  const campos=d=>{ let v=null; try{ v=JSON.parse(d.data().v); }catch(_){} return camposSeguranca(d.id,v); };
  for(let i=0;i<docs.length;i+=150){
    const parte=docs.slice(i,i+150);
    diz(`Migrando… ${i} de ${docs.length}`);
    const lote=fdb.batch();
    for(const d of parte)lote.update(d.ref,campos(d));
    try{ await lote.commit(); n+=parte.length; }
    catch(e){
      /* lote é tudo-ou-nada: se falhou, refaz um a um para isolar o culpado
         em vez de perder os 149 documentos que estavam bons. */
      diz(`Um lote falhou — refazendo um a um (${i} de ${docs.length})…`);
      for(const d of parte){
        try{ await d.ref.update(campos(d)); n++; }
        catch(e2){ falhas.push(d.id+': '+(e2.message||e2)); }
      }
    }
  }
  const nota=pulados?` ${pulados} documento(s) privados de outros atletas foram preservados (só o dono pode escrever neles, e não precisam de migração).`:'';
  if(falhas.length)diz(`Migrados ${n} de ${docs.length}.${nota} <b>${falhas.length} falharam:</b> ${esc(falhas.slice(0,3).join(' · '))}`,'warn');
  else{ diz(`<b>Migração concluída: ${n} documento(s).</b>${nota} Recarregando o diagnóstico…`,'ok');
        setTimeout(()=>abrirDiagnostico(),1400); }
}
/* reconstrói o índice de treinos (eq_<slug>_tridx) a partir dos docs eq_<slug>_tr_* */
async function reconstruirTridx(sg){
  if(!ehDev())return; if(!FB)return;
  toast('Reconstruindo índice…');
  const snap=await varrerKv();
  const re=new RegExp('^eq_'+sg.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&')+'_tr_(.+)$');
  const idx=[];
  snap.forEach(doc=>{ const m=doc.id.match(re); if(!m)return; let v=null; try{v=JSON.parse(doc.data().v)}catch(_){}; if(!v)return;
    const vol=(v.blocos||[]).reduce((s,b)=>s+(b.itens||[]).reduce((x,i)=>x+(i.vol||0),0),0);
    idx.push({id:v.id||m[1],data:v.data||'',titulo:v.titulo||'Treino',nivel:v.nivel||null,vol,para:v.para||Object.keys(v.registros||{}),nAtletas:(v.para||Object.keys(v.registros||{})).length}); });
  idx.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  await DB.set(kTrIdx(sg),idx);
  /* competições: reconstrói o índice a partir dos docs eq_<slug>_cmp_* */
  const reC=new RegExp('^eq_'+sg.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&')+'_cmp_(.+)$'), cidx=[];
  snap.forEach(doc=>{ const m=doc.id.match(reC); if(!m)return; let v=null; try{v=JSON.parse(doc.data().v)}catch(_){}; if(v)cidx.push({id:v.id||m[1],nome:v.nome,data:v.data,local:v.local,piscina:v.piscina}); });
  if(cidx.length)await DB.set(kCIdx(sg),cidx);
  /* lista de atletas: reconstrói a partir das contas que apontam para esta equipe */
  const us=[]; snap.forEach(doc=>{ if(/^u_/.test(doc.id)){ let v=null; try{v=JSON.parse(doc.data().v)}catch(_){}; if(v&&v.equipe===sg&&v.email)us.push(v.email); } });
  if(us.length){ const cur=await DB.get(kEqUsers(sg))||[]; await DB.set(kEqUsers(sg),[...new Set([...cur,...us])]); }
  if(!(await DB.get(kEq(sg))))await DB.set(kEq(sg),{slug:sg,nome:sg,criadoEm:Date.now(),tecnicoEmail:null});
  await registrarEquipeDev(sg);
  if(sg===S.u.equipe)await carregarDados();
  S.equipesDevList=null; toast(`Recuperado: ${idx.length} treino(s), ${cidx.length} competição(ões), ${us.length} atleta(s)`); abrirDiagnostico();
}
/* DEV: funde a equipe ORIGEM na equipe DESTINO — move atletas (contas), treinos,
   competições e liberações, sem perder dados. Os pro_* (marcas/saúde, por UID) já
   acompanham cada atleta. NÃO apaga a origem: confira e apague depois. */
async function mesclarEquipe(orig,dest){
  if(!ehDev())return; if(!FB)return toast('Fusão disponível só no modo em rede (Firebase).');
  if(!orig||!dest||orig===dest)return toast('Escolha equipes diferentes para origem e destino');
  const eqO=await DB.get(kEq(orig)), eqD=await DB.get(kEq(dest));
  if(!eqD)return toast('Equipe de destino inválida');
  const nomeD=eqD.nome;
  if(!confirm(`Fundir "${eqO?eqO.nome:orig}" → "${nomeD}"?\n\nAtletas, treinos, competições e liberações passam para "${nomeD}". A origem NÃO é apagada agora — você confere e apaga depois.`))return;
  toast('Fundindo equipes…');
  const snap=await varrerKv();
  const esc2=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const reTr=new RegExp('^eq_'+esc2(orig)+'_tr_(.+)$');
  const reCm=new RegExp('^eq_'+esc2(orig)+'_cmp_(.+)$');
  /* treinos */
  const trIdxD=await DB.get(kTrIdx(dest))||[]; const idsD=new Set(trIdxD.map(t=>t.id));
  const trDocs=[]; snap.forEach(doc=>{ const m=doc.id.match(reTr); if(!m)return; let v=null; try{v=JSON.parse(doc.data().v)}catch(_){}; if(v)trDocs.push([m[1],v]); });
  let nTr=0,nTrPula=0;
  for(const [id,v] of trDocs){ const tid=v.id||id;
    if(await DB.get(kTr(dest,tid))){ nTrPula++; continue; }
    await DB.set(kTr(dest,tid),v);
    if(!idsD.has(tid)){ const vol=(v.blocos||[]).reduce((s,b)=>s+(b.itens||[]).reduce((x,i)=>x+(i.vol||0),0),0);
      trIdxD.push({id:tid,data:v.data||'',titulo:v.titulo||'Treino',nivel:v.nivel||null,vol,para:v.para||Object.keys(v.registros||{}),nAtletas:(v.para||Object.keys(v.registros||{})).length}); idsD.add(tid); }
    nTr++; }
  trIdxD.sort((a,b)=>(b.data||'').localeCompare(a.data||'')); await DB.set(kTrIdx(dest),trIdxD);
  /* competições */
  const cIdxD=await DB.get(kCIdx(dest))||[]; const cidsD=new Set(cIdxD.map(c=>c.id));
  const cmDocs=[]; snap.forEach(doc=>{ const m=doc.id.match(reCm); if(!m)return; let v=null; try{v=JSON.parse(doc.data().v)}catch(_){}; if(v)cmDocs.push([m[1],v]); });
  let nCm=0;
  for(const [id,v] of cmDocs){ const cid=v.id||id;
    if(await DB.get(kCmp(dest,cid)))continue;
    await DB.set(kCmp(dest,cid),v);
    if(!cidsD.has(cid)){ cIdxD.push({id:cid,nome:v.nome,data:v.data,local:v.local,piscina:v.piscina}); cidsD.add(cid); }
    nCm++; }
  await DB.set(kCIdx(dest),cIdxD);
  /* atletas (contas u_*) */
  const usersMove=[]; snap.forEach(doc=>{ if(/^u_/.test(doc.id)){ let v=null; try{v=JSON.parse(doc.data().v)}catch(_){}; if(v&&v.equipe===orig&&v.email)usersMove.push(v); } });
  const usD=await DB.get(kEqUsers(dest))||[]; const setD=new Set(usD); let nU=0;
  for(const u of usersMove){ u.equipe=dest; u.equipeNome=nomeD; await DB.set(kUser(u.email),u); if(!setD.has(u.email)){usD.push(u.email);setD.add(u.email);} nU++; }
  await DB.set(kEqUsers(dest),usD);
  /* liberações por CPF */
  const libsO=await DB.get(kLib(orig))||[];
  if(libsO.length){ const libsD=await DB.get(kLib(dest))||[]; const cpfs=new Set(libsD.map(l=>l.cpf)); for(const l of libsO)if(!cpfs.has(l.cpf)){libsD.push(l);cpfs.add(l.cpf);} await DB.set(kLib(dest),libsD); }
  /* técnico: se o destino não tem e a origem tinha, carrega */
  if(eqO&&eqO.tecnicoEmail&&!eqD.tecnicoEmail){ eqD.tecnicoEmail=eqO.tecnicoEmail; await DB.set(kEq(dest),eqD); }
  /* se eu estava na origem, passo para o destino */
  if(S.u.equipe===orig){ S.u.equipe=dest; S.u.equipeNome=nomeD; await DB.set(kUser(S.u.email),S.u); if(ehAdmin())S.gestao=true; await carregarDados(); }
  S.equipesDevList=null; S.equipesDisp=null;
  toast(`Fundido em ${nomeD}: ${nTr} treino(s)${nTrPula?` (${nTrPula} já existiam)`:''}, ${nCm} competição(ões), ${nU} atleta(s). Confira e apague a origem.`);
  render();
}

/* técnico abre o RELATÓRIO COMPLETO de um atleta: aponta S.pro para o snapshot dele
   (kPerf, SEM Saúde: garmin/exames/bioimpedância ficam vazios) e o motor recalcula. */
async function abrirLaudoAtleta(id){
  if(!ehGestor())return;
  const a=S.elenco.find(x=>x.id===id);
  const privado=ehAdmin()?await DB.get(kPro(id)):null;
  const snap=privado||await DB.get(kPerf(S.u.equipe,id));
  S.laudoAtleta=id; S.laudoNome=a?a.nome:((snap&&snap.nome)||'Atleta'); S.laudoVista='relatorio';
  S._proBak=S.pro;
  /* _pront: só o PLACAR de prontidão do atleta. Os dados de Saúde (VFC, sono,
     exames) continuam fora daqui — mas sem o placar a "Recuperação" da
     assinatura de sprint ficava vazia para o técnico. */
  const _p=(snap&&snap.prontidao&&snap.prontidao.media!=null)
    ? {score:snap.prontidao.media,dias:snap.prontidao.n||0,fonte:'check-in'}
    : ((snap&&snap.prontidaoGar&&snap.prontidaoGar.score!=null)
        ? {score:snap.prontidaoGar.score,dias:snap.prontidaoGar.dias||0,fonte:'Garmin'} : null);
  /* _espelho: a identidade do dono viaja DENTRO do objeto. É o que permite a
     salvarPro() recusar a gravação mesmo que alguém zere S.laudoAtleta sem
     devolver S.pro — foi exatamente esse descuido que misturou dois atletas. */
  /* `_dono` com o uid do ATLETA, não o meu: se este objeto escapar para uma
     gravação, o campo espelhado vai com o dono errado e o próprio Firestore
     recusa. É a mesma informação servindo de trava no cliente e no servidor. */
  S.pro={_espelho:id,_dono:id,pbs:(snap&&snap.pbs)||{},resultados:(snap&&snap.resultados)||[],seco:(snap&&snap.seco)||[],
    alvos:(snap&&snap.alvos)||null,bioimp:(snap&&snap.bioimp)||[],garmin:ehAdmin()?((snap&&snap.garmin)||[]):[],exames:ehAdmin()?((snap&&snap.exames)||[]):[],_pront:_p};
  ESF=null; push(); render(); window.scrollTo(0,0);
}
/* mesma troca de contexto, mas abrindo as MARCAS — o técnico vê exatamente a
   tela que o atleta vê (inclusive o currículo da ABMN que ele enviou). */
async function abrirMarcasAtleta(id){
  await abrirLaudoAtleta(id);
  if(S.laudoAtleta){ S.laudoVista='marcas'; render(); window.scrollTo(0,0); }
}
function _limparLaudo(){
  /* a condição olha os DOIS: se S.laudoAtleta já foi zerado por outro caminho
     mas S.pro continua sendo o espelho, é aqui que o estrago se desfaz. */
  if(!S.laudoAtleta&&!(S.pro&&S.pro._espelho))return;
  /* sem backup (espelho que vazou por um caminho que não passou por aqui),
     devolve um pro VAZIO em vez de null: a sincronia recarrega o verdadeiro
     em segundos, e nada quebra no render até lá. Nunca devolver o espelho. */
  S.pro=S._proBak||proVazio();
  S._proBak=undefined; S.laudoAtleta=null; S.laudoNome=null; S.laudoVista=null; ESF=null;
}
function voltarLaudo(){ _limparLaudo(); voltar(); }

async function sairDaEquipe(){
  if(!S.u||S.u.perfil==='tecnico'||!S.u.equipe)return;
  if(!confirm(`Desvincular o técnico de ${S.u.equipeNome||''}?\n\nVocê deixa de receber os treinos compartilhados por ele. Sua equipe do perfil, seus próprios treinos, marcas e histórico continuam salvos.`))return;
  const sg=S.u.equipe;

  if(!await DB.set(kEqUsers(sg),us))return toast('Não consegui atualizar a equipe. Tente novamente.');
  /* Cadastros antigos usavam o mesmo campo para equipe e técnico. Na primeira
     separação preservamos o nome antigo como afiliação pública. */
  const tinhaAf=Object.prototype.hasOwnProperty.call(S.u,'afiliacao');
  const atualizado={...S.u,
    afiliacao:tinhaAf?S.u.afiliacao:'eq:'+sg,
    afiliacaoNome:tinhaAf?S.u.afiliacaoNome:S.u.equipeNome,
    equipe:null,equipeNome:null,aprovado:false};

}

/* Apaga um documento de verdade (no Firestore) ou o esvazia (modo local). */
/* ── Escrita ATÔMICA (ler-modificar-gravar) ────────────────────────────────
   O app guarda o conteúdo inteiro num campo só (`v`), então toda gravação
   reescreve o documento completo. Com `DB.get` → modifica → `DB.set`, dois
   atletas lançando tempo no MESMO treino ao mesmo tempo se atropelam: o
   segundo grava por cima e apaga o que o primeiro acabou de registrar. Num
   treino de equipe isso não é hipótese, é rotina.

   `transacao` resolve pedindo ao Firestore que releia e regrave sem que
   ninguém escreva no meio. O `muta` recebe a versão MAIS RECENTE do servidor
   e devolve a nova — por isso ele precisa ser PURO e re-executável: nada de
   toast, render ou leitura de campo de tela lá dentro (o Firestore pode
   chamá-lo mais de uma vez).

   Transação exige rede. Offline (ou se falhar), cai no caminho antigo, que é
   o comportamento de hoje — melhor gravar com risco de conflito do que não
   gravar. Quem chama deve atualizar a tela ANTES, para a resposta seguir
   instantânea. */
async function transacao(k,muta){
  if(!FB){ const v=await DB.get(k); const n=muta(v); if(n!==undefined)await DB.set(k,n); return n; }
  const ref=fdb.collection('kv').doc(fkey(k));
  try{
    return await fdb.runTransaction(async tx=>{
      const s=await tx.get(ref);
      let v=null; if(s.exists){ try{ v=JSON.parse(s.data().v); }catch(_){ v=null; } }
      const n=muta(v);
      if(n===undefined)return v;
      const json=JSON.stringify(n);
      if(!checaTamanho(k,json).ok)throw new Error('documento acima do limite');
      tx.set(ref,Object.assign({v:json,at:firebase.firestore.FieldValue.serverTimestamp()},camposSeguranca(k,n)));
      return n;
    });
  }catch(e){
    console.warn('transacao',k,e.message);
    /* rede indisponível: grava do jeito antigo para não perder o registro */
    const v=await DB.get(k); const n=muta(v);
    if(n!==undefined)await DB.set(k,n);
    return n;
  }
}
async function apagarChave(k){
  if(FB){ try{ await fdb.collection('kv').doc(fkey(k)).delete(); return true }catch(e){ console.warn('apagarChave',k,e.message); return false } }
  return DB.set(k,null);
}

/* ── EXCLUSÃO DA PRÓPRIA CONTA (LGPD art. 18 · exigência das lojas) ─────────
   A tela diz, item a item, o que SAI e o que FICA. Prometer apagamento total
   e deixar rastro é pior do que não prometer: o que permanece são os tempos
   dentro dos documentos de TREINO da equipe, que são do técnico e o atleta
   não tem permissão para reescrever. Isso está dito aqui e na política. */
function apagarMinhaConta(){
  const u=S.u; if(!u)return;

    <div class="eyebrow" style="margin-top:12px">o que é apagado</div>
    <ul class="small" style="margin:6px 0 0;padding-left:18px;line-height:1.55">
      <li>O seu <b>cadastro</b> e o seu <b>login</b>.</li>
      <li>As suas <b>marcas</b>, competições, sessões fora d'água e o histórico de projeções.</li>
      ${temSaude?'<li>Os seus <b>dados de saúde</b> — relógio, exames, bioimpedância e check-in.</li>':''}
      <li>Os <b>anexos</b> (fotos e PDFs) que você enviou.</li>
      <li>O <b>resumo de desempenho</b> que o seu técnico enxerga.</li>

    <ul class="small" style="margin:6px 0 0;padding-left:18px;line-height:1.55">
      <li>Os <b>tempos que você lançou nos treinos da equipe</b>, dentro dos registros do
          treino. Eles pertencem ao histórico da equipe e só o técnico pode removê-los —

      ${u.perfil==='tecnico'?'<li>A <b>equipe</b> e os <b>atletas</b> continuam. A equipe fica sem técnico até alguém assumir.</li>':''}
    </ul>
    <div class="field" style="margin-top:16px"><label for="delTxt">Para confirmar, digite <b>APAGAR</b></label>
      <input id="delTxt" autocapitalize="characters" autocorrect="off" placeholder="APAGAR"></div>
    ${FB?`<div class="field"><label for="delPwd">E a sua senha</label><input id="delPwd" type="password" placeholder="sua senha"></div>`:''}
    <button class="full danger" style="margin-top:6px" onclick="confirmarApagarMinhaConta()">Apagar definitivamente</button>
    <button class="full ghost" style="margin-top:8px" onclick="fecharSheet()">Cancelar</button>`);

async function confirmarApagarMinhaConta(){

    return toast('Digite APAGAR para confirmar');
  if(FB){
    const senha=val('delPwd');
    if(!senha)return toast('Digite sua senha para confirmar');

    catch(e){ return toast(traduzErroFB(e.code)); }
  }
  toast('Apagando…');
  try{await apagarDadosGruposDaConta();}catch(e){return alerta('Exclusão não iniciada',esc(e.message));}
  await apagarDadosDaConta(u,S.pro);

  desligarSincronia(); S.u=null; S.vista='entrada'; S.perfilEscolhido=null; S.treino=null; S.comp=null; S.pilha=[];

/* A remoção propriamente dita, separada da tela: é o que dá para testar sem
   depender de Firebase, de senha e de sheet aberta. Devolve as chaves que
   apagou, na ordem — a ordem importa (ver os anexos abaixo). */
async function apagarDadosDaConta(u,pro){
  const feitas=[];
  try{
    if(u.perfil==='tecnico'){
      const eq=await DB.get(kEq(u.equipe));
      if(eq&&eq.tecnicoEmail===u.email){ eq.tecnicoEmail=null; await DB.set(kEq(u.equipe),eq); }
    }
    if(u.equipe){
      const us=(await DB.get(kEqUsers(u.equipe))||[]).filter(e=>e!==u.email);
      await DB.set(kEqUsers(u.equipe),us);
    }
    if(u.equipe&&u.perfil!=='tecnico'&&u.cpf){                        /* libera o CPF de volta */
      const libs=await DB.get(kLib(u.equipe))||[];
      const l=libs.find(x=>x.cpf===u.cpf); if(l){ l.usado=false; delete l.email; await DB.set(kLib(u.equipe),libs); }
    }
    /* ANEXOS primeiro: depois de apagar o pro_ não há mais como achar as URLs,
       e o arquivo ficaria órfão no Storage para sempre. */
    const p=pro||await DB.get(kPro(u.id))||{};
    /* a Saúde mudou de documento (v160): os anexos de fora d'água podem estar
       no pro_ antigo, no pro_<uid>_sau, ou nos dois durante a migração */
    let sau=null; try{ sau=await DB.get(kSau(u.id)); }catch(_){}
    const secos=[...(p.seco||[]),...((sau&&sau.seco)||[])];
    const vistos=new Set();
    for(const s of secos)
      for(const campo of ['img','arquivo'])
        if(s[campo]&&!vistos.has(s[campo])){ vistos.add(s[campo]);
          await apagarAnexo(s[campo]); feitas.push('anexo:'+s[campo]); }
    /* pro_ SEM condicionar ao perfil: desde que o técnico ganhou área de
       atleta, e desde que existe atleta com Marcas liberadas, dado de saúde
       pode morar aqui em qualquer perfil. Apagar é idempotente — se o
       documento não existe, não acontece nada. */
    await apagarChave(kPro(u.id)); feitas.push(kPro(u.id));
    const pessoais=await DB.get(kPTrIdx(u.id))||[];
    for(const t of pessoais)if(t&&t.id){await apagarChave(kPTr(u.id,t.id));feitas.push(kPTr(u.id,t.id));}
    await apagarChave(kPTrIdx(u.id)); feitas.push(kPTrIdx(u.id));
    /* ⚠️ Apagar a conta tem de levar TUDO. A Saúde agora é um documento à
       parte e as versões diárias são mais sete — deixá-los para trás seria
       prometer exclusão e guardar dado de saúde assim mesmo. */
    await apagarChave(kSau(u.id)); feitas.push(kSau(u.id));
    for(const s of [0,1,2,3,4,5,6,'undo']){
      await apagarChave(kProBk(u.id,s)); feitas.push(kProBk(u.id,s));
    }
    /* o resumo que o TÉCNICO enxerga é um documento à parte e sobrevivia
       à exclusão: o atleta saía e o painel dele continuava no elenco. */
    if(u.equipe){ await apagarChave(kPerf(u.equipe,u.id)); feitas.push(kPerf(u.equipe,u.id)); }
    await apagarChave(kUser(u.email)); feitas.push(kUser(u.email));
  }catch(e){ console.warn('apagar dados',e.message); }
  return feitas;
}

function passoDe(p,piscina){
  if(p.tipo==='rev')return p.d;                      /* um parcial por percurso */
  if(piscina==='LC50')return p.dist>=800?100:50;
  return p.dist<=100?25:(p.dist<=400?50:100);
}
function nPassagens(p,piscina){
  if(p.tipo==='rev')return p.r||4;
  return Math.max(1,Math.round(p.dist/passoDe(p,piscina)));
}
const nomeProva=p=>p.tipo==='rev'
  ? `${p.r}x${p.d}m ${p.estilo}${p.genero?' '+p.genero:''}`
  : `${p.dist}m ${p.estilo}`;

/* Resultados oficiais (ABMN) → por prova, os atletas da EQUIPE com colocação, tempo
   final e parciais. Linha: colocação matr NOME EQUIPE tempo pontos FINA [Xm: split ...].
   N/C, DQL, DNS ficam sem tempo. */
function parseResultadosEquipe(txt,alvos){
  const ESTIL=[[/livre|crawl/i,'livre'],[/costas?/i,'costas'],[/peito/i,'peito'],[/borbol/i,'borboleta'],[/medley/i,'medley']];
  const AL=(alvos||[]).map(a=>a.toUpperCase()).sort((a,b)=>b.length-a.length);
  const provas=[]; let cur=null;
  for(const raw of String(txt||'').split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    if(/\bprova\b/i.test(l)&&/metros/i.test(l)){
      if(/revez|\d\s*x\s*\d/i.test(l)){cur=null;continue;}
      const md=l.match(/prova\s*[-–:]?\s*(\d{2,4})\s*metros/i), mc=l.match(/(\d+)\s*[º°ªo]\s*prova/i);
      if(md){let estilo='livre';for(const[re,v]of ESTIL){if(re.test(l)){estilo=v;break;}}
        const genero=/femin/i.test(l)?'F':/mascul/i.test(l)?'M':'';
        cur={codigo:mc?mc[1]:null,dist:+md[1],estilo,genero,inscritos:[]}; provas.push(cur);}
      continue;
    }
    if(!cur)continue;
    const up=l.toUpperCase(); let alvo=null,idx=-1;
    for(const a of AL){let j=up.indexOf(' '+a+' '); if(j<0&&up.endsWith(' '+a))j=up.length-a.length-1; if(j>=0){alvo=a;idx=j;break;}}
    if(alvo==null)continue;
    const antes=l.slice(0,idx).trim(), depois=l.slice(idx+1+alvo.length).trim();
    const mh=antes.match(/^(\d+\s*[º°ªo]|N\/?C|DQL|DNS|DQ)\s+(\d+)\s+(.+)$/i); if(!mh)continue;
    const nome=mh[3].replace(/\(.*?\)/g,'').replace(/\s{2,}/g,' ').trim();
    const mt=depois.match(/^(\d{1,2}:\d{2}[.,]\d{2}|\d{1,3}[.,]\d{2})\b/);
    const splits=[...depois.matchAll(/(\d{2,4})\s*m:\s*(\d{1,2}:\d{2}[.,]\d{2}|\d{1,3}[.,]\d{2}|S\/T)/gi)]
      .map(m=>({dist:+m[1],t:/S\/T/i.test(m[2])?null:parseTempo(m[2])}));
    cur.inscritos.push({matr:mh[2],nome,colocacao:mh[1].replace(/\s/g,''),tempo:mt?parseTempo(mt[1]):null,splits});
  }
  return provas.filter(p=>p.inscritos.length);
}
/* casa cada linha do balizamento (formato ABMN Competição) com os nomes do Elenco */
function parseBalizamentoTecnico(txt){
  const ESTIL=[[/livre|crawl/i,'livre'],[/costas?/i,'costas'],[/peito/i,'peito'],[/borbol/i,'borboleta'],[/medley/i,'medley']];
  const atletas=(S.elenco||[]).map(a=>({a,toks:a.nome.toLowerCase().split(/\s+/).filter(t=>t.length>=3)})).filter(x=>x.toks.length);
  const provas=[]; let cur=null,serie=1;
  for(const raw of txt.split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    if(/\bprova\b/i.test(l)&&/metros/i.test(l)){
      if(/revez|\d\s*x\s*\d/i.test(l)){ cur=null; continue; }
      const md=l.match(/prova\s*[-–:]?\s*(\d{2,4})\s*metros/i), mc=l.match(/(\d+)\s*[º°ªo]\s*prova/i);
      if(md){ let estilo='livre'; for(const[re,v]of ESTIL){if(re.test(l)){estilo=v;break;}}
        const cat=l.replace(/.*?metros/i,'').replace(/^\s*[a-zà-ú]+\s*/i,'').replace(/\(.*?\)/g,'').trim();
        cur={codigo:mc?mc[1]:null,dist:+md[1],estilo,categoria:cat,inscritos:[]}; provas.push(cur); serie=1;
      }
      continue;
    }
    const ms=l.match(/(\d+)\D{0,3}s[ée]rie/i); if(ms&&/s[ée]rie/i.test(l)){ serie=+ms[1]; continue; }
    if(!cur)continue;
    const low=l.toLowerCase(); const match=atletas.find(x=>x.toks.every(t=>low.includes(t)));
    if(match){
      const raia=parseInt(l,10), times=l.match(/\d{1,2}:\d{2}[.,]\d{2}|\b\d{1,2}[.,]\d{2}\b/g);
      cur.inscritos.push({serie,raia:isNaN(raia)?0:raia,nome:match.a.nome,equipe:'',inscricao:times?parseTempo(times[times.length-1]):null});
    }
  }
  return provas.filter(p=>p.inscritos.length);
}
async function colarBalizamento(){
  const t=document.getElementById('tBal').value; if(!t.trim())return toast('Cole o balizamento');
  const provas=[]; let p=null,serie=1;
  for(const raw of t.split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    const mp=l.match(/prova\s*n?º?\s*([\dA-Za-z]+)?\s*[-–:]?\s*(\d{2,4})\s*m?\s*(livre|costas|peito|borboleta|medley|crawl)/i);
    if(mp){p={codigo:mp[1]||null,dist:+mp[2],estilo:mp[3].toLowerCase()==='crawl'?'livre':mp[3].toLowerCase(),
      categoria:l.split(/[-–]/).slice(3).join('-').trim(),inscritos:[]};provas.push(p);serie=1;continue}
    const ms=l.match(/s[ée]rie\s*n?º?\s*(\d+)/i); if(ms){serie=+ms[1];continue}
    const mr=l.match(/^(\d{1,2})\s*[-–|\t]\s*([^\-–|\t]+?)\s*(?:[-–|\t]\s*([^\-–|\t]+?))?\s*(?:[-–|\t]\s*([\d:.,']+))?$/);
    if(mr&&p)p.inscritos.push({serie,raia:+mr[1],nome:mr[2].trim(),equipe:(mr[3]||'').trim(),inscricao:mr[4]||null});
  }
  if(!provas.length)return toast('Não reconheci o formato');
  await incorporar(provas); toast(`${provas.length} prova(s) importada(s)`);
}
/* identificadores da equipe do técnico (nome + sigla do catálogo) para casar com a
   coluna EQUIPE do balizamento oficial. */
/* Mesmo balizamento HY-TEK, visto pelo técnico: fica com os inscritos que são
   do Elenco (por nome) ou da equipe alvo (pela sigla da coluna TEAM). Um psych
   sheet do PanAm tem milhares de inscritos — sem esse filtro, importaria o
   campeonato inteiro. */
function parseHytekEquipe(txt,alvos){
  const elenco=(S.elenco||[]).map(a=>({a,toks:tokensNome(a.nome)})).filter(x=>x.toks.length);
  const AL=new Set((alvos||[]).map(s=>normNome(s)).filter(Boolean));
  const out=[];
  for(const p of parseHytek(txt)){
    const ins=[];
    for(const i of p.inscritos){
      const n=normNome(i.nome);
      const doElenco=elenco.find(x=>x.toks.every(t=>n.includes(t)));
      if(!doElenco&&!AL.has(normNome(i.equipe)))continue;
      ins.push({serie:0,raia:0,nome:doElenco?doElenco.a.nome:i.nome,equipe:i.equipe,
        inscricao:i.inscricao,seed:i.seed});
    }
    if(ins.length)out.push({codigo:p.codigo,dist:p.dist,estilo:p.estilo,genero:p.genero,categoria:'',inscritos:ins});
  }
  return out;
}
/* Ordem de prioridade, cada formato no layout que é o dele: ABMN por equipe,
   ABMN por nomes do Elenco, HY-TEK em três colunas, HY-TEK em uma. Recebe as
   DUAS leituras do PDF (ou uma string só, para texto colado). */
function parseBalizTec(t){
  const linhas=typeof t==='string'?t:t.linhas;
  const colunas=typeof t==='string'?t:(t.colunas||t.linhas);
  const porEq=parseBalizamentoEquipe(linhas,alvosEquipe()); if(porEq.length)return porEq;
  const porNome=parseBalizamentoTecnico(linhas); if(porNome.length)return porNome;
  const hyCol=parseHytekEquipe(colunas,alvosEquipe()); if(hyCol.length)return hyCol;
  return parseHytekEquipe(linhas,alvosEquipe());
}
function alvosEquipe(){
  const nome=(S.eq&&S.eq.nome)||S.u.equipeNome||'';
  const cat=CATALOGO_EQUIPES.find(e=>slug(e.nome)===slug(nome));
  const arr=[nome]; if(cat){arr.push(cat.nome);arr.push(cat.sigla);}
  return [...new Set(arr.map(s=>(s||'').trim()).filter(Boolean))];
}
/* Balizamento oficial (ABMN) → provas com os atletas da EQUIPE alvo (coluna EQUIPE),
   mesmo que ainda não sejam usuários do app. Linha: raia matr faixa NOME EQUIPE tempo. */
function parseBalizamentoEquipe(txt,alvos){
  const ESTIL=[[/livre|crawl/i,'livre'],[/costas?/i,'costas'],[/peito/i,'peito'],[/borbol/i,'borboleta'],[/medley/i,'medley']];
  const AL=(alvos||[]).map(a=>a.toUpperCase()).sort((a,b)=>b.length-a.length);   // mais longo primeiro
  const provas=[]; let cur=null, serie=1;
  for(const raw of String(txt||'').split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    if(/\bprova\b/i.test(l)&&/metros/i.test(l)){
      if(/revez|\d\s*x\s*\d/i.test(l)){cur=null;continue;}
      const md=l.match(/prova\s*[-–:]?\s*(\d{2,4})\s*metros/i), mc=l.match(/(\d+)\s*[º°ªo]\s*prova/i);
      if(md){let estilo='livre';for(const[re,v]of ESTIL){if(re.test(l)){estilo=v;break;}}
        const genero=/femin/i.test(l)?'F':/mascul/i.test(l)?'M':'';
        const cat=l.replace(/.*?metros/i,'').replace(/\(.*?\)/g,'').replace(/^\s*[a-zà-ú]+\s*/i,'').trim();
        cur={codigo:mc?mc[1]:null,dist:+md[1],estilo,genero,categoria:cat,inscritos:[]}; provas.push(cur); serie=1;}
      continue;
    }
    const ms=l.match(/(\d+)\D{0,3}s[ée]rie/i); if(ms&&/s[ée]rie/i.test(l)){serie=+ms[1];continue;}
    if(!cur)continue;
    const mt=l.match(/(\d{1,2}:\d{2}[.,]\d{2}|\b\d{1,3}[.,]\d{2})\s*$/);
    const semT=(mt?l.slice(0,mt.index):l).trim(), up=semT.toUpperCase();
    const alvo=AL.find(a=>up.endsWith(' '+a)||up===a); if(!alvo)continue;
    const nomeRaw=semT.slice(0,semT.length-alvo.length).trim();
    const mh=nomeRaw.match(/^(\d+)\s+(\d+)\s+(\d+\s*\+|PR[ÉE])\s+(.+)$/i); if(!mh)continue;
    const nome=mh[4].replace(/\(.*?\)/g,'').replace(/\s{2,}/g,' ').trim();
    cur.inscritos.push({serie,raia:+mh[1],matr:mh[2],faixa:mh[3].replace(/\s+/g,' ').trim(),nome,equipe:alvo,
      inscricao:mt?parseTempo(mt[1]):null});
  }
  return provas.filter(p=>p.inscritos.length);
}
async function incorporar(lista){
  await mutarComp(c=>{
    c.provas=c.provas||[];
    for(const p of lista){
      const dist=+p.dist||50, estilo=p.estilo||'livre', genero=p.genero||'';
      /* NÃO duplica: casa por CÓDIGO da prova, senão por dist+estilo+gênero */
      let ex=c.provas.find(q=>(p.codigo&&q.codigo&&String(q.codigo)===String(p.codigo))||(q.dist===dist&&q.estilo===estilo&&(q.genero||'')===genero));
      if(!ex){ ex={id:uid(),tipo:'ind',codigo:p.codigo||null,dist,estilo,genero,categoria:p.categoria||'',inscritos:[]}; c.provas.push(ex); }
      const jaMatr=new Set((ex.inscritos||[]).map(i=>i.matr).filter(Boolean));
      const jaNome=new Set((ex.inscritos||[]).map(i=>(i.nome||'').toLowerCase()));
      for(const i of (p.inscritos||[])){
        const nm=(i.nome||'').toLowerCase();
        if((i.matr&&jaMatr.has(i.matr))||(!i.matr&&jaNome.has(nm)))continue;   /* inscrito já existe */
        ex.inscritos.push({id:uid(),serie:+i.serie||1,raia:+i.raia||0,nome:i.nome||'',matr:i.matr||null,faixa:i.faixa||'',equipe:i.equipe||'',
          inscricao:typeof i.inscricao==='string'?parseTempo(i.inscricao):(i.inscricao||null),atletaId:acharAtleta(i.nome),parciais:[]});
        if(i.matr)jaMatr.add(i.matr); jaNome.add(nm);
      }
      ex.inscritos.sort((a,b)=>(a.serie-b.serie)||(a.raia-b.raia));
    }
  });
}
function acharAtleta(nome){
  if(!nome)return null;
  const n=nome.trim().toLowerCase();
  const a=S.elenco.find(x=>x.nome.toLowerCase()===n)||S.elenco.find(x=>x.nome.toLowerCase().startsWith(n.split(' ')[0]));
  return a?a.id:null;
}
/* Resultados oficiais → preenche os tempos/parciais/colocação de cada atleta na
   competição (casa por matrícula; se não existir, cria o inscrito). */
async function incorporarResultados(resProvas){
  await mutarComp(c=>{
    for(const rp of resProvas){
      let p=(rp.codigo&&c.provas.find(x=>x.codigo&&String(x.codigo)===String(rp.codigo)))
          || c.provas.find(x=>+x.dist===+rp.dist&&x.estilo===rp.estilo&&(!x.genero||!rp.genero||x.genero===rp.genero));
      if(!p){p={id:uid(),tipo:'ind',codigo:rp.codigo||null,dist:+rp.dist,estilo:rp.estilo,genero:rp.genero||'',categoria:'',inscritos:[]};c.provas.push(p);}
      for(const ri of rp.inscritos){
        let parc=(ri.splits&&ri.splits.length)?ri.splits.map(s=>s.t):[];
        if(ri.tempo!=null){ if(!parc.length)parc=[ri.tempo]; else parc[parc.length-1]=ri.tempo; }
        let ins=p.inscritos.find(x=>x.matr&&ri.matr&&String(x.matr)===String(ri.matr))
             || p.inscritos.find(x=>(x.nome||'').toLowerCase()===ri.nome.toLowerCase());
        if(!ins){ins={id:uid(),serie:0,raia:0,nome:ri.nome,matr:ri.matr,faixa:'',equipe:ri.equipe||'',inscricao:null,atletaId:acharAtleta(ri.nome),parciais:[]};p.inscritos.push(ins);}
        if(ri.tempo!=null)ins.parciais=parc;
        ins.oficialTempo=ri.tempo; ins.colocacao=ri.colocacao; ins.oficial=true;
      }
    }
  });
}
/* consolida no Marcas do PRÓPRIO usuário (só o dono escreve seu pro_) os resultados
   oficiais desta competição. Cada atleta faz o seu ao abrir a competição. */
async function consolidarMinhasMarcas(c){
  if(!S.pro||!c)return;
  const pis=c.piscina||'SC25'; let n=0;
  S.pro.pbs=S.pro.pbs||{}; S.pro.resultados=S.pro.resultados||[];
  for(const p of (c.provas||[]))for(const i of (p.inscritos||[])){
    if(i.atletaId!==S.u.id)continue;
    const fin=(i.oficialTempo!=null)?i.oficialTempo:((i.parciais||[]).filter(x=>x!=null).slice(-1)[0]);
    if(fin==null)continue;
    const key=pbKey(p.dist,p.estilo,pis);
    if(!S.pro.pbs[key]||fin<S.pro.pbs[key])S.pro.pbs[key]=fin;
    const chave=c.id+'|'+p.dist+'|'+p.estilo+'|'+pis;
    if(!S.pro.resultados.some(r=>r.chave===chave))
      S.pro.resultados.push({chave,comp:c.nome,data:c.data,piscina:pis,prova:p.dist+'m '+p.estilo,
        dist:p.dist,estilo:p.estilo,tempo:fin,parciais:(i.parciais||[]).filter(x=>x!=null),inscricao:i.inscricao||null});
    n++;
  }
  if(n){await salvarPro(); toast(`${n} resultado(s) no seu Marcas`); render();}
  else toast('Não achei suas provas nesta competição (confira se você está vinculado).');
}
async function lerResultados(inp){
  const f=inp.files[0]; if(!f)return;
  const st=document.getElementById('resStatus');
  if(f.type!=='application/pdf'){ if(st)st.textContent='Envie os resultados em PDF.'; return; }
  if(st)st.textContent='Lendo os resultados…';
  try{
    const txt=await pdfTexto(f);
    const provas=parseResultadosEquipe(txt,alvosEquipe());
    if(!provas.length){ if(st)st.textContent='Não achei resultados da sua equipe no PDF. Confira se a equipe bate com a coluna EQUIPE.'; return; }
    await incorporarResultados(provas);
    const n=provas.reduce((s,p)=>s+p.inscritos.filter(i=>i.tempo!=null).length,0);
    if(st)st.textContent=`${n} resultado(s) oficiais importados. Cada atleta consolida no seu Marcas.`;
    toast('Resultados carregados');
    if(S.pro)await consolidarMinhasMarcas(S.comp);
  }catch(e){ if(st)st.textContent='Não consegui ler o PDF: '+e.message; }
}

async function salvarTempoCompEquipe(ip,ii){
  const c=S.comp,p=c.provas[ip]; if(!p)return;
  const np=nPassagens(p,c.piscina);
  const arr=[]; for(let k=0;k<np;k++){const el=document.getElementById('te_'+k); arr.push((el&&el.value.trim())?parseTempo(el.value.trim()):null);}
  let ant=null; for(const v of arr){ if(v!=null){ if(ant!=null&&v<ant)return toast('As parciais acumuladas devem crescer (cada passagem ≥ a anterior).'); ant=v; } }
  const parc=arr.slice(); while(parc.length&&parc[parc.length-1]==null)parc.pop();
  if(!parc.some(x=>x!=null))return toast('Informe ao menos o tempo final.');
  await mutarComp(cc=>{ cc.provas[ip].inscritos[ii].parciais=parc; });

/* ── PSYCH SHEET / HY-TEK MEET MANAGER (formato internacional) ──────────────
   O balizamento brasileiro (ABMN) diz "Nº PROVA - 50 METROS PEITO"; o do PanAm
   Masters de Buenos Aires diz "#14 Men 50 LC Meter Breaststroke". Mesmo
   documento, outra língua e outro layout — e o parser do app só conhecia o
   primeiro. Por isso o Bruno ficava "sem provas" num PDF em que está inscrito
   em três.
   Psych sheet NÃO tem série nem raia: a largada ainda não foi sorteada. O que
   ele traz é a COLOCAÇÃO NO SEED (ordem pelo tempo de inscrição). O app guarda
   isso como `seed` e deixa série/raia vazias, em vez de inventar. */
function normNome(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')   /* "Sérgio" → "sergio" */
    .replace(/([a-z])\1+/g,'$1')                       /* "Garcíáa" → "garcia": o pdf.js duplica a letra acentuada */
    .replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
}
function tokensNome(nome){ return normNome(nome).split(' ').filter(t=>t.length>=3); }
const HY_ESTILO=[['Freestyle','livre'],['Backstroke','costas'],['Breaststroke','peito'],
  ['Butterfly','borboleta'],['Individual Medley','medley'],['IM','medley']];
/* "#12 Men 100 LC Meter Freestyle" e a continuação "#7 ... (Women 50 LC Meter Butterfly)" */
function hytekCabecalho(l){
  const m=l.match(/#\s*(\d+[A-Za-z]?)\s*(?:\.{2,})?\s*\(?\s*(Women|Men|Mixed|Girls|Boys)\s+(\d{2,4})\s+(?:LC|SC)?\s*(Meters?|Metres?|Yards?)\s+(Freestyle|Backstroke|Breaststroke|Butterfly|Individual Medley|IM)(\s+Relay)?/i);
  if(!m)return null;
  if(m[6])return{pular:true};                      /* revezamento: não é prova individual do atleta */
  if(/yard/i.test(m[4]))return{pular:true};        /* jarda não converte para metro: fora */
  const alvo=m[5].toLowerCase();
  const par=HY_ESTILO.find(([en])=>en.toLowerCase()===alvo);
  if(!par)return null;
  return{codigo:m[1],dist:+m[3],estilo:par[1],genero:/^(w|g)/i.test(m[2])?'F':'M'};
}
/* "47 Barbato De Macedo, Bruno 43 TNTS 2:12.75" — seed, nome, idade, equipe, tempo.
   NT = sem tempo de inscrição; X antes do tempo = exibição. */
function hytekInscrito(l){
  const m=l.match(/^(\d{1,4})\s+(.+?)\s+(\d{1,3})\s+([A-Z0-9][A-Z0-9.\-]{0,9})\s+(NT|X?\d{1,2}:\d{2}[.,]\d{2}|X?\d{1,3}[.,]\d{2})$/);
  if(!m)return null;
  const t=m[5].replace(/^X/,'');
  return{seed:+m[1],nome:m[2].trim(),idade:+m[3],equipe:m[4],inscricao:/^NT$/i.test(t)?null:parseTempo(t)};
}
function parseHytek(txt){
  const provas=[]; let cur=null, pendente=null;
  const linhas=String(txt||'').split(/\r?\n/).map(s=>s.replace(/\s+/g,' ').trim());
  for(let i=0;i<linhas.length;i++){
    const l=linhas[i]; if(!l)continue;
    const cab=hytekCabecalho(l);
    if(cab){ pendente=null; if(cab.pular){cur=null;continue;}
      cur=provas.find(p=>String(p.codigo)===String(cab.codigo));
      if(!cur){cur={codigo:cab.codigo,dist:cab.dist,estilo:cab.estilo,genero:cab.genero,inscritos:[]};provas.push(cur);}
      continue; }
    if(!cur)continue;
    let ins=hytekInscrito(l);
    /* nome comprido quebra em duas linhas: "85 Montero Labat, Evangelina Julia"
       e, embaixo, "58 EDELP 13:39.65". Sem juntar, o inscrito some em silêncio. */
    if(!ins){
      const so=l.match(/^(\d{1,4})\s+([A-Za-zÀ-ÿ.'\- ]*,[A-Za-zÀ-ÿ.'\- ]+)$/);
      if(so){ pendente=so; continue; }
      if(pendente){ const j=hytekInscrito(pendente[1]+' '+pendente[2]+' '+l); pendente=null; if(j)ins=j; }
    }else pendente=null;
    if(ins)cur.inscritos.push(ins);
  }
  return provas.filter(p=>p.inscritos.length);
}
/* balizamento (start list) em PDF — extrai as provas do próprio atleta pelo nome */
/* Formato ABMN Competição: cabeçalho "Nº PROVA - <dist> METROS <estilo> <gênero>",
   séries "Nª SÉRIE ...", e linhas "raia matrícula faixa + NOME  EQUIPE  TEMPO".
   Casa a linha do atleta exigindo todos os nomes dele (>=3 letras) na linha. */
/* as minhas provas num psych sheet HY-TEK, pelo nome */
function hytekMinhasProvas(txt,nome){
  const toks=tokensNome(nome); if(!toks.length)return[];
  const out=[];
  for(const p of parseHytek(txt))
    for(const i of p.inscritos){
      const n=normNome(i.nome);
      if(!toks.every(t=>n.includes(t)))continue;
      out.push({id:uid(),dist:p.dist,estilo:p.estilo,serie:null,raia:null,
        inscricao:i.inscricao,seed:i.seed,codigo:p.codigo});
    }
  return out;
}
function parseBalizamento(txt,nome){
  const toks=(nome||'').toLowerCase().split(/\s+/).filter(t=>t.length>=3);
  const ESTIL=[[/livre|crawl/i,'livre'],[/costas?/i,'costas'],[/peito/i,'peito'],[/borbol/i,'borboleta'],[/medley/i,'medley']];
  let dist=null,estilo=null,serie=null; const out=[];
  for(const raw of txt.split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    if(/\bprova\b/i.test(l)&&/metros/i.test(l)){
      if(/revez|\d\s*x\s*\d/i.test(l)){ dist=null;estilo=null; continue; }   // pula revezamento
      const md=l.match(/prova\s*[-–:]?\s*(\d{2,4})\s*metros/i);
      if(md){ dist=+md[1]; estilo='livre'; for(const[re,v]of ESTIL){if(re.test(l)){estilo=v;break;}} serie=null; }
      continue;
    }
    const ms=l.match(/(\d+)\D{0,3}s[ée]rie/i); if(ms&&/s[ée]rie/i.test(l)){ serie=+ms[1]; continue; }
    if(!dist||!estilo||!toks.length)continue;
    const low=l.toLowerCase();
    if(toks.every(t=>low.includes(t))){
      const raia=parseInt(l,10);
      const times=l.match(/\d{1,2}:\d{2}[.,]\d{2}|\b\d{1,2}[.,]\d{2}\b/g);
      out.push({id:uid(),dist,estilo,serie,raia:isNaN(raia)?null:raia,inscricao:times?parseTempo(times[times.length-1]):null});
    }
  }
  return out;
}
/* Tenta os dois layouts (uma coluna e três) e os dois formatos (ABMN e HY-TEK),
   e fica com a leitura que achou mais provas. Mais barato do que pedir ao
   usuário que descubra qual é o formato do PDF dele. */
function minhasProvasDoBalizamento(t,nome){
  /* ORDEM DE PRIORIDADE, não "o que achar mais". A leitura achatada de um PDF
     de três colunas AINDA acha o nome — só que colado na prova errada e com o
     tempo do vizinho de linha (o Bruno saía no #5 feminino com 2:27.01 em vez
     do #6 com 2:12.75). Como as duas leituras achavam 3 provas, a errada
     empatava e ficava. Cada formato tem UM layout certo, e é esse que vale:
     ABMN é de uma coluna, HY-TEK é de três. */
  const tentativas=[
    ()=>parseBalizamento(t.linhas,nome),      /* ABMN (pt-BR), uma coluna */
    ()=>hytekMinhasProvas(t.colunas,nome),    /* HY-TEK (en), três colunas */
    ()=>hytekMinhasProvas(t.linhas,nome),     /* HY-TEK de meet pequeno, uma coluna */
    ()=>parseBalizamento(t.colunas,nome)
  ];
  for(const f of tentativas){const r=f(); if(r.length)return r;}
  return[];
}
/* Quando não acha, o app precisa dizer O QUE leu — "não achei suas provas" sem
   mais nada deixa o atleta sem saber se o PDF é ilegível, se o nome está
   diferente ou se ele não está inscrito. */
function diagBalizamento(t,nome){
  const provas=parseHytek(t.colunas).length?parseHytek(t.colunas):parseHytek(t.linhas);
  const nIns=provas.reduce((s,p)=>s+p.inscritos.length,0);
  if(!provas.length)return'Não reconheci o formato deste PDF (nem ABMN nem HY-TEK). Lance as provas à mão, ou me mande o arquivo.';
  const toks=tokensNome(nome);
  const cand=[];
  for(const p of provas)for(const i of p.inscritos){
    const n=normNome(i.nome);
    const bate=toks.filter(x=>n.includes(x)).length;
    if(bate)cand.push({nome:i.nome,equipe:i.equipe,bate});
  }
  cand.sort((a,b)=>b.bate-a.bate);
  const top=[...new Map(cand.map(c=>[c.nome,c])).values()].slice(0,3);
  return`Li ${provas.length} prova(s) e ${nIns} inscrito(s), mas nenhum com o nome "${esc(nome||'')}".`
    +(top.length?` Parecidos: ${top.map(c=>esc(c.nome)+' ('+esc(c.equipe)+')').join(' · ')}. Se um deles é você, ajuste seu nome em Conta.`
               :' Confira a grafia do seu nome em Conta, ou lance as provas à mão.');
}
async function importarBalizamento(inp){
  const f=inp.files&&inp.files[0]; if(!f)return; inp.value='';
  const mc=(S.u.competicoes||[]).find(x=>x.id===S.minhaComp); if(!mc)return;
  toast('Lendo o balizamento…');
  let t; try{ t=await pdfTextos(f); }catch(e){ return toast('Não consegui ler: '+e.message); }
  const provas=minhasProvasDoBalizamento(t,S.u.nome);
  if(!provas.length)return alerta('Balizamento',diagBalizamento(t,S.u.nome));
  mc.provas=mc.provas||[];
  const ex=new Set(mc.provas.map(p=>`${p.dist}|${p.estilo}|${p.serie}|${p.raia}`));
  let add=0;
  for(const p of provas){ const k=`${p.dist}|${p.estilo}|${p.serie}|${p.raia}`; if(ex.has(k))continue; ex.add(k); mc.provas.push(p); add++; }
  mc.provas.sort((a,b)=>(+a.codigo||0)-(+b.codigo||0)||a.dist-b.dist);
  await salvarUsuario();
  /* psych sheet declara a piscina no cabeçalho das provas; se bater diferente
     da competição cadastrada, avisa em vez de gravar tempo na piscina errada */
  const lc=/\bLC\s*Meter/i.test(t.colunas||t.linhas), sc=/\bSC\s*Meter/i.test(t.colunas||t.linhas);
  const conflito=(lc&&!sc&&mc.piscina!=='LC50')?'longa (50 m)':(sc&&!lc&&mc.piscina!=='SC25')?'curta (25 m)':null;
  toast(add?`${add} prova(s) importada(s)`:'Tudo já estava lançado');
  if(conflito)alerta('Confira a piscina',`O PDF é de piscina <b>${conflito}</b>, mas esta competição está cadastrada como <b>${mc.piscina==='LC50'?'longa (50 m)':'curta (25 m)'}</b>. Corrija antes de lançar os tempos — marca em piscina errada entra errada em Marcas.`);
  render();
}

/* =====================================================================
   PRO — resultados vindos da competição
   ===================================================================== */
async function gravarResultadoPro(ix){
  const c=S.comp,p=c.provas[S.provaSel],i=p.inscritos[ix];
  if(!i||!i.atletaId||p.tipo==='rev')return;
  const at=S.elenco.find(a=>a.id===i.atletaId)||(S.u.id===i.atletaId?S.u:null);
  if(!at||at.perfil!=='pro')return;
  const np=nPassagens(p,c.piscina),ps=(i.parciais||[]).filter(x=>x!=null);
  if(ps.length<np)return;
  const pro=comDono(await DB.get(kPro(at.id)),at.id)||proVazio(at.id);
  const chave=c.id+'_'+p.id;
  /* P2-B: a procedência da parcial viaja com ela. Aqui é cronometragem da
     competição, lançada por passagem — é o que o app pode chamar de oficial. */
  const r={chave,comp:c.nome,data:c.data,piscina:c.piscina,prova:nomeProva(p),dist:p.dist,estilo:p.estilo,
    tempo:ps[np-1],parciais:[...ps],inscricao:i.inscricao||null,origemParc:'oficial'};
  const k=(pro.resultados||[]).findIndex(x=>x.chave===chave);
  if(k>=0)pro.resultados[k]=r; else (pro.resultados=pro.resultados||[]).push(r);
  const key=pbKey(p.dist,p.estilo,c.piscina);
  if(!pro.pbs[key]||r.tempo<pro.pbs[key])pro.pbs[key]=r.tempo;
  await DB.set(kPro(at.id),pro);
  if(S.u.id===at.id)S.pro=pro;
}

/* =====================================================================
   PRO — MARCAS
   ===================================================================== */
/* tempo a partir dos campos horas:min:seg:centésimo → milissegundos */
function msHMSC(h,m,s,cc){ h=+h||0;m=+m||0;s=+s||0;cc=+cc||0; return ((h*3600+m*60+s)*1000)+cc*10; }
/* tabela de melhores tempos de uma piscina (SC25 curta / LC50 longa) */
function pbsTabela(pbs,pis){
  const ent=Object.entries(pbs||{}).filter(([k])=>k.endsWith(' '+pis)).sort((a,b)=>a[0].localeCompare(b[0]));
  if(!ent.length)return'<div class="small muted" style="margin:6px 0 2px">Nenhuma marca nesta piscina.</div>';
  /* duas colunas de tempo, e elas significam coisas diferentes: a primeira é
     o melhor da FAIXA ATUAL — a que alimenta projeção e %PB — e a segunda é
     o melhor da vida inteira, marcado com *, que não entra em conta nenhuma */
  const at=(S.pro&&S.pro.pbAllTime)||{};
  const temAT=ent.some(([k,v])=>at[k]&&at[k].tempo<v);
  return`<table style="margin-top:6px"><tbody>${ent.map(([k,v])=>{const[d,e]=k.split(' ');
    const a=at[k];
    const melhorDaVida=a&&a.tempo<v;
    return`<tr><td><b>${d}m ${e}</b>${melhorDaVida?`<div class="xs muted">${a.faixa} · ${brCurta(a.data)}</div>`:''}</td>
      <td class="n" style="text-align:right;font-weight:700">${fmt(v,true)}</td>
      ${temAT?`<td class="n" style="text-align:right;color:var(--ink-2)">${melhorDaVida?fmt(a.tempo,true)+'<b style="color:var(--rope-ink)">*</b>':''}</td>`:''}
      <td style="width:34px;text-align:right"><button class="sm ghost" onclick="apagarPB('${k}')">✕</button></td></tr>`}).join('')}</tbody></table>
    ${temAT?`<div class="xs muted" style="margin-top:7px"><b>*</b> melhor tempo da <b>vida inteira</b>, feito em outra faixa etária — está aqui como referência e <b>não entra</b> em projeção, %PB nem prontidão. O número da esquerda é o melhor da sua <b>faixa de hoje</b>${S.pro&&S.pro.faixa?` (${S.pro.faixa}+)`:''}, que é contra quem você compete.</div>`:''}`;
}
/* provas principais do atleta — foco da projeção e da assinatura de sprint */
function provasAlvo(pro){
  if(pro&&pro.alvos&&pro.alvos.length)return pro.alvos.map(s=>{const p=s.split(' ');return{d:+p[0],e:p.slice(1).join(' ')}});
  const pbs=Object.keys((pro&&pro.pbs)||{}), has=(d,e)=>pbs.some(k=>k.startsWith(d+' '+e+' '));
  for(const e of ['peito','livre','costas','borboleta','medley']){const arr=[50,100].filter(d=>has(d,e)).map(d=>({d,e})); if(arr.length)return arr;}
  return[];
}
function cardAlvos(pro){
  const cur=provasAlvo(pro).map(a=>a.d+' '+a.e);
  const chips=cur.length?cur.map(k=>{const p=k.split(' ');
    return`<span class="chip best" style="font-weight:800">${p[0]}m ${p.slice(1).join(' ')} <b onclick="removerAlvo('${k}')" style="cursor:pointer;color:var(--clock);margin-left:3px">✕</b></span>`;}).join(' ')
    :'<span class="small muted">Nenhuma escolhida — usando 50 e 100 do seu estilo principal.</span>';
  const opts=PROVAS_CAT.filter(p=>!cur.includes(p.d+' '+p.e)).map(p=>`<option value="${p.d} ${p.e}">${p.d}m ${p.e}</option>`).join('');
  return`<div class="card"><div class="eyebrow">provas-alvo</div>
    <div class="small muted" style="margin:4px 0 8px">Suas provas principais — a <b>Projeção de Tempo</b> e a <b>Assinatura de Sprint</b> focam nelas. Adicione quantas quiser (um medista pode ter 6+).</div>
    <div class="chips" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">${chips}</div>
    <div class="row" style="gap:6px">
      <select id="alvoSel" style="flex:1">${opts||'<option value="">(todas já adicionadas)</option>'}</select>
      <button class="sm primary" onclick="adicionarAlvo()">+ Adicionar</button></div></div>`;
}

async function removerAlvo(k){

/* Faixa de destaques do Marcas: como tudo ali vive dentro de sanfonas, a tela
   abria "vazia". Aqui os melhores tempos aparecem de cara, em cartões grandes,
   com as provas-alvo destacadas. Quebra em várias linhas no celular. */
function destaquesMarcas(pro){
  const pbs=pro.pbs||{}, chaves=Object.keys(pbs);
  if(!chaves.length)return'';
  const alvos=(typeof provasAlvo==='function')?provasAlvo(pro):[];
  const ehAlvo=(d,e)=>alvos.some(a=>a.d===d&&a.e===e);
  const ord=chaves.slice().sort((a,b)=>{
    const [da,ea]=a.split(' '), [db,eb]=b.split(' ');
    return (ehAlvo(+da,ea)?0:1)-(ehAlvo(+db,eb)?0:1) || (+da)-(+db) || a.localeCompare(b);
  }).slice(0,6);
  const res=pro.resultados||[];
  const temHist=new Set(res.map(r=>pbKey(r.dist,r.estilo,r.piscina)));
  const tiles=ord.map(k=>{
    const p=k.split(' '), d=+p[0], e=p.slice(1,-1).join(' '), pool=p[p.length-1], t=pbs[k];
    const r=res.find(x=>x.dist===d&&x.estilo===e&&(x.piscina||'SC25')===pool&&x.tempo===t);
    const alvo=ehAlvo(d,e), hist=temHist.has(k), accId='mk_h_'+k.replace(/\W+/g,'_');
    /* faixa etária a que esse tempo pertence — num master, o tempo da faixa
       atual é o que importa; o da juventude não se repete. */
    const fx=r&&r.faixa?` · ${r.faixa}+`:'';
    return`<div class="pb-tile ${alvo?'alvo':''}" ${hist?`onclick="abrirHistProva('${accId}')" style="cursor:pointer"`:''}${hist?' title="ver evolução desta prova"':''}>
      <div class="xs muted" style="display:flex;justify-content:space-between;gap:6px;align-items:baseline">
        <span>${d}m ${esc(e)}</span><b style="opacity:.75">${pool}</b></div>
      <div class="t-num">${fmt(t,true)}</div>
      <div class="xs muted">${r?brData(r.data):'melhor tempo'}${fx}${alvo?' · <b style="color:var(--rope)">alvo</b>':''}${hist?' <span style="opacity:.6">›</span>':''}</div>
    </div>`;}).join('');
  return`<div class="card"><div class="eyebrow">melhores tempos</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">${tiles}</div>
    <div class="xs muted" style="margin-top:8px">Toque num tempo para ver a <b>evolução</b> da prova. Borda destacada = prova-alvo. <b>SC25m</b> = piscina curta · <b>LC50m</b> = piscina longa.</div></div>`;
}
function telaMarcas(){
  const pro=S.pro||{pbs:{},resultados:[]};
  const res=[...(pro.resultados||[])].sort((a,b)=>b.data.localeCompare(a.data));
  const nSC=Object.keys(pro.pbs||{}).filter(k=>k.endsWith(' SC25')).length;
  const nLC=Object.keys(pro.pbs||{}).filter(k=>k.endsWith(' LC50')).length;
  /* histórico agrupado por prova (dist+estilo+piscina): clica → resultados + gráfico */
  const grupos={};
  for(const r of res){ const k=pbKey(r.dist,r.estilo,r.piscina); (grupos[k]=grupos[k]||[]).push(r); }
  const chavesG=Object.keys(grupos).sort((a,b)=>a.localeCompare(b));
  const histProvas=chavesG.map(k=>{
    const arr=grupos[k]; /* já vem desc por data (de res) */
    const dist=arr[0].dist,estilo=arr[0].estilo,pool=arr[0].piscina;
    const melhor=Math.min(...arr.map(r=>r.tempo));
    const poolL=pool==='LC50'?'Longa · 50m':'Curta · 25m';
    const linhas=arr.map(r=>{
      const tr=(r.parciais||[]).map((v,i)=>i===0?v:v-r.parciais[i-1]);
      return`<div style="padding:10px 0;border-top:1px solid var(--line)">
        <div class="row"><div class="grow"><b>${esc(r.comp||'—')}</b><div class="xs muted">${brData(r.data)}</div></div>
          <div class="kpi" style="text-align:right"><div class="v" style="font-size:19px">${fmt(r.tempo,true)}</div>
            ${r.tempo<=melhor?'<div class="l" style="color:var(--rope)">melhor</div>':''}</div>
          <button class="sm ghost" style="margin-left:6px" onclick="apagarResultado('${r.chave}')">✕</button></div>
        ${tr.length>1?`<div class="chips">${tr.map((t,i)=>`<span class="chip">${i+1}º trecho · ${fmt(t,true)}</span>`).join('')}</div>`:''}
      </div>`;}).join('');
    const pts=[...arr].sort((a,b)=>a.data.localeCompare(b.data)).map(r=>({rot:r.data.slice(8,10)+'/'+r.data.slice(5,7)+'/'+r.data.slice(2,4),v:r.tempo}));
    const grafico=pts.length>=2?`<div class="eyebrow" style="margin-top:14px">evolução</div>${graficoLinha(pts)}
      <div class="xs muted" style="margin-top:6px">Cada ponto é uma competição em ordem cronológica. Linha para baixo = tempo menor = melhorando.</div>`:'';
    return acc('mk_h_'+k.replace(/\W+/g,'_'),`${dist}m ${estilo}`,`${poolL} · ${arr.length} resultado(s) · melhor ${fmt(melhor,true)}`,linhas+grafico);
  }).join('');
  /* modo espelho: o técnico vendo as marcas do atleta (só leitura) */
  const espelho=!!S.laudoAtleta;
  return`
  ${espelho?`<div class="row noprint" style="margin:16px 0 4px"><button class="sm ghost" onclick="voltarLaudo()">‹ Equipe</button></div>`:''}
  <div class="row" style="margin:${espelho?'2px':'16px'} 0 10px"><h2>${espelho?'Marcas · '+esc(prim(S.laudoNome||'')):'Marcas'}</h2><div class="grow"></div>
    ${espelho?'<span class="tag o">como o atleta vê</span>':'<button class="sm primary" onclick="abrirNovaMarca()">+ Tempo</button>'}</div>
  ${espelho?'<div class="xs muted" style="margin:-4px 0 10px">Esta é a tela do atleta. Você não edita as marcas dele daqui — para enviar o currículo da ABMN, use o card na ficha dele.</div>':''}
  ${destaquesMarcas(pro)}
  ${espelho?'':acc('mk_abmn','Importar da ABMN','currículo On-Line em PDF',`
    <p class="small muted" style="margin:2px 0 8px">Importe seus melhores tempos e o histórico de competições de uma vez — cada resultado entra no quadro de evolução.</p>
    <input type="file" id="abmnFile" accept="application/pdf,.pdf" style="display:none" onchange="importarABMN(this)">
    <button class="primary full" onclick="document.getElementById('abmnFile').click()">Importar currículo ABMN (PDF)</button>`)}
  ${acc('mk_sc','Piscina curta · 25m',nSC?`${nSC} prova(s)`:'sem marcas',nSC?pbsTabela(pro.pbs,'SC25'):'<div class="small muted">Nenhuma marca de piscina curta. Toque em + Tempo.</div>')}
  ${acc('mk_lc','Piscina longa · 50m',nLC?`${nLC} prova(s)`:'sem marcas',nLC?pbsTabela(pro.pbs,'LC50'):'<div class="small muted">Nenhuma marca de piscina longa. Toque em + Tempo.</div>')}
  ${acc('mk_alvos','Provas-alvo','provas foco da projeção',cardAlvos(pro)||'<div class="small muted">Sem provas-alvo definidas.</div>')}
  <div class="eyebrow" style="margin:16px 4px 4px">histórico de competições · por prova</div>
  ${histProvas||'<div class="card"><div class="small muted">Nenhum resultado ainda. Use + Tempo (com a competição) ou o técnico lança nas competições.</div></div>'}
  ${espelho?'':`<div class="row noprint" style="margin:14px 0 0"><div class="grow"></div>
    <button class="sm ghost" onclick="abrirLimparMarcas()">Conferir procedência das marcas</button></div>`}
  <div style="height:20px"></div>`;
}

async function salvarMarca(){
  const b=PROVAS_MARCA[+document.getElementById('mkProva').value];
  const pis=document.getElementById('mkPis').value,ms=msHMSC(val('mkH'),val('mkM'),val('mkS'),val('mkC'));
  if(!ms)return toast('Informe o tempo (ao menos os segundos)');
  S.pro=S.pro||proVazio();
  const key=pbKey(b.d,b.e,pis);
  if(!S.pro.pbs[key]||ms<S.pro.pbs[key])S.pro.pbs[key]=ms;
  if(val('mkComp')){
    const parc=val('mkParc')?val('mkParc').split(/[\/,;]+/).map(s=>parseTempo(s.trim())).filter(x=>x!=null):[];
    S.pro.resultados=S.pro.resultados||[];
    S.pro.resultados.push({chave:uid(),comp:val('mkComp'),data:val('mkData')||hoje(),piscina:pis,
      prova:`${b.d}m ${b.e}`,dist:b.d,estilo:b.e,tempo:ms,parciais:parc.length?parc:[ms],inscricao:null});
  }
  await salvarPro(); fecharSheet(); toast(val('mkComp')?'Competição registrada':'Melhor tempo registrado'); render();
}
async function apagarPB(k){delete S.pro.pbs[k];await salvarPro();render()}
async function apagarResultado(chave){ S.pro.resultados=(S.pro.resultados||[]).filter(r=>r.chave!==chave); await salvarPro(); render(); }

/* ── PROCEDÊNCIA DAS MARCAS ────────────────────────────────────────────────
   Na tela de Marcas, um tempo de outra pessoa é indistinguível de um seu: são
   os dois "50 livre, 24.12, tal competição". Isso deixou de ser hipótese
   quando o modo espelho gravou marcas de um atleta no pro_ de quem estava
   olhando — e o dono não tinha como saber o que era dele nem como separar.
   A chave de cada resultado diz de onde ele veio, e é só isso que este
   inventário faz: traduzir a chave em procedência, para o atleta decidir.
   Função pura, para poder ser testada sem tela e sem banco. */
const ORIGEM_RES=[
  {id:'abmn',rot:'Currículo ABMN',          teste:c=>/^abmn_/.test(c)},
  {id:'mc',  rot:'Competições que você lançou',teste:c=>/^mc_/.test(c)},
  {id:'eq',  rot:'Competições da equipe',    teste:c=>c.includes('|')},
  {id:'mao', rot:'Digitado em + Tempo',      teste:()=>true}];
function inventarioMarcas(pro){
  const g={};
  for(const r of (pro&&pro.resultados)||[]){
    const o=ORIGEM_RES.find(x=>x.teste(String(r.chave||'')));
    const b=g[o.id]=g[o.id]||{rot:o.rot,n:0,comps:new Set(),de:null,ate:null};
    b.n++;
    if(r.comp)b.comps.add(r.comp);
    if(r.data){ if(!b.de||r.data<b.de)b.de=r.data; if(!b.ate||r.data>b.ate)b.ate=r.data; }
  }
  return ORIGEM_RES.filter(o=>g[o.id])
    .map(o=>({id:o.id,rot:g[o.id].rot,n:g[o.id].n,de:g[o.id].de,ate:g[o.id].ate,
              comps:[...g[o.id].comps].sort()}));
}
function abrirLimparMarcas(){

      ${b.id==='abmn'?`<button class="sm ghost full" style="margin-top:6px" onclick="apagarMarcasOrigem('abmn')">Apagar estes ${b.n}</button>`:''}
    </div>`).join('');

    ${blocos||'<div class="small muted">Nenhum resultado no histórico.</div>'}

    <div class="note warn" style="margin:10px 0"><b>Zerar apaga os PBs e todo o histórico de competições.</b> Os dados de Saúde (check-in, Garmin, exames, bioimpedância) e os treinos não são tocados. Depois de zerar, importe o seu currículo da ABMN de novo: ele reconstrói os dois.</div>
    <button class="ghost full" onclick="zerarMarcas()">Zerar marcas (PBs e histórico)</button>
    <button class="primary full" style="margin-top:8px" onclick="fecharSheet()">Fechar</button>`);

async function apagarMarcasOrigem(id){

/* ---------- leitura de PDF no navegador (pdf.js sob demanda) ---------- */
let _pdfjs=null;
function carregarPdfJs(){
  if(_pdfjs)return _pdfjs;
  _pdfjs=new Promise((res,rej)=>{
    if(window.pdfjsLib){res(window.pdfjsLib);return;}
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    /* SRI: se o CDN for comprometido e servir outro arquivo, o navegador
       recusa em vez de executar. Exige crossOrigin anônimo. */
    s.integrity='sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e';
    s.crossOrigin='anonymous';
    s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib)}catch(e){rej(e)}};
    s.onerror=()=>rej(new Error('não consegui carregar o leitor de PDF (sem conexão ou arquivo alterado no CDN)'));
    document.head.appendChild(s);
  });
  return _pdfjs;
}
/* DUAS leituras do mesmo PDF, num parse só.
   `linhas` agrupa por Y — é o que sempre foi usado, e é o certo para documento
   de uma coluna (currículo ABMN, exame, bioimpedância).
   `colunas` agrupa primeiro por FAIXA DE X e só depois por Y. Psych sheet do
   HY-TEK vem em até três colunas por página; agrupando por Y, a mesma linha de
   texto junta inscritos de provas diferentes e o cabeçalho da prova aparece
   DEPOIS dos inscritos dela. Foi exatamente isso que impediu o app de achar o
   Bruno no balizamento de Buenos Aires: a linha dele estava lá, mas sem prova
   a que pertencer. Lendo coluna por coluna, a ordem de leitura volta a ser a
   do documento. */
async function pdfTextos(file){
  const lib=await carregarPdfJs();
  const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  const junta=(g,colapsa)=>Object.keys(g).map(Number).sort((a,b)=>b-a)
    .map(y=>{const l=g[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ');
             return colapsa?l.replace(/\s+/g,' ').trim():l})
    .filter(l=>!colapsa||l).join('\n');
  let linhas='', colunas='';
  for(let p=1;p<=pdf.numPages;p++){
    const pg=await pdf.getPage(p), larg=(pg.getViewport({scale:1}).width)||612;
    const tc=await pg.getTextContent();
    const porY={}, porCol=[{},{},{}];
    for(const it of tc.items){
      const x=it.transform[4], y=Math.round(it.transform[5]);
      (porY[y]=porY[y]||[]).push({x,s:it.str});
      const c=x<larg/3?0:x<larg*2/3?1:2;
      (porCol[c][y]=porCol[c][y]||[]).push({x,s:it.str});
    }
    linhas+=junta(porY,false)+'\n';
    for(const c of porCol){const t=junta(c,true); if(t)colunas+=t+'\n';}
  }
  return{linhas,colunas};
}
/* mantém a assinatura antiga: todos os importadores de uma coluna seguem iguais */
async function pdfTexto(file,modo){ const t=await pdfTextos(file); return modo==='colunas'?t.colunas:t.linhas; }
/* extrai resultados do currículo On-Line da ABMN (histórico por competição) */
/* ── Currículo ABMN ────────────────────────────────────────────────────────
   O PDF traz DUAS listas: "all-time" e "por faixa" (etária). Para um master, a
   segunda é a que vale: quem tem 50+ dificilmente repete o tempo que fez aos
   25 — no currículo do Tiaen, o 50 peito SC25 é 31.40 (25+, 2002) contra 34.71
   na faixa atual, 3,3 s de diferença. Projetar em cima do tempo de 2002 daria
   um alvo irreal. Lemos a faixa atual do cabeçalho ("Faixa em 2026: 50 +").

   Cuidados de formato: o nome do evento QUEBRA LINHA (a data cai na linha
   seguinte), e a segunda faixa de uma prova vem sem repetir o nome da prova.
   Por isso o casamento é feito sobre o texto inteiro, não linha a linha.
   (O parser antigo exigia ':' no tempo e perdia TODOS os tempos de 50 m.) */
function parseABMN(txt){
  const ESTIL={LIVRE:'livre',PEITO:'peito',COSTAS:'costas',BORBOLETA:'borboleta',MEDLEY:'medley'};
  const t=String(txt||'').replace(/\r/g,'');
  const mF=t.match(/Faixa\s+em\s*\d{4}\s*:\s*(\d{2})\s*\+/i);
  const faixaAtual=mF?+mF[1]:null;
  const mM=t.match(/Matr[íi]cula\s+ABMN:\s*(\d+)/i);
  const itens=[];
  const secRe=/Melhores\s+tempos\s+por\s+faixa\s*[-–]\s*(25|50)\s*METROS([\s\S]*?)(?=Melhores\s+tempos|Resultados\s+por\s+prova|$)/gi;
  let s;
  while((s=secRe.exec(t))){
    const pool=s[1]==='50'?'LC50':'SC25';
    const corpo=s[2].split('\n').filter(l=>!/revez/i.test(l)&&!/\d\s*[xX]\s*\d{2,}/.test(l)).join('\n');
    /* prova (opcional, só na 1ª linha do grupo) + faixa + tempo + evento + data
       A FAIXA aceita PRÉ-MASTER, e isso conserta um erro silencioso: quando a
       primeira linha de uma prova era pré-master, ela NÃO casava, a prova não
       era capturada, e as linhas seguintes herdavam a prova ANTERIOR. No
       currículo do Renê o 50 borboleta abre em pré-master, então 25.41 e
       25.51 iam parar no 50 PEITO — o PB de peito dele virava tempo de
       borboleta. Pré-master entra como faixa 0 e sai do filtro de faixa. */
    const re=/(?:(\d{2,4})\s+(LIVRE|PEITO|COSTAS|BORBOLETA|MEDLEY)\s+(MASC|FEM)\s+)?(PR[ÉE]-?|\d{2}\s*\+)\s+(\d{1,3}:\d{2}\.\d{2}|\d{1,2}\.\d{2})\s+([\s\S]*?)(\d{2}\/\d{2}\/\d{4})/g;
    let m, dist=null, estilo=null, genero=null;
    while((m=re.exec(corpo))){
      if(m[1]){ dist=+m[1]; estilo=ESTIL[m[2].toUpperCase()]||'livre'; genero=m[3].toUpperCase(); }
      if(dist==null)continue;
      const tempo=parseTempo(m[5]); if(!tempo)continue;
      const d=m[7].split('/');
      itens.push({dist,estilo,genero,faixa:/PR[ÉE]/i.test(m[4])?0:parseInt(m[4],10),piscina:pool,tempo,
        comp:m[6].replace(/\s+/g,' ').trim().slice(0,90),
        data:`${d[2]}-${d[1]}-${d[0]}`,prova:`${dist}m ${estilo}`,parciais:[],inscricao:null});
    }
  }
  /* ── ALL-TIME: o PB da vida inteira ──────────────────────────────────────
     Não entra no modelo — `pbs` continua sendo o melhor da FAIXA ATUAL, que é
     o que projeta um alvo realista. Entra como referência de vitrine: quem
     nada há vinte anos quer ver o 22.72 que fez aos 25, e quer saber que é
     de outra época. Guardamos o tempo, a faixa em que foi feito e a data. */
  const alltime={};
  const atRe=/Melhores\s+tempos\s+all-?time\s*[-–]\s*(25|50)\s*METROS([\s\S]*?)(?=Melhores\s+tempos|Hist[óo]rico\s+por|$)/gi;
  let a;
  while((a=atRe.exec(t))){
    const pool=a[1]==='50'?'LC50':'SC25';
    const corpo=a[2].split('\n').filter(l=>!/revez/i.test(l)&&!/\d\s*[xX]\s*\d{2,}/.test(l)).join('\n');
    const re=/(\d{2,4})\s+(LIVRE|PEITO|COSTAS|BORBOLETA|MEDLEY)\s+(?:MASC|FEM)\s+(PR[ÉE]-?|\d{2}\s*\+)\s+(\d{1,3}:\d{2}\.\d{2}|\d{1,2}\.\d{2})\s+([\s\S]*?)(\d{2}\/\d{2}\/\d{4})/gi;
    let m;
    while((m=re.exec(corpo))){
      const tempo=parseTempo(m[4]); if(!tempo)continue;
      const d=m[6].split('/');
      const fx=/PR[ÉE]/i.test(m[3])?'pré-master':m[3].replace(/\s+/g,'');
      const k=`${+m[1]} ${ESTIL[m[2].toUpperCase()]||'livre'} ${pool}`;
      if(!alltime[k]||tempo<alltime[k].tempo)
        alltime[k]={tempo,faixa:fx,data:`${d[2]}-${d[1]}-${d[0]}`,
          comp:m[5].replace(/\s+/g,' ').trim().slice(0,90)};
    }
  }
  return {faixaAtual,matricula:mM?mM[1]:null,atleta:nomeDoCurriculo(t),itens,alltime,
          historico:parseABMNHistorico(t)};
}
/* ── DE QUEM É ESTE CURRÍCULO ───────────────────────────────────────────────
   O cabeçalho do Currículo On-Line traz o nome do atleta na linha logo acima
   da matrícula: "NOME COMPLETO (EQUIPE, CIDADE) (ANO)". Ler esse nome é o que
   permite ao app conferir se o PDF é de quem se pensa — em vez de aceitar
   qualquer arquivo e só descobrir o engano quando as marcas de um aparecem
   no perfil de outro, que foi o que aconteceu. */
function nomeDoCurriculo(txt){
  const linhas=String(txt||'').replace(/\r/g,'').split('\n');
  const i=linhas.findIndex(l=>/Matr[íi]cula\s+ABMN\s*:/i.test(l));
  if(i<1)return null;
  for(let k=i-1;k>=Math.max(0,i-4);k--){
    const l=linhas[k].trim();
    if(!l||/Curr[íi]culo|Associa[çc][ãa]o|Swim\s*It\s*Up/i.test(l))continue;
    const m=l.match(/^([^(]{5,})\s*(?:\(|$)/);
    if(m)return m[1].replace(/\s+/g,' ').trim();
  }
  return null;
}
/* mesmo nome? Compara os TOKENS, porque a ficha costuma ter o nome social
   ("Renê") e o currículo o nome de registro ("RENE DE ALMEIDA LEITE"). Um
   contém o outro quando é a mesma pessoa. */
function mesmoAtleta(nomeA,nomeB){
  const a=normNome(nomeA).split(' ').filter(x=>x.length>=3);
  const b=normNome(nomeB).split(' ').filter(x=>x.length>=3);
  if(!a.length||!b.length)return null;                 /* não dá para afirmar */
  const comuns=a.filter(x=>b.includes(x)).length;
  return comuns>=Math.min(2,Math.min(a.length,b.length));
}
/* ── HISTÓRICO POR COMPETIÇÃO ──────────────────────────────────────────────
   É a seção que torna possível um gráfico de evolução DENTRO da faixa atual.
   A tabela de "melhores por faixa" dá um ponto por faixa — para um atleta de
   40+ isso é um ponto só, e o gráfico que existia ligava 2009 a 2025, o que
   mostra envelhecimento, não treino. Aqui cada linha é uma prova nadada, com
   a FAIXA em que foi disputada, então dá para recortar.
   Linha: colocação · nº da prova · distância estilo gênero · faixa · equipe ·
          tempo · rec · pontos · índice · data.
   A piscina vem do cabeçalho da competição ("… - 50 METROS"). */
function parseABMNHistorico(txt){
  const ESTIL={LIVRE:'livre',PEITO:'peito',COSTAS:'costas',BORBOLETA:'borboleta',MEDLEY:'medley'};
  const t=String(txt||'').replace(/\r/g,'');
  const i=t.search(/Hist[óo]rico\s+por\s+competi[çc][ãa]o/i);
  if(i<0)return [];
  const out=[];
  let comp=null, pool=null;
  for(const bruto of t.slice(i).split('\n')){
    const l=bruto.trim(); if(!l)continue;
    /* cabeçalho de competição: "NOME ... - 25 METROS" | "- 50 METROS"
       ⚠️ O guarda antigo era `!/^\d/` e descartava TODO cabeçalho que começa
       com número — que na ABMN é a maioria: "75º CAMPEONATO BRASILEIRO",
       "46º", "6ª ETAPA", "2011 PANAMERICAN", "15º CAMPEONATO MUNDIAL".
       Sem trocar o cabeçalho, as provas seguintes herdavam o nome E A
       PISCINA da competição anterior. No currículo do Renê isso misturava
       quatro competições debaixo de "III TROFÉU BRASIL" e marcava como
       25 m os 100 livre de 55.85 nadados em piscina de 50 no 73º
       Brasileiro — e a prova mais recente dele (50 borboleta do 75º
       Brasileiro) era simplesmente descartada, porque ainda não havia
       piscina definida quando ela apareceu.
       O discriminador certo não é o primeiro caractere: linha de RESULTADO
       sempre termina em data, cabeçalho NUNCA tem data. */
    const mc=l.match(/^(.+?)\s*[-–]\s*(25|50)\s*METROS\s*$/i);
    if(mc&&!/\d{2}\/\d{2}\/\d{4}/.test(l)){ comp=mc[1].replace(/\s+/g,' ').trim().slice(0,90); pool=mc[2]==='50'?'LC50':'SC25'; continue; }
    if(!pool)continue;
    if(/revez/i.test(l)||/\b\d\s*[xX]\s*\d{2,}\b/.test(l))continue;   /* revezamento fora */
    /* a faixa também pode ser PRÉ-MASTER, e aí vem sem o "+" e com a palavra
       MASTER quebrada para a linha seguinte. Entra como faixa 0, igual à
       tabela de melhores por faixa — fica no histórico e sai do recorte da
       faixa atual. Antes, essas sete provas do Renê desapareciam. */
    const m=l.match(/^\s*(?:\d+[ºªo]|N\/?C|DQL|DNS)\s+\d+[ºªa]\s+(\d{2,4})\s+(LIVRE|PEITO|COSTAS|BORBOLETA|MEDLEY)\s+(?:MASC|FEM)\s+(PR[ÉE]-?|\d{2,3}\s*\+)\s+.*?(\d{2}:\d{2}\.\d{2})\s+.*?(\d{2}\/\d{2}\/\d{4})\s*$/i);
    if(!m)continue;
    const tempo=parseTempo(m[4].replace(/^00:/,''));   /* 00:25.82 → 25.82 */
    if(!tempo)continue;
    const d=m[5].split('/');
    out.push({dist:+m[1],estilo:ESTIL[m[2].toUpperCase()]||'livre',piscina:pool,
      faixa:/PR[ÉE]/i.test(m[3])?0:parseInt(m[3],10),tempo,comp,data:`${d[2]}-${d[1]}-${d[0]}`,
      prova:`${+m[1]}m ${ESTIL[m[2].toUpperCase()]||'livre'}`,parciais:[],inscricao:null});
  }
  return out;
}
/* Melhor tempo POR PROVA na faixa atual. Sem registro na faixa atual, cai para
   a faixa mais recente que o atleta tem — nunca para a da juventude. */
function pbsDaFaixa(itens,faixaAtual){
  const g={};
  for(const r of itens){ const k=pbKey(r.dist,r.estilo,r.piscina); (g[k]=g[k]||[]).push(r); }
  const out={};
  for(const k in g){
    const arr=g[k];
    const elegiveis=(faixaAtual!=null)?arr.filter(r=>r.faixa<=faixaAtual):arr;
    const base=elegiveis.length?elegiveis:arr;
    const maxF=Math.max(...base.map(r=>r.faixa));
    out[k]=base.filter(r=>r.faixa===maxF).reduce((a,b)=>b.tempo<a.tempo?b:a);
  }
  return out;
}
/* Aplica um currículo ABMN já lido sobre um objeto `pro`. Devolve o resumo,
   para servir tanto ao próprio atleta quanto ao técnico em Gestão de Equipe. */
function aplicarABMN(pro,cur){
  pro.pbs=pro.pbs||{}; pro.resultados=pro.resultados||[];
  if(cur.faixaAtual)pro.faixa=cur.faixaAtual;
  if(cur.matricula)pro.matricula=cur.matricula;
  /* o PB da vida inteira fica à parte: é vitrine, não entra no modelo */
  if(cur.alltime&&Object.keys(cur.alltime).length)pro.pbAllTime=cur.alltime;
  /* ── RE-IMPORTAR SUBSTITUI O QUE VEIO DA ABMN ────────────────────────────
     A deduplicação sozinha só evita repetir; ela não desfaz. Então uma
     correção no leitor não limpava o que a versão anterior tinha gravado
     errado — os resultados com piscina trocada ficariam no histórico para
     sempre, lado a lado com os certos, e o atleta não teria como removê-los.
     Saem só as chaves 'abmn_' (é esta função que as cria): competição,
     treino e marco digitados pelo atleta não são tocados. */
  const antes=pro.resultados.length;
  pro.resultados=pro.resultados.filter(r=>!/^abmn_/.test(r.chave||''));
  const removidos=antes-pro.resultados.length;
  const existe=new Set(pro.resultados.map(r=>`${r.dist}|${r.estilo}|${r.piscina}|${r.data}|${r.tempo}`));
  let add=0;
  /* O HISTÓRICO por competição entra junto com as melhores por faixa. É ele
     que dá mais de um ponto dentro da faixa atual — sem ele, o gráfico de
     evolução de um atleta de 40+ tem um ponto só por prova, ou liga 2009 a
     2025 e mostra envelhecimento em vez de treino. A deduplicação é por
     prova+piscina+data+tempo, então a mesma prova nas duas listas não dobra. */
  for(const r of [...(cur.historico||[]),...cur.itens]){
    const k=`${r.dist}|${r.estilo}|${r.piscina}|${r.data}|${r.tempo}`;
    if(existe.has(k))continue; existe.add(k);
    pro.resultados.push(Object.assign({chave:'abmn_'+k.replace(/\|/g,'_')},r)); add++;
  }
  /* PB = melhor tempo NA FAIXA ATUAL (não o da vida inteira) */
  const melhores=pbsDaFaixa(cur.itens,cur.faixaAtual);
  let ajust=0;
  for(const pk in melhores){
    const r=melhores[pk];
    if(pro.pbs[pk]!==r.tempo){ pro.pbs[pk]=r.tempo; ajust++; }
  }
  return {add,ajust,removidos,faixa:cur.faixaAtual,provas:Object.keys(melhores).length,
          historico:(cur.historico||[]).length,
          naFaixa:(cur.historico||[]).filter(r=>r.faixa===cur.faixaAtual).length,
          allTime:Object.keys(cur.alltime||{}).length};
}

/* agrupa os resultados de competição por prova+piscina para a linha do tempo */
/* ── EVOLUÇÃO: SÓ A CATEGORIA DE HOJE ──────────────────────────────────────
   Atleta longevo compete em várias faixas. Ligar o 22.72 que ele fez aos 25
   ao 24.12 que fez aos 42 desenha uma linha de envelhecimento, não de treino
   — e era isso que o gráfico mostrava. A evolução passa a usar só as provas
   da FAIXA ATUAL, que é onde ele compete hoje e contra quem ele compete.
   Resultado sem faixa declarada (o que o atleta lança no app) entra sempre:
   é recente por definição. Sem faixa conhecida, nada muda. */
function resultadosDaFaixa(pro){
  const fx=pro&&pro.faixa;
  const todos=(pro&&pro.resultados)||[];
  if(!fx)return todos;
  const naFaixa=todos.filter(r=>r.faixa==null||r.faixa===fx);
  /* se a faixa atual ainda não tem prova nenhuma, não deixa o atleta sem
     gráfico: devolve tudo e quem desenha avisa que é de faixas diferentes */
  return naFaixa.length?naFaixa:todos;
}
function evolucaoProvas(pro){
  const g={};
  for(const r of resultadosDaFaixa(pro)){
    if(r.tempo==null||!r.data)continue;
    const k=pbKey(r.dist,r.estilo,r.piscina);
    (g[k]=g[k]||[]).push(r);
  }
  const out=[];
  for(const k of Object.keys(g)){
    const arr=g[k].slice().sort((a,b)=>a.data.localeCompare(b.data));
    if(arr.length<2)continue;
    const first=arr[0].tempo,last=arr[arr.length-1].tempo;
    out.push({key:k,prova:`${arr[0].dist}m ${arr[0].estilo}`,piscina:arr[0].piscina,
      pts:arr.map(r=>({rot:r.data.slice(8,10)+'/'+r.data.slice(5,7)+'/'+r.data.slice(2,4),v:r.tempo})),delta:last-first,melhora:last<first});
  }
  return out.sort((a,b)=>a.key.localeCompare(b.key));
}
/* mini gráfico de linha: menor tempo (melhor) fica em cima; verde melhora, vermelho piora */
function graficoLinha(pts){
  if(!pts||pts.length<2)return'';
  const W=600,H=150,P=30,n=pts.length;
  const vs=pts.map(p=>p.v),mx=Math.max(...vs),mn=Math.min(...vs),rg=(mx-mn)||1;
  const x=i=>P+(i*(W-2*P)/(n-1));
  /* EIXO DO TEMPO. Em SVG o y cresce para baixo, então `P + (v-mn)/rg*alt`
     colocava o MENOR tempo no topo: o atleta melhorava e a linha subia — o
     contrário do que a própria legenda do card dizia ("linha para baixo =
     tempo menor = melhorando") e do ▼ do rótulo "melhorou".
     Aqui o maior tempo fica no topo e o menor embaixo: melhorar é descer. */
  const y=v=>P+((mx-v)/rg)*(H-2*P);
  const cor=pts[n-1].v<pts[0].v?'var(--ok)':'var(--clock)';
  const linha=pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" style="overflow:visible">
    <polyline points="${linha}" fill="none" stroke="${cor}" stroke-width="2.5"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5" fill="${cor}"/>
      <text x="${x(i).toFixed(1)}" y="${(y(p.v)-8).toFixed(1)}" font-size="10" fill="var(--ink)" text-anchor="middle" font-family="JetBrains Mono,monospace">${fmt(p.v,true)}</text>
      <text x="${x(i).toFixed(1)}" y="${H-P+14}" font-size="9" fill="var(--ink-2)" text-anchor="middle" font-family="Barlow,sans-serif">${p.rot}</text>`).join('')}
  </svg>`;
}
function cardEvolucao(pro,eyebrow){
  const ev=evolucaoProvas(pro); if(!ev.length)return'';
  return`<div class="card"><div class="eyebrow">${eyebrow}</div>
    ${/* P2-D — cada série traz o seu n e o que ele permite afirmar. "Melhorou
         1,69s" entre duas provas separadas por dois anos não é tendência; é a
         diferença entre dois pontos, e o cartão passa a dizer qual é qual. */''}
    ${ev.map(e=>{const n=e.pts.length;
      const dias=(e.pts[n-1]&&e.pts[0])?null:null;
      const limite=n>=5?null:(n<=2?`${n} provas — é a diferença entre dois pontos, não uma tendência`
                                  :`${n} provas — direção preliminar, sensível a uma prova atípica`);
      return`<div style="margin-top:14px">
      <div class="row"><b>${e.prova} <span class="xs muted">${e.piscina}</span></b><div class="grow"></div>
        <span class="small" style="font-weight:700;color:${e.melhora?'var(--ok)':'var(--clock)'}">${e.melhora?'▼ melhorou':'▲ piorou'} ${fmt(Math.abs(e.delta),true)}</span></div>
      <div class="xs muted" style="margin-top:2px">n = ${n} competição(ões)${limite?` · <b>${limite}</b>`:' · amostra suficiente para falar em tendência'}</div>
      ${graficoLinha(e.pts)}</div>`}).join('')}
    <div class="xs muted" style="margin-top:8px">Cada ponto é uma competição, na ordem cronológica (dia/mês/ano). Linha para baixo = tempo menor = melhorando. <b>Cada prova e piscina tem a sua própria série</b> — 50 e 100, curta e longa não se somam numa tendência só. Melhora na prova e mudança no treino andarem na mesma direção <b>não estabelece que uma causou a outra</b>: o que mudou no período não foi só o treino.</div>
  </div>`;
}
