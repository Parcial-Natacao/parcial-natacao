function volumePorSemana(){
  const m={};
  for(const meta of S.tridx.filter(t=>(t.para||[]).includes(S.u.id))){
    const d=new Date(meta.data+'T00:00:00'); const on=new Date(d); on.setDate(d.getDate()-((d.getDay()+6)%7));
    const k=on.toISOString().slice(0,10);
    m[k]=(m[k]||0)+(meta.vol||0);
  }
  return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0])).slice(-8).map(([k,v])=>({rot:brCurta(k),m:v}));
}
function diagnostico(comPct,brk,sem,pro){
  const foco=[];
  const md=comPct.length?comPct.reduce((t,e)=>t+e.pct,0)/comPct.length:null;
  const deltaMd=brk.length?brk.slice(-10).reduce((t,e)=>t+e.delta,0)/Math.min(brk.length,10):null;
  const g=[...(pro.garmin||[])].sort((a,b)=>b.data.localeCompare(a.data));
  const h=g.filter(x=>x.hrv!=null);
  let hrvBaixa=false;
  if(h.length>=4){
    const rec=h.slice(0,3).reduce((t,x)=>t+x.hrv,0)/3;
    const base=h.slice(3,17).reduce((t,x)=>t+x.hrv,0)/Math.max(1,h.slice(3,17).length);
    hrvBaixa=((rec-base)/base)<-0.08;
  }
  const subindo=sem.length>=2&&sem[sem.length-1].m>sem[sem.length-2].m*1.25;
  const exUlt=[...(pro.exames||[])].sort((a,b)=>b.data.localeCompare(a.data))[0];
  const exFlags=exUlt?flagsExame(exUlt):[];
  const exameForte=exFlags.some(f=>f.forte);

  if(deltaMd!=null){
    if(deltaMd>2600)foco.push({t:'warn',txt:`O segundo 25 está custando em média <b>+${fmt(deltaMd,true)}</b> a mais que o primeiro. Esse é o seu maior ponto de perda: o limitador é manutenção de velocidade, não velocidade de largada.`});
    else foco.push({t:'ok',txt:`Diferencial médio de <b>+${fmt(deltaMd,true)}</b> entre os 25. A manutenção do segundo 25 está estável, e o primeiro 25 mostra margem de velocidade relativa.`});
  }
  if(md!=null){
    if(md<90)foco.push({t:'',txt:`Os tiros estão saindo a <b>${md.toFixed(0)}%</b> da sua melhor marca. Baixa exposição recente a esforços curtos em intensidade específica de prova. <i>Leitura para o técnico: avaliar se a preparação traz estímulo específico suficiente.</i>`});
    else if(md>=95)foco.push({t:'ok',txt:`Média de <b>${md.toFixed(0)}%</b> do seu melhor tempo nos tiros. Você está treinando perto do ritmo de prova; o ganho agora vem de frescor, não de mais carga.`});
    else foco.push({t:'',txt:`Média de <b>${md.toFixed(0)}%</b> do melhor tempo. Faixa saudável de treino. <i>Leitura para o técnico: a intensidade específica aparece em volume adequado.</i>`});
  }
  if(hrvBaixa)foco.push({t:'warn',txt:'A VFC está abaixo da sua linha de base. Historicamente, esforços de alta demanda nessa condição rendem menos. <i>Leitura para o técnico.</i>'});
  if(subindo)foco.push({t:'warn',txt:'O volume subiu mais de 25% em relação à semana anterior. Salto de volume acima do habitual. <i>Leitura para o técnico sobre a progressão.</i>'});
  exFlags.forEach(f=>foco.push({t:f.t,txt:f.txt}));
  const bioUlt=[...(pro.bioimp||[])].sort((a,b)=>b.data.localeCompare(a.data))[0];
  if(bioUlt)flagsBio(bioUlt).forEach(f=>foco.push({t:f.t,txt:f.txt}));
  const evP=evolucaoProvas(pro);
  const evoluiu=evP.filter(e=>e.melhora),regrediu=evP.filter(e=>!e.melhora);
  if(evoluiu.length)foco.push({t:'ok',txt:`Em competição, evolução em <b>${[...new Set(evoluiu.map(e=>e.prova))].join(', ')}</b>. Mantenha o que está funcionando nessas provas.`});
  if(regrediu.length)foco.push({t:'warn',txt:`Queda de rendimento em <b>${[...new Set(regrediu.map(e=>e.prova))].join(', ')}</b> ao longo das competições. Vale revisar a preparação específica dessas provas.`});
  if(!foco.length)foco.push({t:'',txt:'Ainda não há tiros suficientes registrados para um diagnóstico firme. Lance os tempos de mais algumas sessões.'});

  let sessao,descanso,descansoTipo;
  if(hrvBaixa||exameForte){
    sessao=`Aquecimento\n400 livre solto\n4x50 pernada 1'10\n\nPrincipal (leve)\n8x50 técnica 1'15\n4x25 progressivo pausa 40"\n\nSoltura\n300 livre`;
    descanso='Priorize 48 horas de carga reduzida e sono acima de sete horas antes da próxima sessão forte.';
    descansoTipo='warn';
  }else if(deltaMd!=null&&deltaMd>2600){
    sessao=`Aquecimento\n400 livre\n6x50 pernada peito 1'05\n\nPrincipal — manutenção de velocidade\n6x50 peito ritmo de prova saída 3'00 (parciais 25/25)\n8x25 peito máximo pausa 45"\n4x50 peito broken 10" no 25\n\nSoltura\n300 livre`;
    descanso='Descanso completo entre os 50: o objetivo é repetir o segundo 25, não acumular fadiga.';
    descansoTipo='';
  }else{
    sessao=`Aquecimento\n300 livre\n4x50 pernada peito 1'10\n\nPrincipal — velocidade\n10x25 peito máximo pausa 50"\n4x50 peito ritmo de prova saída 2'30\n2x50 peito com saída de bloco\n\nSoltura\n200 costas`;
    descanso='Um dia leve entre sessões de velocidade. Mantenha o volume total estável nesta semana.';
    descansoTipo='ok';
  }
  return{foco,sessao,descanso,descansoTipo};
}
function graficoBarras(arr,crescerBom){
  if(!arr.length)return'';
  const W=600,H=155,P=28,mx=Math.max(...arr.map(a=>a.v)),mn=Math.min(...arr.map(a=>a.v)),rg=(mx-mn)||1;
  const bw=(W-2*P)/arr.length;
  const bom=crescerBom?mx:mn;
  const resumo=arr.map(a=>`${a.rot}: ${crescerBom?(a.v/1000).toFixed(1)+' mil':fmt(a.v,true)}`).join(', ');
  return`<svg class="chart" role="img" aria-label="Gráfico de barras. ${esc(resumo)}" viewBox="0 0 ${W} ${H}">
    ${arr.map((a,i)=>{const h=20+((a.v-mn)/rg)*(H-2*P-20);
      return`<rect x="${(P+i*bw+bw*.16).toFixed(1)}" y="${(H-P-h).toFixed(1)}" width="${(bw*.68).toFixed(1)}" height="${h.toFixed(1)}"
        fill="${a.v===bom?'#1B7F5A':'#0E6E8C'}" rx="3"/>
      <text x="${(P+i*bw+bw*.5).toFixed(1)}" y="${H-P+14}" font-size="10" fill="var(--ink-2)" text-anchor="middle" font-family="Barlow,sans-serif">${a.rot}</text>
      <text x="${(P+i*bw+bw*.5).toFixed(1)}" y="${(H-P-h-5).toFixed(1)}" font-size="11" fill="var(--ink)" text-anchor="middle" font-family="JetBrains Mono,monospace">${crescerBom?(a.v/1000).toFixed(1)+'k':fmt(a.v,true)}</text>`}).join('')}
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--line-forte)"/></svg>`;
}

function imprimirRelatorio(modo){

  if(modo==='completo'){ S.acc.dt_relDet=true; SECOES_REL.forEach(k=>S.acc[k]=true); render(); }
  try{ window.scrollTo(0,0); }catch(e){}
  const app=document.getElementById('app'); if(!app){S.acc=JSON.parse(antes);return toast('Abra o Relatório primeiro.')}
  const clone=app.cloneNode(true); clone.querySelectorAll('.noprint').forEach(n=>n.remove());
  /* A janela de impressão recebe só HTML e CSS — nenhuma função do app existe
     lá. Handlers inline herdados do clone viram ReferenceError no console da
     janela nova; e botão em papel não serve para nada. */
  clone.querySelectorAll('[onclick],[oninput],[ontoggle],[onchange]').forEach(n=>{
    n.removeAttribute('onclick');n.removeAttribute('oninput');
    n.removeAttribute('ontoggle');n.removeAttribute('onchange');});
  clone.querySelectorAll('details').forEach(d=>d.setAttribute('open',''));
  /* P3-B — os três modos recortam por NÍVEL, não por cartão solto */
  if(modo==='enxuto'||modo==='pagina1'){
    clone.querySelectorAll('.report-details,.doc-meta').forEach(n=>n.remove());
    clone.querySelectorAll('.doc-nivel').forEach(n=>{ if(/Nível 3/.test(n.textContent))n.remove(); });
  }
  if(modo==='pagina1'){
    clone.querySelectorAll('.doc-sec').forEach(n=>{ if(!n.closest('.pagina-um'))n.remove(); });
    clone.querySelectorAll('.doc-nivel').forEach(n=>n.remove());
    const p1=clone.querySelector('.pagina-um'); if(p1)p1.style.breakAfter='auto';
  }
  /* Rodapé de folha, repetido em TODAS as páginas: um PDF que circula entre

     capa — a folha 7 pode chegar sozinha na mão de alguém. */
  const rod=document.createElement('div'); rod.className='doc-rodape';
  rod.innerHTML=`<span class="rod-marca"><img src="./icone-m360-512.png" alt="" width="512" height="512"><b>${esc(APP_NOME)}</b><span class="rod-url">meros360.com</span></span>`
    +`<span class="rod-quem">${esc(nomeLaudo())} — relatório de performance · ${brData(hoje())}</span>`
    +`<span class="rod-ver">${VER}</span>`;
  clone.appendChild(rod);
  setTimeout(()=>{ S.acc=JSON.parse(antes); render(); },400);
  const estilos=[...document.querySelectorAll('style')].map(s=>s.outerHTML).join('');
  const nome=nomeLaudo();
  const corpo=clone.innerHTML;
  /* A janela de impressão nasce em about:blank, onde "./logo-m360-*.png" não
     resolve — a logo sairia quebrada no PDF. O <base> amarra os caminhos
     relativos ao endereço de onde o app está servido. */
  const base=`<base href="${location.href.replace(/[^/]*$/,'')}">`;
  const cabeca=base+`<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(nome)} — relatório</title>${estilos}<style>body{padding:14px;background:#fff}@media print{body{padding:0}}</style>`;
  const script='<scr'+'ipt>window.onload=function(){setTimeout(function(){try{window.focus();window.print();}catch(e){}},500);};window.onafterprint=function(){setTimeout(function(){try{window.close();}catch(e){}},300);};</scr'+'ipt>';
  const doc='<!doctype html><html lang="pt-BR"><head>'+cabeca+'</head><body>'+corpo+script+'</body></html>';
  let w=null; try{ w=window.open('','_blank'); }catch(e){}
  if(w&&w.document){ w.document.open(); w.document.write(doc); w.document.close(); return; }
  /* fallback: iframe oculto (popup bloqueado — comum em PWA no celular) */
  const ifr=document.createElement('iframe');
  ifr.setAttribute('aria-hidden','true');
  ifr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0';
  document.body.appendChild(ifr);
  const d=ifr.contentWindow.document;
  d.open(); d.write('<!doctype html><html><head>'+cabeca+'</head><body>'+corpo+'</body></html>'); d.close();
  const go=()=>{ try{ ifr.contentWindow.focus(); ifr.contentWindow.print(); }
    catch(e){ toast('Não consegui abrir o PDF. Use o menu do navegador → Imprimir/Compartilhar.'); }
    setTimeout(()=>{ try{ifr.remove();}catch(e){} }, 2000); };
  setTimeout(go, 600);
}
async function compartilharRelatorio(){
  const pro=S.pro||{};
  const e=ESF||await coletarEsforcos({dias:120});
  const tec=e.filter(x=>['pernada','técnica','braçada','filipina'].some(t=>x.tags.includes(t)));
  const int=e.filter(x=>!tec.includes(x));
  const comPct=int.map(x=>{const pb=pbDe(pro,x.dist,x.estilo,x.pis);return{...x,pct:pb?pb/x.tempo*100:null}}).filter(x=>x.pct);
  const brk=int.filter(x=>x.p1!=null&&x.dist===50).map(x=>({...x,delta:x.tempo-2*x.p1}));
  const diag=diagnostico(comPct,brk,volumePorSemana(),pro);
  const semTags=s=>String(s).replace(/<[^>]+>/g,'');
  let t=`*Relatório de performance — ${S.u.nome}*\n${brData(hoje())}\n`;
  t+=`\n*Onde concentrar*\n`+diag.foco.slice(0,5).map(f=>'• '+semTags(f.txt)).join('\n')+'\n';
  const ev=evolucaoProvas(pro);
  if(ev.length)t+=`\n*Evolução em competições*\n`+ev.map(x=>`• ${x.prova} ${x.piscina}: ${x.melhora?'melhorou':'piorou'} ${fmt(Math.abs(x.delta),true)}`).join('\n')+'\n';
  const exUlt=[...(pro.exames||[])].sort((a,b)=>b.data.localeCompare(a.data))[0];
  if(exUlt){const fl=flagsExame(exUlt); if(fl.length)t+=`\n*Saúde — exame de ${brData(exUlt.data)}*\n`+fl.map(f=>'• '+semTags(f.txt)).join('\n')+'\n';}
  const bioUlt=[...(pro.bioimp||[])].sort((a,b)=>b.data.localeCompare(a.data))[0];
  if(bioUlt){const susp=bioSuspeita(bioUlt),tm=tmbDe(bioUlt),imc=imcDe(bioUlt),ps=[];
    if(bioUlt.peso!=null)ps.push(`peso ${bioUlt.peso}kg`);
    if(bioUlt.gordura!=null&&!susp)ps.push(`gordura ${bioUlt.gordura}%`);
    if(imc!=null)ps.push(`IMC ${imc}`); if(tm)ps.push(`TMB ~${tm}kcal`);
    t+=`\n*Composição — ${brData(bioUlt.data)}*\n${susp?`(bioimpedância com valor suspeito: ${susp} — verificar)\n`:''}${ps.join(' · ')||'—'}\n`;}
  const pbs=Object.entries(pro.pbs||{}).slice(0,8);
  if(pbs.length)t+=`\n*Melhores marcas*\n${pbs.map(([k,v])=>`  ${k}: ${fmt(v,true)}`).join('\n')}\n`;
  t+=`\n_Análise automática de apoio — não substitui avaliação médica._\n${APP_NOME} ${VER}`;
  enviar(t,S.tecnico?[{nome:S.tecnico.nome+' (técnico)',tel:S.tecnico.telefone}]:[]);
}
