function chavesExame(ex){
  const s=new Set(Object.keys((ex&&ex.vals)||{}));
  MARC_LAB.forEach(([k])=>{ if(ex&&ex[k]!=null)s.add(k); });
  return MARC_LAB.map(([k])=>k).filter(k=>s.has(k));
}
/* data do exame: prioriza "Coleta:", depois "Data da coleta", depois a data
   mais repetida do documento (ignora a de nascimento). Nunca usa a de hoje à toa. */
function dataDoExame(txt){
  const norm=(d,m,a)=>`${a}-${m}-${d}`;
  let m=txt.match(/coleta\s*:?\s*(\d{2})\/(\d{2})\/(\d{4})/i)
      ||txt.match(/data\s*(?:d[ae]\s*)?coleta\s*:?\s*(\d{2})\/(\d{2})\/(\d{4})/i);
  if(m)return norm(m[1],m[2],m[3]);
  m=txt.match(/data\s*\/?\s*hora\s*:?\s*(\d{2})[.\/](\d{2})[.\/](\d{4})/i);   /* InBody */
  if(m)return norm(m[1],m[2],m[3]);
  /* fallback: data mais frequente (aceita / ou .), descartando nascimento e datas de emissão/liberação */
  const cont={};
  for(const linha of txt.split(/\r?\n/)){
    if(/nascimento|\bdn\b|\bd\.n\b|libera[çc]|emiss|impress/i.test(linha))continue;
    const achadas=linha.match(/\b(\d{2})[.\/](\d{2})[.\/](\d{4})\b/g)||[];
    for(const d of achadas){const p=d.split(/[.\/]/);cont[norm(p[0],p[1],p[2])]=(cont[norm(p[0],p[1],p[2])]||0)+1;}
  }
  const ord=Object.entries(cont).sort((a,b)=>(b[1]-a[1])||b[0].localeCompare(a[0]));
  return ord.length?ord[0][0]:hoje();
}
/* Lê laudo laboratorial. Formato comum (Sabin/Fleury/etc): o marcador é um
   título e o valor vem depois em "RESULTADO: x". Fallback: valor na mesma linha. */
function parseExame(txt){
  const linhas=txt.split(/\r?\n/).map(l=>l.trim());
  const vals={}; let atual=null;
  const num=s=>{const n=parseFloat(String(s).replace(/\./g,'#').replace(',','.').replace(/#/g,''));return isNaN(n)?null:n;};
  for(const l of linhas){
    if(!l)continue;
    const mr=l.match(/resultado\s*:?\s*([<>]?\s*-?[\d.,]+)/i);
    if(mr){ if(atual&&vals[atual]==null){const n=num(mr[1].replace(/[<>\s]/g,'')); if(n!=null)vals[atual]=n;} continue; }
    /* título de seção: linha curta que casa com um marcador conhecido */
    if(l.length<=60){
      const hit=MARC_LAB.find(([,,,re])=>re.test(l));
      if(hit){
        atual=hit[0];
        /* alguns laudos põem o valor na mesma linha do título */
        const inline=l.replace(hit[3],'').match(/(-?\d[\d.,]*)/);
        if(inline&&vals[atual]==null&&/\d/.test(inline[1])&&!/^\d{2}\/\d{2}/.test(l)){
          const n=num(inline[1]); if(n!=null&&/(:|\s{2,})/.test(l))vals[atual]=n;
        }
        continue;
      }
    }
  }
  return vals;
}
/* ── Leitura por IA (via Cloudflare Worker) ──────────────────────────────── */
function fileB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(new Error('não consegui ler o arquivo'));r.readAsDataURL(file);});}
/* prepara o arquivo p/ IA: foto é reduzida (máx 1600px, JPEG) pra não estourar
   limite/tamanho; PDF vai como está. Devolve {data(base64), mime}. */
function arquivoParaIA(file){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type||'')){ fileB64(file).then(data=>res({data,mime:file.type||'application/pdf'})).catch(rej); return; }
    const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{ const max=1600,e=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement('canvas'); cv.width=Math.round(img.width*e); cv.height=Math.round(img.height*e);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res({data:(cv.toDataURL('image/jpeg',.85).split(',')[1]||''),mime:'image/jpeg'}); };
      img.onerror=()=>rej(new Error('não consegui abrir a imagem (formato não suportado?)'));
      img.src=r.result; };
    r.onerror=()=>rej(new Error('não consegui ler o arquivo'));
    r.readAsDataURL(file);
  });
}
async function chamarIA(payload){
  /* O Worker exige o ID token do Firebase: é ele que prova QUEM está chamando.
     Só o cabeçalho Origin não serve — fora do navegador qualquer um o forja e
     gastaria a chave da Anthropic. */
  const h={'Content-Type':'application/json'};
  try{ if(FB&&fauth&&fauth.currentUser){ const t=await fauth.currentUser.getIdToken(); if(t)h['Authorization']='Bearer '+t; } }catch(_){}
  if(!h['Authorization'])throw new Error('faça login para usar a leitura por IA');
  const r=await fetch(IA_URL,{method:'POST',headers:h,body:JSON.stringify(payload)});
  let d; try{ d=await r.json(); }catch{ throw new Error('resposta inválida do servidor'); }
  if(!r.ok||d.erro)throw new Error(d.erro||('erro '+r.status));
  return d;
}

function mdNeg(s){return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
function mdSimples(t){
  const linhas=esc(String(t||'')).split(/\n/); let html='',emLista=false;
  const fecha=()=>{if(emLista){html+='</ul>';emLista=false;}};
  for(const raw of linhas){
    const l=raw.trim();
    if(!l){fecha();continue;}
    if(/^##\s+/.test(l)){fecha();html+=`<h3 style="margin:12px 0 4px">${mdNeg(l.replace(/^##\s+/,''))}</h3>`;continue;}
    if(/^#\s+/.test(l)){fecha();html+=`<h2 style="margin:12px 0 6px">${mdNeg(l.replace(/^#\s+/,''))}</h2>`;continue;}
    if(/^[-*]\s+/.test(l)){if(!emLista){html+='<ul style="margin:4px 0 4px 18px">';emLista=true;}html+=`<li>${mdNeg(l.replace(/^[-*]\s+/,''))}</li>`;continue;}
    fecha();html+=`<p style="margin:6px 0">${mdNeg(l)}</p>`;
  }
  fecha(); return html;
}

/* gráfico de linha simples para série de marcador (neutro: nem alto nem baixo é "bom") */
function graficoSerie(pts,faixa){
  if(!pts||pts.length<2)return'';
  const W=600,H=120,P=26,n=pts.length;
  const vs=pts.map(p=>p.v);
  let mn=Math.min(...vs),mx=Math.max(...vs);
  if(faixa){ if(faixa.lo!=null)mn=Math.min(mn,faixa.lo); if(faixa.hi!=null)mx=Math.max(mx,faixa.hi); }
  const rg=(mx-mn)||1;
  const x=i=>P+(i*(W-2*P)/(n-1)), y=v=>H-P-((v-mn)/rg)*(H-2*P);
  const faixaSvg=(faixa&&(faixa.lo!=null||faixa.hi!=null))
    ? `<rect x="${P}" y="${(faixa.hi!=null?y(faixa.hi):P).toFixed(1)}" width="${W-2*P}" height="${Math.max(2,((faixa.lo!=null?y(faixa.lo):H-P)-(faixa.hi!=null?y(faixa.hi):P))).toFixed(1)}" fill="var(--ok)" opacity=".12"/>` : '';
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" style="overflow:visible">
    ${faixaSvg}
    <polyline points="${pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--water)" stroke-width="2.5"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.2" fill="var(--water)"/>
      <text x="${x(i).toFixed(1)}" y="${(y(p.v)-7).toFixed(1)}" font-size="10" fill="var(--ink)" text-anchor="middle" font-family="JetBrains Mono,monospace">${p.v}</text>
      <text x="${x(i).toFixed(1)}" y="${H-P+13}" font-size="9" fill="var(--ink-2)" text-anchor="middle" font-family="Barlow,sans-serif">${p.d}</text>`).join('')}
  </svg>`;
}
/* histórico dos marcadores, com gráfico, para análise antes do relatório */
function cardHistoricoSaude(pro){
  const ex=[...(pro.exames||[])].sort((a,b)=>a.data.localeCompare(b.data));
  if(!ex.length)return'';
  const usados=[...new Set(ex.flatMap(e=>chavesExame(e)))];
  const linhas=usados.map(k=>{
    const d=marcDef(k); if(!d)return'';
    const serie=ex.filter(e=>vExame(e,k)!=null).map(e=>({v:vExame(e,k),d:brCurta(e.data)}));
    if(!serie.length)return'';
    const tr=serie.length>1?(serie[serie.length-1].v>serie[0].v?'▲':(serie[serie.length-1].v<serie[0].v?'▼':'→')):'';
    return`<div style="padding:10px 0;border-top:1px solid var(--line)">
      <div class="row"><b>${d[1]}</b> <span class="xs muted" style="margin-left:4px">${d[2]}</span><div class="grow"></div>
        <span class="small t">${serie[serie.length-1].v}</span> <span class="small" style="margin-left:6px">${tr}</span></div>
      ${serie.length>1?graficoSerie(serie,d[4]):`<div class="small t muted">${serie[0].v} <span class="xs">${serie[0].d}</span></div>`}
    </div>`;
  }).filter(Boolean).join('');
  const fl=flagsExame(ex[ex.length-1]);
  return`<div class="card"><div class="eyebrow">histórico e análise — laboratório</div>
    <p class="small muted" style="margin:4px 0">${ex.length} exame(s) · último em ${brData(ex[ex.length-1].data)}. A faixa verde é o alvo de referência.</p>
    ${linhas||'<div class="small muted">Sem valores numéricos ainda.</div>'}
    ${fl.length?`<div class="sep"></div><div class="eyebrow">pontos de atenção (último exame)</div>${fl.map(f=>`<div class="note ${f.t}" style="margin-top:8px">${f.txt}</div>`).join('')}`:''}
  </div>`;
}

const BIO_M=[['peso','Peso','kg'],['gordura','Gordura','%'],['musculo','Massa muscular','kg'],['agua','Água','%'],['visceral','Gordura visceral',''],['ossea','Massa óssea','kg'],['tmb','TMB','kcal']];
/* TMB estimada (Katch-McArdle, usa massa magra) quando o aparelho não traz */
function tmbKatch(b){ if(!b||b.peso==null||b.gordura==null)return null; const lbm=b.peso*(1-b.gordura/100); return Math.round(370+21.6*lbm); }
function tmbDe(b){ return (b&&b.tmb!=null)?b.tmb:tmbKatch(b); }
function imcDe(b){ if(!b||b.peso==null||!b.altura)return null; const h=b.altura/100; return +(b.peso/(h*h)).toFixed(1); }
/* valor de bioimpedância fisiologicamente improvável → não deve ser usado em conclusões */
function bioSuspeita(b){ if(!b)return null; if(b.gordura!=null&&b.gordura<7)return 'gordura corporal muito baixa'; const imc=imcDe(b); if(b.gordura!=null&&b.gordura<10&&imc!=null&&imc>26)return `gordura ${b.gordura}% incompatível com IMC ${imc}`; return null; }

/* ── InBody / LookinBody ───────────────────────────────────────────────────
   Nestes laudos os RÓTULOS são imagens. O texto do PDF traz os números, mas
   sem dizer o que cada um é — então `parseBio`, que procura por nome de
   marcador ("peso", "gordura"), não acha absolutamente nada. Era por isso que
   "a bioimpedância em PDF não era lida": o app achava que o arquivo estava
   ilegível quando na verdade estava cheio de dados.

   A âncora aqui é outra: cada valor é identificado pela VIZINHANÇA, que é
   estável entre laudos — a unidade (kcal), a faixa de referência (1~9), a
   régua do gráfico (10,0 15,0 18,5 … 55,0). E o que dá para conferir por
   aritmética é conferido: o peso só é aceito se bater com IMC × altura², a
   massa muscular só se estiver na proporção fisiológica do peso.

   O que não dá para identificar com segurança fica EM BRANCO. O InBody120 dá
   minerais totais, não massa óssea; converter um no outro seria inventar, e
   num dado de saúde um número errado é pior do que um campo vazio. */
function parseInBody(txt){
  const t=String(txt||'').replace(/\s+/g,' ');
  if(!/InBody|LookinBody/i.test(t))return null;
  const n=s=>s==null?null:parseFloat(String(s).replace(',','.'));
  const um=(re,g)=>{const m=t.match(re); return m?n(m[g||1]):null;};

  const altura=um(/(\d{2,3})\s*cm/);
  /* IMC e % de gordura vêm logo depois das réguas dos gráficos, que são as
     mesmas em todo laudo do aparelho */
  const imc=um(/18,5\s+22,0\s+25,0[\d,\s]*?55,0\s+(\d{1,3},\d)/);
  const gordura=um(/0,0\s+5,0\s+10,0\s+15,0[\d,\s]*?50,0\s+(\d{1,3},\d)/);
  const tmb=um(/kcal\s*[\d.,]+~[\d.,]+\s*(\d{3,5})/)??um(/(\d{3,5})\s*kcal/);
  /* a faixa da gordura visceral é sempre 1~9; o valor cai antes ou depois */
  const visceral=um(/(\d{1,2})\s+1~9/)??um(/1~9\s+(\d{1,2})/);

  /* PESO: a folha tem vários "(kg) valor (faixa)" — proteína, minerais, peso.
     Em vez de adivinhar pela ordem, escolhe o que bate com IMC × altura². */
  const esperado=(imc!=null&&altura)?imc*Math.pow(altura/100,2):null;
  const cands=[...t.matchAll(/\(kg\)\s*(\d{2,3},\d)\s*\(/g)].map(m=>n(m[1]));
  let peso=null;
  if(cands.length){
    peso=esperado!=null
      ? cands.reduce((a,b)=>Math.abs(b-esperado)<Math.abs(a-esperado)?b:a)
      : Math.max(...cands);
    if(esperado!=null&&Math.abs(peso-esperado)>2)peso=null;   /* não confere */
  }

  /* MASSA MUSCULAR ESQUELÉTICA: valor colado numa faixa de referência. A
     folha traz duas assim (muscular e massa livre de gordura); a muscular é
     a que fica entre 35% e 65% do peso — a livre de gordura passa de 85%. */
  let musculo=null;
  if(peso){
    const c=[];
    for(const m of t.matchAll(/(\d{2,3},\d)\s+\d{2,3},\d+~\d{2,3},\d+/g))c.push(n(m[1]));
    for(const m of t.matchAll(/\d{2,3},\d+~\d{2,3},\d+\s+(\d{2,3},\d)/g))c.push(n(m[1]));
    musculo=c.find(v=>v>=peso*0.35&&v<=peso*0.65)??null;
  }

  /* ÁGUA: o aparelho dá litros; o app guarda % do peso */
  let agua=null;
  const mL=t.match(/\(L\)\s*(\d{2,3},\d)?\s*\(\s*[\d,]+~[\d,]+\s*\)\s*(\d{2,3},\d)?/);
  const tbw=mL?(mL[1]!=null?n(mL[1]):(mL[2]!=null?n(mL[2]):null)):null;
  if(tbw!=null&&peso)agua=+(tbw/peso*100).toFixed(1);

  const md=t.match(/(\d{2})\.(\d{2})\.(\d{4})\./);   /* 12.08.2026. */
  /* A folha de ACOMPANHAMENTO é outro documento: só gráficos de tendência,
     com os números soltos e sem rótulo. Não dá para ler medida nenhuma dela
     com segurança — e a data que aparece é a da PRIMEIRA avaliação da série,
     que preencher seria pior do que deixar vazio. */
  const historico=/Todos os resultados dos exames|Recente:\s*At[ée]/i.test(t)
    || (peso==null&&gordura==null&&tmb==null);
  return {peso,gordura,musculo,agua,visceral,ossea:null,tmb,
          altura:historico?null:altura,
          data:historico?null:(md?`${md[3]}-${md[2]}-${md[1]}`:null),
          historico,fonte:'InBody'};
}
function parseBio(txt){
  const t=txt.replace(/\s+/g,' ');
  const cap=(nomes)=>{ for(const nome of nomes){ const m=t.match(new RegExp(nome+'[^0-9]{0,30}?(\\d{1,4}(?:[.,]\\d{1,2})?)','i')); if(m){const v=parseFloat(m[1].replace(',','.')); if(!isNaN(v))return v;} } return null; };
  return {peso:cap(['peso']),gordura:cap(['gordura\\s*corporal','percentual\\s*de\\s*gordura','%\\s*gordura','gordura']),
    musculo:cap(['massa\\s*muscular','massa\\s*magra','m[uú]sculo']),agua:cap(['[aá]gua\\s*corporal','[aá]gua']),
    visceral:cap(['gordura\\s*visceral','visceral']),ossea:cap(['massa\\s*[oó]ssea']),
    tmb:cap(['metab[oó]lica\\s*basal','taxa\\s*metab','\\btmb\\b','metabolismo\\s*basal'])};

/* laudo consolidado: liga saúde + composição + treino/desempenho e prioriza ações */
/* ── JANELAS: a leitura curta e a reconciliação das duas ────────────────────
   Todo número do relatório fala de uma janela, e janelas diferentes podem
   apontar para lados diferentes sem que nenhuma esteja errada. Estas duas
   funções existem para que o relatório DIGA de qual janela cada leitura veio,
   em vez de deixar o atleta descobrir sozinho que "↑" e "abaixo da base" não
   estavam medindo a mesma coisa. */
function tendCurtaPct(comPct){
  const pts=(comPct||[]).map(x=>({data:x.data,v:x.pct}));
  if(pts.length<6)return null;
  const a=janelaStat(pts,0,7,'avg'), b=janelaStat(pts,7,28,'avg');
  if(a==null||b==null||!(b>0))return null;
  const h0=new Date(hoje()+'T00:00:00');
  const n=pts.filter(p=>{const d=(h0-new Date(p.data+'T00:00:00'))/86400000;return d>=0&&d<7}).length;
  if(n<3)return null;              /* 1 ou 2 tiros na semana não é leitura, é ruído */
  const dp=(a-b)/b*100;
  return{pct:+dp.toFixed(1),dir:dp>2?'↑':dp<-2?'↓':'→',atual:Math.round(a),base:Math.round(b),n};
}
/* Reconciliação das duas janelas, em duas formas. `linha` é a nota de rodapé do
   detalhamento, e sai sempre: lá o leitor quer o número. `nota` é a caixa de
   aviso da síntese, e só sai quando as janelas DE FATO divergem — caixa que
   aparece em todo relatório vira paisagem e ninguém lê. */
function notaJanelas(tend,forma){
  if(!tend||!tend.curto)return'';

  const longa=`A <b>tendência ${tend.dir}</b> vem do ${tend.janela}.`;
  const curta=`A <b>leitura curta</b> compara os seus tiros dos <b>últimos 7 dias</b> (%PB médio ${c.atual}%, ${c.n} tiro${c.n>1?'s':''}) com os <b>21 dias anteriores</b> (${c.base}%): <b style="color:${c.dir==='↑'?'var(--ok)':c.dir==='↓'?'var(--clock)':'var(--ink-2)'}">${c.pct>=0?'+':''}${c.pct}%</b>.`;
  if(forma==='linha'||!tend.divergencia)
    return`<div class="xs muted" style="margin-top:8px">${longa} ${curta} ${tend.divergencia
      ? 'As duas <b>divergem</b> — e podem estar as duas certas: são intervalos diferentes. Para decidir a semana vale a curta; para saber se a preparação funciona, a longa.'
      : 'As duas apontam para o mesmo lado.'}</div>`;
  return`<div class="note" style="margin-top:10px"><b>Duas leituras, duas janelas — e elas divergem.</b>
    ${longa} ${curta}
    As duas podem ser verdadeiras ao mesmo tempo: ${tend.dir==='↑'
      ? 'você está mais rápido do que <b>era</b>, e mais lento do que <b>estava</b> neste mês'
      : 'você vem abaixo do seu melhor histórico, mas a semana aponta para cima'}.

/* ── ESTADO DE PERFORMANCE (Prontidão · Capacidade · Tendência) ──────────────
   Modelo transparente a partir dos dados que já existem no app. */
function estadoPerformance(pro,comPct,sem){
  const md=(a,k)=>a.reduce((t,x)=>t+x[k],0)/Math.max(1,a.length);
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  /* Prontidão 0–100 (VFC/FC repouso/sono/carga) — extraída para prontidaoGarmin,
     porque o snapshot do técnico também precisa dela.
     Fallbacks, nesta ordem: (1) Garmin do próprio atleta; (2) placar que veio
     no snapshot (é o caso do TÉCNICO: ele não recebe os dados de Saúde, só o
     número — sem isso a dimensão "Recuperação" da assinatura de sprint saía
     como "s/ dado", justamente o que ele mais precisa para montar a semana);
     (3) check-in subjetivo, para quem não usa relógio. */
  let pr=prontidaoGarmin(pro,sem);
  if(!pr&&pro&&pro._pront&&pro._pront.score!=null)
    pr={score:pro._pront.score,mot:[],dias:pro._pront.dias||0,fonte:pro._pront.fonte||null};
  if(!pr&&!S.laudoAtleta&&typeof prontidaoSubj==='function'){
    const p=prontidaoSubj(7);
    if(p&&p.media!=null)pr={score:p.media,mot:[],dias:p.n||0,fonte:'check-in'};
  }
  /* Velocidade média: %PB MÉDIO dos últimos 15 tiros, de TODAS as provas. Não
     confundir com o eixo Velocidade do radar, que é a média dos MELHORES 20%
     das provas-alvo. Mesma fórmula (PB ÷ tempo × 100, onde mais rápido = maior),
     recortes diferentes -- e os rótulos agora dizem qual é qual. */
  let cap=null;
  if(comPct.length){const a=comPct.slice(-15);cap={score:Math.round(cl(md(a,'pct'),0,100)),n:a.length};}
  /* Tendência: evolução em competição PONDERADA PELA MAGNITUDE + tendência do %PB.
     Antes contava só quantas provas melhoraram/pioraram; agora usa o TAMANHO da melhora
     (% de queda de tempo por prova), então cair 2 s pesa mais que cair 1 centésimo. */
  let tend=null;
  const ev=(typeof evolucaoProvas==='function')?evolucaoProvas(pro):[];
  /* LEITURA CURTA (%PB dos últimos 7 dias contra os 21 anteriores).
     A tendência longa responde "estou mais rápido do que eu era"; ela compara
     cada prova com a PRIMEIRA vez que foi nadada, sem janela, então pode vir ↑
     num mês em que tudo piorou. A curta responde "estou mais rápido do que eu
     estava neste mês". Sem as duas, o relatório mostrava ↑ ao lado de %PB
     abaixo da base e parecia estar se contradizendo — não estava, mas também
     não dizia de que janela cada número falava. */
  const curto=tendCurtaPct(comPct);
  const net=ev.filter(e=>e.melhora).length-ev.filter(e=>!e.melhora).length;   /* contagem (só p/ referência) */
  /* % média de melhora nas competições: (primeiro − último)/primeiro · +=melhorou */
  const mps=ev.map(e=>{const f=e.pts&&e.pts[0]?e.pts[0].v:null,l=e.pts&&e.pts.length?e.pts[e.pts.length-1].v:null;return (f&&l&&f>0)?(f-l)/f*100:0;});
  const magProvas=mps.length?mps.reduce((a,b)=>a+b,0)/mps.length:0;
  let pc=0;
  if(comPct.length>=4){const hf=Math.floor(comPct.length/2);pc=md(comPct.slice(hf),'pct')-md(comPct.slice(0,hf),'pct');}
  /* score contínuo, em "% equivalente": competição pesa cheio; tendência de treino, metade */
  const mag=magProvas+pc*0.5;
  const dir=mag>0.4?'↑':mag<-0.4?'↓':'→';   /* zona morta de 0,4% evita oscilar à toa */
  if(ev.length||comPct.length>=4){
    const detalhe=ev.length?`${magProvas>=0?'+':''}${magProvas.toFixed(1)}% em prova`:`%PB ${pc>=0?'+':''}${pc.toFixed(1)}`;
    const janela=ev.length
      ? `histórico completo de ${ev.length} prova${ev.length>1?'s':''} — cada uma comparada com a primeira vez que você a nadou`
      : `%PB dos ${comPct.length} tiros da janela de análise`;
    tend={dir,
      txt:dir==='↑'?'capacidade melhorando':dir==='↓'?'capacidade em queda — atenção':'capacidade estável',
      cor:dir==='↑'?'var(--ok)':dir==='↓'?'var(--clock)':'var(--ink-2)',
      net,magProvas:+magProvas.toFixed(1),pc:+pc.toFixed(1),mag:+mag.toFixed(1),detalhe,
      janela,curto,
      divergencia:!!(curto&&curto.dir!=='→'&&dir!=='→'&&curto.dir!==dir),
      nEv:ev.length,nPct:comPct.length};
  }
  return {pr,cap,tend};
}
function cardEstado(pro,comPct,sem){
  const e=estadoPerformance(pro,comPct,sem);
  if(!e.pr&&!e.cap&&!e.tend)return'';
  const kpi=(v,l,cor)=>`<div class="kpi"><div class="v"${cor?` style="color:${cor}"`:''}>${v}</div><div class="l">${l}</div></div>`;
  const corPr=e.pr?(e.pr.score>=75?'var(--ok)':e.pr.score<55?'var(--clock)':''):'';
  return`<div class="card"><div class="eyebrow">estado de performance</div>
    <div class="grid3" style="margin-top:8px">
      ${kpi(e.pr?e.pr.score:'—','prontidão',corPr)}
      ${kpi(e.cap?e.cap.score+'%':'—','capacidade')}
      ${kpi(e.tend?e.tend.dir:'—','tendência (histórico)',e.tend?e.tend.cor:'')}
    </div>
    ${notaJanelas(e.tend,'linha')}
    ${e.pr&&e.pr.mot.length?`<div class="small" style="margin-top:10px"><b>Prontidão</b> — ${e.pr.mot.map(m=>`${m.txt} <b style="color:${m.c>=0?'var(--ok)':'var(--clock)'}">${m.c>=0?'+':''}${Math.round(m.c)}</b>`).join(' · ')}</div>`:''}
    ${(function(){const cf=(n,a,m)=>n>=a?{t:'alta',c:'var(--ok)'}:n>=m?{t:'média',c:''}:{t:'baixa',c:'var(--clock)'};
      const ps=[]; if(e.pr){const c=cf(e.pr.dias,14,7);ps.push(`Prontidão <b style="color:${c.c}">${c.t}</b> <span class="xs muted">(${e.pr.dias} dias de VFC/FC)</span>`);}
      if(e.cap){const c=cf(e.cap.n,12,6);ps.push(`Capacidade <b style="color:${c.c}">${c.t}</b> <span class="xs muted">(${e.cap.n} tiros)</span>`);}
      if(e.tend){const base=Math.max(e.tend.nEv,e.tend.nPct>=8?2:e.tend.nPct>=4?1:0);const c=cf(base,3,1);ps.push(`Tendência <b style="color:${c.c}">${c.t}</b>`);}
      return ps.length?`<div class="small" style="margin-top:8px"><b>Confiança</b> — ${ps.join(' · ')}</div>`:'';})()}
    <div class="xs muted" style="margin-top:8px"><b>Prontidão</b>: quão pronto seu corpo está hoje (VFC, FC de repouso, sono, carga). <b>Velocidade média</b>: média de %PB dos seus <b>últimos 15 tiros</b>, de todas as provas. É diferente do eixo <b>Velocidade</b> da assinatura de sprint, que usa só os <b>melhores 20%</b> dos tiros <b>das provas-alvo</b> — dois recortes do mesmo cálculo, por isso os números não batem. <b>Tendência</b>: se vem melhorando ou caindo — é a única leitura que olha o <b>histórico inteiro</b> de competições, não a janela de análise.${e.tend?' '+e.tend.txt+'.':''} <span class="muted">Estimativa de apoio; a confiança sobe conforme você acumula dados.</span></div>
  </div>`;
}
/* Carga aguda × crônica (ACWR): volume dos últimos 7 dias / média semanal em 28 dias.
   Só conta treino marcado como feito. */
function cargaACWR(){
  const h0=new Date(hoje()+'T00:00:00');
  /* treino pessoal nao tem lista `para` (nao foi atribuido a ninguem, e do
     proprio) — sem esta clausula o ACWR saia nulo justamente para o atleta
     sem equipe, que e quem mais depende dele */
  const meus=S.tridx.filter(t=>t.data&&(t._pessoal||(t.para||[]).includes(S.u.id)));
  const dias=t=>Math.floor((h0-new Date(t.data+'T00:00:00'))/86400000);
  let ag=0,cr28=0;
  for(const t of meus){const d=dias(t); if(d<0)continue;
    if(d<7)ag+=(t.vol||0);
    if(d<28)cr28+=(t.vol||0);}
  const cr=cr28/4;
  if(cr<=0)return null;
  return {ag,cr:Math.round(cr),acwr:ag/cr};
}
/* Estima a composição de forma transparente. O peso é sempre real (balança).
   Se a gordura% do aparelho for plausível (8–45%), usa-a; senão ESTIMA a partir de
   idade/sexo (+ altura via Deurenberg, quando houver), porque a bioimpedância do
   atleta costuma ler gordura baixa demais. Score com TETO 90 (nunca "100/perfeito"). */
function composicaoEstim(pro){
  const bio=[...(pro.bioimp||[])].filter(b=>b.peso!=null).sort((a,b)=>a.data.localeCompare(b.data));
  if(!bio.length)return null;
  const ult=bio[bio.length-1];
  const idade=(typeof anos==='function'&&S.u)?(anos(S.u)||42):42;
  const sexoF=!!(S.u&&S.u.store&&S.u.store.sexo==='feminino');
  const plausivel=g=>g!=null&&g>=5&&g<=45;      // atleta muito magro (5%) é real
  let gord=ult.gordura, estimada=false, motivo='', fonte='medida';
  if(!plausivel(gord)){
    estimada=true;
    if(ult.agua!=null&&ult.agua>=45&&ult.agua<=80){
      /* a % de gordura do aparelho lê baixo demais, mas a ÁGUA é confiável:
         massa magra ≈ água corporal ÷ 0,732 (hidratação) → gordura por diferença. */
      gord=100*(1-(ult.agua/100)/0.732); fonte='água corporal';
      motivo=`a gordura% do aparelho (${ult.gordura}%) é implausível; estimada pela sua água corporal (${ult.agua}%)`;
    } else {
      gord=(sexoF?20:12)+(Math.max(30,idade)-30)*0.25; fonte='idade/sexo';
      motivo='a gordura% do aparelho é implausível; estimada por idade/sexo';
    }
    gord=Math.max(sexoF?12:5, Math.min(sexoF?32:24, gord));
  }
  gord=+gord.toFixed(1);
  const massaMagra=+(ult.peso*(1-gord/100)).toFixed(1);
  /* QUARENTENA. O relatório já dizia, em texto, "não estou usando esses números
     nas conclusões" — e logo abaixo exibia Composição 87/100 na assinatura de
     sprint, derivada justamente do valor recusado. As duas coisas não podiam
     ser verdade ao mesmo tempo.
       medida        → a gordura% do aparelho é plausível: alimenta score.
       água corporal → massa magra por água (TBW ÷ 0,732) é método aceito, mas é
                       uma ESTIMATIVA: mostramos o número e não geramos score.
       idade/sexo    → é tabela demográfica, não medição deste atleta: suspeito.
     `usavelParaScore` é o que o motor consulta; o número continua visível. */
  const status=!estimada?'medida':(fonte==='água corporal'?'estimada':'suspeita');
  const usavelParaScore=status==='medida';
  const score=usavelParaScore?Math.round(Math.max(0,Math.min(90,92-(gord-6)*3))):null;   // teto 90 (nunca "perfeito")
  return {peso:ult.peso,data:ult.data,gordura:gord,estimada,fonte,motivo,massaMagra,
    status,usavelParaScore,score,imc:imcDe(ult),tmb:tmbDe(ult)};
}
/* Composição × desempenho: massa magra + relação peso/potência (tempo/peso) */
function cardComposicaoRelativa(pro){

  const prefer=Object.entries(pro.pbs||{}).find(([k])=>/^50 /.test(k));

    <div class="grid3" style="margin-top:8px">

      <div class="kpi"><div class="v">${c.massaMagra}<span class="xs muted"> kg</span></div><div class="l">massa magra</div></div>

      ${c.fonte==='água corporal'

        :'Fórmula: tabela por idade e sexo — não é uma medição sua.'}
      <span class="xs muted" style="display:block;margin-top:4px">Valor original do aparelho preservado no registro, para auditoria. Estimativa <b>não alimenta score, radar nem projeção</b>. Com uma medição confiável (dobras ou DEXA) registrada, o app passa a usá-la.</span></div>`:''}
    ${/* Sem evidência individual, recomendar perda de peso é extrapolar. O app
         mede tempo e composição; não mediu, NESTE atleta, que um kg a menos

    <div class="xs muted" style="margin-top:6px">Massa magra = peso × (1 − %gordura). <b>O app não recomenda perda de peso</b>: não há, no seu histórico, medição que ligue variação de peso a variação de tempo. Composição aqui é descrição, não meta — mudanças de peso em atleta master são assunto do técnico e de nutricionista.</div>

  </div>`;

/* ── CORRELAÇÕES: cruza o histórico do próprio atleta ──────────────────────── */
function garminNaData(pro,dataISO,campo){
  const g=(pro.garmin||[]).filter(x=>x[campo]!=null);
  let best=null,bd=99;
  for(const x of g){const d=Math.abs((new Date(dataISO)-new Date(x.data))/86400000); if(d<=3&&d<bd){bd=d;best=x[campo];}}
  return best;
}
function correlacoes(pro,comPct){
  const out={rec:null,carga:null};
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  /* Recuperação × desempenho: %PB por estado de VFC no dia do tiro */
  const hrvAll=(pro.garmin||[]).filter(x=>x.hrv!=null).map(x=>x.hrv);
  if(hrvAll.length>=6&&comPct.length>=6){
    const base=avg(hrvAll), b={bom:[],neutro:[],ruim:[]};
    for(const e of comPct){const hv=garminNaData(pro,e.data,'hrv'); if(hv==null)continue; const dev=(hv-base)/base*100; (dev>4?b.bom:dev<-4?b.ruim:b.neutro).push(e.pct);}
    if(b.bom.length>=2||b.ruim.length>=2){
      const rB=avg(b.bom),rR=avg(b.ruim);
      out.rec={bom:{n:b.bom.length,pct:avg(b.bom)},neutro:{n:b.neutro.length,pct:avg(b.neutro)},ruim:{n:b.ruim.length,pct:avg(b.ruim)},
        insight:(b.bom.length>=2&&b.ruim.length>=2&&rB!=null&&rR!=null)?(rB-rR>1.5?`Com recuperação boa você nada em média <b>${(rB-rR).toFixed(0)}%</b> mais perto do seu melhor tempo do que com recuperação ruim.`:'Sem diferença clara entre recuperação boa e ruim ainda.'):null};
    }
  }
  /* Carga × desempenho: %PB médio por faixa de carga semanal */
  const semKey=d=>{const dt=new Date(d+'T00:00:00'),on=new Date(dt);on.setDate(dt.getDate()-((dt.getDay()+6)%7));return on.toISOString().slice(0,10);};
  const loadSem={},pctSem={};
  for(const t of S.tridx.filter(t=>(t.para||[]).includes(S.u.id)&&t.data))loadSem[semKey(t.data)]=(loadSem[semKey(t.data)]||0)+(t.vol||0);
  for(const e of comPct){const k=semKey(e.data);(pctSem[k]=pctSem[k]||[]).push(e.pct);}
  const semanas=Object.keys(pctSem).map(k=>({load:loadSem[k]||0,pct:avg(pctSem[k])})).filter(s=>s.load>0);
  if(semanas.length>=4){
    semanas.sort((a,b)=>a.load-b.load);
    const t=Math.ceil(semanas.length/3), bx=[semanas.slice(0,t),semanas.slice(t,2*t),semanas.slice(2*t)];
    const faixas=bx.map((b,i)=>({nome:['baixa','média','alta'][i],load:avg(b.map(x=>x.load)),pct:avg(b.map(x=>x.pct)),n:b.length})).filter(f=>f.pct!=null);
    if(faixas.length>=2)out.carga={faixas,melhor:faixas.slice().sort((a,b)=>b.pct-a.pct)[0]};
  }
  return out;
}
function cardCorrelacoes(pro,comPct){
  const c=correlacoes(pro,comPct);
  if(!c.rec&&!c.carga)return'';
  let html=`<div class="card" data-dom="perf"><div class="eyebrow">correlações</div>`;
  if(c.rec){const r=c.rec, lin=(nome,o)=>o&&o.n>=2?`<tr><td>${nome}</td><td class="n">${o.n}</td><td class="n" style="font-weight:700">${o.pct.toFixed(0)}%</td></tr>`:'';
    html+=`<h3 style="margin:8px 0 4px">Recuperação × desempenho</h3>
      <table><thead><tr><th>recuperação</th><th class="n">tiros</th><th class="n">%PB méd</th></tr></thead><tbody>${lin('boa',r.bom)}${lin('neutra',r.neutro)}${lin('ruim',r.ruim)}</tbody></table>
      ${r.insight?`<div class="note" style="margin-top:8px">${r.insight}</div>`:''}`;}
  if(c.carga){const cg=c.carga;
    html+=`<h3 style="margin:12px 0 4px">Carga × desempenho</h3>
      <table><thead><tr><th>carga semanal</th><th class="n">volume</th><th class="n">%PB méd</th></tr></thead><tbody>
      ${cg.faixas.map(f=>`<tr><td>${f.nome}</td><td class="n">${(f.load/1000).toFixed(1)}k</td><td class="n" style="font-weight:700">${f.pct.toFixed(0)}%</td></tr>`).join('')}</tbody></table>
      ${cg.melhor?`<div class="note" style="margin-top:8px">Melhor %PB observado na faixa de carga <b>${cg.melhor.nome}</b> (~${(cg.melhor.load/1000).toFixed(1)}k/semana). <b>Associação observada</b> — os dados ainda não bastam para estabelecer uma faixa ótima individual.</div>`:''}`;}
  /* FASE 8 — a tabela trazia n e média; faltava a DISPERSÃO. Duas faixas com
     a mesma média e espalhamentos diferentes não dizem a mesma coisa, e sem
     isso a leitura vira "esta faixa é melhor" a partir de ruído. */
  const disp=(o)=>o&&o.dp!=null?` ±${o.dp.toFixed(1)}`:'';
  html+=`<div class="xs muted" style="margin-top:8px">Cruzamentos do seu próprio histórico. <b>n</b> é o número de tiros em cada faixa — compare as médias só quando os dois lados tiverem amostra parecida. Diferença de poucos pontos entre faixas com n pequeno é ruído, não efeito. <b>É associação, nunca causa</b>: o que separa as faixas não é só a carga.
    <br><b>Estratificação:</b> estes cruzamentos juntam tiros de <b>todas</b> as suas provas, normalizados em %PB. São leitura geral de treino — <b>não</b> são tendência de uma prova específica. Para ver prova a prova, use a projeção, as parciais e a evolução, que separam distância, estilo e piscina.</div></div>`;
  return html;
}
/* ── BASELINE INDIVIDUAL MÓVEL ──────────────────────────────────────────────
   Compara o valor recente de cada variável com a linha de base do atleta. */
function baselineSerie(pts,janela,recentes){
  if(!pts||!pts.length)return null;
  const s=[...pts].sort((a,b)=>b.data.localeCompare(a.data));
  const h0=new Date(hoje()+'T00:00:00'), dd=d=>(h0-new Date(d+'T00:00:00'))/86400000;
  const at=s.slice(0,recentes||3), base=s.filter(p=>dd(p.data)<(janela||28));
  if(!at.length||base.length<3)return null;
  const avg=a=>a.reduce((t,x)=>t+x.v,0)/a.length;
  const a=avg(at), b=avg(base);
  /* FAIXA HABITUAL (média ± 1 desvio da janela). "VFC 42 ms → −1%" não diz se
     42 é normal PARA ESTA PESSOA: −1% pode ser ruído num indicador que oscila
     8% ao dia, e pode ser muito num que oscila 1%. A faixa é o que transforma
     o número em leitura. */
  const vs=base.map(p=>p.v);
  const sd=vs.length>1?Math.sqrt(vs.reduce((t,x)=>t+(x-b)*(x-b),0)/(vs.length-1)):0;
  const lo=b-sd, hi=b+sd;
  return {atual:a,base:b,lo,hi,sd,
    status: sd>0?(a<lo?'abaixo':a>hi?'acima':'normal'):'normal',
    desvio:b?(a-b)/b*100:0,n:base.length,
    ultimo:s[0]?s[0].data:null};
}
/* ── FASE 10 — IDADE DOS DADOS ─────────────────────────────────────────────
   Dado velho não é dado ruim: ele continua valendo para histórico. O que ele
   não pode é pesar como se fosse de hoje na leitura do ESTADO ATUAL. Cada
   fonte tem o seu próprio prazo, porque elas mudam em ritmos diferentes — VFC
   muda todo dia, bioimpedância não muda em uma semana, exame menos ainda. */
/* Os prazos saem da VELOCIDADE DE MUDANÇA de cada medida, não de preferência:
   uma fonte deixa de descrever o presente quando o que ela mede já mudou.
     tiros   — forma específica se altera em semanas; 14 d é cerca de um
               microciclo e meio.
     carga   — a janela aguda do próprio modelo é de 7 dias.
     relógio — VFC e FC de repouso variam dia a dia; 3 d já é média curta.
     bioimp  — composição corporal em atleta em treino muda de forma
               mensurável na escala de 4 a 12 semanas, que é o intervalo
               usual de reavaliação em acompanhamento esportivo. Abaixo de ~4
               semanas o que se mede costuma ser variação de hidratação, não
               de tecido — por isso remedir toda semana não aumenta precisão.
     exames  — hemograma e perfil de ferro em atleta de resistência costumam
               ser acompanhados a cada 6 meses, e o painel geral anualmente.
   São FAIXAS DE ACOMPANHAMENTO, não prescrição: a periodicidade de exame
   quem define é o médico, e a de bioimpedância depende do protocolo do
   aparelho (jejum, hidratação, sem treino antes). */
const FRESCOR=[
  {id:'tiros',   rot:'Performance (tiros)', atual:14, parcial:42,
    nota:'Forma específica muda em semanas.'},
  {id:'carga',   rot:'Carga de treino',     atual:7,  parcial:28,
    nota:'Janela aguda do modelo é de 7 dias.'},
  {id:'garmin',  rot:'Relógio (VFC/FC/sono)',atual:3,  parcial:14,
    nota:'VFC e FC de repouso variam dia a dia.'},
  {id:'bio',     rot:'Bioimpedância',       atual:90, parcial:180,
    nota:'Reavaliar a cada 4–12 semanas. Repetir em menos de 4 semanas mede hidratação, não tecido — e sempre no mesmo protocolo (jejum, hidratado, sem treino antes).'},
  {id:'exames',  rot:'Exames laboratoriais',atual:190,parcial:400,
    nota:'Perfil de ferro em atleta de resistência costuma ser semestral; painel geral, anual. Quem define é o médico.'}
];
function frescorDados(pro,comPct){
  const h0=new Date(hoje()+'T00:00:00');
  const dias=d=>d?Math.floor((h0-new Date(d+'T00:00:00'))/86400000):null;
  const ult=a=>{const v=(a||[]).map(x=>x&&x.data).filter(Boolean).sort(); return v.length?v[v.length-1]:null};
  const fontes={
    tiros: ult(comPct),
    carga: ult([...(SESSOES||[]),...((pro.seco||[]).filter(s=>s.rpe!=null&&s.dur))]),
    garmin: ult(pro.garmin),
    bio: ult(pro.bioimp),
    exames: ult(pro.exames)
  };
  return FRESCOR.map(f=>{
    const d=fontes[f.id], k=dias(d);
    return{...f,data:d,dias:k,
      uso: k==null?'sem dado':(k<=f.atual?'estado atual':(k<=f.parcial?'peso reduzido':'só histórico'))};
  });
}
function cardFrescor(pro,comPct){
  const rs=frescorDados(pro,comPct);
  const cor=u=>u==='estado atual'?'var(--ok)':u==='peso reduzido'?'var(--rope-ink)':u==='sem dado'?'var(--ink-3)':'var(--clock)';
  const linhas=rs.map(r=>`<tr><td>${r.rot}${r.nota?`<div class="xs muted" style="font-weight:400">${r.nota}</div>`:''}</td>

     piscina da prova é `predicao`, usando o PB daquela piscina. O problema era

      ? `Você tem <b>${t.semBase.length} prova(s)</b> de ${esc(nome)} registrada(s), mas <b>nenhum tiro lançado antes delas</b> — a mais recente é de ${brData(t.semBase[t.semBase.length-1])}. A conversão compara o que você nadou na prova com o que vinha nadando no treino; sem o lado do treino não há o que comparar, e estimar por cima disso seria inventar a metade que falta. A partir das próximas competições, com os tiros que você já vem registrando, o número aparece sozinho.`
      : `Ainda não dá para medir a sua conversão: é preciso ter, na mesma prova, um resultado de competição <b>e</b> tiros registrados antes dele. Registre as competições em <b>Marcas</b>.`}</p></div>`;
  const sinal=v=>(v>0?'+':'')+v.toFixed(1)+'%';
  const est=t.estagio;
  const leitura=t.soOutraPiscina
    ? `<b>Comparação descritiva, não conversão.</b> As ${t.n} prova(s) aqui só têm tiro de referência em <b>piscina diferente</b> da prova. Num sprint a virada da piscina curta vale décimos, então este número descreve o que aconteceu — não serve para projetar. Registre um tiro de ${esc(nome)} na mesma piscina e ele vira conversão de verdade.`
    : est.chave==='sinal'
    ? `<b>Evidência insuficiente — uma observação.</b> Nesta prova você competiu <b>${sinal(t.mediana)}</b> em relação ao seu melhor tiro das 6 semanas anteriores. Um ponto não define a sua conversão.`
    : `<b>Você compete ${sinal(t.mediana)}</b> em relação ao seu melhor tiro das 6 semanas anteriores (mediana de ${t.n} prova(s) comparável(is); metade entre ${sinal(t.p25)} e ${sinal(t.p75)}).${est.forte?' Com esta amostra já dá para usar como referência.':' '+est.rotulo+' — ainda sensível a uma prova atípica.'}`;
  const linhas=t.itens.slice(0,8).map(x=>`<tr><td class="small">${brCurta(x.data)}${x.qualidade!=='direta'?`<div class="xs muted">${x.qualidade}</div>`:''}</td>
    <td class="n">${fmt(x.treino,true)}${x.pisTiro&&x.pisTiro!==ref.pis?`<div class="xs muted">${x.pisTiro}</div>`:''}</td><td class="n">${fmt(x.prova,true)}</td>
    <td class="n" style="color:${x.pct<=0?'var(--ok)':(x.pct>3?'var(--clock)':'var(--ink-2)')}">${sinal(x.pct)}</td></tr>`).join('');
  /* ── P2-A/B — custo da segunda metade, ESTRATIFICADO ─────────────────────
     Antes: `brk` traz TODO tiro de 50 dos últimos 120 dias, de qualquer
     estilo e qualquer piscina, e isso era comparado com a prova de peito.
     Um 50 livre em piscina curta entrava na conta do 50 peito em piscina
     longa. Agora os dois lados são da mesma distância, estilo e piscina. */
  let cmp='';
  if(ref.d===50||ref.d===100){
    const pp=parciaisProva(pro,ref.d,ref.e,ref.pis);
    const tre=metadesTreino(comPct,ref.d,ref.e,ref.pis,120);
    const meio=ref.d/2;
    if(pp.suportada&&pp.n&&tre){
      /* agrega só DENTRO de uma origem; com mais de uma, usa a mais confiável
         e diz quantas ficaram de fora */
      const ord=['oficial','manual','nd'].filter(o=>pp.porOrigem[o]);
      const usa=ord[0], st=pp.porOrigem[usa];
      const dt=tre.difMedia, dp=st.difMedia;
      cmp=`<div class="sep"></div><div class="eyebrow">custo da segunda metade — ${meio}m + ${meio}m</div>
        <div class="grid2" style="margin-top:8px">
          <div class="kpi"><div class="v">${dt>=0?'+':''}${fmt(Math.abs(dt),true)}</div><div class="l">no treino (${tre.n} tiros)</div></div>
          <div class="kpi"><div class="v">${dp>=0?'+':''}${fmt(Math.abs(dp),true)}</div><div class="l">na prova (${st.n})</div></div>
        </div>
        <div class="xs muted" style="margin-top:6px">${Math.abs(dp-dt)<150?'A queda da segunda metade se comporta na prova como no treino.'
          :(dp>dt?`Na prova a segunda metade custa <b>${fmt(dp-dt,true)} a mais</b> que no treino — a manutenção de velocidade cede mais em competição.`
                 :`Na prova a segunda metade custa <b>${fmt(dt-dp,true)} a menos</b> que no treino.`)} <i>Leitura para o técnico.</i></div>
        <div class="xs muted" style="margin-top:4px"><b>Comparabilidade:</b> os dois lados são ${ref.d}m ${esc(ref.e)} em piscina ${ref.pis==='LC50'?'longa':'curta'}. Parciais de prova: <b>${ORIGEM_PARC[usa]}</b>${ord.length>1?` (${pp.n-st.n} de outra origem ficaram fora desta média)`:''}. <b>A saída não é equivalente</b> — borda no treino, bloco na prova —, por isso os dois números são descritos lado a lado e <b>não</b> convertidos um no outro.</div>`;
    }else if(pp.suportada&&pp.n&&!tre){
      cmp=`<div class="sep"></div><div class="eyebrow">custo da segunda metade — ${meio}m + ${meio}m</div>
        <div class="small muted" style="margin-top:6px">Você tem <b>${pp.n} prova(s)</b> de ${ref.d}m ${esc(ref.e)} ${ref.pis} com parcial registrada, mas <b>nenhum tiro de treino desta mesma prova e piscina com parcial</b> nos últimos 120 dias. Sem os dois lados comparáveis, o app não calcula a diferença — lançar a parcial de 25m num tiro de ${ref.d} já resolve.</div>`;
    }
  }
  return`<div class="card" data-dom="prova" id="c-transf"><div class="eyebrow">treino → prova — ${esc(nome)}</div>
    <div class="grid3" style="margin-top:8px">
      <div class="kpi"><div class="v">${sinal(t.mediana)}</div><div class="l">conversão (mediana)</div></div>
      <div class="kpi"><div class="v" style="opacity:.75">${sinal(t.p25)} / ${sinal(t.p75)}</div><div class="l">quartis</div></div>
      <div class="kpi"><div class="v">${t.n}</div><div class="l">prova(s)</div></div>
    </div>
    <div class="small" style="margin-top:8px">${leitura}</div>
    <table style="margin-top:10px"><thead><tr><th>prova</th><th class="n">melhor tiro</th><th class="n">competição</th><th class="n">conversão</th></tr></thead>
      <tbody>${linhas}</tbody></table>
    ${cmp}
    ${t.nOutraPiscina&&!t.soOutraPiscina?`<div class="note" style="margin-top:8px"><b>${t.nOutraPiscina} prova(s) fora da mediana.</b> O único tiro de referência delas é de piscina diferente da prova, e piscina curta tem uma virada que a longa não tem. Elas continuam listadas acima, marcadas, mas não entram no número — misturar as duas piscinas numa só conversão esconde justamente o que diferencia as provas.</div>`:''}
    ${/* P2-C — CRITÉRIOS DE COMPARABILIDADE, à vista. O número só vale se o
         leitor souber o que foi casado e o que não foi. */''}
    <details class="xs" style="margin-top:8px"><summary class="muted">critérios de comparabilidade desta conversão</summary>
      <table style="margin-top:6px"><tbody>
        <tr><td style="width:42%"><b>Distância</b></td><td class="muted">igual dos dois lados (${ref.d} m) — obrigatório.</td></tr>
        <tr><td><b>Estilo</b></td><td class="muted">igual dos dois lados (${esc(ref.e)}) — obrigatório.</td></tr>
        <tr><td><b>Piscina</b></td><td class="muted">${t.nComparavel?`${t.nComparavel} prova(s) com tiro na mesma piscina (${ref.pis}).`:'nenhuma prova com tiro na mesma piscina.'}${t.nOutraPiscina?` ${t.nOutraPiscina} com tiro de piscina diferente, marcada(s) e fora da mediana.`:''}</td></tr>
        <tr><td><b>Janela</b></td><td class="muted">6 semanas antes da prova. Sem tiro nela, o app amplia para 90 dias e rotula a linha — a conversão de janela ampliada vale menos.</td></tr>
        <tr><td><b>Saída</b></td><td class="muted"><b>Não equivalente.</b> Treino sai da borda, prova sai do bloco. Esta é a razão de a conversão ser <b>negativa</b> na maioria dos atletas, e o motivo de ela ser medida em vez de estimada.</td></tr>
        <tr><td><b>Tipo de esforço</b></td><td class="muted">pernada, braçada, técnica e filipina já saem antes de chegar aqui. Tiro com equipamento só é separável quando foi anotado na série.</td></tr>
        <tr><td><b>Natureza do registro</b></td><td class="muted">tiro de treino é cronometragem de treino; resultado de prova é o tempo registrado em Marcas. São registros de naturezas diferentes e é por isso que isto é conversão observada, não equivalência.</td></tr>
      </tbody></table></details>
    <div class="xs muted" style="margin-top:6px">Conversão <b>positiva</b> = a prova saiu mais lenta que o melhor tiro; negativa = mais rápida. Associação observada no seu histórico — <b>não é previsão</b>, e não atribui causa: o que mudou entre o tiro e a prova não é só o treino.</div>
  </div>`;
}
/* P2-B — cartão das parciais de prova, por prova e por origem do registro */
function cardParciais(pro,motor,comPct){
  const ref=motor.provaRef; if(!ref)return'';
  const pp=parciaisProva(pro,ref.d,ref.e,ref.pis);
  const nome=`${ref.d}m ${ref.e} ${ref.pis}`;
  if(!pp.suportada)return'';
  const meio=ref.d/2;
  if(!pp.n)return`<div class="card" data-dom="prova"><div class="eyebrow">parciais de prova — ${esc(nome)}</div>
    <p class="small muted" style="margin-top:6px">${pp.nProvas
      ? `Você tem <b>${pp.nProvas} prova(s)</b> de ${esc(nome)} em Marcas, mas <b>nenhuma com parcial de ${meio}m registrada</b> — só o tempo final. A passagem dos ${meio}m é o que separa "abri rápido demais" de "não sustentei", e sem ela as duas leituras ficam iguais.`
      : `Nenhuma prova de ${esc(nome)} registrada ainda.`}</p></div>`;
  const ord=['oficial','manual','nd'].filter(o=>pp.porOrigem[o]);
  const linhas=pp.itens.slice().reverse().slice(0,10).map(x=>`<tr>
    <td class="small">${brCurta(x.data)}${x.comp?`<div class="xs muted">${esc(x.comp)}</div>`:''}</td>
    <td class="n">${fmt(x.h1,true)}</td><td class="n">${fmt(x.h2,true)}</td>
    <td class="n" style="font-weight:700;color:${x.dif>0?'var(--ink-2)':'var(--ok)'}">${x.dif>=0?'+':''}${fmt(Math.abs(x.dif),true)}</td>
    <td class="xs muted">${x.origem==='nd'?'não declarada':x.origem}</td></tr>`).join('');
  const blocos=ord.map(o=>{const s=pp.porOrigem[o];
    return`<div style="border-top:1px solid var(--line);padding:9px 0">
      <div class="row" style="align-items:baseline"><b>${ORIGEM_PARC[o]}</b><div class="grow"></div><span class="xs muted">${s.n} prova(s)</span></div>
      <div class="xs muted" style="margin-top:3px">diferença média <b class="t">${s.difMedia>=0?'+':''}${fmt(Math.abs(s.difMedia),true)}</b>${s.dp!=null?` · variação entre provas <b class="t">${fmt(s.dp,true)}</b>${s.cv!=null?` (${s.cv.toFixed(0)}%)`:''}`:' · variação exige 2 provas'}
      ${s.r!=null?` · abertura × manutenção <b class="t">r=${s.r.toFixed(2)}</b>`:` · abertura × manutenção: ${s.n<4?`precisa de 4 provas (tem ${s.n})`:'sem variação suficiente'}`}</div>
      ${s.r!=null?`<div class="xs muted" style="margin-top:3px">${s.r>0.5?`Quanto mais rápido você abre, <b>mais</b> a segunda metade cede. Associação no seu histórico, com ${s.n} provas — não é causa.`
        :s.r<-0.5?`Abrir mais rápido <b>não</b> tem custado a segunda metade aqui. ${s.n} provas — amostra pequena.`
        :`Abertura e manutenção não andam juntas de forma clara (${s.n} provas).`}</div>`:''}
    </div>`}).join('');
  return`<div class="card" data-dom="prova" id="c-parciais"><div class="eyebrow">parciais de prova — ${esc(nome)}</div>
    <div class="small muted" style="margin:4px 0 6px">Como a prova se divide em <b>${meio}m + ${meio}m</b>. Só provas desta distância, estilo e piscina.</div>
    <table><thead><tr><th>prova</th><th class="n">1º ${meio}</th><th class="n">2º ${meio}</th><th class="n">dif.</th><th>origem</th></tr></thead><tbody>${linhas}</tbody></table>
    ${blocos}
    ${pp.misturaOrigem?`<div class="note warn" style="margin-top:8px"><b>Origens diferentes não entram na mesma média.</b> Estas parciais vêm de ${ord.length} procedências (${ord.map(o=>ORIGEM_PARC[o]).join(', ')}), e cronometragem oficial não se mistura com tempo digitado depois. Por isso cada origem tem o seu bloco acima.</div>`:''}
    ${pp.semParcial?`<div class="xs muted" style="margin-top:6px"><b>${pp.semParcial} prova(s) de ${esc(nome)} ficaram fora</b> — só têm o tempo final registrado, sem a passagem dos ${meio}m. Continuam valendo em Marcas; o que não dá é dividir uma prova sem a parcial dela.</div>`:''}
    <div class="xs muted" style="margin-top:6px"><b>Diferença</b> = segunda metade − primeira. Positiva é o normal: a primeira tem a saída. <b>Variação</b> é o desvio dessa diferença entre provas — quanto menor, mais repetível é a sua divisão de prova. <b>Origem não declarada</b> é registro antigo: o app não promove dado sem procedência a oficial.</div>
  </div>`;
}
function cardAprendizado(pro){
  const alvo=(typeof provasAlvo==='function')?provasAlvo(pro):[];
  const a=alvo[0]; if(!a)return'';
  const pbs=pro.pbs||{};
  const pis=pbs[`${a.d} ${a.e} LC50`]?'LC50':'SC25';
  const p=precisaoModelo(pro,a.d,a.e,pis);
  if(!p||!p.n)return`<div class="card" data-dom="prova"><div class="eyebrow">aprendizado do modelo</div>
    <p class="small muted" style="margin-top:6px">Ainda não há competição registrada para comparar com a previsão. <b>Registre seus resultados em Marcas</b> — a cada prova o app passa a saber o quanto costuma errar com você, e a projeção deixa de ser um palpite genérico.</p></div>`;
  const sinal=v=>(v>0?'+':'')+ (Math.abs(v)>=1000?fmt(Math.abs(v),true):(v/1000).toFixed(2)+'s');
  const linhas=p.itens.map(x=>{
    const cor=x.erro<0?'var(--ok)':(x.erro>=1200?'var(--clock)':'var(--ink-2)');   /* verde = nadou mais rapido */
    return`<tr><td class="small">${brCurta(x.data)}${x.origem==='reconstruida'?' <span class="xs muted">·rec</span>':''}</td>
      <td class="n">${fmt(x.central,true)}</td><td class="n">${fmt(x.real,true)}</td>
      <td class="n" style="color:${cor}">${(x.erro>0?'+':'')+(x.erro/1000).toFixed(2)}s</td></tr>`;}).join('');
  const vies=p.vies/1000, abs=p.abs/1000;
  /* Frase escrita do ponto de vista do ATLETA. A anterior ("o modelo tem
     previsto mais devagar do que você nada") era ambígua e foi lida ao
     contrário — quem lê quer saber o que ELE fez, não o que o modelo fez. */
  /* A FORÇA DA FRASE SEGUE A AMOSTRA. Com uma prova comparada o número é
     correto e a conclusão não existe: "em média" sobre n=1 é a própria
     observação. Só a partir de calibração consistente o texto fala em
     tendência e em correção aplicada. */
  const est=p.estagio;
  const dir=vies<0?'mais RÁPIDO':'mais DEVAGAR';
  /* a unidade da frase acompanha a amostra, como os KPIs acima */
  const un=p.homogenea?`${Math.abs(vies).toFixed(2)}s`:`${Math.abs(p.viesPct).toFixed(1)}%`;
  const leitura=est.chave==='sinal'
    ? `<b>Evidência insuficiente — uma única observação.</b> Nesta prova você nadou ${un} ${vies<0?'abaixo':'acima'} do previsto. Isso não estima viés nem calibração: é um ponto. Com mais provas registradas o app passa a saber se o padrão se repete.`
    : (Math.abs(p.viesPct)<0.4
      ? `<b>O modelo não puxa para nenhum lado</b> (${est.rotulo}, n=${p.n}). A diferença média está dentro do ruído.`
      : (est.forte
        ? `<b>Você tem nadado ${dir} que a previsão</b> — em média ${un}, em ${p.n} provas. Amostra suficiente para tratar como tendência, e o app corrige nas próximas projeções.`
        : `<b>Tendência preliminar (n=${p.n}, amostra pequena):</b> você nadou ${dir} que a previsão, média ${un}. ${est.rotulo} — o app corrige em parte, com peso reduzido pela amostra.`));
  const qc=qualidadeCalib(p);
  return`<div class="card" data-dom="prova"><div class="eyebrow">aprendizado do modelo — ${a.d}m ${esc(a.e)} ${pis}</div>
    <div class="grid3" style="margin-top:8px">
      <div class="kpi"><div class="v">${p.n}</div><div class="l">${p.nPrev?`${p.nPrev} prospectiva(s) · ${p.nRec} reconstruída(s)`:`prova(s) comparada(s)`}</div></div>
      ${/* P1-B: segundo só quando a amostra é de UMA distância e UMA piscina */''}
      <div class="kpi"><div class="v">${p.homogenea?abs.toFixed(2)+'s':p.absPct.toFixed(1)+'%'}</div><div class="l">erro absoluto médio${p.homogenea?'':' (relativo)'}</div></div>
      <div class="kpi"><div class="v" style="${est.forte&&Math.abs(vies)>=0.5?'color:var(--clock)':(est.forte?'':'opacity:.55')}">${p.homogenea?(vies>0?'+':'')+vies.toFixed(2)+'s':(p.viesPct>0?'+':'')+p.viesPct.toFixed(1)+'%'}</div><div class="l">viés${est.forte?'':' (provisório)'}</div></div>
    </div>
    ${!p.homogenea?`<div class="note warn" style="margin-top:8px"><b>Amostra de provas diferentes — erro em segundos não se soma.</b>
      Este histórico junta ${p.dists.sort((x,y)=>x-y).join(' m, ')} m${p.piscinas.length>1?` e as duas piscinas`:''}, e meio segundo num 50 não é a mesma coisa que meio segundo num 200.
      Por isso aqui o erro aparece em <b>percentual do tempo</b>, que atravessa distâncias. Para ver o erro em segundos, é preciso ter prova registrada nesta mesma distância e piscina.</div>`:''}
    <div class="small" style="margin-top:8px">${leitura}</div>
    <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap">
      <span class="tag ${est.forte?'w':'o'}">${est.rotulo}</span>
      <span class="tag o">calibração ${qc.rotulo}</span>
      ${p.medianaPct!=null?`<span class="chip">erro mediano ${p.medianaPct.toFixed(1)}%</span>`:''}
      ${p.p90Pct!=null&&p.n>=3?`<span class="chip">p90 ${p.p90Pct.toFixed(1)}%</span>`:''}
      ${p.dvPct!=null?`<span class="chip">dispersão ${p.dvPct.toFixed(1)}%</span>`:''}
    </div>
    <div class="xs muted" style="margin-top:4px">Qualidade da calibração: ${esc(qc.porque)}. Mede o quanto o histórico sustenta a projeção desta prova — não é probabilidade.</div>
    <table style="margin-top:10px"><thead><tr><th>prova</th><th class="n">previsto</th><th class="n">realizado</th><th class="n">erro</th></tr></thead>
      <tbody>${linhas}</tbody></table>
    ${(()=>{/* P2 — RASTREABILIDADE. "3 provas comparáveis, a mais recente em
        28/06/2025" ao lado de um resultado de 15/04/2026 em Marcas parece
        contradição, e não é: só entra no log a prova que tinha TIROS ANTES
        dela para reconstruir a previsão. Sem dizer isso, o relatório parecia
        estar ignorando competições — ou inventando datas. */
      const todas=((pro.resultados||[]).filter(r=>r&&r.tempo>0&&r.data&&r.dist===a.d&&r.estilo===a.e&&(r.piscina||'SC25')===pis));
      const dentro=new Set((p.itens||[]).map(x=>x.data));
      const fora=todas.filter(r=>!dentro.has(r.data)).sort((x,y)=>y.data.localeCompare(x.data));
      if(!fora.length)return'';
      return`<div class="note" style="margin-top:8px"><b>${fora.length} de ${todas.length} vez(es) que você nadou esta prova ficaram fora desta comparação</b>, a mais recente em ${brData(fora[0].data)}${fora[0].comp?` (${esc(fora[0].comp)})`:''}.
        <span class="xs muted" style="display:block;margin-top:4px">Motivo: só entra aqui a prova que tinha <b>tiros registrados antes dela</b> — sem o lado do treino não há previsão para comparar com o resultado. Elas continuam valendo em <b>Marcas</b> e no histórico de evolução; o que não dá é medir erro de previsão onde não houve previsão possível.</span></div>`;})()}
    ${/* P1-B — COBERTURA. Só é medida sobre previsões PROSPECTIVAS (a faixa
         reconstruída não existe), e só é afirmada com amostra. Antes, uma
         única prova dentro da faixa virava "cobertura 100%". */''}
    ${p.nFaixa?(p.coberturaValida

/* ── O QUE MUDOU EM 28 DIAS + POR QUÊ ───────────────────────────────────────

function mudancas28d(pro,comPct){

    ['VFC',1,'ms',0,'avg',gar.filter(x=>x.hrv!=null).map(x=>({data:x.data,v:x.hrv}))],
    ['FC repouso',-1,'bpm',0,'avg',gar.filter(x=>x.fc!=null).map(x=>({data:x.data,v:x.fc}))],
    ['Sono',1,'h',1,'avg',gar.filter(x=>x.sono!=null).map(x=>({data:x.data,v:x.sono}))],
    ['Carga (UA)',0,'',0,'sum',carga],

    ['Massa magra',1,'kg',1,'avg',bio.filter(b=>b.peso!=null&&b.gordura!=null).map(b=>({data:b.data,v:+(b.peso*(1-b.gordura/100)).toFixed(1)}))]

    else f+=cg&&cg.dPct>10?' — pode refletir fadiga do aumento de carga.':vfc&&vfc.dPct<0?' — recuperação (VFC) mais baixa acompanhou a queda.':'.';

function cardMudancas(pro,comPct){

/* ── SPRINT FINGERPRINT (radar) — só dimensões observáveis ───────────────────*/

function velocFingerprint(pro,comPct){

  if(!vals.length&&comPct.length){const s=comPct.map(x=>x.pct).sort((a,b)=>b-a),n=Math.max(1,Math.ceil(s.length*0.2));vals.push(s.slice(0,n).reduce((t,x)=>t+x,0)/n);}

/* Manutenção = constância dos tempos numa SÉRIE (coef. de variação).
   Agrupa por dia+distância+estilo e, dentro do grupo, considera só o "bloco de
   qualidade" (tempos até 8% acima do mais rápido) — assim aquecimento/soltura no
   mesmo dia não inflam a variação. CV% médio ponderado pelo tamanho da série. */
function manutencaoCV(comPct){
  const g={};
  for(const e of comPct){const k=e.data+'|'+e.dist+'|'+e.estilo;(g[k]=g[k]||[]).push(e.tempo);}
  let somaCV=0,somaW=0;
  for(const k in g){let a=g[k].slice().sort((x,y)=>x-y); const rap=a[0];
    a=a.filter(t=>t<=rap*1.08); if(a.length<3)continue;
    const m=a.reduce((t,x)=>t+x,0)/a.length, sd=Math.sqrt(a.reduce((t,x)=>t+(x-m)*(x-m),0)/a.length);

}
/* ── ESPECIFICIDADE ────────────────────────────────────────────────────────

   85% do PB não prepara para competir a 100%: a diferença é o sistema que se
   está treinando. O corte de 92% do PB é o limite a partir do qual o esforço
   passa a exigir o ritmo real da prova num sprint; abaixo disso é qualidade
   aeróbia, que conta em outro lugar do relatório.
   Dois componentes, porque os dois faltam por motivos diferentes: QUANTIDADE
   (nunca fez) e RECÊNCIA (fez, mas há três semanas). */
/* Distâncias que CONTAM para uma prova, e com que peso. Um 4×50 sustentando
   ritmo sob fadiga é treino específico para o 100 — ignorá-lo porque não é um
   tiro de 100 isolado descrevia errado o que o atleta vinha fazendo. O peso
   cai conforme a distância se afasta, e o estilo tem que ser o mesmo: ritmo de
   peito não se treina nadando livre. */
function vizinhasDe(d){
  const m={50:[[50,1],[25,0.6],[100,0.5]],

           200:[[200,1],[100,0.7],[400,0.4]],
           400:[[400,1],[200,0.6],[800,0.4]]};

function especificidadeProva(comPct,d,e,dias){
  dias=dias||28;
  const h0=new Date(hoje()+'T00:00:00');
  const idade=x=>Math.floor((h0-new Date((x.data||'')+'T00:00:00'))/86400000);
  const pesos=new Map(vizinhasDe(d));
  const perto=(comPct||[]).filter(x=>x.estilo===e&&pesos.has(x.dist)&&idade(x)>=0&&idade(x)<dias);
  if(!perto.length)return{score:null,n:0,nEsp:0,diasUlt:null,
    txt:`sem tiro de ${e} em distância próxima de ${d}m nos últimos ${dias} dias`};
  /* ≥92% do PB da PRÓPRIA distância do tiro: um 50 a 92% do PB de 50 é

  const esp=perto.filter(x=>x.pct>=92);
  const diasUlt=esp.length?Math.min(...esp.map(idade)):null;

/* Forma específica: o melhor %PB recente, aceitando distância vizinha com o

   100m isolado. Devolve também de onde veio, porque a origem muda a leitura. */
function formaEspecifica(comPct,d,e,dias){
  dias=dias||42;

  const idade=x=>Math.floor((h0-new Date((x.data||'')+'T00:00:00'))/86400000);
  const pesos=new Map(vizinhasDe(d));
  let melhor=null;

    if(x.estilo!==e||!pesos.has(x.dist))continue;
    const k=idade(x); if(!(k>=0&&k<dias))continue;

/* ── P2-B — PARCIAIS DE PROVA, POR PROVA E POR ORIGEM ──────────────────────
   O app já comparava "custo do segundo 25", mas pegava QUALQUER tiro de 50 do
   treino — inclusive de outro estilo e de outra piscina — e comparava com a
   prova de peito. Aqui a estratificação é obrigatória: estilo, distância e
   piscina iguais dos dois lados.

   ORIGEM DO REGISTRO. Três procedências, que não se comparam entre si:
     'oficial'  — cronometragem da competição, lançada pelo técnico por passagem
     'manual'   — digitada pelo próprio atleta depois da prova
     'nd'       — registro antigo, sem declaração de origem

   sem procedência. Estatística só é agregada DENTRO de uma origem; quando há
   mais de uma, elas aparecem separadas.

   Fórmulas (d = 50 → metades de 25 m; d = 100 → metades de 50 m):
     h1  = primeira parcial acumulada
     h2  = tempo final − h1
     dif = h2 − h1                     (positivo = segunda metade mais lenta)
     cv  = desvio/média das difs       (variação entre competições comparáveis)

const ORIGEM_PARC={oficial:'cronometragem oficial',manual:'digitada por você',nd:'origem não declarada'};

function metadesDe(r,d){
  const ps=(r&&Array.isArray(r.parciais))?r.parciais.filter(x=>x!=null):[];
  if(ps.length<2||!(r.tempo>0))return null;          /* [total] sozinho não é parcial */

  const idx=ps.length===2?0:Math.round(ps.length/2)-1;

function parciaisProva(pro,d,e,pis){
  if(d!==50&&d!==100)return{suportada:false,d,e,pis};
  const res=((pro&&pro.resultados)||[]).filter(r=>r&&r.tempo>0&&r.data
    &&r.dist===d&&r.estilo===e&&(r.piscina||'SC25')===(pis||'SC25'));
  const itens=[];
  for(const r of res){
    const m=metadesDe(r,d); if(!m)continue;
    itens.push({data:r.data,comp:r.comp||null,total:r.tempo,...m,origem:origemParcial(r)});
  }
  itens.sort((a,b)=>a.data.localeCompare(b.data));
  const porOrigem={};
  for(const it of itens)(porOrigem[it.origem]=porOrigem[it.origem]||[]).push(it);
  const stat=arr=>{
    if(!arr.length)return null;
    const difs=arr.map(x=>x.dif), n=difs.length;
    const m=difs.reduce((a,b)=>a+b,0)/n;

}
/* Comparação treino × prova das metades — ESTRATIFICADA. Só entra o tiro da
   MESMA distância, MESMO estilo e MESMA piscina, e o resultado é descritivo:
   a saída não é equivalente (borda no treino, bloco na prova), então não existe
   conversão numérica honesta entre os dois lados — só a descrição dos dois. */
function metadesTreino(comPct,d,e,pis,dias){
  const h0=new Date(hoje()+'T00:00:00');
  const arr=(comPct||[]).filter(x=>x.dist===d&&x.estilo===e&&x.p1!=null&&x.tempo>x.p1

    &&(!dias||(h0-new Date((x.data||'')+'T00:00:00'))/86400000<dias));

  return{n,difMedia:m,h1Media:arr.reduce((a,b)=>a+b.p1,0)/n,

/* ── PRESSÃO DE TREINAMENTO ────────────────────────────────────────────────

   ponto em que você está favorece competir. Janela de desempenho entre 0,8 e
   1,3 de fadiga/fitness — acima, fadiga acumulada; abaixo, destreino. A
   monotonia desconta à parte porque carga certa com estímulo sempre igual
   também não rende.

/* Transferência como COMPONENTE de prontidão. Conversão alta não é mérito: o

   quartis e o tamanho da amostra. */
function transfScore(t){
  if(!t||!t.n)return null;   /* sem prova convertida não há componente, e sim ausência dele */
  let s=50;
  s+=Math.max(-20,Math.min(25,-t.mediana*6));        /* −2,4% de conversão → +14 */
  s+=Math.min(15,t.estagio.peso*15);                 /* amostra */
  s+=Math.max(0,10-Math.abs(t.p75-t.p25)*2);         /* consistência entre provas */

     especificidade    20%  exposição a ritmo de prova em 28 dias (P3)
     fisiológica       20%  prontidão do relógio (VFC/FC/sono)
     pressão           15%  fadiga/fitness e monotonia

function cardFingerprint(m){

  const pt=(i,r)=>[cx+r*Math.cos(rad(i)),cy+r*Math.sin(rad(i))];

/* ── Três números do topo ──────────────────────────────────────────────────
   O relatório tem mais de vinte cartões de peso igual, e quem abre não sabe
   por onde começar. Estes três são os que mudam decisão: o tempo que você
   nadaria hoje, se a carga está acima do habitual, e se o corpo respondeu.
   Cada um leva ao cartão que o explica — o resumo vira o índice. */
/* ── P3-D — AUTOVERIFICAÇÃO DE COERÊNCIA ───────────────────────────────────
   O relatório já teve cabeçalho falando de uma prova e projeção de outra. A
   correção foi tornar a referência canônica; esta é a trava que impede a
   regressão: antes de desenhar, confere se todas as peças que dependem da
   prova em foco estão de fato na mesma prova e piscina. Divergência vira
   aviso visível — o app não publica relatório incoerente em silêncio. */
function conferirCoerencia(pro,motor){
  const ref=motor&&motor.provaRef; if(!ref)return[];
  const k=`${ref.d} ${ref.e} ${ref.pis}`, erros=[];

  if(p&&p.prova!==k)erros.push(`a projeção em destaque é de <b>${esc(p.prova)}</b>, mas a prova em foco é <b>${esc(k)}</b>`);
  const t=motor.transf;
  if(t&&t.chave&&t.chave!==k)erros.push(`a conversão treino→prova é de <b>${esc(t.chave)}</b>, não de <b>${esc(k)}</b>`);
  /* a faixa tem de conter o central, e o PB tem de ser o da piscina da prova */
  if(p){
    if(!(p.low<=p.central&&p.central<=p.high))erros.push('a faixa da projeção não contém a estimativa central');
    const pbRef=(pro.pbs||{})[k];
    if(pbRef!=null&&p.pb!==pbRef)erros.push('a projeção usa um PB que não é o desta prova e piscina');

function avisoCoerencia(pro,motor){

    ${tile(p?`${fmt(p.low,true)}<br>–${fmt(p.high,true)}`:'—', p?`projeção ${p.prova.split(' ')[0]}m`:'sem prova-alvo', '', p?'c-provas':null, !!p)}
    ${tile(a!=null?a.toFixed(2):'—','fadiga / fitness',corAC,'c-fadiga')}
    ${tile(pg?pg.score:'—','prontidão',corPr,'c-prontidao')}
  </div>`;
}
/* abre o detalhamento e leva até o cartão — sem isto o número do topo seria

/* ── RESUMO EXECUTIVO (topo do relatório): estado assertivo + fortes/fracos ── */
function cardResumoExec(pro,motor,comPct){
  const e=motor.estado||{}, fp=motor.fingerprint||[];
  const cap=e.cap?e.cap.score:null, pr=e.pr?e.pr.score:null, tend=e.tend, f=motor.fadiga;
  let cargaTxt=null,cargaCor='';
  if(f&&f.acwr!=null){ if(f.acwr>1.5){cargaTxt='carga acima da habitual (fadiga acumulada)';cargaCor='var(--clock)';}
    else if(f.acwr>=0.8){cargaTxt='carga sustentável';cargaCor='var(--ok)';} else {cargaTxt='carga baixa (há espaço para subir)';} }
  const rot={Velocidade:'velocidade',Manutenção:'manutenção de velocidade',Recuperação:'recuperação',Composição:'composição',Tendência:'evolução'};
  const fortes=fp.filter(d=>d.score!=null&&d.score>=70).map(d=>rot[d.eixo]||d.eixo);
  const fracos=fp.filter(d=>d.score!=null&&d.score<55).map(d=>rot[d.eixo]||d.eixo);
  const prTxt=pr==null?null:pr>=75?'alta':pr>=55?'média':'baixa';
  const p=[];
  if(cap!=null)p.push(`seus tiros saem a <b>${cap}%</b> do seu melhor tempo`);
  /* A janela entra no texto: "capacidade em evolução" sem dizer "no histórico"
     colide com o %PB abaixo da base logo adiante, e o relatório parece estar
     se contradizendo quando só está olhando dois intervalos diferentes. */
  if(tend)p.push(`capacidade <b>${tend.dir==='↑'?'em evolução':tend.dir==='↓'?'em queda':'estável'} no histórico</b>${tend.detalhe?` (${tend.detalhe})`:''}`);
  if(tend&&tend.curto&&tend.curto.dir!=='→')
    p.push(`últimos 7 dias <b style="color:${tend.curto.dir==='↑'?'var(--ok)':'var(--clock)'}">${tend.curto.pct>=0?'+':''}${tend.curto.pct}% em %PB</b> vs. os 21 anteriores`);
  if(prTxt)p.push(`prontidão hoje <b>${prTxt}</b>`);
  if(cargaTxt)p.push(`<b style="color:${cargaCor}">${cargaTxt}</b>`);
  const narr=p.length?(p.join(' · ')+'.'):'Ainda faltam dados para um resumo firme — lance mais tempos e um check-in.';
  return`<div class="card"><div class="eyebrow">resumo</div>

      <div class="kpi"><div class="v" style="${tend?`color:${tend.cor||''}`:''}">${tend?tend.dir:'—'}</div><div class="l">tendência (histórico)</div></div>
      <div class="kpi"><div class="v" style="color:${pr==null?'':pr>=75?'var(--ok)':pr<55?'var(--clock)':''}">${pr!=null?pr:'—'}</div><div class="l">prontidão (hoje)</div></div>
    </div>
    ${tend&&tend.divergencia?notaJanelas(tend):''}
    ${fortes.length?`<div class="note ok" style="margin-top:12px"><b>Pontos fortes:</b> ${fortes.join(', ')}.</div>`:''}
    ${fracos.length?`<div class="note warn" style="margin-top:8px"><b>A melhorar:</b> ${fracos.join(', ')}.</div>`:''}
  </div>`;
}
/* recomendação de INTENSIDADE/CARGA (subir, manter ou reduzir) — NÃO sugere treino,
   só a direção da carga a partir de fadiga (ACWR/monotonia) + prontidão. */
function recomendaIntensidade(motor){
  const f=motor.fadiga||{}, acwr=f.acwr, mono=f.monotonia;
  const prG=motor.estado&&motor.estado.pr?motor.estado.pr.score:null;
  const prS=(typeof prontidaoSubj==='function'&&prontidaoSubj(7))?prontidaoSubj(7).media:null;
  const pr=prG!=null?prG:prS;
  if(acwr==null&&pr==null)return{t:'',nivel:'Sem dados de carga',txt:'Faltam dados para recomendar intensidade. Marque RPE e duração dos treinos e faça o check-in diário.'};
  /* Sem ACWR não se fala de carga — nem para mandar reduzir, nem para dizer
     que está "sustentável". Antes desta guarda, quem tinha check-in e nenhuma
     história de treino recebia "Manter a carga — carga em faixa sustentável",
     uma afirmação sobre carga feita sem carga nenhuma. */
  if(acwr==null){
    if(pr!=null&&pr<50)return{t:'warn',nivel:'Prontidão baixa hoje',
      txt:'A prontidão de hoje está abaixo da sua faixa. Ainda não há semanas suficientes de registro para comparar a carga com a sua habitual — esta leitura é do estado, não uma recomendação de carga.'};
    return{t:'',nivel:'Sem carga habitual para comparar',
      txt:'Ainda não há semanas suficientes de RPE e duração registrados para comparar a carga desta semana com a sua habitual. Seguir registrando é o que destrava essa leitura.'};
  }
  const alto=(acwr!=null&&acwr>1.5)||(mono!=null&&mono>2.2)||(pr!=null&&pr<50);
  if(alto){ const m=[];
    if(acwr!=null&&acwr>1.5)m.push(`carga de sessão (duração × RPE) dos últimos 7 dias em ${acwr.toFixed(1)}× a média das 4 semanas anteriores`);
    if(mono!=null&&mono>2.2)m.push('treinos muito monótonos');
    if(pr!=null&&pr<50)m.push('prontidão baixa');
    return{t:'warn',nivel:'Reavaliar a carga',txt:`Há sinais que justificam considerar redução temporária (${m.join(', ')}). Confirme o ajuste com o técnico e, se houver sintomas, com um profissional de saúde.`};
  }
  if(acwr!=null&&acwr<0.8&&(pr==null||pr>=55))
    return{t:'ok',nivel:'Margem aparente para progressão',txt:`Os dados sugerem espaço para progressão gradual (carga abaixo da habitual${pr!=null?', prontidão adequada':''}), desde que o técnico confirme e não haja sintomas.`};
  return{t:'',nivel:'Manter a carga',txt:`Carga em faixa sustentável${pr!=null?` e prontidão ${pr>=75?'boa':'ok'}`:''}. Mantenha e progrida aos poucos, sem picos bruscos.`};
}
function cardPrioridadeSemana(pro,motor,diag){

/* ── PLANO DE AÇÃO: intensidade + ajustes de treino e foco para a competição ── */

/* ── UM CARTÃO QUEBRADO NÃO PODE DERRUBAR O RELATÓRIO ──────────────────────
   O relatório monta mais de vinte cartões numa única expressão. Qualquer um
   que lance — um campo inesperado, um dado antigo com outra forma — levava a
   PÁGINA INTEIRA, e a tela só dizia "não foi possível montar", sem dizer qual.
   Agora cada cartão é isolado: o que falha vira um aviso no lugar dele, com a
   mensagem real, e os outros continuam de pé. */
function sc(nome,fn){
  try{ return fn()||''; }
  catch(e){
    try{ console.warn('[relatório] falhou:',nome,e); }catch(_){}
    return`<div class="card"><div class="eyebrow">${esc(nome)}</div>
      <div class="note warn" style="margin-top:6px"><b>Esta seção não pôde ser montada.</b>
      <span class="t xs" style="display:block;margin-top:4px">${esc((e&&e.message)||String(e))}</span>
      <span class="xs muted" style="display:block;margin-top:4px">O resto do relatório continua válido. Me mostre esta mensagem e eu corrijo.</span></div></div>`;
  }
}
/* ── O RELATÓRIO É UM DOCUMENTO, NÃO UM PAINEL ─────────────────────────────
   O modelo que o Bruno quer reproduzir abre identificando a prova, o atleta e

function cabecalhoDocumento(pro,motor){

  const linha=(r,v)=>`<tr><td class="rot">${r}</td><td><b>${v}</b></td></tr>`;

      : `Emitido em ${brData(hoje())} · janela de análise: últimos 120 dias de treino · histórico completo de competições`}</div>

        :(ref?`<span style="font-weight:400">indisponível para ${ref.d} m ${esc(ref.e)} ${ref.pis}</span><div class="xs" style="font-weight:400">${((pro.pbs||{})[`${ref.d} ${ref.e} ${ref.pis}`])?'faltam tiros recentes desta prova':'sem PB registrado nesta prova e piscina'}</div>`:'sem prova-alvo definida'))}

/* Seção numerada: é o que dá ao documento a espinha que o painel não tinha.
   A numeração NÃO pode ser fixa. Seção sem dado não é renderizada — e com
   número fixo o documento saía "1, 2, 3, 4, 6", que num relatório parece
   página faltando. O contador só anda quando a seção de fato existe. */
let _N_APOIO=7;   /* numero da secao de apoio, definido depois de saber quantas secoes existem */
let _N_FEITAS=0;   /* seções já numeradas antes deste bloco (o documento tem dois) */
function montarSecoes(lista,inicio){
  let n=inicio||0, html='';
  for(const [titulo,sub,corpo,dom] of lista){
    if(!corpo||!String(corpo).trim())continue;
    n++;
    html+=`<section class="doc-sec"${dom?` data-dom="${dom}"`:''}>
      <h2 class="doc-h"><span class="doc-n">${n}</span>${esc(titulo)}</h2>
      ${sub?`<p class="doc-lead">${esc(sub)}</p>`:''}
      ${corpo}</section>`;
  }
  return{html,n};
}
/* Fecho do documento: de onde vieram os números e o que eles não são. O modelo
   termina assim, e é o que separa relatório de tela de aplicativo. */
function secaoMetodologia(pro,motor){
  const iv=motor.inventario||{};
  const fr=(typeof frescorDados==='function')?frescorDados(pro,[]):[];
  const velhas=fr.filter(f=>f.uso==='só histórico').map(f=>f.rot.toLowerCase());
  return`<div class="doc-meta">
    <h3>Metodologia e ressalvas</h3>
    <p>Janela de análise: <b>últimos 120 dias</b> de treinos consolidados (${iv.tiros||0} tiros cronometrados), ${iv.competicoes||0} prova(s) nadada(s) em competição (uma competição entra com uma linha por prova) e ${iv.garmin||0} dia(s) de dados do relógio. Os tempos de treino são convertidos para condição de prova aplicando <b>saída de bloco e taper</b>, e depois calibrados pelas suas competições anteriores — a projeção não é o seu tempo de treino.</p>
    <p><b>Cada número fala de uma janela, e elas não são a mesma.</b> A <b>tendência</b> compara cada prova com a primeira vez que você a nadou: histórico inteiro, sem corte de 120 dias. A <b>leitura curta</b> compara os seus tiros dos últimos 7 dias com os 21 anteriores. O <b>estado atual</b> compara a última medida com a sua base de 28 dias. O <b>"o que mudou"</b> compara duas médias de 28 dias. Janelas diferentes podem apontar para lados diferentes sem que nenhuma esteja errada — por isso cada leitura aparece com a sua janela declarada, e quando duas divergem o relatório diz isso em vez de escolher a mais simpática.</p>
    <p><b>Cobertura</b> mede quanto dos dados esperados existe; <b>confiabilidade</b> mede o quanto o modelo já acertou na sua prova. Nenhum dos dois é probabilidade: não há calibração estatística que autorize lê-los assim.</p>
    <p>Correlações descrevem <b>associação observada no seu histórico</b>, nunca causa. Amostras pequenas aparecem marcadas como tal, e o app evita conclusão forte com uma ou duas observações.</p>
    <p>Dado marcado como suspeito — bioimpedância implausível, duração fora de faixa — <b>não alimenta score, radar nem projeção</b>; continua visível, identificado. ${velhas.length?`Hoje ${velhas.join(' e ')} ${velhas.length>1?'entram':'entra'} apenas como histórico, por idade do dado.`:''}</p>
    <p><b>O app não prescreve treino.</b> Ele indica direção de carga — reduzir, manter ou aumentar — e sinaliza o que merece leitura. O conteúdo do treino é decisão do técnico; indicadores de saúde não substituem avaliação clínica.</p>
  </div>`;
}

    <button class="sm ghost" onclick="abrirImpressao()">PDF</button>
