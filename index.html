<style>
:root{
  --deck:#F2EFE9; --ink:#12181C; --ink-2:#5A6670; --line:#D8D3C9;

@media print{
  nav,header,.noprint{display:none!important}

  main,#app{max-width:100%!important;padding:0!important;margin:0!important}
  .card{break-inside:avoid;box-shadow:none;border:0;border-top:1px solid #e5e2db;border-radius:0;margin:0;padding:11px 2px;background:#fff}

  .eyebrow{font-size:10.5px}
  h2,h3,.eyebrow{page-break-after:avoid}
  svg,table,.grid3{break-inside:avoid}
  @page{margin:14mm 12mm}

const fkey=k=>k.replace(/\//g,'∕');
/* ── Campos de segurança espelhados (Fase 1 do P0) ─────────────────────────
   As regras do Firestore NÃO conseguem ler dentro de `v` (é uma string JSON).
   Por isso os campos que decidem autorização — dono, equipe, perfil, aprovado —
   são gravados também como campos REAIS do documento. Só assim a regra pode
   exigir "você não pode mudar o seu próprio perfil" ou "só o técnico da equipe
   escreve nos treinos dela". Enquanto as regras novas não são publicadas isto
   é inócuo: só acrescenta campos. */
function camposSeguranca(k,v){
  const o={dono:null,donoEmail:null,equipe:null,perfil:null,aprovado:null};
  const val=(v&&typeof v==='object'&&!Array.isArray(v))?v:{};
  if(k.startsWith('pro_')){ o.dono=k.slice(4)||null; }
  else if(k.startsWith('u_')){
    o.dono=val.id||null;                       /* uid do Firebase, para casar com request.auth.uid */
    o.equipe=val.equipe||null;
    o.perfil=val.perfil||null;
    o.aprovado=val.aprovado===true;
  }
  else if(k.startsWith('eq_')){
    o.equipe=k.split('_')[1]||null;
    /* só o documento da equipe em si tem tecnicoEmail. É o que permite à regra
       reconhecer o DONO da equipe — quem cria a própria equipe (técnico ou PRO
       avulso) pode se auto-aprovar nela; entrar na equipe dos outros, não. */
    o.donoEmail=val.tecnicoEmail?String(val.tecnicoEmail).toLowerCase():null;
  }
  return o;
}
/* ── Trava de tamanho ───────────────────────────────────────────────────────
   Documento do Firestore tem teto RÍGIDO de 1 MiB. Como a gravação é otimista
   (a tela atualiza antes da confirmação), estourar o limite fazia o app parar
   de salvar em silêncio. Agora avisa antes e recusa com mensagem clara. */
const LIM_DOC=1048576, LIM_SEGURO=900000, LIM_AVISO=650000;
function bytesDe(s){ try{ return new Blob([s]).size; }catch(_){ return (s||'').length; } }
function checaTamanho(k,json){
  const b=bytesDe(json);
  if(b>LIM_SEGURO){
    toast(`Não salvei: "${k}" ficou com ${(b/1024).toFixed(0)} KB e o limite por documento é 1024 KB. Remova anexos (fotos/PDFs) das sessões fora d'água.`);
    console.warn('DB.set BLOQUEADO por tamanho',k,b);
    return {ok:false,bytes:b};
  }
  if(b>LIM_AVISO)toast(`Atenção: "${k}" já está com ${(b/1024).toFixed(0)} KB de 1024 KB. Convém remover anexos antigos.`);
  return {ok:true,bytes:b};
}
/* Medidor usado na tela de Diagnóstico — evita ter que abrir o console. */
function tamanhoDados(obj){
  const o=obj||{}, itens=Object.keys(o).map(k=>({secao:k,bytes:bytesDe(JSON.stringify(o[k]||null))}))
    .sort((a,b)=>b.bytes-a.bytes);
  const total=bytesDe(JSON.stringify(o));
  return {total,pct:total/LIM_DOC*100,itens};
}
const DB={
  async get(k,sh=true){
    if(FB){
      if(k==='sessao'){try{const v=localStorage.getItem(PFX+'sessao');return v?JSON.parse(v):null}catch(e){return null}}
      try{const s=await fdb.collection('kv').doc(fkey(k)).get();return s.exists?JSON.parse(s.data().v):null}
      catch(e){console.warn('DB.get',k,e.message);return null}
    }
    if(NUVEM){try{const r=await window.storage.get(k,sh);return r?JSON.parse(r.value):null}catch(e){return null}}
    if(LOCAL){try{const v=localStorage.getItem(PFX+k);return v?JSON.parse(v):null}catch(e){return null}}
    return MEM[k]!==undefined?JSON.parse(MEM[k]):null;
  },
  async set(k,v,sh=true){
    if(FB){
      if(k==='sessao'){try{localStorage.setItem(PFX+'sessao',JSON.stringify(v));return true}catch(e){return false}}
      try{
        const json=JSON.stringify(v);
        const chk=checaTamanho(k,json); if(!chk.ok)return false;   /* trava: nunca falhar calado */
        await fdb.collection('kv').doc(fkey(k)).set(Object.assign({
          v:json,
          at:firebase.firestore.FieldValue.serverTimestamp()
        },camposSeguranca(k,v)));
        return true;
      }catch(e){toast('Falha ao salvar');console.warn('DB.set',k,e.message);return false}
    }
    if(NUVEM){try{await window.storage.set(k,JSON.stringify(v),sh);return true}catch(e){toast('Falha ao salvar');return false}}
    if(LOCAL){try{localStorage.setItem(PFX+k,JSON.stringify(v));return true}
      catch(e){toast('Memória cheia — exporte um backup');return false}}
    MEM[k]=JSON.stringify(v); return true;
  }
};

function fmt(ms,curto){
  if(ms==null||isNaN(ms))return'—';
  const cs=Math.floor(Math.abs(ms)/10),s=Math.floor(cs/100),c=cs%100,m=Math.floor(s/60),sg=s%60,sn=ms<0?'-':'';
  if(m>0)return`${sn}${m}:${String(sg).padStart(2,'0')}.${String(c).padStart(2,'0')}`;
  return`${sn}${curto?sg:String(sg).padStart(2,'0')}.${String(c).padStart(2,'0')}`;
}
function parseTempo(x){
  if(x==null||x==='')return null;
  const t=String(x).trim().replace(/["″]/g,'').replace(/['′h]/g,':').replace(',','.');
  const p=t.split(':').map(n=>parseFloat(n)).filter(n=>!isNaN(n));
  if(!p.length)return null;
  if(p.length===1)return Math.round(p[0]*1000);
  if(p.length===2)return Math.round((p[0]*60+p[1])*1000);
  return Math.round((p[0]*3600+p[1]*60+p[2])*1000);
}
/* Igual a parseTempo, mas usa a DISTÂNCIA para desfazer a ambiguidade de "1.09":
   num 100m, 1,09s é impossível → interpreta como 1:09 (min:seg). Se já vier com
   ":" ou "'" (min explícito), respeita. Evita o "1.08" virar 1,08s. */
function parseTempoDist(x,dist){
  if(x==null||x==='')return null;
  const s=String(x).trim();
  if(/[:'′h]/.test(s))return parseTempo(s);                 // separador de minuto explícito
  const m=s.replace(',','.').match(/^(\d{1,2})\.(\d{2})$/);  // "M.SS" com 2 dígitos após o ponto
  if(m&&dist){
    const seg=parseFloat(s.replace(',','.'));
    if(seg<dist*0.4 && +m[2]<60) return Math.round((+m[1]*60 + +m[2])*1000);  // rápido demais p/ a distância → min:seg
  }
  return parseTempo(s);
}

/* ---------- CPF ---------- */
function cpfLimpo(c){return(c||'').replace(/\D/g,'')}
/* senha: 6 a 8 caracteres, com ao menos 1 maiúscula, 1 minúscula e 1 símbolo #$%!@ */
function senhaForte(s){ return typeof s==='string' && /^(?=.*[a-z])(?=.*[A-Z])(?=.*[#$%!@]).{6,8}$/.test(s); }
/* duração: texto "hh:mm:ss" / "mm:ss" / "45" (min) → minutos (decimal); e o inverso */
function hmsParaMin(txt){
  if(txt==null||txt==='')return null;
  const p=String(txt).trim().replace(',','.').split(':').map(x=>parseFloat(x)).filter(x=>!isNaN(x));
  if(!p.length)return null;
  let seg = p.length===1?p[0]*60 : p.length===2?p[0]*60+p[1] : p[0]*3600+p[1]*60+p[2];
  return +(seg/60).toFixed(2);
}
function minParaHMS(min){
  if(min==null||isNaN(min))return '';
  let s=Math.round(min*60), h=Math.floor(s/3600); s-=h*3600; const m=Math.floor(s/60), sg=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(sg).padStart(2,'0');
}
/* horas flexível (SONO): "7:30"=7,5 · "5h45"=5,75 · "7.5"/"7,5"/"7" → horas; nunca NaN */
function horasFlex(txt){
  if(txt==null||txt==='')return null;
  const s=String(txt).trim().toLowerCase().replace(',','.').replace(/h/g,':').replace(/[^0-9:.]/g,'');
  if(s.includes(':')){ const p=s.split(':'); const h=parseFloat(p[0])||0, m=parseFloat(p[1])||0; return +(h+m/60).toFixed(2); }
  const n=parseFloat(s); return isNaN(n)?null:n;
}
/* duração em MINUTOS (como o relógio mostra):
   "46:17" (mm:ss, treino <1h) = 46,28 · "1:15:30" (hh:mm:ss) = 75,5 · "90" (min) = 90. Nunca NaN. */
function durMin(txt){
  if(txt==null||txt==='')return null;
  const s=String(txt).trim().replace(',','.');
  if(s.includes(':')){ const p=s.split(':').map(x=>parseFloat(x)||0);
    return +(p.length>=3?(p[0]*60+p[1]+p[2]/60):(p[0]+p[1]/60)).toFixed(2); }   /* 2 partes = mm:ss */
  const n=parseFloat(s); return isNaN(n)?null:n;
}
/* esportes do treino extra (fora d'água / cross-training do atleta) */
const SECO_TIPOS=['Musculação','Bicicleta','Corrida','Funcional','Core','Mobilidade','Outro'];
function cpfValido(c){
  c=cpfLimpo(c); if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;
  let s=0; for(let i=0;i<9;i++)s+=+c[i]*(10-i);
  let d=(s*10)%11; if(d===10)d=0; if(d!==+c[9])return false;
  s=0; for(let i=0;i<10;i++)s+=+c[i]*(11-i);
  d=(s*10)%11; if(d===10)d=0; return d===+c[10];
}
const cpfMasc=c=>{c=cpfLimpo(c);return c.length===11?`${c.slice(0,3)}.${c.slice(3,6)}.${c.slice(6,9)}-${c.slice(9)}`:c};

/* ---------- senha ---------- */
async function hash(txt,sal){
  const dado=sal+'::'+txt;
  if(typeof crypto!=='undefined'&&crypto.subtle){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(dado));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  let h=5381; for(let i=0;i<dado.length;i++)h=((h<<5)+h+dado.charCodeAt(i))>>>0;
  return 'f'+h.toString(16);
}

/* idade (em anos) a partir da data de nascimento YYYY-MM-DD */
function idadeDe(nasc){
  if(!nasc)return null;
  const d=new Date(nasc+'T00:00:00'); if(isNaN(d))return null;
  const h=new Date(); let a=h.getFullYear()-d.getFullYear();
  const m=h.getMonth()-d.getMonth(); if(m<0||(m===0&&h.getDate()<d.getDate()))a--;
  return a;
}
/* idade para exibir — calcula do nascimento; cai para o campo antigo se preciso */
function anos(u){ const a=idadeDe(u&&u.nascimento); return a!=null?a:((u&&u.idade!=null)?u.idade:'—'); }

/* Cadastro no modo em rede (Firebase). Cria a conta de verdade e só depois
   valida CPF/código/equipe — assim as liberações não precisam ficar públicas.
   Se a validação falhar, a conta recém-criada é removida. */
async function cadastrarFB(dados){
  const {perfil,equipe,nome,email,nascimento,telefone,senha,senha2,tipo,cpf,codigoPro,nivel}=dados;
  if(!equipe)return toast('Informe o nome da equipe');
  if(!nome||nome.split(/\s+/).length<2)return toast('Informe nome e sobrenome');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return toast('E-mail inválido');
  const id=idadeDe(nascimento);
  if(!nascimento||id==null||id<8||id>110)return toast('Data de nascimento inválida');
  if(!telValido(telefone))return toast('Telefone inválido — use DDD + número');
  if(!senhaForte(senha))return toast('Senha: 6 a 8 caracteres, com 1 maiúscula, 1 minúscula e 1 símbolo (#$%!@)');
  if(senha!==senha2)return toast('As senhas não conferem');

  const em=email.toLowerCase(), eqSlug=slug(equipe);
  let cred;
  try{ cred=await fauth.createUserWithEmailAndPassword(em,senha); }
  catch(e){ return toast(traduzErroFB(e.code)); }
  const abortar=async msg=>{ try{await cred.user.delete()}catch(_){} return toast(msg); };

  let eq=await DB.get(kEq(eqSlug));
  let nivelFinal=nivel||'Master';
  async function criarEquipe(dono){
    const nova={slug:eqSlug,nome:equipe.trim(),criadoEm:Date.now(),tecnicoEmail:dono,codigoPro:CODIGO_PRO};
    await DB.set(kEq(eqSlug),nova); await DB.set(kLib(eqSlug),[]);
    await DB.set(kTrIdx(eqSlug),[]); await DB.set(kCIdx(eqSlug),[]);
    if(typeof registrarEquipeDev==='function')await registrarEquipeDev(eqSlug);
    return nova;
  }

  let criouEquipe=false;                 /* só quem CRIA a equipe é dono dela */
  if(perfil==='tecnico'){
    if(!eq){eq=await criarEquipe(em);criouEquipe=true;}
    /* equipe órfã (criada pelo dev): o técnico se vincula, mas quem libera é o
       dev na aba Técnicos — assumir o e-mail aqui não o torna aprovado. */
    else if(!eq.tecnicoEmail){eq.tecnicoEmail=em;await DB.set(kEq(eqSlug),eq)}
  }else if(perfil==='pro'){
    const cod=(codigoPro||'').toUpperCase().replace(/\s/g,'');
    const aceito=cod===CODIGO_PRO.toUpperCase()||(eq&&eq.codigoPro&&cod===String(eq.codigoPro).toUpperCase());
    if(!aceito)return abortar('Código PRO inválido');
    /* PRO avulso vira DONO da equipe que ele mesmo cria — é o que permite a
       auto-aprovação pela regra. Entrar numa equipe já existente segue pendente. */
    if(!eq){eq=await criarEquipe(em);criouEquipe=true;}
    nivelFinal='Master';
  }else{
    /* cadastro livre: não precisa de liberação prévia. Entra pendente e o
       técnico (ou PRO em gestão) aprova depois. CPF é opcional. */
    if(!eq)return abortar('Equipe não encontrada. Confira o nome com seu técnico.');
    if(cpf&&!cpfValido(cpf))return abortar('CPF inválido');
    nivelFinal=nivel||'Master';
  }

  /* o id do perfil é o uid do Firebase — é ele que amarra a privacidade
     dos dados PRO (só o dono lê pro_<uid>). */
  /* P0: NINGUÉM nasce aprovado. Entrar na equipe passa a exigir confirmação —
     do técnico (atleta) ou do dev (técnico). A única auto-aprovação possível é
     a de quem é DONO da equipe, e ela acontece no passo seguinte, porque a
     regra do Firestore confere o dono no documento da equipe. */
  const donoDaEquipe=criouEquipe;
  const u={id:cred.user.uid,perfil,equipe:eqSlug,equipeNome:eq?eq.nome:equipe.trim(),nome:nome.trim(),
    email:em,nascimento,idade:id,telefone:soDig(telefone),
    tipo:perfil==='tecnico'?null:(tipo||'piscina'),cpf:cpfLimpo(cpf||''),
    nivel:perfil==='tecnico'?null:nivelFinal,ativo:true,aprovado:false,criadoEm:Date.now()};
  await DB.set(kUser(u.email),u);
  if(donoDaEquipe){ u.aprovado=true; await DB.set(kUser(u.email),u); }
  const us=await DB.get(kEqUsers(eqSlug))||[]; if(!us.includes(u.email)){us.push(u.email);await DB.set(kEqUsers(eqSlug),us)}
  if(perfil==='tecnico')await registrarTecnicoDev(u);
  try{ await cred.user.sendEmailVerification(); }catch(_){}   /* confirma o e-mail por link */
  await entrarSessao(u);
  toast(u.aprovado?'Conta criada! Enviei um link de confirmação ao seu e-mail.':(perfil==='tecnico'?'Cadastro enviado. Confirme o e-mail e aguarde a liberação do desenvolvedor.':'Cadastro enviado! Confirme o e-mail e aguarde a liberação do técnico.'));
}
/* fila global de técnicos, para o desenvolvedor enxergar e liberar */
async function registrarTecnicoDev(u){
  const lst=await DB.get('dev_tecnicos')||[];
  if(!lst.some(x=>x.email===u.email)){ lst.push({email:u.email,nome:u.nome,equipeNome:u.equipeNome,em:Date.now()}); await DB.set('dev_tecnicos',lst); }
}

async function autenticarFB(email,senha){

  const u=await DB.get(kUser(em));
  if(!u){ await fauth.signOut(); return toast('Conta sem perfil. Refaça o cadastro.'); }
  if(u.ativo===false){ await fauth.signOut(); return toast('Conta desativada pelo técnico'); }
  await entrarSessao(u); toast('Bom treino, '+prim(u.nome)+'!');
}

async function cadastrar(dados){
  if(FB)return cadastrarFB(dados);
  const {perfil,equipe,nome,email,nascimento,telefone,senha,senha2,tipo,cpf,codigoPro,nivel}=dados;
  if(!equipe)return toast('Informe o nome da equipe');
  if(!nome||nome.split(/\s+/).length<2)return toast('Informe nome e sobrenome');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return toast('E-mail inválido');
  const id=idadeDe(nascimento);
  if(!nascimento||id==null||id<8||id>110)return toast('Data de nascimento inválida');
  if(!telValido(telefone))return toast('Telefone inválido — use DDD + número');
  if(!senhaForte(senha))return toast('Senha: 6 a 8 caracteres, com 1 maiúscula, 1 minúscula e 1 símbolo (#$%!@)');
  if(senha!==senha2)return toast('As senhas não conferem');
  if(await DB.get(kUser(email)))return toast('Já existe conta com este e-mail');

  const eqSlug=slug(equipe);
  let eq=await DB.get(kEq(eqSlug));
  let nivelFinal=nivel||'Master';

  async function criarEquipe(dono){
    const nova={slug:eqSlug,nome:equipe.trim(),criadoEm:Date.now(),tecnicoEmail:dono,codigoPro:CODIGO_PRO};
    await DB.set(kEq(eqSlug),nova); await DB.set(kLib(eqSlug),[]);
    await DB.set(kTrIdx(eqSlug),[]); await DB.set(kCIdx(eqSlug),[]);
    if(typeof registrarEquipeDev==='function')await registrarEquipeDev(eqSlug);
    return nova;
  }

  if(perfil==='tecnico'){
    if(!eq)eq=await criarEquipe(email.toLowerCase());
    else if(!eq.tecnicoEmail){eq.tecnicoEmail=email.toLowerCase();await DB.set(kEq(eqSlug),eq)}
  }else if(perfil==='pro'){
    /* O PRO não depende de liberação do técnico: a tranca é o código mestre. */
    const cod=(codigoPro||'').toUpperCase().replace(/\s/g,'');
    const aceito=cod===CODIGO_PRO.toUpperCase()||(eq&&eq.codigoPro&&cod===String(eq.codigoPro).toUpperCase());
    if(!aceito)return toast('Código PRO inválido');
    if(!eq)eq=await criarEquipe(null);   /* equipe nasce sem técnico; ele entra depois */
    nivelFinal='Master';
  }else{
    if(!eq)return toast('Equipe não encontrada. Confira o nome com seu técnico.');
    if(cpf&&!cpfValido(cpf))return toast('CPF inválido');
    nivelFinal=nivel||'Master';
  }

  const sal=novoSal();
  const em=email.toLowerCase();
  const aprovInicial=perfil==='pro'?true:(perfil==='tecnico'?(DEV_EMAILS.includes(em)||(((await DB.get('dev_pre'))||[]).includes(em))):false);
  const u={id:uid(),perfil,equipe:eqSlug,equipeNome:eq?eq.nome:equipe.trim(),nome:nome.trim(),
    email:em,nascimento,idade:id,telefone:soDig(telefone),sal,senha:await hash(senha,sal),
    tipo:perfil==='tecnico'?null:(tipo||'piscina'),cpf:cpfLimpo(cpf||''),nivel:perfil==='tecnico'?null:nivelFinal,
    ativo:true,aprovado:aprovInicial,criadoEm:Date.now()};
  await DB.set(kUser(u.email),u);
  const us=await DB.get(kEqUsers(eqSlug))||[]; us.push(u.email); await DB.set(kEqUsers(eqSlug),us);
  if(perfil==='tecnico')await registrarTecnicoDev(u);
  await entrarSessao(u);
  toast(u.aprovado?'Conta criada. Bem-vindo!':(perfil==='tecnico'?'Cadastro de técnico enviado. Aguarde a liberação do desenvolvedor.':'Cadastro enviado! Aguarde a liberação do técnico.'));
}

async function autenticar(email,senha){

/* ---------- recuperação de senha ---------- */
async function pedirReset(email){
  if(FB){
    const em=(email||'').toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return toast('E-mail inválido');
    try{ await fauth.sendPasswordResetEmail(em); toast('Enviamos um link de recuperação para '+em); }
    catch(e){ toast(traduzErroFB(e.code)); }
    return;
  }
  const u=await DB.get(kUser((email||'').toLowerCase()));
  if(!u)return toast('E-mail não cadastrado');
  const tok=uid()+uid();
  await DB.set(kTok(tok),{email:u.email,exp:Date.now()+1000*60*60*2});
  /* PONTO DE INTEGRAÇÃO: aqui o back-end envia o e-mail com o link abaixo. */
  const link=location.origin+location.pathname+'#recuperar='+tok;
  sheet(`<h2>Link de recuperação</h2>
    <p class="small muted" style="margin:8px 0 12px">Válido por 2 horas. Na versão publicada este link chega no e-mail
    <b>${esc(u.email)}</b> automaticamente. Enquanto o envio não está ligado, copie e abra o endereço abaixo.</p>
    <textarea id="rcLink" style="min-height:70px;font-size:12.5px">${esc(link)}</textarea>
    <button class="full primary" style="margin-top:10px" onclick="copiarTexto('rcLink')">Copiar link</button>
    <button class="full ghost" style="margin-top:8px" onclick="S.vista='reset';S.tok='${tok}';fecharSheet();render()">Redefinir agora</button>`);
}
async function aplicarReset(tok,senha,senha2){
  if(!senha||senha.length<6)return toast('Mínimo de 6 caracteres');
  if(senha!==senha2)return toast('As senhas não conferem');
  const t=await DB.get(kTok(tok));
  if(!t)return toast('Link inválido');
  if(Date.now()>t.exp)return toast('Link expirado — peça outro');
  const u=await DB.get(kUser(t.email)); if(!u)return toast('Conta não encontrada');
  u.sal=novoSal(); u.senha=await hash(senha,u.sal);
  await DB.set(kUser(u.email),u); await DB.set(kTok(tok),null);
  toast('Senha redefinida'); S.vista='entrada'; S.perfilEscolhido=null; render();
}
function copiar(t){
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Copiado'),()=>toast('Copie manualmente'));
  else toast('Copie manualmente');
}

/* =====================================================================
   CARGA DE DADOS
   ===================================================================== */
async function carregarDados(){
  if(!S.u)return;
  const eq=S.u.equipe;
  S.tridx=await DB.get(kTrIdx(eq))||[];
  S.cidx=await DB.get(kCIdx(eq))||[];
  /* de-duplica o índice de competições por id (recuperações/fusões antigas podiam repetir) */
  {const vis=new Set(),lim=[]; for(const c of S.cidx){ if(c&&c.id&&!vis.has(c.id)){vis.add(c.id);lim.push(c);} }
   if(lim.length!==S.cidx.length){ S.cidx=lim; try{await DB.set(kCIdx(eq),lim);}catch(_){}} }
  S.libs=await DB.get(kLib(eq))||[];
  const emails=await DB.get(kEqUsers(eq))||[];
  const elenco=[];
  for(const em of emails){const u=await DB.get(kUser(em)); if(u&&u.perfil!=='tecnico')elenco.push(u)}
  S.elenco=elenco.sort((a,b)=>a.nome.localeCompare(b.nome));
  const meus=ehGestor()?S.tridx:S.tridx.filter(t=>(t.para||[]).includes(S.u.id));
  /* atualiza o treino/competição ABERTO (mostra edições remotas) sem jogar
     de volta pro primeiro da lista — era o que causava o "volta sozinho". */
  if(S.treino){const t2=await DB.get(kTr(eq,S.treino.id)); if(t2)S.treino=t2;}
  else if(meus[0])S.treino=await DB.get(kTr(eq,meus[0].id));
  if(S.comp){const c2=await DB.get(kCmp(eq,S.comp.id)); if(c2)S.comp=c2;}
  else if(S.cidx[0])S.comp=await DB.get(kCmp(eq,S.cidx[0].id));
  if(temPro()&&!S.laudoAtleta)S.pro=await DB.get(kPro(S.u.id))||{pbs:{},garmin:[],seco:[],resultados:[],exames:[],bioimp:[]};
  S.tecnico=(S.u.perfil!=='tecnico'&&S.eq?.tecnicoEmail)?await DB.get(kUser(S.eq.tecnicoEmail)):null;
}
async function sincronizar(sil){
  if(!S.u)return;
  /* não interrompe quem está escrevendo treino ou com uma folha aberta */
  if(sil&&(S.sub==='novo'||S.escrevendo||document.getElementById('sheet')?.classList.contains('on')))return;
  const u=await DB.get(kUser(S.u.email)); if(u)S.u=u;
  await carregarDados(); if(!sil)toast('Atualizado'); render();
}
setInterval(()=>{if(S.u&&!S.escrevendo)sincronizar(true)},12000);

/* Sincronia instantânea (Firebase): qualquer alteração feita por outra
   pessoa recarrega os dados aqui em ~0,3s. Ignora os ecos das próprias
   gravações. Fica ligada uma vez, após o login. */
let _fbSnap=null,_fbTimer=null;
function ligarSincronia(){
  if(!FB||_fbSnap)return;
  _fbSnap=fdb.collection('kv').onSnapshot(s=>{
    if(s.metadata.hasPendingWrites||S.escrevendo)return;
    clearTimeout(_fbTimer); _fbTimer=setTimeout(()=>{if(S.u&&!S.escrevendo)sincronizar(true)},350);
  },e=>console.warn('sync',e.message));
}
async function salvarPro(){
  if(!(S.u&&temPro()))return;
  await DB.set(kPro(S.u.id),S.pro);
  /* snapshot visível ao técnico (desempenho + carga + composição p/ a assinatura de sprint;
     SEM Saúde: Garmin (VFC/sono) e exames laboratoriais ficam só no pro_ privado) */
  if(S.u.equipe)await DB.set(kPerf(S.u.equipe,S.u.id),{nome:S.u.nome,nivel:S.u.nivel||null,
    pbs:S.pro.pbs||{},resultados:S.pro.resultados||[],seco:S.pro.seco||[],alvos:S.pro.alvos||null,
    bioimp:S.pro.bioimp||[],prontidao:(typeof prontidaoSubj==='function'?prontidaoSubj(7):null),at:Date.now()});
}

/* =====================================================================
   INTERPRETADOR DE TREINO
   ===================================================================== */
const ESTILOS=[[/borbol|golfin|\bfly\b|\bbf\b/i,'borboleta'],[/costas?|\bcs\b/i,'costas'],
 [/peito|\bpt\b|bruç/i,'peito'],[/medley|\bmd\b|4\s*estilos/i,'medley'],[/livre|crawl|\bcr\b|\bfr\b/i,'livre']];
const RECURSOS=[[/pernad|perna|kick/i,'pernada'],[/braçad|braço|pull/i,'braçada'],[/educativ|técnic|drill/i,'técnica'],
 [/palmar|paddle/i,'palmar'],[/saíd|partida|start/i,'saída'],[/vira|turn/i,'virada'],[/filipin|pullout|submers/i,'filipina'],
 [/progressiv/i,'progressivo'],[/boia|pull\s*buoy/i,'boia']];
const CABECA=/^(aquecimen|aquec|warm|ativa|t[ée]cnic|educativ|parte\s*princip|principal|s[ée]rie|conjunto|main|set\b|tiros?\b|velocidad|aer[óo]bi|limiar|soltura|volta[\s-]*[àa]?\s*calma|volta calma|desaquec|pr[ée][\s-]*principal|complemento|final|regenerat|poliment|core|seco|dryland|travessia|simula|prepara|recupera|trote|bloco\s+princip|prova\s*teste|teste\s*de\s*prova)/i;

function interpretar(txt){
  const blocos=[]; let atual={id:uid(),titulo:'TREINO',itens:[]}; let mult=1;
  const notaPref=/^(obs|observ|nota|aten|import|lembr|foco|dica)\b/i;
  const multLine=/^(\d{1,2})\s*[x×]\s*:?\s*$/i;   /* "2x", "2x:", "3 x" sozinho = o bloco repete N vezes */
  for(const raw of (txt||'').split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    const ehHeader=!notaPref.test(l)&&CABECA.test(l);
    if(ehHeader){
      if(atual.itens.length)blocos.push(atual);
      atual={id:uid(),titulo:l.replace(/[:•\-–]+\s*$/,'').toUpperCase(),itens:[]}; mult=1;  /* novo bloco zera o multiplicador */
      /* a linha de cabeçalho só vira TAMBÉM um item se traz uma série explícita (NxDist),
         ex.: "Principal 8x50". Um título com número solto ("Simulação — 200 Livre") é só título. */
      if(!/\d{1,3}\s*[x×]\s*\d{2,5}/.test(l))continue;
    }
    const mm=l.match(multLine);
    if(mm){ mult=Math.min(+mm[1],12)||1; continue; }   /* linha "Nx" define o multiplicador do bloco */
    /* linha que é só descanso/observação vira NOTA (não se perde) */
    const soRest=/^(descanso|pausa|rest|intervalo|recupera)/i.test(l)&&!/\d\s*[x×]\s*\d/.test(l);
    const it=soRest?null:linhaParaItem(l);
    if(it){ if(mult>1){it.rodadas=Math.min((it.rodadas||1)*mult,12); it.vol=(it.rodadas||1)*it.reps*it.dist;} atual.itens.push(it); }
    else if(!ehHeader)atual.itens.push({id:uid(),nota:true,texto:l,vol:0});
  }
  if(atual.itens.length)blocos.push(atual);
  return blocos.length?blocos:[{id:uid(),titulo:'TREINO',itens:[]}];
}
/* descanso em vários formatos → milissegundos */
function parsePausa(l){
  let m=l.match(/(?:pausa|rest|descanso|recup\w*)\s*(?:de\s*)?(\d{1,3})\s*(?:'|min|m\b)/i);
  if(m)return +m[1]*60000;
  m=l.match(/(?:pausa|rest|descanso|recup\w*)\s*(?:de\s*)?(\d{1,3})\s*(?:["″]|s\b|seg\w*)?/i);
  if(m)return +m[1]*1000;
  m=l.match(/(\d{1,3})\s*["″]\s*(?:de\s*)?(?:pausa|descanso)/i);
  if(m)return +m[1]*1000;
  return null;
}
function fmtPausa(ms){ const s=Math.round(ms/1000); if(s>=60){const m=Math.floor(s/60),r=s%60;return r?`${m}min${r}`:`${m}min`;} return s+'s'; }
function linhaParaItem(l){
  let rodadas=1,reps=1,dist=null;
  /* série dupla: "2x 4x50" → 2 rodadas de 4×50 */
  const m2=l.match(/(\d{1,2})\s*[x×]\s*(\d{1,3})\s*[x×]\s*(\d{2,5})/i);
  const mx=l.match(/(\d{1,3})\s*[x×]\s*(\d{2,5})/i);
  if(m2){rodadas=Math.min(+m2[1],12)||1;reps=+m2[2];dist=+m2[3]}
  else if(mx){reps=+mx[1];dist=+mx[2]}
  else{const md=l.match(/(?:^|[^\d.,:'])(\d{2,5})\s*(m\b|mts?\b|metros)?/i); if(md&&+md[1]>=25)dist=+md[1];else return null}
  if(!dist||dist<20)return null;
  let estilo='livre'; for(const[re,v]of ESTILOS){if(re.test(l)){estilo=v;break}}
  const tags=[]; for(const[re,v]of RECURSOS){if(re.test(l))tags.push(v)}
  let intervalo=null;
  const mi=l.match(/(?:sa[íi]da|int\.?|s\/|@|c\/)\s*(\d{1,2})\s*[:'′h]\s*(\d{2})/i)||l.match(/(\d{1,2})\s*[:'′h]\s*(\d{2})(?!\d)/);
  if(mi)intervalo=(+mi[1]*60+ +mi[2])*1000;
  const forte=/máxim|maxim|all\s*out|tiro|forte|sprint|ritmo de prova|\brp\b|9[0-9]\s*%|100\s*%/i.test(l);
  const parcial=/parcia|broken|quebrad|25\s*a\s*25|split/i.test(l)||(forte&&dist>=50&&dist<=100);
  const mo=l.match(/\(([^)]+)\)/); const obs=mo?mo[1].trim():'';
  return{id:uid(),rodadas,reps,dist,estilo,tags,intervalo,pausa:parsePausa(l),parcial,forte,obs,texto:l,vol:rodadas*reps*dist};
}
const volTreino=t=>(t.blocos||[]).reduce((a,b)=>a+b.itens.reduce((x,i)=>x+i.vol,0),0);
const piscinaLabel=p=>p==='AA'?'águas abertas':p==='LC50'?'piscina 50m':'piscina 25m';
/* aplica as regras de parcial de 25m conforme o tipo de treino:
   - águas abertas: sem parcial (usa ritmo /100m);
   - piscina 25m: mantém a parcial detectada nos tiros, se o técnico quiser;
   - piscina 50m: só nos tiros da SÉRIE PRINCIPAL, e só se o técnico quiser. */
function aplicarParciais(blocos,piscina,parcial25){
  const principalRe=/principal|série|serie|main|conjunto/i;
  for(const b of blocos){
    const ehPrincipal=principalRe.test(b.titulo||'');
    for(const it of b.itens){
      if(piscina==='AA')it.parcial=false;
      else if(piscina==='LC50')it.parcial=!!(it.parcial&&parcial25&&ehPrincipal);
      else it.parcial=!!(it.parcial&&parcial25);
    }
  }
}

/* =====================================================================
   MARCAS E ZONAS
   ===================================================================== */
const pbKey=(d,e,p)=>`${d} ${e} ${p||'SC25'}`;
function pbDe(dados,dist,estilo){
  if(!dados)return null;
  const p=dados.pbs||{};
  const c=Object.entries(p).filter(([k])=>{const[d,e]=k.split(' ');return +d===dist&&e===estilo}).map(([,v])=>v);
  if(c.length)return Math.min(...c);
  const p50=Object.entries(p).find(([k])=>k.startsWith(`50 ${estilo}`));
  if(p50&&dist>=25){const b=p50[1];
    if(dist===25)return b*.465; if(dist===100)return b*2.22; if(dist===200)return b*4.75;
    return b*(dist/50)*1.06}
  return null;
}
/* Zonas por %PB (velocidade relativa ao seu melhor tempo — é o que o app mede).
   Aproxima as zonas aeróbias A1/A2/A3 (base→ritmo→potência) e o ritmo de prova.
   Os cortes de %PB podem ser calibrados. */
function zona(p){ if(p==null)return null;
  if(p>=96)return{n:'ritmo de prova',c:'z4',dsc:'sprint / velocidade máxima'};
  if(p>=90)return{n:'A3',c:'z3',dsc:'potência aeróbica (perto do limiar)'};
  if(p>=84)return{n:'A2',c:'z2',dsc:'ritmo (aeróbico médio)'};
  return{n:'A1',c:'z1',dsc:'base aeróbica (leve)'} }
const ZONAS_INFO='Zonas por velocidade (%PB): A1 base aeróbica (leve) · A2 ritmo · A3 potência aeróbica (perto do limiar) · ritmo de prova = sprint. %PB = seu tempo em relação ao seu melhor — quanto mais perto de 100%, mais rápido.';

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
/* agrupa treinos por Ano → Mês, com mês recolhível (o mais recente já aberto) */
function grupoTreinos(lista,cardFn){
  if(!lista.length)return'';
  const ord=[...lista].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  if(S.mesAberto==null)S.mesAberto={[(ord[0].data||'').slice(0,7)]:true};
  const anos={};
  for(const t of ord){ const y=(t.data||'').slice(0,4)||'—',m=(t.data||'').slice(5,7)||'--';
    (anos[y]=anos[y]||{}); (anos[y][m]=anos[y][m]||[]).push(t); }
  let html='';
  for(const y of Object.keys(anos).sort((a,b)=>b.localeCompare(a))){
    html+=`<div class="blk" style="margin-top:14px"><h3>${y}</h3><div class="ln"></div></div>`;
    for(const m of Object.keys(anos[y]).sort((a,b)=>b.localeCompare(a))){
      const key=y+'-'+m, arr=anos[y][m], aberto=!!S.mesAberto[key];
      html+=`<button class="card tight lst" style="width:100%;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--deck)" onclick="S.mesAberto=Object.assign({},S.mesAberto,{'${key}':${!aberto}});render()">
        <span class="grow" style="text-align:left"><b style="text-transform:capitalize">${MESES[+m-1]||m}</b> <span class="xs muted">· ${arr.length} treino${arr.length>1?'s':''}</span></span>
        <span class="tag o">${aberto?'▲ recolher':'▼ ver'}</span></button>`;
      if(aberto)html+=arr.map(cardFn).join('');
    }
  }
  return html;
}
/* Calendário mês a mês (visão do técnico): marca os dias com treino; tocar no dia
   abre os treinos daquele dia. Mais organizado que a lista longa. */
function calendarioTreinos(lista,cardFn,criarFn){
  const porDia={}; for(const t of lista){const d=t.data||''; if(d)(porDia[d]=porDia[d]||[]).push(t);}
  if(!S.calYM){S.calYM=(lista.length?[...lista].sort((a,b)=>(b.data||'').localeCompare(a.data||''))[0].data:hoje()).slice(0,7);}
  const Y=+S.calYM.slice(0,4), M=+S.calYM.slice(5,7);
  const inicioSemana=new Date(Y,M-1,1).getDay(), diasNoMes=new Date(Y,M,0).getDate(), hj=hoje();
  const nav=dl=>{let y=Y,m=M+dl; if(m<1){m=12;y--} if(m>12){m=1;y++} return y+'-'+String(m).padStart(2,'0');};
  const cell=d=>{const ds=`${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`, arr=porDia[ds]||[], sel=S.calDia===ds, eHoje=ds===hj;
    const bg=sel?'var(--ink)':arr.length?'var(--deck)':'transparent', cor=sel?'var(--deck)':'inherit';
    return`<button onclick="S.calDia='${ds}';render()" style="aspect-ratio:1;border:1px solid ${eHoje?'var(--water)':'var(--line)'};border-radius:10px;background:${bg};color:${cor};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0">
      <span style="font-size:13px;font-weight:${arr.length?'800':'400'}">${d}</span>
      ${arr.length?`<span style="font-size:8px;line-height:1;color:${sel?'var(--deck)':'var(--water)'}">●${arr.length>1?arr.length:''}</span>`:''}</button>`;};
  let cells=''; for(let i=0;i<inicioSemana;i++)cells+='<div></div>'; for(let d=1;d<=diasNoMes;d++)cells+=cell(d);
  const doDia=S.calDia?(porDia[S.calDia]||[]):null;
  return`<div class="card">
    <div class="row" style="align-items:center;margin-bottom:10px">
      <button class="sm ghost" onclick="S.calYM='${nav(-1)}';S.calDia=null;render()">‹</button>
      <div class="grow" style="text-align:center;font-weight:800;text-transform:capitalize">${MESES[M-1]} ${Y}</div>
      <button class="sm ghost" onclick="S.calYM='${nav(1)}';S.calDia=null;render()">›</button></div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:10px;color:var(--ink-2);margin-bottom:5px">${['dom','seg','ter','qua','qui','sex','sáb'].map(n=>`<div>${n}</div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div></div>
  ${S.calDia?`<div class="blk" style="margin-top:12px"><h3 style="text-transform:capitalize">${brData(S.calDia)}</h3><div class="ln"></div></div>
    ${doDia.length?doDia.map(cardFn).join(''):`<div class="small muted" style="margin:10px 0;text-align:center">Nenhum treino nesse dia.${criarFn?`<br><button class="sm ghost" style="margin-top:6px" onclick="${criarFn}('${S.calDia}')">+ Adicionar treino nesse dia</button>`:''}</div>`}`
    :`<div class="small muted" style="margin-top:12px;text-align:center">Toque num dia para ver os treinos.</div>`}`;
}

function marcarTodosNivel(){

let TREINOPDF=null;
function fileTreinoPDF(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const p=document.getElementById('ntPdfPrev');
  if(f.type!=='application/pdf'){ if(p)p.textContent='Escolha um arquivo PDF.'; return; }
  if(f.size>600000){ TREINOPDF=null; if(p)p.textContent='PDF muito grande (máx 600KB).'; return; }
  const r=new FileReader(); r.onload=()=>{ TREINOPDF=r.result; if(p)p.textContent='PDF anexado ✓'; }; r.readAsDataURL(f);
}
async function salvarTreino(){
  const data=val('ntData')||hoje(),titulo=val('ntTitulo')||'Treino',
    nivel=document.getElementById('ntNivel').value,texto=document.getElementById('ntTexto').value;
  const piscina=document.getElementById('ntPiscina').value;
  const parcial25=document.getElementById('ntParcial25').value==='1';
  const editando=S.editando&&S.treino;
  const pdf=TREINOPDF||(editando&&S.treino.pdf)||null;
  if(!texto.trim()&&!pdf)return toast('Cole o treino ou anexe um PDF');
  if(!S.selMulti.length)return toast('Escolha ao menos um atleta');
  const id=editando?S.treino.id:uid();
  const blocos=interpretar(texto);
  aplicarParciais(blocos,piscina,parcial25);
  const t={id,data,titulo,nivel,piscina,parcial25,textoBruto:texto,blocos,pdf,para:[...S.selMulti],
    registros:editando?(S.treino.registros||{}):{},autor:S.u.nome,
    criadoPor:editando?(S.treino.criadoPor||null):S.u.id,atualizado:Date.now()};
  await DB.set(kTr(S.u.equipe,id),t);
  const idx=(await DB.get(kTrIdx(S.u.equipe))||[]).filter(x=>x.id!==id);
  idx.unshift({id,data,titulo,nivel,vol:volTreino(t),para:t.para,nAtletas:t.para.length});
  idx.sort((a,b)=>b.data.localeCompare(a.data));
  await DB.set(kTrIdx(S.u.equipe),idx);
  S.tridx=idx; S.treino=t; S.sub='detalhe'; S.editando=false; S.rascunho=null; TREINOPDF=null; S.pilha.pop();
  toast(`${t.blocos.reduce((n,b)=>n+b.itens.length,0)} séries · ${t.para.length} atleta(s)`);
  render();
}
async function abrirTreino(id){

function temposDoAtleta(t,atId){const r=t&&t.registros&&t.registros[atId]; if(!r)return false;
  return Object.values(r).some(x=>(x.tempos&&x.tempos.some(v=>v!=null))||(x.rd&&x.rd.some(rr=>(rr.tempos||[]).some(v=>v!=null)))||x.ritmo100!=null);}
/* treino "feito": marcado explicitamente, ou tem tempos lançados (e não foi desmarcado) */
function treinoFeito(t,atId){ if(t&&t.feito&&t.feito[atId]===true)return true; if(t&&t.feito&&t.feito[atId]===false)return false; return temposDoAtleta(t,atId); }
async function toggleFeito(treinoId,atId){
  const t=await DB.get(kTr(S.u.equipe,treinoId))||S.treino;

}

/* nº de rodadas EFETIVO: do interpretador (item.rodadas) OU adicionadas à mão
   pelo atleta/técnico (rec.nrd). Assim dá para lançar 2ª/3ª rodada em qualquer série. */
function nRodadas(item,rec){ return Math.max((rec&&rec.nrd)||1,(item&&item.rodadas)||1,1); }
/* tempos de um item (achata rodadas quando há mais de uma) */
function temposItem(rec,item){
  if(!rec)return [];
  if(rec.rd&&nRodadas(item,rec)>1)return (rec.rd||[]).flatMap(r=>(r.tempos||[]).filter(x=>x!=null));
  return (rec.tempos||[]).filter(x=>x!=null);
}
function linhaSerie(t,i,at,blocoSolto){
  if(i.nota)return`<div style="margin:2px 0 9px;padding:9px 12px;border-left:3px solid var(--rope);background:var(--deck);border-radius:0 9px 9px 0">
    <span class="small">${esc(i.texto)}</span></div>`;
  const rec=(t.registros?.[at.id]?.[i.id])||{};
  const aa=t.piscina==='AA';
  const nrd=nRodadas(i,rec), multi=nrd>1&&!aa;
  const rds=multi?Array.from({length:nrd},(_,k)=>(rec.rd&&rec.rd[k])||{tempos:[],parciais:[]}):null;
  /* sem botão só em NADO SOLTO (aquecimento/soltura contínuo, 1 repetição);
     educativos/técnica e qualquer série com repetições ganham "+". Um esforço cronometrado
     (parcial/forte/simulação) SEMPRE ganha o botão, mesmo se o bloco foi rotulado como solto —
     conserta treinos já salvos com a estrutura de blocos antiga. */
  const semCrono=!!blocoSolto&&(i.reps||1)<=1&&(i.rodadas||1)<=1&&!i.parcial&&!i.forte;
  const ts=temposItem(rec,i);
  const logged=aa?(rec.ritmo100!=null):ts.length;
  const dadosPB=at.id===S.u.id?S.pro:null;
  const mel=ts.length?Math.min(...ts):null;                                  /* só p/ destacar o melhor tiro */
  const med=ts.length?ts.reduce((a,b)=>a+b,0)/ts.length:null;                /* %PB da SÉRIE = média dos tiros */
  const pbSerie=dadosPB?(pbDe(dadosPB,i.dist,i.estilo)||0):0;
  const pct=(!aa&&pbSerie&&med)?(pbSerie/med*100)||null:null;
  const pctMel=(!aa&&pbSerie&&mel)?(pbSerie/mel*100)||null:null;
  const z=zona(pct);
  /* "+" para anotar tempo em QUALQUER série; só aquecimento/soltura ficam sem botão */
  const botao=semCrono?''
    :`<button class="sm ghost" style="font-weight:800;font-size:18px;line-height:1;padding:6px 12px${logged?'':';color:var(--water)'}" title="${logged?'editar tempos':'registrar tempo'}" onclick="S.rd=0;abrirLancamento('${i.id}','${at.id}')">${logged?'✎':'+'}</button>`;
  const chips=aa
    ? (rec.ritmo100!=null?`<div class="chips"><span class="chip">ritmo /100m · ${fmt(rec.ritmo100,true)}</span></div>`:'')
    : multi
      ? rds.map((r,ri)=>(r.tempos||[]).some(x=>x!=null)?`<div class="chips" style="margin-top:4px"><span class="chip" style="background:var(--deck);font-weight:800">R${ri+1}</span>${(r.tempos||[]).map((x,ix)=>{ if(x==null)return''; const pa=r.parciais&&r.parciais[ix]; const extra=Array.isArray(pa)?` <span style="color:var(--water)">(${pa.map((v,k)=>v==null?'—':fmt(k===0?v:v-pa[k-1],true)).join(' · ')})</span>`:''; return`<span class="chip ${x===mel?'best':''}">${fmt(x,true)}${extra}</span>`;}).join('')}</div>`:'').join('')
      : (ts.length?`<div class="chips">${(rec.tempos||[]).map((x,ix)=>{ if(x==null)return'';
        const pa=rec.parciais&&rec.parciais[ix];
        const extra=Array.isArray(pa)
          ? ` <span style="color:var(--water)">(${pa.map((v,k)=>v==null?'—':fmt(k===0?v:v-pa[k-1],true)).join(' · ')})</span>`
          : (i.parcial&&pa!=null?` <span style="color:var(--water)">(${fmt(pa,true)}+${fmt(x-pa,true)})</span>`:'');
        return`<span class="chip ${x===mel?'best':''}">${ix+1}· ${fmt(x,true)}${extra}</span>`;}).join('')}</div>`:'');
  return`<div class="item ${logged?'sel':''}">
    <div class="row" style="align-items:baseline;flex-wrap:wrap;gap:6px">
      <span class="grow" style="min-width:58%"><b>${esc(i.texto||((i.rodadas>1?i.rodadas+'x ':'')+(i.reps>1?i.reps+'×':'')+i.dist+' '+i.estilo))}</b></span>
      ${z?`<span class="z ${z.c}" title="${pct.toFixed(0)}% do PB — média dos ${ts.length} tiro(s) da série${pctMel?` · melhor tiro ${pctMel.toFixed(0)}%`:''}">${pct.toFixed(0)}%</span>`:''}
      ${botao}
    </div>
    ${chips}
  </div>`;
}

/* intervalos de parcial válidos p/ uma distância (25/50/100 que dividem e são < dist) */
function intervalosValidos(dist){ return [25,50,100].filter(iv=>iv<dist&&dist%iv===0); }
/* série que aceita parciais por passagem (marcada como parcial, com ao menos 1 intervalo válido) */
function splitElegivel(item,piscina){
  return !!(piscina!=='AA'&&item&&item.parcial&&item.dist>=50&&intervalosValidos(item.dist).length);
}
/* intervalo escolhido: escolha atual (S.splitReg) > inferido do array salvo (dist/nº passagens)
   > padrão (50m se válido, senão o menor válido, ex.: 25m no 50m). */
function intervaloSplit(itemId,item,rec){
  const opts=intervalosValidos(item.dist);
  const pref=S.splitReg&&S.splitReg[itemId];
  if(pref&&opts.includes(pref))return pref;
  const arr=rec&&Array.isArray(rec.parciais)?rec.parciais.find(a=>Array.isArray(a)):null;
  if(arr&&arr.length){ const iv=item.dist/arr.length; if(opts.includes(iv))return iv; }
  return opts.includes(50)?50:opts[0];
}
function setSplitInt(itemId,atletaId,iv){ S.splitReg=S.splitReg||{}; S.splitReg[itemId]=iv; abrirLancamento(itemId,atletaId); }
/* lançamento com parciais por passagem (tempos ACUMULADOS); escolha 50m ou 100m */
function abrirSplits(itemId,atletaId,item,at,rec){
  const reps=item.reps||1, iv=intervaloSplit(itemId,item,rec), np=item.dist/iv;
  const opts=intervalosValidos(item.dist);
  const nrd=nRodadas(item,rec);
  if(S.rd==null||S.rd<0||S.rd>=nrd)S.rd=0;
  /* com rodadas, edita a rodada atual (rec.rd[S.rd]); sem rodadas, o próprio rec */
  const alvo=nrd>1?((rec.rd&&rec.rd[S.rd])||{tempos:[],parciais:[]}):rec;
  const par=(alvo&&Array.isArray(alvo.parciais))?alvo.parciais:[];
  const toggle=opts.length>1?`<div class="eyebrow" style="margin-top:8px">parcial a cada</div><div class="opt" style="margin:6px 0 4px">
    ${opts.map(o=>`<button class="${iv===o?'on':''}" onclick="setSplitInt('${itemId}','${atletaId}',${o})">${o}m</button>`).join('')}</div>`:'';
  const abas=nrd>1?`<div class="row" style="gap:6px;margin:8px 0;flex-wrap:wrap">
    ${Array.from({length:nrd},(_,ri)=>{const feito=rec.rd&&rec.rd[ri]&&(rec.rd[ri].tempos||[]).some(x=>x!=null);return`<button class="sm ${ri===S.rd?'primary':'ghost'}" onclick="S.rd=${ri};abrirLancamento('${itemId}','${atletaId}')">Rodada ${ri+1}${feito?' ✓':''}</button>`}).join('')}
  </div>`:'';
  const corpo=Array.from({length:reps},(_,r)=>{
    const arr=(Array.isArray(par[r])&&par[r].length===np)?par[r]:[];   /* só pré-preenche se o intervalo bate */
    const inputs=Array.from({length:np},(_,k)=>`<div class="field" style="margin:0"><label>${(k+1)*iv}m</label>
      <input inputmode="decimal" id="sp_${r}_${k}" placeholder="—" value="${arr[k]!=null?fmt(arr[k],true):''}"></div>`).join('');
    return`${reps>1?`<div class="eyebrow" style="margin-top:12px">repetição ${r+1}</div>`:''}<div class="grid2">${inputs}</div>`;
  }).join('');
  sheet(`<h2>${reps>1?reps+'×':''}${item.dist} ${item.estilo}${nrd>1?' · rodada '+(S.rd+1):''}</h2>
    <div class="small muted">${esc(at.nome)} · parciais a cada ${iv}m${nrd>1?' · '+nrd+' rodadas':''}</div>
    ${toggle}
    ${abas}
    <div class="xs muted" style="margin-top:6px">Digite o tempo <b>acumulado</b> em cada passagem (como no painel da prova). O último = tempo total. Pode deixar em branco o que não pegou.</div>
    ${corpo}
    <button class="primary full" style="margin-top:12px" onclick="salvarSplits('${itemId}','${atletaId}')">Salvar${nrd>1?' rodada '+(S.rd+1):''}</button>
    <button class="ghost full" style="margin-top:10px" onclick="addRodada('${itemId}','${atletaId}')">+ adicionar rodada${nrd>1?' ('+(nrd+1)+'ª)':''}</button>
    <button class="ghost full" style="margin-top:8px" onclick="fecharSheet();render()">Fechar</button>`);
}
async function salvarSplits(itemId,atletaId){
  const item=(S.treino.blocos.flatMap(b=>b.itens)).find(x=>x.id===itemId); if(!item)return;
  const rec=(S.treino.registros?.[atletaId]?.[itemId])||{};
  const iv=intervaloSplit(itemId,item,rec), np=item.dist/iv, reps=item.reps||1;
  const nrd=nRodadas(item,rec), rdIdx=nrd>1?(S.rd||0):null;
  const tempos=[],parciais=[];
  for(let r=0;r<reps;r++){
    const arr=[]; for(let k=0;k<np;k++){const el=document.getElementById('sp_'+r+'_'+k); arr.push((el&&el.value.trim())?parseTempoDist(el.value,(k+1)*iv):null);}
    /* monotonia: passagem acumulada não pode ser menor que a anterior preenchida */
    let ant=null,ok=true; for(const v of arr){ if(v!=null){ if(ant!=null&&v<ant)ok=false; ant=v; } }
    if(!ok)return toast('As parciais acumuladas devem crescer (cada passagem ≥ a anterior).');
    parciais.push(arr);
    let tot=null; for(let k=arr.length-1;k>=0;k--){ if(arr[k]!=null){tot=arr[k];break;} }
    tempos.push(tot);
  }
  await gravarReg(itemId,atletaId,rdIdx,tempos,parciais);
  fecharSheet(); toast(rdIdx!=null?'Parciais da rodada '+(rdIdx+1)+' salvas':'Parciais salvas'); render();
}
/* adiciona uma rodada à série (para blocos que repetem, ex.: "2x"). Migra o
   registro simples para rodada 1 e cria a próxima; funciona em qualquer série. */
async function addRodada(itemId,atletaId){
  const t=await DB.get(kTr(S.u.equipe,S.treino.id))||S.treino;
  const item=(t.blocos.flatMap(b=>b.itens)).find(i=>i.id===itemId); if(!item)return;
  t.registros=t.registros||{}; t.registros[atletaId]=t.registros[atletaId]||{};
  const prev=t.registros[atletaId][itemId]||{};
  let rd=(prev.rd&&prev.rd.slice())||[{tempos:prev.tempos||[],parciais:prev.parciais||[]}];
  const base=Math.max(nRodadas(item,prev),rd.length);
  while(rd.length<base)rd.push({tempos:[],parciais:[]});
  rd.push({tempos:[],parciais:[]});
  const novo={...prev,rd,nrd:rd.length,em:Date.now(),por:S.u.nome}; delete novo.tempos; delete novo.parciais;
  t.registros[atletaId][itemId]=novo; t.atualizado=Date.now();
  await DB.set(kTr(S.u.equipe,t.id),t); S.treino=t;
  S.rd=rd.length-1; abrirLancamento(itemId,atletaId); toast('Rodada '+rd.length+' adicionada');
}
/* lê todos os campos digitados na ficha (para não perder nada) */
function lerCamposLancamento(reps,temParcial,dist){
  const tempos=[],parciais=[];
  for(let k=0;k<reps;k++){
    const el=document.getElementById('lt'+k); tempos.push(el?parseTempoDist(el.value,dist):null);
    if(temParcial){const ep=document.getElementById('lp'+k); parciais.push(ep?parseTempoDist(ep.value,dist?dist/2:null):null);}
  }
  return {tempos,parciais};
}
async function gravarReg(itemId,atletaId,rd,tempos,parciais){
  const t=await DB.get(kTr(S.u.equipe,S.treino.id))||S.treino;
  t.registros=t.registros||{}; t.registros[atletaId]=t.registros[atletaId]||{};
  const prev=t.registros[atletaId][itemId]||{};
  if(rd==null){
    t.registros[atletaId][itemId]={...prev,tempos,parciais,em:Date.now(),por:S.u.nome};
  }else{
    const item=(S.treino.blocos.flatMap(b=>b.itens)).find(x=>x.id===itemId);
    const base=Math.max((item&&item.rodadas)||1,(prev.nrd||0),rd+1), arr=(prev.rd||[]).slice();
    while(arr.length<base)arr.push({tempos:[],parciais:[]});
    arr[rd]={tempos,parciais};
    const novo={...prev,rd:arr,nrd:arr.length,em:Date.now(),por:S.u.nome}; delete novo.tempos; delete novo.parciais;
    t.registros[atletaId][itemId]=novo;
  }
  t.atualizado=Date.now();
  await DB.set(kTr(S.u.equipe,t.id),t); S.treino=t;
}
/* ✓ verde: grava o tempo daquela linha (e tudo que estiver digitado) na hora */
async function confTempo(itemId,atletaId,i,rd){
  const item=(S.treino.blocos.flatMap(b=>b.itens)).find(x=>x.id===itemId); if(!item)return;
  const {tempos,parciais}=lerCamposLancamento(item.reps,!!item.parcial,item.dist);
  if(tempos[i]==null)return toast('Digite o tempo da linha '+(i+1)+' antes do ✓');
  await gravarReg(itemId,atletaId,rd==null?null:rd,tempos,parciais);
  toast('Tempo '+(i+1)+' salvo');
  abrirLancamento(itemId,atletaId);
}
/* ✕ vermelho: apaga o tempo daquela linha */
async function delTempo(itemId,atletaId,i,rd){
  const item=(S.treino.blocos.flatMap(b=>b.itens)).find(x=>x.id===itemId); if(!item)return;
  const {tempos,parciais}=lerCamposLancamento(item.reps,!!item.parcial,item.dist);
  tempos[i]=null; if(item.parcial)parciais[i]=null;
  await gravarReg(itemId,atletaId,rd==null?null:rd,tempos,parciais);

function telaTreinosAtleta(){

/* ── Fase 2 do P0: migração dos campos de segurança ─────────────────────────
   Reescreve dono/equipe/perfil/aprovado como campos REAIS em todos os
   documentos. Os dados (`v`) não são tocados. Precisa rodar DEPOIS que todos
   os clientes estiverem na v69+ e ANTES de publicar as regras novas — publicar
   antes disto tranca todos os usuários para fora do app. */
async function migrarCamposSeguranca(){
  if(!ehDev())return;
  if(!FB)return toast('Migração disponível só no modo em rede (Firebase).');
  if(!confirm('Reescrever os campos de segurança de TODOS os documentos?\n\nOs dados em si (v) não são alterados. Rode isto ANTES de publicar as regras novas.'))return;
  toast('Migrando…');
  let snap; try{ snap=await fdb.collection('kv').get(); }catch(e){ return toast('Falha ao varrer: '+e.message); }
  const docs=[]; snap.forEach(d=>docs.push(d));
  let n=0, err=0;
  for(let i=0;i<docs.length;i+=400){           /* lote do Firestore: máx 500 operações */
    const lote=fdb.batch();
    for(const d of docs.slice(i,i+400)){
      let v=null; try{ v=JSON.parse(d.data().v); }catch(_){}
      lote.update(d.ref,camposSeguranca(d.id,v)); n++;
    }
    try{ await lote.commit(); }catch(e){ err++; console.warn('migração, lote',i,e.message); }
  }
  toast(err?`Migrados ${n} documento(s), ${err} lote(s) com erro — veja o console.`:`Migração concluída: ${n} documento(s).`);
}
/* reconstrói o índice de treinos (eq_<slug>_tridx) a partir dos docs eq_<slug>_tr_* */
async function reconstruirTridx(sg){
  if(!ehDev())return; if(!FB)return;
  toast('Reconstruindo índice…');
  const snap=await fdb.collection('kv').get();
  const re=new RegExp('^eq_'+sg.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&')+'_tr_(.+)$');
  const idx=[];
  snap.forEach(doc=>{ const m=doc.id.match(re); if(!m)return; let v=null; try{v=JSON.parse(doc.data().v)}catch(_){}; if(!v)return;
    const vol=(v.blocos||[]).reduce((s,b)=>s+(b.itens||[]).reduce((x,i)=>x+(i.vol||0),0),0);
    idx.push({id:v.id||m[1],data:v.data||'',titulo:v.titulo||'Treino',nivel:v.nivel||null,vol,para:v.para||Object.keys(v.registros||{}),nAtletas:(v.para||Object.keys(v.registros||{})).length}); });
  idx.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  await DB.set(kTrIdx(sg),idx);
  /* competições: reconstrói o índice a partir dos docs eq_<slug>_cmp_* */
  const reC=new RegExp('^eq_'+sg.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&')+'_cmp_(.+)$'), cidx=[];
  snap.forEach(doc=>{ const m=doc.id.match(reC); if(!m)return; let v=null; try{v=JSON.parse(doc.data().v)}catch(_){}; if(v)cidx.push({id:v.id||m[1],nome:v.nome,data:v.data,local:v.local,piscina:v.piscina}); });
  if(cidx.length)await DB.set(kCIdx(sg),cidx);
  /* lista de atletas: reconstrói a partir das contas que apontam para esta equipe */
  const us=[]; snap.forEach(doc=>{ if(/^u_/.test(doc.id)){ let v=null; try{v=JSON.parse(doc.data().v)}catch(_){}; if(v&&v.equipe===sg&&v.email)us.push(v.email); } });
  if(us.length){ const cur=await DB.get(kEqUsers(sg))||[]; await DB.set(kEqUsers(sg),[...new Set([...cur,...us])]); }
  if(!(await DB.get(kEq(sg))))await DB.set(kEq(sg),{slug:sg,nome:sg,criadoEm:Date.now(),tecnicoEmail:null,codigoPro:CODIGO_PRO});
  await registrarEquipeDev(sg);
  if(sg===S.u.equipe)await carregarDados();
  S.equipesDevList=null; toast(`Recuperado: ${idx.length} treino(s), ${cidx.length} competição(ões), ${us.length} atleta(s)`); abrirDiagnostico();
}
/* DEV: funde a equipe ORIGEM na equipe DESTINO — move atletas (contas), treinos,
   competições e liberações, sem perder dados. Os pro_* (marcas/saúde, por UID) já
   acompanham cada atleta. NÃO apaga a origem: confira e apague depois. */
async function mesclarEquipe(orig,dest){
  if(!ehDev())return; if(!FB)return toast('Fusão disponível só no modo em rede (Firebase).');
  if(!orig||!dest||orig===dest)return toast('Escolha equipes diferentes para origem e destino');
  const eqO=await DB.get(kEq(orig)), eqD=await DB.get(kEq(dest));
  if(!eqD)return toast('Equipe de destino inválida');
  const nomeD=eqD.nome;
  if(!confirm(`Fundir "${eqO?eqO.nome:orig}" → "${nomeD}"?\n\nAtletas, treinos, competições e liberações passam para "${nomeD}". A origem NÃO é apagada agora — você confere e apaga depois.`))return;
  toast('Fundindo equipes…');
  const snap=await fdb.collection('kv').get();
  const esc2=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const reTr=new RegExp('^eq_'+esc2(orig)+'_tr_(.+)$');
  const reCm=new RegExp('^eq_'+esc2(orig)+'_cmp_(.+)$');
  /* treinos */
  const trIdxD=await DB.get(kTrIdx(dest))||[]; const idsD=new Set(trIdxD.map(t=>t.id));
  const trDocs=[]; snap.forEach(doc=>{ const m=doc.id.match(reTr); if(!m)return; let v=null; try{v=JSON.parse(doc.data().v)}catch(_){}; if(v)trDocs.push([m[1],v]); });
  let nTr=0,nTrPula=0;
  for(const [id,v] of trDocs){ const tid=v.id||id;
    if(await DB.get(kTr(dest,tid))){ nTrPula++; continue; }
    await DB.set(kTr(dest,tid),v);
    if(!idsD.has(tid)){ const vol=(v.blocos||[]).reduce((s,b)=>s+(b.itens||[]).reduce((x,i)=>x+(i.vol||0),0),0);
      trIdxD.push({id:tid,data:v.data||'',titulo:v.titulo||'Treino',nivel:v.nivel||null,vol,para:v.para||Object.keys(v.registros||{}),nAtletas:(v.para||Object.keys(v.registros||{})).length}); idsD.add(tid); }
    nTr++; }
  trIdxD.sort((a,b)=>(b.data||'').localeCompare(a.data||'')); await DB.set(kTrIdx(dest),trIdxD);
  /* competições */
  const cIdxD=await DB.get(kCIdx(dest))||[]; const cidsD=new Set(cIdxD.map(c=>c.id));
  const cmDocs=[]; snap.forEach(doc=>{ const m=doc.id.match(reCm); if(!m)return; let v=null; try{v=JSON.parse(doc.data().v)}catch(_){}; if(v)cmDocs.push([m[1],v]); });
  let nCm=0;
  for(const [id,v] of cmDocs){ const cid=v.id||id;
    if(await DB.get(kCmp(dest,cid)))continue;
    await DB.set(kCmp(dest,cid),v);
    if(!cidsD.has(cid)){ cIdxD.push({id:cid,nome:v.nome,data:v.data,local:v.local,piscina:v.piscina}); cidsD.add(cid); }
    nCm++; }
  await DB.set(kCIdx(dest),cIdxD);
  /* atletas (contas u_*) */
  const usersMove=[]; snap.forEach(doc=>{ if(/^u_/.test(doc.id)){ let v=null; try{v=JSON.parse(doc.data().v)}catch(_){}; if(v&&v.equipe===orig&&v.email)usersMove.push(v); } });
  const usD=await DB.get(kEqUsers(dest))||[]; const setD=new Set(usD); let nU=0;
  for(const u of usersMove){ u.equipe=dest; u.equipeNome=nomeD; await DB.set(kUser(u.email),u); if(!setD.has(u.email)){usD.push(u.email);setD.add(u.email);} nU++; }
  await DB.set(kEqUsers(dest),usD);
  /* liberações por CPF */
  const libsO=await DB.get(kLib(orig))||[];
  if(libsO.length){ const libsD=await DB.get(kLib(dest))||[]; const cpfs=new Set(libsD.map(l=>l.cpf)); for(const l of libsO)if(!cpfs.has(l.cpf)){libsD.push(l);cpfs.add(l.cpf);} await DB.set(kLib(dest),libsD); }
  /* técnico: se o destino não tem e a origem tinha, carrega */
  if(eqO&&eqO.tecnicoEmail&&!eqD.tecnicoEmail){ eqD.tecnicoEmail=eqO.tecnicoEmail; await DB.set(kEq(dest),eqD); }
  /* se eu estava na origem, passo para o destino */
  if(S.u.equipe===orig){ S.u.equipe=dest; S.u.equipeNome=nomeD; await DB.set(kUser(S.u.email),S.u); if(S.u.perfil==='pro')S.gestao=true; await carregarDados(); }
  S.equipesDevList=null; S.equipesDisp=null;
  toast(`Fundido em ${nomeD}: ${nTr} treino(s)${nTrPula?` (${nTrPula} já existiam)`:''}, ${nCm} competição(ões), ${nU} atleta(s). Confira e apague a origem.`);
  render();
}

/* Apaga um documento de verdade (no Firestore) ou o esvazia (modo local). */
async function apagarChave(k){
  if(FB){ try{ await fdb.collection('kv').doc(fkey(k)).delete(); return true }catch(e){ console.warn('apagarChave',k,e.message); return false } }
  return DB.set(k,null);
}

/* Qualquer um apaga a PRÓPRIA conta — login e dados. No modo em rede pede a
   senha para reautenticar (o Firebase exige, e garante que é mesmo você). */
function apagarMinhaConta(){
  const u=S.u; if(!u)return;
  sheet(`<h2>Apagar minha conta</h2>
    <div class="note" style="margin:10px 0;border-color:var(--clock)">Isso apaga sua conta ${u.perfil==='tecnico'?'de técnico':''} e os seus dados desta equipe. <b>Não dá para desfazer.</b>
    ${u.perfil==='tecnico'?' A equipe e os atletas continuam; a equipe fica sem técnico até alguém assumir.':''}</div>
    ${FB?`<div class="field"><label>Confirme sua senha</label><input id="delPwd" type="password" placeholder="sua senha"></div>`:''}
    <button class="full danger" style="margin-top:6px" onclick="confirmarApagarMinhaConta()">Apagar definitivamente</button>
    <button class="full ghost" style="margin-top:8px" onclick="fecharSheet()">Cancelar</button>`);
}
async function confirmarApagarMinhaConta(){
  const u=S.u; if(!u)return;
  if(FB){
    const senha=val('delPwd');
    if(!senha)return toast('Digite sua senha para confirmar');
    try{ await fauth.signInWithEmailAndPassword(u.email,senha); }   /* reautentica */
    catch(e){ return toast(traduzErroFB(e.code)); }
  }
  try{
    if(u.perfil==='tecnico'){
      const eq=await DB.get(kEq(u.equipe));
      if(eq&&eq.tecnicoEmail===u.email){ eq.tecnicoEmail=null; await DB.set(kEq(u.equipe),eq); }
    }
    const us=(await DB.get(kEqUsers(u.equipe))||[]).filter(e=>e!==u.email);
    await DB.set(kEqUsers(u.equipe),us);
    if(u.perfil!=='tecnico'&&u.cpf){                                 /* libera o CPF de volta */
      const libs=await DB.get(kLib(u.equipe))||[];
      const l=libs.find(x=>x.cpf===u.cpf); if(l){ l.usado=false; delete l.email; await DB.set(kLib(u.equipe),libs); }
    }
    if(u.perfil==='pro') await apagarChave(kPro(u.id));
    await apagarChave(kUser(u.email));
  }catch(e){ console.warn('apagar dados',e.message); }
  if(FB){ try{ await fauth.currentUser.delete(); }catch(e){ console.warn('apagar login',e.message); } }
  try{ localStorage.removeItem(PFX+'sessao'); }catch(e){}
  S.u=null; S.vista='entrada'; S.perfilEscolhido=null; S.treino=null; S.comp=null; S.pilha=[];
  fecharSheet(); toast('Conta apagada'); render();
}

/* 25m não é prova oficial, mas é a parcial da prova e mede a intensidade real;

function passoDe(p,piscina){
  if(p.tipo==='rev')return p.d;                      /* um parcial por percurso */
  if(piscina==='LC50')return p.dist>=800?100:50;
  return p.dist<=100?25:(p.dist<=400?50:100);
}
function nPassagens(p,piscina){
  if(p.tipo==='rev')return p.r||4;
  return Math.max(1,Math.round(p.dist/passoDe(p,piscina)));
}
const nomeProva=p=>p.tipo==='rev'
  ? `${p.r}x${p.d}m ${p.estilo}${p.genero?' '+p.genero:''}`

/* técnico vê as competições que os ATLETAS cadastraram (atribuídas a cada um) */
function blocoCompAtletas(){
  const rows=[];
  for(const a of (S.elenco||[]))for(const mc of (a.competicoes||[]))rows.push({a,mc});
  if(!rows.length)return'';
  rows.sort((x,y)=>(y.mc.data||'').localeCompare(x.mc.data||''));
  return`<div class="card"><div class="eyebrow">competições dos atletas</div>
    <p class="small muted" style="margin:4px 0 8px">Cadastradas pelos próprios atletas — com as provas e tempos que eles lançaram.</p>
    ${rows.map(({a,mc})=>`<button class="lst" onclick="verCompAtleta('${a.id}','${mc.id}')">
      <span class="av">${iniciais(a.nome)}</span>
      <span class="grow"><b>${esc(mc.nome)}</b><span class="xs muted" style="display:block">por ${esc(prim(a.nome))} · ${brData(mc.data)} · ${mc.piscina} · ${(mc.provas||[]).length} prova(s)</span></span>
      <span class="tag o">›</span></button>`).join('')}
  </div>`;
}
function verCompAtleta(atId,mcId){
  const a=(S.elenco||[]).find(x=>x.id===atId); if(!a)return;
  const mc=(a.competicoes||[]).find(x=>x.id===mcId); if(!mc)return;
  const provas=(mc.provas||[]).map(p=>{
    const ps=(p.parciais||[]).filter(x=>x!=null);
    const fin=p.tempo!=null?p.tempo:(ps.length?ps[ps.length-1]:null);
    const dif=(fin!=null&&p.inscricao!=null)?fin-p.inscricao:null;
    return`<div style="padding:8px 0;border-top:1px solid var(--line)">
      <div class="row"><div class="grow"><b>${p.dist}m ${esc(p.estilo)}</b>
        <div class="xs muted">${p.serie?'série '+p.serie:''}${p.raia?' · raia '+p.raia:''}${p.inscricao!=null?' · inscrição '+fmt(p.inscricao,true):''}</div></div>
        <div class="t" style="font-weight:800">${fin!=null?fmt(fin,true):'—'}</div></div>
      ${ps.length?`<div class="chips" style="margin-top:4px">${ps.map(v=>`<span class="chip">${fmt(v,true)}</span>`).join('')}</div>`:''}
      ${dif!=null?`<div class="xs" style="margin-top:4px;color:${dif<0?'var(--ok)':'var(--clock)'}">${dif<0?'baixou ':'ficou '}${fmt(Math.abs(dif),true)} vs inscrição</div>`:''}</div>`;
  }).join('')||'<div class="small muted">Sem provas cadastradas.</div>';
  sheet(`<h2>${esc(mc.nome)}</h2>

/* Resultados oficiais (ABMN) → por prova, os atletas da EQUIPE com colocação, tempo
   final e parciais. Linha: colocação matr NOME EQUIPE tempo pontos FINA [Xm: split ...].
   N/C, DQL, DNS ficam sem tempo. */
function parseResultadosEquipe(txt,alvos){
  const ESTIL=[[/livre|crawl/i,'livre'],[/costas?/i,'costas'],[/peito/i,'peito'],[/borbol/i,'borboleta'],[/medley/i,'medley']];
  const AL=(alvos||[]).map(a=>a.toUpperCase()).sort((a,b)=>b.length-a.length);
  const provas=[]; let cur=null;
  for(const raw of String(txt||'').split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    if(/\bprova\b/i.test(l)&&/metros/i.test(l)){
      if(/revez|\d\s*x\s*\d/i.test(l)){cur=null;continue;}
      const md=l.match(/prova\s*[-–:]?\s*(\d{2,4})\s*metros/i), mc=l.match(/(\d+)\s*[º°ªo]\s*prova/i);
      if(md){let estilo='livre';for(const[re,v]of ESTIL){if(re.test(l)){estilo=v;break;}}
        const genero=/femin/i.test(l)?'F':/mascul/i.test(l)?'M':'';
        cur={codigo:mc?mc[1]:null,dist:+md[1],estilo,genero,inscritos:[]}; provas.push(cur);}
      continue;
    }
    if(!cur)continue;
    const up=l.toUpperCase(); let alvo=null,idx=-1;
    for(const a of AL){let j=up.indexOf(' '+a+' '); if(j<0&&up.endsWith(' '+a))j=up.length-a.length-1; if(j>=0){alvo=a;idx=j;break;}}
    if(alvo==null)continue;
    const antes=l.slice(0,idx).trim(), depois=l.slice(idx+1+alvo.length).trim();
    const mh=antes.match(/^(\d+\s*[º°ªo]|N\/?C|DQL|DNS|DQ)\s+(\d+)\s+(.+)$/i); if(!mh)continue;
    const nome=mh[3].replace(/\(.*?\)/g,'').replace(/\s{2,}/g,' ').trim();
    const mt=depois.match(/^(\d{1,2}:\d{2}[.,]\d{2}|\d{1,3}[.,]\d{2})\b/);
    const splits=[...depois.matchAll(/(\d{2,4})\s*m:\s*(\d{1,2}:\d{2}[.,]\d{2}|\d{1,3}[.,]\d{2}|S\/T)/gi)]
      .map(m=>({dist:+m[1],t:/S\/T/i.test(m[2])?null:parseTempo(m[2])}));
    cur.inscritos.push({matr:mh[2],nome,colocacao:mh[1].replace(/\s/g,''),tempo:mt?parseTempo(mt[1]):null,splits});
  }
  return provas.filter(p=>p.inscritos.length);
}
/* casa cada linha do balizamento (formato ABMN Competição) com os nomes do Elenco */
function parseBalizamentoTecnico(txt){
  const ESTIL=[[/livre|crawl/i,'livre'],[/costas?/i,'costas'],[/peito/i,'peito'],[/borbol/i,'borboleta'],[/medley/i,'medley']];
  const atletas=(S.elenco||[]).map(a=>({a,toks:a.nome.toLowerCase().split(/\s+/).filter(t=>t.length>=3)})).filter(x=>x.toks.length);
  const provas=[]; let cur=null,serie=1;
  for(const raw of txt.split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    if(/\bprova\b/i.test(l)&&/metros/i.test(l)){
      if(/revez|\d\s*x\s*\d/i.test(l)){ cur=null; continue; }
      const md=l.match(/prova\s*[-–:]?\s*(\d{2,4})\s*metros/i), mc=l.match(/(\d+)\s*[º°ªo]\s*prova/i);
      if(md){ let estilo='livre'; for(const[re,v]of ESTIL){if(re.test(l)){estilo=v;break;}}
        const cat=l.replace(/.*?metros/i,'').replace(/^\s*[a-zà-ú]+\s*/i,'').replace(/\(.*?\)/g,'').trim();
        cur={codigo:mc?mc[1]:null,dist:+md[1],estilo,categoria:cat,inscritos:[]}; provas.push(cur); serie=1;
      }
      continue;
    }
    const ms=l.match(/(\d+)\D{0,3}s[ée]rie/i); if(ms&&/s[ée]rie/i.test(l)){ serie=+ms[1]; continue; }
    if(!cur)continue;
    const low=l.toLowerCase(); const match=atletas.find(x=>x.toks.every(t=>low.includes(t)));
    if(match){
      const raia=parseInt(l,10), times=l.match(/\d{1,2}:\d{2}[.,]\d{2}|\b\d{1,2}[.,]\d{2}\b/g);
      cur.inscritos.push({serie,raia:isNaN(raia)?0:raia,nome:match.a.nome,equipe:'',inscricao:times?parseTempo(times[times.length-1]):null});
    }
  }
  return provas.filter(p=>p.inscritos.length);
}

/* identificadores da equipe do técnico (nome + sigla do catálogo) para casar com a

/* usa o parser por EQUIPE (todos os atletas do clube no balizamento); se não achar
   nada, cai para o parser por nomes do Elenco (compat). */
function parseBalizTec(txt){
  const porEq=parseBalizamentoEquipe(txt,alvosEquipe());
  return porEq.length?porEq:parseBalizamentoTecnico(txt);
}
function alvosEquipe(){

}
/* Balizamento oficial (ABMN) → provas com os atletas da EQUIPE alvo (coluna EQUIPE),
   mesmo que ainda não sejam usuários do app. Linha: raia matr faixa NOME EQUIPE tempo. */
function parseBalizamentoEquipe(txt,alvos){
  const ESTIL=[[/livre|crawl/i,'livre'],[/costas?/i,'costas'],[/peito/i,'peito'],[/borbol/i,'borboleta'],[/medley/i,'medley']];
  const AL=(alvos||[]).map(a=>a.toUpperCase()).sort((a,b)=>b.length-a.length);   // mais longo primeiro
  const provas=[]; let cur=null, serie=1;
  for(const raw of String(txt||'').split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    if(/\bprova\b/i.test(l)&&/metros/i.test(l)){
      if(/revez|\d\s*x\s*\d/i.test(l)){cur=null;continue;}
      const md=l.match(/prova\s*[-–:]?\s*(\d{2,4})\s*metros/i), mc=l.match(/(\d+)\s*[º°ªo]\s*prova/i);
      if(md){let estilo='livre';for(const[re,v]of ESTIL){if(re.test(l)){estilo=v;break;}}
        const genero=/femin/i.test(l)?'F':/mascul/i.test(l)?'M':'';
        const cat=l.replace(/.*?metros/i,'').replace(/\(.*?\)/g,'').replace(/^\s*[a-zà-ú]+\s*/i,'').trim();
        cur={codigo:mc?mc[1]:null,dist:+md[1],estilo,genero,categoria:cat,inscritos:[]}; provas.push(cur); serie=1;}
      continue;
    }
    const ms=l.match(/(\d+)\D{0,3}s[ée]rie/i); if(ms&&/s[ée]rie/i.test(l)){serie=+ms[1];continue;}
    if(!cur)continue;
    const mt=l.match(/(\d{1,2}:\d{2}[.,]\d{2}|\b\d{1,3}[.,]\d{2})\s*$/);
    const semT=(mt?l.slice(0,mt.index):l).trim(), up=semT.toUpperCase();
    const alvo=AL.find(a=>up.endsWith(' '+a)||up===a); if(!alvo)continue;
    const nomeRaw=semT.slice(0,semT.length-alvo.length).trim();
    const mh=nomeRaw.match(/^(\d+)\s+(\d+)\s+(\d+\s*\+|PR[ÉE])\s+(.+)$/i); if(!mh)continue;
    const nome=mh[4].replace(/\(.*?\)/g,'').replace(/\s{2,}/g,' ').trim();
    cur.inscritos.push({serie,raia:+mh[1],matr:mh[2],faixa:mh[3].replace(/\s+/g,' ').trim(),nome,equipe:alvo,
      inscricao:mt?parseTempo(mt[1]):null});
  }
  return provas.filter(p=>p.inscritos.length);
}
async function incorporar(lista){
  await mutarComp(c=>{
    c.provas=c.provas||[];
    for(const p of lista){
      const dist=+p.dist||50, estilo=p.estilo||'livre', genero=p.genero||'';
      /* NÃO duplica: casa por CÓDIGO da prova, senão por dist+estilo+gênero */
      let ex=c.provas.find(q=>(p.codigo&&q.codigo&&String(q.codigo)===String(p.codigo))||(q.dist===dist&&q.estilo===estilo&&(q.genero||'')===genero));
      if(!ex){ ex={id:uid(),tipo:'ind',codigo:p.codigo||null,dist,estilo,genero,categoria:p.categoria||'',inscritos:[]}; c.provas.push(ex); }
      const jaMatr=new Set((ex.inscritos||[]).map(i=>i.matr).filter(Boolean));
      const jaNome=new Set((ex.inscritos||[]).map(i=>(i.nome||'').toLowerCase()));
      for(const i of (p.inscritos||[])){
        const nm=(i.nome||'').toLowerCase();
        if((i.matr&&jaMatr.has(i.matr))||(!i.matr&&jaNome.has(nm)))continue;   /* inscrito já existe */
        ex.inscritos.push({id:uid(),serie:+i.serie||1,raia:+i.raia||0,nome:i.nome||'',matr:i.matr||null,faixa:i.faixa||'',equipe:i.equipe||'',
          inscricao:typeof i.inscricao==='string'?parseTempo(i.inscricao):(i.inscricao||null),atletaId:acharAtleta(i.nome),parciais:[]});
        if(i.matr)jaMatr.add(i.matr); jaNome.add(nm);
      }
      ex.inscritos.sort((a,b)=>(a.serie-b.serie)||(a.raia-b.raia));
    }
  });
}
function acharAtleta(nome){
  if(!nome)return null;
  const n=nome.trim().toLowerCase();
  const a=S.elenco.find(x=>x.nome.toLowerCase()===n)||S.elenco.find(x=>x.nome.toLowerCase().startsWith(n.split(' ')[0]));

/* Resultados oficiais → preenche os tempos/parciais/colocação de cada atleta na
   competição (casa por matrícula; se não existir, cria o inscrito). */
async function incorporarResultados(resProvas){
  await mutarComp(c=>{
    for(const rp of resProvas){
      let p=(rp.codigo&&c.provas.find(x=>x.codigo&&String(x.codigo)===String(rp.codigo)))
          || c.provas.find(x=>+x.dist===+rp.dist&&x.estilo===rp.estilo&&(!x.genero||!rp.genero||x.genero===rp.genero));
      if(!p){p={id:uid(),tipo:'ind',codigo:rp.codigo||null,dist:+rp.dist,estilo:rp.estilo,genero:rp.genero||'',categoria:'',inscritos:[]};c.provas.push(p);}
      for(const ri of rp.inscritos){
        let parc=(ri.splits&&ri.splits.length)?ri.splits.map(s=>s.t):[];
        if(ri.tempo!=null){ if(!parc.length)parc=[ri.tempo]; else parc[parc.length-1]=ri.tempo; }
        let ins=p.inscritos.find(x=>x.matr&&ri.matr&&String(x.matr)===String(ri.matr))
             || p.inscritos.find(x=>(x.nome||'').toLowerCase()===ri.nome.toLowerCase());
        if(!ins){ins={id:uid(),serie:0,raia:0,nome:ri.nome,matr:ri.matr,faixa:'',equipe:ri.equipe||'',inscricao:null,atletaId:acharAtleta(ri.nome),parciais:[]};p.inscritos.push(ins);}
        if(ri.tempo!=null)ins.parciais=parc;
        ins.oficialTempo=ri.tempo; ins.colocacao=ri.colocacao; ins.oficial=true;
      }
    }
  });
}
/* consolida no Marcas do PRÓPRIO usuário (só o dono escreve seu pro_) os resultados
   oficiais desta competição. Cada atleta faz o seu ao abrir a competição. */
async function consolidarMinhasMarcas(c){
  if(!S.pro||!c)return;
  const pis=c.piscina||'SC25'; let n=0;
  S.pro.pbs=S.pro.pbs||{}; S.pro.resultados=S.pro.resultados||[];
  for(const p of (c.provas||[]))for(const i of (p.inscritos||[])){
    if(i.atletaId!==S.u.id)continue;
    const fin=(i.oficialTempo!=null)?i.oficialTempo:((i.parciais||[]).filter(x=>x!=null).slice(-1)[0]);
    if(fin==null)continue;
    const key=pbKey(p.dist,p.estilo,pis);
    if(!S.pro.pbs[key]||fin<S.pro.pbs[key])S.pro.pbs[key]=fin;
    const chave=c.id+'|'+p.dist+'|'+p.estilo+'|'+pis;
    if(!S.pro.resultados.some(r=>r.chave===chave))
      S.pro.resultados.push({chave,comp:c.nome,data:c.data,piscina:pis,prova:p.dist+'m '+p.estilo,
        dist:p.dist,estilo:p.estilo,tempo:fin,parciais:(i.parciais||[]).filter(x=>x!=null),inscricao:i.inscricao||null});
    n++;
  }
  if(n){await salvarPro(); toast(`${n} resultado(s) no seu Marcas`); render();}
  else toast('Não achei suas provas nesta competição (confira se você está vinculado).');
}
async function lerResultados(inp){
  const f=inp.files[0]; if(!f)return;
  const st=document.getElementById('resStatus');
  if(f.type!=='application/pdf'){ if(st)st.textContent='Envie os resultados em PDF.'; return; }
  if(st)st.textContent='Lendo os resultados…';
  try{
    const txt=await pdfTexto(f);
    const provas=parseResultadosEquipe(txt,alvosEquipe());
    if(!provas.length){ if(st)st.textContent='Não achei resultados da sua equipe no PDF. Confira se a equipe bate com a coluna EQUIPE.'; return; }
    await incorporarResultados(provas);
    const n=provas.reduce((s,p)=>s+p.inscritos.filter(i=>i.tempo!=null).length,0);
    if(st)st.textContent=`${n} resultado(s) oficiais importados. Cada atleta consolida no seu Marcas.`;
    toast('Resultados carregados');
    if(S.pro)await consolidarMinhasMarcas(S.comp);
  }catch(e){ if(st)st.textContent='Não consegui ler o PDF: '+e.message; }
}
function blocoResultados(){
  return`<div class="card noprint">
    <div class="eyebrow">resultados oficiais</div>
    <h3 style="margin:4px 0 8px">Puxar os tempos oficiais</h3>
    <p class="small muted">Suba o <b>PDF de resultados</b> da competição. O app acha os atletas da sua equipe e preenche o <b>tempo oficial e as parciais</b> de cada prova. Depois cada atleta consolida no seu <b>Marcas</b>.</p>
    <input type="file" id="fRes" accept="application/pdf,.pdf" style="display:none" onchange="lerResultados(this)">
    <button class="primary full" onclick="document.getElementById('fRes').click()">Importar resultados (PDF)</button>
    <div id="resStatus" class="small muted" style="margin-top:6px"></div>
  </div>`;
}

/* ---------- prova aberta: lançar parciais ---------- */
function telaProvaDetalhe(){
  const c=S.comp,p=c.provas[S.provaSel];
  const np=nPassagens(p,c.piscina),passo=passoDe(p,c.piscina);
  const cols=Array.from({length:np},(_,i)=>p.tipo==='rev'?`${i+1}º`:`${(i+1)*passo}m`);
  const series=[...new Set(p.inscritos.map(i=>i.serie||1))].sort((a,b)=>a-b);
  return`
  <div class="row" style="margin:16px 0 4px"><button class="sm ghost" onclick="voltar()">‹ Provas</button>
    <div class="grow"></div><button class="sm ghost" onclick="removerProva()">✕</button></div>
  <div><div class="eyebrow">${p.codigo?'Prova '+p.codigo+' · ':''}${esc(p.categoria||'')}</div>
    <h2>${nomeProva(p)}</h2>
    <div class="small muted">${p.tipo==='rev'?`um parcial por percurso de ${p.d}m`:`parciais a cada ${passo}m`} · ${c.piscina}</div></div>

  ${p.inscritos.length?series.map(s=>{
    const gr=p.inscritos.filter(i=>(i.serie||1)===s);
    return`<div class="blk"><h3>Série ${s}</h3><div class="ln"></div></div>
    <div class="card tight" style="overflow-x:auto">
      <table class="ficha"><thead><tr><th>R</th><th style="text-align:left;min-width:96px">Atleta</th>
        ${cols.map(x=>`<th style="min-width:74px">${x}</th>`).join('')}<th>Δ insc.</th></tr></thead><tbody>
      ${gr.map(i=>{
        const ix=p.inscritos.indexOf(i),ps=i.parciais||[],fin=ps.length>=np?ps[np-1]:null;
        const dif=(fin&&i.inscricao)?fin-i.inscricao:null;
        return`<tr><td class="n"><b>${i.raia||'—'}</b></td>
          <td class="nome">${esc(prim(i.nome))}<div class="xs muted" style="font-weight:400">${esc(i.equipe||'')}</div></td>
          ${cols.map((_,k)=>`<td><input inputmode="decimal" placeholder="—" value="${ps[k]!=null?fmt(ps[k],true):''}"
            onchange="setParcial(${ix},${k},this.value)">
            ${k>0&&ps[k]!=null&&ps[k-1]!=null?`<div class="xs t" style="color:var(--water)">${fmt(ps[k]-ps[k-1],true)}</div>`:''}</td>`).join('')}
          <td class="n" style="color:${dif==null?'inherit':(dif<0?'var(--ok)':'var(--clock)')}">${dif==null?'—':(dif<0?'':'+')+fmt(dif,true)}</td></tr>`}).join('')}
      </tbody></table></div>`}).join(''):
    `<div class="empty"><div class="big">Sem inscritos</div><p class="small">Inclua os atletas desta prova.</p></div>`}

  <div class="row" style="margin-top:12px">
    <button class="ghost full" onclick="abrirInscricao()">+ Atleta</button>
    <button class="ghost full" onclick="compartilharProva()">WhatsApp</button>
  </div>
  ${leituraProva(p,np,passo)}
  <div style="height:20px"></div>`;
}
async function setParcial(ix,k,v){
  const ms=parseTempo(v),ip=S.provaSel;
  await mutarComp(c=>{const i=c.provas[ip].inscritos[ix]; i.parciais=i.parciais||[];
    while(i.parciais.length<k)i.parciais.push(null);
    i.parciais[k]=ms; while(i.parciais.length&&i.parciais[i.parciais.length-1]==null)i.parciais.pop()});
  await gravarResultadoPro(ix);
}

  sheet(`<h2>Incluir na prova</h2>
    <div class="small muted">${nomeProva(p)}</div>
    <div class="field"><label>Atleta da equipe</label><select id="isAt">
      <option value="">— digitar outro nome —</option>
      ${S.elenco.filter(a=>a.ativo!==false).map(a=>`<option value="${a.id}">${esc(a.nome)}</option>`).join('')}</select></div>
    <div class="field"><label>Ou nome avulso</label><input id="isNome" autocapitalize="words"></div>
    <div class="grid3">
      <div class="field"><label>Série</label><input id="isSerie" inputmode="numeric" value="1"></div>
      <div class="field"><label>Raia</label><input id="isRaia" inputmode="numeric" placeholder="4"></div>
