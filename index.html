async function salvarInscricao(){
  const aId=val('isAt'),a=S.elenco.find(x=>x.id===aId);
  const nome=a?a.nome:val('isNome');
  if(!nome)return toast('Escolha ou digite um nome');
  const ip=S.provaSel;
  await mutarComp(c=>{c.provas[ip].inscritos.push({id:uid(),atletaId:a?a.id:null,nome,
    equipe:a?S.eq.nome:'',serie:+val('isSerie')||1,raia:+val('isRaia')||0,
    inscricao:parseTempo(val('isInsc')),parciais:[]});
    c.provas[ip].inscritos.sort((x,y)=>(x.serie-y.serie)||(x.raia-y.raia))});
  fecharSheet(); toast('Incluído');
}
async function removerProva(){
  sheet(`<h2>Excluir prova</h2><p class="small muted">Os tempos lançados nesta prova serão perdidos.</p>
    <button class="danger full" style="margin-top:12px" onclick="confirmarRemProva()">Excluir</button>
    <button class="ghost full" style="margin-top:8px" onclick="fecharSheet()">Cancelar</button>`);
}
async function confirmarRemProva(){
  const ip=S.provaSel; await mutarComp(c=>c.provas.splice(ip,1));
  S.provaSel=null; S.pilha.pop(); fecharSheet(); toast('Prova excluída'); render();
}

function leituraProva(p,np,passo){
  const comTempo=p.inscritos.filter(i=>(i.parciais||[]).filter(x=>x!=null).length>=2);
  if(!comTempo.length)return'';
  return`<div class="card"><div class="eyebrow">leitura dos trechos</div>
    ${comTempo.map(i=>{
      const ps=(i.parciais||[]).filter(x=>x!=null);
      const tr=ps.map((v,k)=>k===0?v:v-ps[k-1]);
      const melhor=Math.min(...tr.slice(1));
      const fin=ps.length>=np?ps[np-1]:null;
      return`<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
        <div class="row"><b>${esc(i.nome)}</b><div class="grow"></div>
          ${fin?`<span class="t" style="font-weight:700">${fmt(fin,true)}</span>`:''}</div>
        <div class="chips">${tr.map((t,k)=>`<span class="chip ${k>0&&t===melhor?'best':''}">${p.tipo==='rev'?(k+1)+'º':((k+1)*passo)+'m'} · ${fmt(t,true)}</span>`).join('')}</div>
        ${tr.length>1?`<div class="xs muted" style="margin-top:5px">Do primeiro ao último trecho: <b class="t">${(tr[tr.length-1]-tr[0])>0?'+':''}${fmt(tr[tr.length-1]-tr[0],true)}</b></div>`:''}
      </div>`}).join('')}</div>`;
}
function compartilharProva(){
  const c=S.comp,p=c.provas[S.provaSel],np=nPassagens(p,c.piscina),passo=passoDe(p,c.piscina);
  let t=`*${c.nome}* — ${brData(c.data)}\n${p.codigo?'Prova '+p.codigo+' · ':''}${nomeProva(p)}${p.categoria?' · '+p.categoria:''}\n`;
  p.inscritos.forEach(i=>{
    const ps=(i.parciais||[]).filter(x=>x!=null); if(!ps.length)return;
    const tr=ps.map((v,k)=>k===0?v:v-ps[k-1]);
    t+=`\n${i.raia?'Raia '+i.raia+' — ':''}${i.nome}\n  ${ps.map((v,k)=>`${p.tipo==='rev'?(k+1)+'º':((k+1)*passo)+'m'} ${fmt(v,true)}`).join(' | ')}`;
    t+=`\n  trechos: ${tr.map(x=>fmt(x,true)).join(' · ')}`;
    if(ps.length>=np&&i.inscricao){const d=ps[np-1]-i.inscricao; t+=`\n  ${d<0?'−':'+'}${fmt(Math.abs(d),true)} vs inscrição`}
  });
  enviar(t+`\n\nPARCIAL ${VER}`,destinosProva(p));
}
/* ---------- compartilhamento ----------
   Dentro do app o navegador bloqueia janelas automáticas, então sempre
   mostramos o texto com botão de copiar e links tocáveis pelo usuário. */
function enviar(texto,destinos){
  const enc=encodeURIComponent(texto);
  const lista=(destinos||[]).filter(d=>d&&d.tel&&telValido(d.tel));
  sheet(`<h2>Compartilhar</h2>
    <p class="small muted" style="margin:6px 0 10px">Copie o texto e cole no WhatsApp, ou toque em um contato para abrir a conversa já com a mensagem pronta.</p>
    <textarea id="shTxt" style="min-height:150px;font-size:13.5px">${esc(texto)}</textarea>
    <button class="primary full" style="margin-top:10px" onclick="copiarTexto('shTxt')">Copiar texto</button>
    <a class="btnlink zap" href="https://wa.me/?text=${enc}" target="_blank" rel="noopener">Abrir WhatsApp</a>
    ${lista.length?`<div class="sep"></div><div class="eyebrow">enviar direto para</div>
      ${lista.map(d=>`<a class="destin" href="https://wa.me/${telWa(d.tel)}?text=${enc}" target="_blank" rel="noopener">
        <span class="av">${iniciais(d.nome)}</span>
        <span class="grow"><b>${esc(d.nome)}</b><span class="xs muted" style="display:block">${telBr(d.tel)}</span></span>
        <span class="tag" style="background:#25D366;color:#062B14">enviar</span></a>`).join('')}`:
      `<div class="xs muted" style="margin-top:10px">Nenhum contato com telefone cadastrado. Peça para cada um preencher o telefone no cadastro — aí o envio vai direto para a conversa.</div>`}
    <button class="ghost full" style="margin-top:12px" onclick="fecharSheet()">Fechar</button>`);
}
function destinosTreino(t){
  if(ehGestor())
    return S.elenco.filter(a=>(t.para||[]).includes(a.id)).map(a=>({nome:a.nome,tel:a.telefone}));
  return S.tecnico?[{nome:S.tecnico.nome+' (técnico)',tel:S.tecnico.telefone}]:[];
}
function destinosProva(p){
  if(!ehGestor())return S.tecnico?[{nome:S.tecnico.nome+' (técnico)',tel:S.tecnico.telefone}]:[];
  const ids=[...new Set((p.inscritos||[]).map(i=>i.atletaId).filter(Boolean))];
  return S.elenco.filter(a=>ids.includes(a.id)).map(a=>({nome:a.nome,tel:a.telefone}));
}
function compartilharTreino(){
  const t=S.treino; if(!t)return;
  const alvo=ehGestor()?S.elenco.filter(a=>(t.para||[]).includes(a.id)):[S.u];
  let x=`*${t.titulo}* — ${brData(t.data)} · ${t.nivel||''}\n`;
  for(const b of t.blocos||[]){
    const ls=[];
    for(const i of b.itens){
      if(i.nota){ ls.push(`• ${i.texto}`); continue; }
      const partes=alvo.map(a=>{
        const r=t.registros?.[a.id]?.[i.id]; const ts=temposItem(r,i);
        return ts.length?`${alvo.length>1?prim(a.nome)+': ':''}${ts.map(y=>fmt(y,true)).join(' / ')}`:null}).filter(Boolean);
      ls.push(`${i.rodadas>1?i.rodadas+'x ':''}${i.reps>1?i.reps+'x':''}${i.dist} ${i.estilo}${i.intervalo?` saída ${fmtInt(i.intervalo)}`:''}${i.pausa?` desc ${fmtPausa(i.pausa)}`:''}${i.obs?` (${i.obs})`:''}${partes.length?'\n  '+partes.join('\n  '):''}`);
    }
    if(ls.length)x+=`\n_${b.titulo}_\n${ls.join('\n')}\n`;
  }
  enviar(x+`\nVolume: ${(volTreino(t)/1000).toFixed(1)}k · PARCIAL ${VER}`,destinosTreino(t));
}

    ${minhas.length?`<div class="card"><div class="eyebrow">minhas competições</div>

      </div>`:''}

    const fin=ps.length>=np?ps[np-1]:(ps.length?ps[ps.length-1]:null);

/* atleta lança/edita OS PRÓPRIOS tempos numa competição da EQUIPE (sem depender do técnico).
   Grava no mesmo doc eq_<slug>_cmp_<id> — o técnico vê na hora. */
function abrirTempoCompEquipe(ip,ii){
  const c=S.comp,p=c.provas[ip],i=p.inscritos[ii]; if(!p||!i)return;
  const passo=passoDe(p,c.piscina),np=nPassagens(p,c.piscina);
  const ps=(i.parciais||[]).filter(x=>x!=null);
  const campos=Array.from({length:np},(_,k)=>`<div class="field" style="margin:0"><label>${p.tipo==='rev'?(k+1)+'º':((k+1)*passo)+'m'}</label>
    <input inputmode="decimal" id="te_${k}" placeholder="—" value="${ps[k]!=null?fmt(ps[k],true):''}"></div>`).join('');
  sheet(`<h2>Meu tempo — ${nomeProva(p)}</h2>
    <div class="small muted">${esc(c.nome)} · ${c.piscina}${i.serie?' · série '+i.serie:''}${i.raia?' · raia '+i.raia:''}${i.inscricao?' · inscrição '+fmt(i.inscricao,true):''}</div>
    <div class="xs muted" style="margin-top:8px">Tempos <b>acumulados</b> em cada passagem (como no painel). O último = tempo final. Pode deixar em branco o que não pegou; se souber só o final, preencha só a última.</div>
    <div class="grid2" style="margin-top:8px">${campos}</div>
    <button class="primary full" style="margin-top:12px" onclick="salvarTempoCompEquipe(${ip},${ii})">Salvar</button>
    <button class="ghost full" style="margin-top:8px" onclick="fecharSheet()">Cancelar</button>`);
}
async function salvarTempoCompEquipe(ip,ii){
  const c=S.comp,p=c.provas[ip]; if(!p)return;
  const np=nPassagens(p,c.piscina);
  const arr=[]; for(let k=0;k<np;k++){const el=document.getElementById('te_'+k); arr.push((el&&el.value.trim())?parseTempo(el.value.trim()):null);}
  let ant=null; for(const v of arr){ if(v!=null){ if(ant!=null&&v<ant)return toast('As parciais acumuladas devem crescer (cada passagem ≥ a anterior).'); ant=v; } }
  const parc=arr.slice(); while(parc.length&&parc[parc.length-1]==null)parc.pop();
  if(!parc.some(x=>x!=null))return toast('Informe ao menos o tempo final.');
  await mutarComp(cc=>{ cc.provas[ip].inscritos[ii].parciais=parc; });
  fecharSheet(); toast('Tempo salvo ✓'); render();
}
function compartilharMinhasProvas(){
  const c=S.comp; let t=`*${c.nome}* — ${brData(c.data)}\n${S.u.nome}\n`;
  c.provas.forEach(p=>p.inscritos.forEach(i=>{
    if(i.atletaId!==S.u.id)return;
    const np=nPassagens(p,c.piscina),passo=passoDe(p,c.piscina);
    const ps=(i.parciais||[]).filter(x=>x!=null); if(!ps.length)return;
    const tr=ps.map((v,k)=>k===0?v:v-ps[k-1]);
    t+=`\n${nomeProva(p)} — ${fmt(ps[ps.length-1],true)}\n  ${tr.map((x,k)=>`${p.tipo==='rev'?(k+1)+'º':((k+1)*passo)+'m'} ${fmt(x,true)}`).join(' · ')}`;
  }));
  enviar(t+`\n\nPARCIAL ${VER}`,S.tecnico?[{nome:S.tecnico.nome+' (técnico)',tel:S.tecnico.telefone}]:[]);
}

  return`
  <div class="row" style="margin:16px 0 4px"><button class="sm ghost" onclick="S.minhaComp=null;render()">‹ Competições</button></div>

async function enviarProvasParaMarcas(mcId){
  const mc=(S.u.competicoes||[]).find(x=>x.id===mcId); if(!mc)return;
  const comTempo=(mc.provas||[]).filter(p=>p.tempo);
  if(!comTempo.length)return toast('Nenhum tempo lançado ainda');
  S.pro=S.pro||{pbs:{},garmin:[],seco:[],resultados:[],exames:[],bioimp:[]};
  S.pro.resultados=S.pro.resultados||[];
  const existe=new Set(S.pro.resultados.map(r=>`${r.dist}|${r.estilo}|${r.piscina}|${r.data}|${r.tempo}`));
  let add=0;
  for(const p of comTempo){
    const k=`${p.dist}|${p.estilo}|${mc.piscina}|${mc.data}|${p.tempo}`;
    if(existe.has(k))continue; existe.add(k);
    S.pro.resultados.push({chave:'mc_'+mc.id+'_'+p.id,comp:mc.nome,data:mc.data,piscina:mc.piscina,
      prova:`${p.dist}m ${p.estilo}`,dist:p.dist,estilo:p.estilo,tempo:p.tempo,
      parciais:(p.parciais&&p.parciais.length)?p.parciais:[p.tempo],inscricao:p.inscricao||null});
    const pk=pbKey(p.dist,p.estilo,mc.piscina);
    if(!S.pro.pbs[pk]||p.tempo<S.pro.pbs[pk])S.pro.pbs[pk]=p.tempo;
    add++;
  }
  await salvarPro(); toast(add?`${add} tempo(s) enviado(s) para Marcas`:'Já estavam em Marcas'); render();
}
/* balizamento (start list) em PDF — extrai as provas do próprio atleta pelo nome */
/* Formato ABMN Competição: cabeçalho "Nº PROVA - <dist> METROS <estilo> <gênero>",
   séries "Nª SÉRIE ...", e linhas "raia matrícula faixa + NOME  EQUIPE  TEMPO".
   Casa a linha do atleta exigindo todos os nomes dele (>=3 letras) na linha. */
function parseBalizamento(txt,nome){
  const toks=(nome||'').toLowerCase().split(/\s+/).filter(t=>t.length>=3);
  const ESTIL=[[/livre|crawl/i,'livre'],[/costas?/i,'costas'],[/peito/i,'peito'],[/borbol/i,'borboleta'],[/medley/i,'medley']];
  let dist=null,estilo=null,serie=null; const out=[];
  for(const raw of txt.split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    if(/\bprova\b/i.test(l)&&/metros/i.test(l)){
      if(/revez|\d\s*x\s*\d/i.test(l)){ dist=null;estilo=null; continue; }   // pula revezamento
      const md=l.match(/prova\s*[-–:]?\s*(\d{2,4})\s*metros/i);
      if(md){ dist=+md[1]; estilo='livre'; for(const[re,v]of ESTIL){if(re.test(l)){estilo=v;break;}} serie=null; }
      continue;
    }
    const ms=l.match(/(\d+)\D{0,3}s[ée]rie/i); if(ms&&/s[ée]rie/i.test(l)){ serie=+ms[1]; continue; }
    if(!dist||!estilo||!toks.length)continue;
    const low=l.toLowerCase();
    if(toks.every(t=>low.includes(t))){
      const raia=parseInt(l,10);
      const times=l.match(/\d{1,2}:\d{2}[.,]\d{2}|\b\d{1,2}[.,]\d{2}\b/g);
      out.push({id:uid(),dist,estilo,serie,raia:isNaN(raia)?null:raia,inscricao:times?parseTempo(times[times.length-1]):null});
    }
  }
  return out;
}
async function importarBalizamento(inp){
  const f=inp.files&&inp.files[0]; if(!f)return; inp.value='';
  const mc=(S.u.competicoes||[]).find(x=>x.id===S.minhaComp); if(!mc)return;
  toast('Lendo o balizamento…');
  let txt; try{ txt=await pdfTexto(f); }catch(e){ return toast('Não consegui ler: '+e.message); }
  const provas=parseBalizamento(txt,S.u.nome);
  if(!provas.length)return toast('Não achei suas provas. Confira se seu nome está no PDF, ou lance à mão.');
  mc.provas=mc.provas||[];
  const ex=new Set(mc.provas.map(p=>`${p.dist}|${p.estilo}|${p.serie}|${p.raia}`));
  let add=0;
  for(const p of provas){ const k=`${p.dist}|${p.estilo}|${p.serie}|${p.raia}`; if(ex.has(k))continue; ex.add(k); mc.provas.push(p); add++; }
  await salvarUsuario(); toast(add?`${add} prova(s) importada(s)`:'Tudo já estava lançado'); render();
}

async function gravarResultadoPro(ix){
  const c=S.comp,p=c.provas[S.provaSel],i=p.inscritos[ix];
  if(!i||!i.atletaId||p.tipo==='rev')return;
  const at=S.elenco.find(a=>a.id===i.atletaId)||(S.u.id===i.atletaId?S.u:null);
  if(!at||at.perfil!=='pro')return;
  const np=nPassagens(p,c.piscina),ps=(i.parciais||[]).filter(x=>x!=null);
  if(ps.length<np)return;
  const pro=await DB.get(kPro(at.id))||{pbs:{},garmin:[],seco:[],resultados:[],exames:[],bioimp:[]};
  const chave=c.id+'_'+p.id;
  const r={chave,comp:c.nome,data:c.data,piscina:c.piscina,prova:nomeProva(p),dist:p.dist,estilo:p.estilo,
    tempo:ps[np-1],parciais:[...ps],inscricao:i.inscricao||null};
  const k=(pro.resultados||[]).findIndex(x=>x.chave===chave);
  if(k>=0)pro.resultados[k]=r; else (pro.resultados=pro.resultados||[]).push(r);
  const key=pbKey(p.dist,p.estilo,c.piscina);
  if(!pro.pbs[key]||r.tempo<pro.pbs[key])pro.pbs[key]=r.tempo;
  await DB.set(kPro(at.id),pro);
  if(S.u.id===at.id)S.pro=pro;
}

/* tempo a partir dos campos horas:min:seg:centésimo → milissegundos */
function msHMSC(h,m,s,cc){ h=+h||0;m=+m||0;s=+s||0;cc=+cc||0; return ((h*3600+m*60+s)*1000)+cc*10; }
/* tabela de melhores tempos de uma piscina (SC25 curta / LC50 longa) */
function pbsTabela(pbs,pis){
  const ent=Object.entries(pbs||{}).filter(([k])=>k.endsWith(' '+pis)).sort((a,b)=>a[0].localeCompare(b[0]));
  if(!ent.length)return'<div class="small muted" style="margin:6px 0 2px">Nenhuma marca nesta piscina.</div>';
  return`<table style="margin-top:6px"><tbody>${ent.map(([k,v])=>{const[d,e]=k.split(' ');
    return`<tr><td><b>${d}m ${e}</b></td>
      <td class="n" style="text-align:right;font-weight:700">${fmt(v,true)}</td>
      <td style="width:34px;text-align:right"><button class="sm ghost" onclick="apagarPB('${k}')">✕</button></td></tr>`}).join('')}</tbody></table>`;
}
/* provas principais do atleta — foco da projeção e da assinatura de sprint */
function provasAlvo(pro){
  if(pro&&pro.alvos&&pro.alvos.length)return pro.alvos.map(s=>{const p=s.split(' ');return{d:+p[0],e:p.slice(1).join(' ')}});
  const pbs=Object.keys((pro&&pro.pbs)||{}), has=(d,e)=>pbs.some(k=>k.startsWith(d+' '+e+' '));
  for(const e of ['peito','livre','costas','borboleta','medley']){const arr=[50,100].filter(d=>has(d,e)).map(d=>({d,e})); if(arr.length)return arr;}
  return[];
}
function cardAlvos(pro){
  const cur=provasAlvo(pro).map(a=>a.d+' '+a.e);
  const chips=cur.length?cur.map(k=>{const p=k.split(' ');
    return`<span class="chip best" style="font-weight:800">${p[0]}m ${p.slice(1).join(' ')} <b onclick="removerAlvo('${k}')" style="cursor:pointer;color:var(--clock);margin-left:3px">✕</b></span>`;}).join(' ')
    :'<span class="small muted">Nenhuma escolhida — usando 50 e 100 do seu estilo principal.</span>';
  const opts=PROVAS_CAT.filter(p=>!cur.includes(p.d+' '+p.e)).map(p=>`<option value="${p.d} ${p.e}">${p.d}m ${p.e}</option>`).join('');
  return`<div class="card"><div class="eyebrow">provas-alvo</div>
    <div class="small muted" style="margin:4px 0 8px">Suas provas principais — a <b>Projeção de Tempo</b> e a <b>Assinatura de Sprint</b> focam nelas. Adicione quantas quiser (um medista pode ter 6+).</div>
    <div class="chips" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">${chips}</div>
    <div class="row" style="gap:6px">
      <select id="alvoSel" style="flex:1">${opts||'<option value="">(todas já adicionadas)</option>'}</select>
      <button class="sm primary" onclick="adicionarAlvo()">+ Adicionar</button></div></div>`;
}
async function adicionarAlvo(){
  const v=(document.getElementById('alvoSel')||{}).value; if(!v)return;
  S.pro=S.pro||{pbs:{}}; const set=new Set((S.pro.alvos&&S.pro.alvos.length)?S.pro.alvos:provasAlvo(S.pro).map(a=>a.d+' '+a.e));
  set.add(v); S.pro.alvos=[...set]; await salvarPro(); render();
}
async function removerAlvo(k){
  S.pro=S.pro||{pbs:{}}; const set=new Set((S.pro.alvos&&S.pro.alvos.length)?S.pro.alvos:provasAlvo(S.pro).map(a=>a.d+' '+a.e));
  set.delete(k); S.pro.alvos=[...set]; await salvarPro(); render();
}
function telaMarcas(){
  const pro=S.pro||{pbs:{},resultados:[]};
  const res=[...(pro.resultados||[])].sort((a,b)=>b.data.localeCompare(a.data));
  const nSC=Object.keys(pro.pbs||{}).filter(k=>k.endsWith(' SC25')).length;
  const nLC=Object.keys(pro.pbs||{}).filter(k=>k.endsWith(' LC50')).length;
  /* histórico agrupado por prova (dist+estilo+piscina): clica → resultados + gráfico */
  const grupos={};
  for(const r of res){ const k=pbKey(r.dist,r.estilo,r.piscina); (grupos[k]=grupos[k]||[]).push(r); }
  const chavesG=Object.keys(grupos).sort((a,b)=>a.localeCompare(b));
  const histProvas=chavesG.map(k=>{
    const arr=grupos[k]; /* já vem desc por data (de res) */
    const dist=arr[0].dist,estilo=arr[0].estilo,pool=arr[0].piscina;
    const melhor=Math.min(...arr.map(r=>r.tempo));
    const poolL=pool==='LC50'?'Longa · 50m':'Curta · 25m';
    const linhas=arr.map(r=>{
      const tr=(r.parciais||[]).map((v,i)=>i===0?v:v-r.parciais[i-1]);
      return`<div style="padding:10px 0;border-top:1px solid var(--line)">
        <div class="row"><div class="grow"><b>${esc(r.comp||'—')}</b><div class="xs muted">${brData(r.data)}</div></div>
          <div class="kpi" style="text-align:right"><div class="v" style="font-size:19px">${fmt(r.tempo,true)}</div>
            ${r.tempo<=melhor?'<div class="l" style="color:var(--rope)">melhor</div>':''}</div>
          <button class="sm ghost" style="margin-left:6px" onclick="apagarResultado('${r.chave}')">✕</button></div>
        ${tr.length>1?`<div class="chips">${tr.map((t,i)=>`<span class="chip">${i+1}º trecho · ${fmt(t,true)}</span>`).join('')}</div>`:''}
      </div>`;}).join('');
    const pts=[...arr].sort((a,b)=>a.data.localeCompare(b.data)).map(r=>({rot:r.data.slice(8,10)+'/'+r.data.slice(5,7)+'/'+r.data.slice(2,4),v:r.tempo}));
    const grafico=pts.length>=2?`<div class="eyebrow" style="margin-top:14px">evolução</div>${graficoLinha(pts)}
      <div class="xs muted" style="margin-top:6px">Cada ponto é uma competição em ordem cronológica. Linha para baixo = tempo menor = melhorando.</div>`:'';
    return acc('mk_h_'+k.replace(/\W+/g,'_'),`${dist}m ${estilo}`,`${poolL} · ${arr.length} resultado(s) · melhor ${fmt(melhor,true)}`,linhas+grafico);
  }).join('');
  return`
  <div class="row" style="margin:16px 0 10px"><h2>Marcas</h2><div class="grow"></div>
    <button class="sm primary" onclick="abrirNovaMarca()">+ Tempo</button></div>
  ${acc('mk_abmn','Importar da ABMN','currículo On-Line em PDF',`
    <p class="small muted" style="margin:2px 0 8px">Importe seus melhores tempos e o histórico de competições de uma vez — cada resultado entra no quadro de evolução.</p>
    <input type="file" id="abmnFile" accept="application/pdf,.pdf" style="display:none" onchange="importarABMN(this)">
    <button class="primary full" onclick="document.getElementById('abmnFile').click()">Importar currículo ABMN (PDF)</button>`)}
  ${acc('mk_sc','Piscina curta · 25m',nSC?`${nSC} prova(s)`:'sem marcas',nSC?pbsTabela(pro.pbs,'SC25'):'<div class="small muted">Nenhuma marca de piscina curta. Toque em + Tempo.</div>')}
  ${acc('mk_lc','Piscina longa · 50m',nLC?`${nLC} prova(s)`:'sem marcas',nLC?pbsTabela(pro.pbs,'LC50'):'<div class="small muted">Nenhuma marca de piscina longa. Toque em + Tempo.</div>')}
  ${acc('mk_alvos','Provas-alvo','provas foco da projeção',cardAlvos(pro)||'<div class="small muted">Sem provas-alvo definidas.</div>')}
  <div class="eyebrow" style="margin:16px 4px 4px">histórico de competições · por prova</div>
  ${histProvas||'<div class="card"><div class="small muted">Nenhum resultado ainda. Use + Tempo (com a competição) ou o técnico lança nas competições.</div></div>'}
  <div style="height:20px"></div>`;
}

async function salvarMarca(){
  const b=PROVAS_MARCA[+document.getElementById('mkProva').value];
  const pis=document.getElementById('mkPis').value,ms=msHMSC(val('mkH'),val('mkM'),val('mkS'),val('mkC'));
  if(!ms)return toast('Informe o tempo (ao menos os segundos)');
  S.pro=S.pro||{pbs:{},garmin:[],seco:[],resultados:[],exames:[],bioimp:[]};
  const key=pbKey(b.d,b.e,pis);

/* ---------- leitura de PDF no navegador (pdf.js sob demanda) ---------- */
let _pdfjs=null;
function carregarPdfJs(){
  if(_pdfjs)return _pdfjs;
  _pdfjs=new Promise((res,rej)=>{
    if(window.pdfjsLib){res(window.pdfjsLib);return;}
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib)}catch(e){rej(e)}};
    s.onerror=()=>rej(new Error('sem conexão para o leitor de PDF'));
    document.head.appendChild(s);
  });
  return _pdfjs;
}
async function pdfTexto(file){
  const lib=await carregarPdfJs();
  const buf=await file.arrayBuffer();
  const pdf=await lib.getDocument({data:buf}).promise;
  let out='';
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    const linhas={};
    for(const it of tc.items){ const y=Math.round(it.transform[5]); (linhas[y]=linhas[y]||[]).push({x:it.transform[4],s:it.str}); }
    for(const y of Object.keys(linhas).map(Number).sort((a,b)=>b-a))
      out+=linhas[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ')+'\n';
  }
  return out;
}
/* extrai resultados do currículo On-Line da ABMN (histórico por competição) */
function parseABMN(txt){
  const ESTIL={LIVRE:'livre',PEITO:'peito',COSTAS:'costas',BORBOLETA:'borboleta',MEDLEY:'medley'};
  let comp='',pool='SC25'; const out=[];
  for(const raw of txt.split(/\r?\n/)){
    const l=raw.trim(); if(!l)continue;
    const mh=l.match(/^(.*?[A-Za-zÀ-ÿ].*?)\s*[-–]\s*(25|50)\s*METROS\s*$/i);
    if(mh&&!/melhores tempos|resultados por prova/i.test(mh[1])){ comp=mh[1].trim(); pool=mh[2]==='50'?'LC50':'SC25'; continue; }
    if(/melhores tempos/i.test(l)&&/(25|50)\s*metros/i.test(l)){ pool=/50\s*metros/i.test(l)?'LC50':'SC25'; continue; }
    if(/\d\s*[xX]\s*\d/.test(l))continue;                    // pula revezamentos
    const mp=l.match(/(\d{2,4})\s+(LIVRE|PEITO|COSTAS|BORBOLETA|MEDLEY)\s+MASC/i);
    const mt=l.match(/\b(\d{1,2}:\d{2}\.\d{2})\b/);
    const md=l.match(/\b(\d{2})\/(\d{2})\/(\d{4})\b/);
    if(mp&&mt&&md){
      const dist=+mp[1],estilo=ESTIL[mp[2].toUpperCase()]||'livre',tempo=parseTempo(mt[1]);
      if(tempo)out.push({comp,data:`${md[3]}-${md[2]}-${md[1]}`,piscina:pool,prova:`${dist}m ${estilo}`,dist,estilo,tempo,parciais:[],inscricao:null});
    }
  }
  return out;
}
async function importarABMN(inp){
  const f=inp.files&&inp.files[0]; if(!f)return; inp.value='';
  toast('Lendo o PDF…');
  let txt; try{ txt=await pdfTexto(f); }catch(e){ return toast('Não consegui ler: '+e.message); }
  const novos=parseABMN(txt);
  if(!novos.length)return toast('Nenhum resultado ABMN encontrado neste PDF.');
  S.pro=S.pro||{pbs:{},garmin:[],seco:[],resultados:[],exames:[],bioimp:[]};
  S.pro.resultados=S.pro.resultados||[];
  const existe=new Set(S.pro.resultados.map(r=>`${r.dist}|${r.estilo}|${r.piscina}|${r.data}|${r.tempo}`));
  let add=0;
  for(const r of novos){
    const k=`${r.dist}|${r.estilo}|${r.piscina}|${r.data}|${r.tempo}`;
    if(existe.has(k))continue; existe.add(k);
    r.chave='abmn_'+k.replace(/\|/g,'_'); S.pro.resultados.push(r); add++;
    const pk=pbKey(r.dist,r.estilo,r.piscina);
    if(!S.pro.pbs[pk]||r.tempo<S.pro.pbs[pk])S.pro.pbs[pk]=r.tempo;
  }
  await salvarPro(); toast(add?`${add} resultado(s) importado(s) da ABMN`:'Tudo já estava importado'); render();
}

/* agrupa os resultados de competição por prova+piscina para a linha do tempo */
function evolucaoProvas(pro){
  const g={};
  for(const r of (pro.resultados||[])){
    if(r.tempo==null||!r.data)continue;
    const k=pbKey(r.dist,r.estilo,r.piscina);
    (g[k]=g[k]||[]).push(r);
  }
  const out=[];
  for(const k of Object.keys(g)){
    const arr=g[k].slice().sort((a,b)=>a.data.localeCompare(b.data));
    if(arr.length<2)continue;
    const first=arr[0].tempo,last=arr[arr.length-1].tempo;
    out.push({key:k,prova:`${arr[0].dist}m ${arr[0].estilo}`,piscina:arr[0].piscina,
      pts:arr.map(r=>({rot:r.data.slice(8,10)+'/'+r.data.slice(5,7)+'/'+r.data.slice(2,4),v:r.tempo})),delta:last-first,melhora:last<first});
  }
  return out.sort((a,b)=>a.key.localeCompare(b.key));
}
/* mini gráfico de linha: menor tempo (melhor) fica em cima; verde melhora, vermelho piora */
function graficoLinha(pts){
  if(!pts||pts.length<2)return'';
  const W=600,H=150,P=30,n=pts.length;
  const vs=pts.map(p=>p.v),mx=Math.max(...vs),mn=Math.min(...vs),rg=(mx-mn)||1;
  const x=i=>P+(i*(W-2*P)/(n-1));
  const y=v=>P+((v-mn)/rg)*(H-2*P);
  const cor=pts[n-1].v<pts[0].v?'#1B7F5A':'#E0342A';
  const linha=pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" style="overflow:visible">
    <polyline points="${linha}" fill="none" stroke="${cor}" stroke-width="2.5"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5" fill="${cor}"/>
      <text x="${x(i).toFixed(1)}" y="${(y(p.v)-8).toFixed(1)}" font-size="10" fill="#12181C" text-anchor="middle" font-family="JetBrains Mono,monospace">${fmt(p.v,true)}</text>
      <text x="${x(i).toFixed(1)}" y="${H-P+14}" font-size="9" fill="#5A6670" text-anchor="middle" font-family="Barlow,sans-serif">${p.rot}</text>`).join('')}
  </svg>`;
}
function cardEvolucao(pro,eyebrow){
  const ev=evolucaoProvas(pro); if(!ev.length)return'';
  return`<div class="card"><div class="eyebrow">${eyebrow}</div>
    ${ev.map(e=>`<div style="margin-top:14px">
      <div class="row"><b>${e.prova} <span class="xs muted">${e.piscina}</span></b><div class="grow"></div>
        <span class="small" style="font-weight:700;color:${e.melhora?'var(--ok)':'var(--clock)'}">${e.melhora?'▼ melhorou':'▲ piorou'} ${fmt(Math.abs(e.delta),true)}</span></div>
      ${graficoLinha(e.pts)}</div>`).join('')}
    <div class="xs muted" style="margin-top:8px">Cada ponto é uma competição, na ordem cronológica (dia/mês/ano). Linha para baixo = tempo menor = melhorando.</div>
  </div>`;
}

function prontidao(){
  const g=[...(S.pro?.garmin||[])].sort((a,b)=>b.data.localeCompare(a.data));
  const h=g.filter(x=>x.hrv!=null),f=g.filter(x=>x.fc!=null);
  if(h.length<4&&f.length<4)return'<div class="small muted">Poucos dias para uma leitura confiável.</div>';
  const m=[];let alerta=false;
  if(h.length>=4){
    const rec=h.slice(0,3).reduce((t,x)=>t+x.hrv,0)/3;
    const base=h.slice(3,17).reduce((t,x)=>t+x.hrv,0)/Math.max(1,h.slice(3,17).length);
    const d=((rec-base)/base)*100;
    if(d<-8){m.push(`VFC ${Math.abs(d).toFixed(0)}% abaixo da linha de base.`);alerta=true}
    else if(d>8)m.push(`VFC ${d.toFixed(0)}% acima da linha de base — boa janela para intensidade.`);
    else m.push('VFC estável em relação à linha de base.');
  }
  if(f.length>=4){
    const rec=f.slice(0,3).reduce((t,x)=>t+x.fc,0)/3;
    const base=f.slice(3,17).reduce((t,x)=>t+x.fc,0)/Math.max(1,f.slice(3,17).length);
    if(rec>base+3){m.push(`FC de repouso ${(rec-base).toFixed(0)} bpm acima do habitual.`);alerta=true}
  }
  const sono=g.filter(x=>x.sono!=null).slice(0,7);
  if(sono.length>=3){const md=sono.reduce((t,x)=>t+x.sono,0)/sono.length;
    if(md<6.5){m.push(`Média de sono de ${md.toFixed(1)}h nos últimos dias.`);alerta=true}}
  return`<div class="note ${alerta?'warn':'ok'}">${m.join(' ')}</div>`;
}
/* ── CHECK-IN DIÁRIO SUBJETIVO (prontidão sem relógio) ───────────────────────
   5 perguntas 1-5 (sono, energia, dor, estresse, humor). Vira um score 0-100.
   Salvo no mesmo registro diário (S.pro.garmin[data]); entra no relatório. */
function checkinScore(x){
  if(!x)return null;
  const need=['sonoQ','energia','dor','estresse','humor'];
  if(need.some(k=>x[k]==null))return null;
  const s=x.sonoQ+x.energia+x.humor+(6-x.dor)+(6-x.estresse); /* 5..25 (dor/estresse invertidos) */
  return Math.round((s-5)/20*100);
}
function prontidaoSubj(dias){
  dias=dias||7; const h0=new Date(hoje()+'T00:00:00');
  const arr=(S.pro?.garmin||[]).filter(x=>{const d=(h0-new Date(x.data+'T00:00:00'))/86400000;return d>=0&&d<dias&&checkinScore(x)!=null;});
  if(!arr.length)return null;
  const sc=arr.map(checkinScore), media=Math.round(sc.reduce((t,s)=>t+s,0)/sc.length);
  const hj=(S.pro?.garmin||[]).find(x=>x.data===hoje());
  return {media,n:arr.length,hoje:hj?checkinScore(hj):null};
}
function veredictoProntidao(score){
  if(score==null)return {nivel:'sem check-in',cor:'var(--ink-2)',txt:'Faça o check-in diário na aba Saúde para acompanhar a prontidão sem relógio.'};
  if(score>=75)return {nivel:'pronto',cor:'var(--ok)',txt:'Bem recuperado — dá para treinar forte e progredir a carga.'};
  if(score>=50)return {nivel:'moderado',cor:'var(--rope)',txt:'Prontidão média — mantenha a carga, evite picos e cuide do sono.'};
  return {nivel:'baixa prontidão',cor:'var(--clock)',txt:'Sinais de fadiga/estresse — priorize recuperação; cuidado ao subir a carga (risco de overtraining).'};
}

async function importarGarmin(raw,silencioso){
  if(!raw||!raw.trim()){if(!silencioso)toast('Cole os dados');return 0}
  let j; try{j=JSON.parse(raw)}catch(e){if(!silencioso)toast('JSON inválido');return 0}
  S.pro=S.pro||{pbs:{},garmin:[],seco:[],resultados:[],exames:[],bioimp:[]};
  const arr=Array.isArray(j)?j.flat():[j],mapa={};
  (S.pro.garmin||[]).forEach(x=>mapa[x.data]=x);
  let n=0;
  arr.forEach(o=>{
    if(!o||typeof o!=='object')return;
    const d=o.calendarDate||o.calendar_date||o.sleepStartTimestampLocal?.slice?.(0,10)||
      (o.startTimeLocal?String(o.startTimeLocal).slice(0,10):null);
    if(!d||!/^\d{4}-\d{2}-\d{2}/.test(d))return;
    const dia=d.slice(0,10);
    const g=mapa[dia]||{data:dia};
    if(o.restingHeartRate!=null)g.fc=Math.round(o.restingHeartRate);
    const hrv=o.hrvWeeklyAverage??o.lastNightAvg??o.avgOvernightHrv??o.weeklyAvg;
    if(hrv!=null)g.hrv=Math.round(hrv);
    if(o.sleepTimeSeconds!=null)g.sono=+(o.sleepTimeSeconds/3600).toFixed(1);
    if(o.deepSleepSeconds!=null&&o.sleepTimeSeconds==null)g.sono=+((o.deepSleepSeconds+(o.lightSleepSeconds||0)+(o.remSleepSeconds||0))/3600).toFixed(1);
    if((o.activityType==='lap_swimming'||o.activityType==='open_water_swimming')&&o.distance!=null)
      g.nado=(g.nado||0)+Math.round(o.distance/100);
    mapa[dia]=g;n++;
  });
  S.pro.garmin=Object.values(mapa);
  if(!silencioso){await salvarPro();toast(`${n} registro(s) lido(s)`);render()}
  return n;
}

let FOTO=null,SECOPDF=null;
function fotoSeco(inp){
  const f=inp.files[0]; if(!f)return;
  if(f.type==='application/pdf'){
    const p=document.getElementById('skPrev');
    if(f.size>500000){ SECOPDF=null; if(p)p.textContent='PDF grande demais (máx 500KB). Prefira uma foto.'; return; }
    const rp=new FileReader(); rp.onload=()=>{ SECOPDF=rp.result; FOTO=null; if(p)p.textContent='PDF anexado ✓'; }; rp.readAsDataURL(f); return;
  }
  const r=new FileReader();
  r.onload=()=>{
    SECOPDF=null;
    const img=new Image();
    img.onload=()=>{
      const max=760,esc2=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*esc2); cv.height=Math.round(img.height*esc2);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      FOTO=cv.toDataURL('image/jpeg',.6);
      const p=document.getElementById('skPrev');
      if(p)p.innerHTML=`<img src="${FOTO}" style="max-width:130px;border-radius:9px;border:1px solid var(--line)">`;
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

   PRO — RELATÓRIO DE PERFORMANCE

async function coletarEsforcos(opts){
  const out=[]; const ses=[];
  /* janela TEMPORAL opcional: coletarEsforcos({dias:56}). Sem argumento mantém o
     comportamento antigo (os 25 treinos mais recentes) por compatibilidade. */
  const dias=opts&&opts.dias, h0=new Date(hoje()+'T00:00:00');
  const noPrazo=d=>{ if(!dias)return true; const x=(h0-new Date((d||'')+'T00:00:00'))/86400000; return x>=0&&x<dias; };
  const alvo=_alvoId();
  const metas=S.tridx.filter(t=>(t.para||[]).includes(alvo)&&noPrazo(t.data));
  const lista=dias?metas:metas.slice(0,25);
  for(const meta of lista){
    const t=await DB.get(kTr(_alvoEq(),meta.id)); if(!t)continue;
    if(!treinoFeito(t,alvo))continue;   /* só consolida treino marcado como feito */
    const sj=t.sessao&&t.sessao[alvo];
    if(sj&&sj.rpe!=null&&sj.dur)ses.push({data:t.data||meta.data,tipo:'natação',load:sj.rpe*sj.dur});
    for(const b of t.blocos||[])for(const i of b.itens){
      const r=t.registros?.[alvo]?.[i.id]; if(!r)continue;
      const series=r.rd?r.rd:[r];   /* achata rodadas (do interpretador OU manuais) */
      for(const s of series)(s.tempos||[]).forEach((x,k)=>{ if(x==null)return;
        const pk=s.parciais?.[k];
        /* p1 = split de 25m dos 50m (para o "custo do segundo 25"): escalar (legado) ou 1ª passagem do array */
        const p1=(i.parcial&&i.dist===50)?(Array.isArray(pk)?(pk[0]??null):(typeof pk==='number'?pk:null)):null;
        out.push({data:t.data,dist:i.dist,estilo:i.estilo,tags:i.tags,tempo:x,p1,forte:i.forte,vol:i.vol})});
    }
  }
  SESSOES=ses;
  return out.sort((a,b)=>a.data.localeCompare(b.data));
}
let ESF=null, SESSOES=[];
/* Carga total (session-RPE = duração × RPE) por modalidade, últimos N dias */
function cargaTotal(dias){
  dias=dias||28; const h0=new Date(hoje()+'T00:00:00');
  const dentro=d=>{const x=(h0-new Date(d+'T00:00:00'))/86400000;return x>=0&&x<dias;};
  let natacao=0,forca=0;
  for(const s of (SESSOES||[]))if(dentro(s.data))natacao+=s.load;
  for(const s of ((S.pro&&S.pro.seco)||[]))if(s.rpe!=null&&s.dur&&dentro(s.data))forca+=s.rpe*s.dur;
  const total=natacao+forca;
  return total>0?{natacao:Math.round(natacao),forca:Math.round(forca),total:Math.round(total)}:null;
}
function cardCargaTotal(){

    ${(()=>{const t=tonelagem(28);return t?`<div class="xs" style="margin-top:6px;color:var(--ink-2)"><b>Tonelagem de força (28d):</b> ~${t.total.toLocaleString('pt-BR')} kg em ${t.sessoes} sessão(ões) — volume real de musculação (séries×reps×carga), quando a ficha traz as cargas.</div>`:'';})()}
  </div>`;
}
/* carga diária (session-RPE) somando natação + treinos fora d'água → índice por dias-atrás */
function loadDiario(dias){
  dias=dias||42; const h0=new Date(hoje()+'T00:00:00');
  const dd=d=>Math.floor((h0-new Date((d||'')+'T00:00:00'))/86400000);
  const dia={}; const push=(d,v)=>{const k=dd(d); if(k>=0&&k<dias)dia[k]=(dia[k]||0)+v;};
  for(const s of (SESSOES||[]))push(s.data,s.load||0);
  for(const s of ((S.pro&&S.pro.seco)||[]))if(s.rpe!=null&&s.dur)push(s.data,s.rpe*s.dur);
  return dia;
}
/* fadiga: aguda(7d) × crônica(28d/sem) = relação a/c; monotonia = média/desvio (7d) */
function fadigaCarga(){
  const dia=loadDiario(42), soma=(a,b)=>{let t=0;for(let i=a;i<b;i++)t+=dia[i]||0;return t;};
  const aguda=soma(0,7), cron=soma(0,28)/4;
  if(aguda<=0&&cron<=0)return null;
  const acwr=cron>0?aguda/cron:null;
  const arr=Array.from({length:7},(_,i)=>dia[i]||0), m=arr.reduce((t,x)=>t+x,0)/7;
  const sd=Math.sqrt(arr.reduce((t,x)=>t+(x-m)*(x-m),0)/7), monotonia=sd>0?m/sd:(m>0?3:0);
  return {aguda:Math.round(aguda),cronica:Math.round(cron),acwr,monotonia:+monotonia.toFixed(1),strain:Math.round(aguda*monotonia)};
}
function cardFadiga(){
  const f=fadigaCarga(); if(!f)return'';
  const a=f.acwr; let nivel,cor,txt;
  if(a==null){nivel='dados iniciais';cor='var(--ink-2)';txt='Ainda sem carga habitual (crônica) suficiente para comparar. Registre RPE e duração nos treinos.';}
  else if(a>1.5||f.monotonia>2.2){nivel='alerta de fadiga';cor='var(--clock)';txt='Carga recente bem acima da habitual'+(f.monotonia>2.2?' e treinos muito monótonos':'')+' — fadiga acumulada. Vale um dia leve/recuperação antes de subir a carga (risco de overtraining).';}
  else if(a>=0.8){nivel='carga sustentável';cor='var(--ok)';txt='Carga em faixa saudável — dá para manter ou progredir aos poucos.';}
  else {nivel='carga baixa';cor='';txt='Carga abaixo da habitual — há espaço para aumentar volume/intensidade com segurança.';}
  return`<div class="card"><div class="eyebrow">fadiga e overtraining</div>
    <div class="grid3" style="margin-top:8px">
      <div class="kpi"><div class="v">${f.cronica}</div><div class="l">fitness (crônica/sem)</div></div>
      <div class="kpi"><div class="v">${f.aguda}</div><div class="l">fadiga (aguda 7d)</div></div>
      <div class="kpi"><div class="v" style="${a!=null&&a>1.5?'color:var(--clock)':''}">${a!=null?a.toFixed(2):'—'}</div><div class="l">relação a/c</div></div>
    </div>
    <div class="note" style="margin-top:10px;border-color:${cor}"><b>${nivel[0].toUpperCase()+nivel.slice(1)}:</b> ${txt}</div>
    <div class="xs muted" style="margin-top:6px">Junta natação + treinos fora d'água (carga = duração × RPE). <b>Fitness</b> = carga habitual (28 dias); <b>fadiga</b> = últimos 7 dias; monotonia ${f.monotonia}. Interprete com a prontidão — leitura de apoio, não diagnóstico.</div>
  </div>`;
}
/* ── FADIGA POR ATLETA (visão do técnico) ────────────────────────────────────
   Calcula a carga do atleta a partir dos treinos da equipe (natação) + o snapshot
   de fora d'água do atleta (kPerf). NÃO usa dados de Saúde (Garmin/exames). */
async function calcFadigaAtleta(atId){
  const dias=42, h0=new Date(hoje()+'T00:00:00');
  const dd=d=>Math.floor((h0-new Date((d||'')+'T00:00:00'))/86400000);
  const dia={}; const push=(d,v)=>{const k=dd(d); if(k>=0&&k<dias)dia[k]=(dia[k]||0)+v;};
  const metas=S.tridx.filter(t=>(t.para||[]).includes(atId)&&dd(t.data)>=0&&dd(t.data)<dias);
  for(const meta of metas){ const t=await DB.get(kTr(S.u.equipe,meta.id)); if(!t)continue;
    const sj=t.sessao&&t.sessao[atId]; if(sj&&sj.rpe!=null&&sj.dur)push(t.data||meta.data,sj.rpe*sj.dur); }
  const perf=await DB.get(kPerf(S.u.equipe,atId));
  const pront=(perf&&perf.prontidao)||null;
  for(const s of ((perf&&perf.seco)||[]))if(s.rpe!=null&&s.dur)push(s.data,s.rpe*s.dur);
  const soma=(a,b)=>{let t=0;for(let i=a;i<b;i++)t+=dia[i]||0;return t;};
  const aguda=soma(0,7), cron=soma(0,28)/4;
  const temCarga=!(aguda<=0&&cron<=0);
  if(!temCarga&&!pront)return null;
  let res={aguda:null,cronica:null,acwr:null,monotonia:null,prontidao:pront};
  if(temCarga){
    const acwr=cron>0?aguda/cron:null;

/* Interpreta a ficha de força. Carga SÓ entra nos cálculos com unidade explícita
   de kg. Número solto (ex.: "Supino 4x8 60") vira `cargaAmbigua` e NÃO conta em
   tonelagem/e-1RM (fica guardado para confirmação futura). Descanso/pausa nunca é
   carga. Reps em segundos (prancha) = isométrico → sem carga e tonelagem 0.
   Mantém campos antigos (ex/ton). */
function parseForca(txt){
  if(!txt)return{itens:[],tonelagem:0};
  const itens=[]; let ton=0;
  for(let ln of String(txt).split(/\n|;/)){
    ln=ln.trim(); if(!ln)continue;
    const m=ln.match(/(\d{1,2})\s*[x×]\s*(\d{1,3})/i); if(!m)continue;
    const series=+m[1], reps=+m[2], resto=ln.slice(m.index+m[0].length);
    const tempoReps=/^\s*(s|seg|segundos|"|”)\b/i.test(resto)||/^\s*(s|seg)/i.test(resto);  // reps em segundos → isométrico
    let carga=null, unidade=null, cargaAmbigua=null;
    if(!tempoReps){
      const semSR=ln.replace(m[0],' ');
      const mkg=semSR.match(/(\d{1,3}(?:[.,]\d{1,2})?)\s*kg\b/i);
      if(mkg){carga=parseFloat(mkg[1].replace(',','.'));unidade='kg';}
      else{
        const limpo=semSR
          .replace(/\b(descanso|pausa|desc\.?|rest|intervalo|int\.?|sa[íi]da|pace)\b\D{0,4}\d{1,3}\s*(s|seg|min|'|"|”)?/ig,' ')
          .replace(/\d{1,3}\s*(s|seg|min|'|"|”)\b/ig,' ');   // remove qualquer tempo restante
        const mnum=limpo.match(/(\d{1,3}(?:[.,]\d{1,2})?)/);
        if(mnum)cargaAmbigua=parseFloat(mnum[1].replace(',','.'));   // guardado, NÃO entra nos cálculos
      }

    const nomeOriginal=ln.slice(0,m.index).replace(/[-–:]+$/,'').trim()||'exercício';
    const tonI=(carga!=null&&!tempoReps)?series*reps*carga:0; ton+=tonI;
    const e1=estimarE1RM(carga,reps);

      series,reps,carga,unidade,cargaAmbigua,tonelagem:Math.round(tonI),e1rm:e1.valor,confianca:carga!=null?0.9:0,
      ex:nomeOriginal,ton:Math.round(tonI)});   // compat

function tonForcaSessao(s){

   mais repetida do documento (ignora a de nascimento). Nunca usa a de hoje à toa. */
function dataDoExame(txt){
  const norm=(d,m,a)=>`${a}-${m}-${d}`;
  let m=txt.match(/coleta\s*:?\s*(\d{2})\/(\d{2})\/(\d{4})/i)
      ||txt.match(/data\s*(?:d[ae]\s*)?coleta\s*:?\s*(\d{2})\/(\d{2})\/(\d{4})/i);
  if(m)return norm(m[1],m[2],m[3]);
  m=txt.match(/data\s*\/?\s*hora\s*:?\s*(\d{2})[.\/](\d{2})[.\/](\d{4})/i);   /* InBody */
  if(m)return norm(m[1],m[2],m[3]);
  /* fallback: data mais frequente (aceita / ou .), descartando nascimento e datas de emissão/liberação */
  const cont={};
  for(const linha of txt.split(/\r?\n/)){
    if(/nascimento|\bdn\b|\bd\.n\b|libera[çc]|emiss|impress/i.test(linha))continue;
    const achadas=linha.match(/\b(\d{2})[.\/](\d{2})[.\/](\d{4})\b/g)||[];
    for(const d of achadas){const p=d.split(/[.\/]/);cont[norm(p[0],p[1],p[2])]=(cont[norm(p[0],p[1],p[2])]||0)+1;}
  }
  const ord=Object.entries(cont).sort((a,b)=>(b[1]-a[1])||b[0].localeCompare(a[0]));
  return ord.length?ord[0][0]:hoje();
}
/* Lê laudo laboratorial. Formato comum (Sabin/Fleury/etc): o marcador é um
   título e o valor vem depois em "RESULTADO: x". Fallback: valor na mesma linha. */
function parseExame(txt){
  const linhas=txt.split(/\r?\n/).map(l=>l.trim());
  const vals={}; let atual=null;
  const num=s=>{const n=parseFloat(String(s).replace(/\./g,'#').replace(',','.').replace(/#/g,''));return isNaN(n)?null:n;};
  for(const l of linhas){
    if(!l)continue;
    const mr=l.match(/resultado\s*:?\s*([<>]?\s*-?[\d.,]+)/i);
    if(mr){ if(atual&&vals[atual]==null){const n=num(mr[1].replace(/[<>\s]/g,'')); if(n!=null)vals[atual]=n;} continue; }
    /* título de seção: linha curta que casa com um marcador conhecido */
    if(l.length<=60){
      const hit=MARC_LAB.find(([,,,re])=>re.test(l));
      if(hit){
        atual=hit[0];
        /* alguns laudos põem o valor na mesma linha do título */
        const inline=l.replace(hit[3],'').match(/(-?\d[\d.,]*)/);
        if(inline&&vals[atual]==null&&/\d/.test(inline[1])&&!/^\d{2}\/\d{2}/.test(l)){
          const n=num(inline[1]); if(n!=null&&/(:|\s{2,})/.test(l))vals[atual]=n;
        }
        continue;
      }
    }
  }
  return vals;
}
/* ── Leitura por IA (via Cloudflare Worker) ──────────────────────────────── */
function fileB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(new Error('não consegui ler o arquivo'));r.readAsDataURL(file);});}
/* prepara o arquivo p/ IA: foto é reduzida (máx 1600px, JPEG) pra não estourar
   limite/tamanho; PDF vai como está. Devolve {data(base64), mime}. */
function arquivoParaIA(file){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type||'')){ fileB64(file).then(data=>res({data,mime:file.type||'application/pdf'})).catch(rej); return; }
    const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{ const max=1600,e=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement('canvas'); cv.width=Math.round(img.width*e); cv.height=Math.round(img.height*e);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res({data:(cv.toDataURL('image/jpeg',.85).split(',')[1]||''),mime:'image/jpeg'}); };
      img.onerror=()=>rej(new Error('não consegui abrir a imagem (formato não suportado?)'));
      img.src=r.result; };
    r.onerror=()=>rej(new Error('não consegui ler o arquivo'));
    r.readAsDataURL(file);
  });
}
async function chamarIA(payload){
  const r=await fetch(IA_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  let d; try{ d=await r.json(); }catch{ throw new Error('resposta inválida do servidor'); }
  if(!r.ok||d.erro)throw new Error(d.erro||('erro '+r.status));
  return d;
}

function mdNeg(s){return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
function mdSimples(t){
  const linhas=esc(String(t||'')).split(/\n/); let html='',emLista=false;
  const fecha=()=>{if(emLista){html+='</ul>';emLista=false;}};
  for(const raw of linhas){
    const l=raw.trim();
    if(!l){fecha();continue;}
    if(/^##\s+/.test(l)){fecha();html+=`<h3 style="margin:12px 0 4px">${mdNeg(l.replace(/^##\s+/,''))}</h3>`;continue;}
    if(/^#\s+/.test(l)){fecha();html+=`<h2 style="margin:12px 0 6px">${mdNeg(l.replace(/^#\s+/,''))}</h2>`;continue;}
    if(/^[-*]\s+/.test(l)){if(!emLista){html+='<ul style="margin:4px 0 4px 18px">';emLista=true;}html+=`<li>${mdNeg(l.replace(/^[-*]\s+/,''))}</li>`;continue;}
    fecha();html+=`<p style="margin:6px 0">${mdNeg(l)}</p>`;
  }
  fecha(); return html;
}

/* gráfico de linha simples para série de marcador (neutro: nem alto nem baixo é "bom") */
function graficoSerie(pts,faixa){
  if(!pts||pts.length<2)return'';
  const W=600,H=120,P=26,n=pts.length;
  const vs=pts.map(p=>p.v);
  let mn=Math.min(...vs),mx=Math.max(...vs);
  if(faixa){ if(faixa.lo!=null)mn=Math.min(mn,faixa.lo); if(faixa.hi!=null)mx=Math.max(mx,faixa.hi); }
  const rg=(mx-mn)||1;
  const x=i=>P+(i*(W-2*P)/(n-1)), y=v=>H-P-((v-mn)/rg)*(H-2*P);
  const faixaSvg=(faixa&&(faixa.lo!=null||faixa.hi!=null))
    ? `<rect x="${P}" y="${(faixa.hi!=null?y(faixa.hi):P).toFixed(1)}" width="${W-2*P}" height="${Math.max(2,((faixa.lo!=null?y(faixa.lo):H-P)-(faixa.hi!=null?y(faixa.hi):P))).toFixed(1)}" fill="#1B7F5A" opacity=".07"/>` : '';
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" style="overflow:visible">
    ${faixaSvg}
    <polyline points="${pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}" fill="none" stroke="#0E6E8C" stroke-width="2.5"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.2" fill="#0E6E8C"/>
      <text x="${x(i).toFixed(1)}" y="${(y(p.v)-7).toFixed(1)}" font-size="10" fill="#12181C" text-anchor="middle" font-family="JetBrains Mono,monospace">${p.v}</text>
      <text x="${x(i).toFixed(1)}" y="${H-P+13}" font-size="9" fill="#5A6670" text-anchor="middle" font-family="Barlow,sans-serif">${p.d}</text>`).join('')}
  </svg>`;
}

/* TMB estimada (Katch-McArdle, usa massa magra) quando o aparelho não traz */
function tmbKatch(b){ if(!b||b.peso==null||b.gordura==null)return null; const lbm=b.peso*(1-b.gordura/100); return Math.round(370+21.6*lbm); }
function tmbDe(b){ return (b&&b.tmb!=null)?b.tmb:tmbKatch(b); }
function imcDe(b){ if(!b||b.peso==null||!b.altura)return null; const h=b.altura/100; return +(b.peso/(h*h)).toFixed(1); }
/* valor de bioimpedância fisiologicamente improvável → não deve ser usado em conclusões */
function bioSuspeita(b){ if(!b)return null; if(b.gordura!=null&&b.gordura<7)return 'gordura corporal muito baixa'; const imc=imcDe(b); if(b.gordura!=null&&b.gordura<10&&imc!=null&&imc>26)return `gordura ${b.gordura}% incompatível com IMC ${imc}`; return null; }

function estadoPerformance(pro,comPct,sem){
  const md=(a,k)=>a.reduce((t,x)=>t+x[k],0)/Math.max(1,a.length);
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));

  const h=g.filter(x=>x.hrv!=null),f=g.filter(x=>x.fc!=null);
  let pr=null;
  if(h.length>=4||f.length>=4){
    let s=72; const mot=[];
    if(h.length>=4){const d=(md(h.slice(0,3),'hrv')-md(h.slice(3,17),'hrv'))/md(h.slice(3,17),'hrv')*100;const c=cl(d*1.2,-22,16);s+=c;mot.push({c,txt:`VFC ${d>=0?'+':''}${d.toFixed(0)}% vs base`});}
    if(f.length>=4){const d=md(f.slice(0,3),'fc')-md(f.slice(3,17),'fc');const c=cl(-d*2,-14,8);s+=c;mot.push({c,txt:`FC repouso ${d>=0?'+':''}${d.toFixed(0)} bpm`});}
    const sn=g.filter(x=>x.sono!=null).slice(0,7);
    if(sn.length>=3){const m=md(sn,'sono');const c=m<6.5?-8:(m>=7.5?4:0);if(c){s+=c;mot.push({c,txt:`sono ${m.toFixed(1)}h`});}}
    if(sem&&sem.length>=2&&sem[sem.length-1].m>sem[sem.length-2].m*1.25){s-=8;mot.push({c:-8,txt:'volume +25%'});}
    pr={score:Math.round(cl(s,0,100)),mot,dias:Math.max(h.length,f.length)};
  }
  /* Capacidade: quão perto do melhor tempo os tiros recentes estão saindo */
  let cap=null;
  if(comPct.length){const a=comPct.slice(-15);cap={score:Math.round(cl(md(a,'pct'),0,100)),n:a.length};}
  /* Tendência: evolução em competição PONDERADA PELA MAGNITUDE + tendência do %PB.
     Antes contava só quantas provas melhoraram/pioraram; agora usa o TAMANHO da melhora
     (% de queda de tempo por prova), então cair 2 s pesa mais que cair 1 centésimo. */
  let tend=null;
  const ev=(typeof evolucaoProvas==='function')?evolucaoProvas(pro):[];
  const net=ev.filter(e=>e.melhora).length-ev.filter(e=>!e.melhora).length;   /* contagem (só p/ referência) */
  /* % média de melhora nas competições: (primeiro − último)/primeiro · +=melhorou */
  const mps=ev.map(e=>{const f=e.pts&&e.pts[0]?e.pts[0].v:null,l=e.pts&&e.pts.length?e.pts[e.pts.length-1].v:null;return (f&&l&&f>0)?(f-l)/f*100:0;});

  let pc=0;
  if(comPct.length>=4){const hf=Math.floor(comPct.length/2);pc=md(comPct.slice(hf),'pct')-md(comPct.slice(0,hf),'pct');}
  /* score contínuo, em "% equivalente": competição pesa cheio; tendência de treino, metade */
  const mag=magProvas+pc*0.5;
  const dir=mag>0.4?'↑':mag<-0.4?'↓':'→';   /* zona morta de 0,4% evita oscilar à toa */
  if(ev.length||comPct.length>=4){
    const detalhe=ev.length?`${magProvas>=0?'+':''}${magProvas.toFixed(1)}% em prova`:`%PB ${pc>=0?'+':''}${pc.toFixed(1)}`;
    tend={dir,
      txt:dir==='↑'?'capacidade melhorando':dir==='↓'?'capacidade em queda — atenção':'capacidade estável',
      cor:dir==='↑'?'var(--ok)':dir==='↓'?'var(--clock)':'var(--ink-2)',
      net,magProvas:+magProvas.toFixed(1),pc:+pc.toFixed(1),mag:+mag.toFixed(1),detalhe,
      nEv:ev.length,nPct:comPct.length};
  }
  return {pr,cap,tend};
}

/* Carga aguda × crônica (ACWR): volume dos últimos 7 dias / média semanal em 28 dias.

function cargaACWR(){
  const h0=new Date(hoje()+'T00:00:00');
  const meus=S.tridx.filter(t=>(t.para||[]).includes(S.u.id)&&t.data);
  const dias=t=>Math.floor((h0-new Date(t.data+'T00:00:00'))/86400000);
  let ag=0,cr28=0;
  for(const t of meus){const d=dias(t); if(d<0)continue;
    if(d<7)ag+=(t.vol||0);
    if(d<28)cr28+=(t.vol||0);}
  const cr=cr28/4;
  if(cr<=0)return null;
  return {ag,cr:Math.round(cr),acwr:ag/cr};

/* Estima a composição de forma transparente. O peso é sempre real (balança).
   Se a gordura% do aparelho for plausível (8–45%), usa-a; senão ESTIMA a partir de
   idade/sexo (+ altura via Deurenberg, quando houver), porque a bioimpedância do
   atleta costuma ler gordura baixa demais. Score com TETO 90 (nunca "100/perfeito"). */
function composicaoEstim(pro){
  const bio=[...(pro.bioimp||[])].filter(b=>b.peso!=null).sort((a,b)=>a.data.localeCompare(b.data));
  if(!bio.length)return null;
  const ult=bio[bio.length-1];
  const idade=(typeof anos==='function'&&S.u)?(anos(S.u)||42):42;
  const sexoF=!!(S.u&&S.u.store&&S.u.store.sexo==='feminino');
  const plausivel=g=>g!=null&&g>=5&&g<=45;      // atleta muito magro (5%) é real
  let gord=ult.gordura, estimada=false, motivo='', fonte='medida';
  if(!plausivel(gord)){
    estimada=true;
    if(ult.agua!=null&&ult.agua>=45&&ult.agua<=80){
      /* a % de gordura do aparelho lê baixo demais, mas a ÁGUA é confiável:
         massa magra ≈ água corporal ÷ 0,732 (hidratação) → gordura por diferença. */
      gord=100*(1-(ult.agua/100)/0.732); fonte='água corporal';
      motivo=`a gordura% do aparelho (${ult.gordura}%) é implausível; estimada pela sua água corporal (${ult.agua}%)`;
    } else {
      gord=(sexoF?20:12)+(Math.max(30,idade)-30)*0.25; fonte='idade/sexo';
      motivo='a gordura% do aparelho é implausível; estimada por idade/sexo';
    }

  }
  gord=+gord.toFixed(1);
  const massaMagra=+(ult.peso*(1-gord/100)).toFixed(1);
  const score=Math.round(Math.max(0,Math.min(90,92-(gord-6)*3)));   // teto 90 (nunca "perfeito")
  return {peso:ult.peso,data:ult.data,gordura:gord,estimada,fonte,motivo,massaMagra,score,imc:imcDe(ult),tmb:tmbDe(ult)};
}

/* ── CORRELAÇÕES: cruza o histórico do próprio atleta ──────────────────────── */
function garminNaData(pro,dataISO,campo){
  const g=(pro.garmin||[]).filter(x=>x[campo]!=null);

  const out={rec:null,carga:null};
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  /* Recuperação × desempenho: %PB por estado de VFC no dia do tiro */
  const hrvAll=(pro.garmin||[]).filter(x=>x.hrv!=null).map(x=>x.hrv);
  if(hrvAll.length>=6&&comPct.length>=6){
    const base=avg(hrvAll), b={bom:[],neutro:[],ruim:[]};
    for(const e of comPct){const hv=garminNaData(pro,e.data,'hrv'); if(hv==null)continue; const dev=(hv-base)/base*100; (dev>4?b.bom:dev<-4?b.ruim:b.neutro).push(e.pct);}

        insight:(b.bom.length>=2&&b.ruim.length>=2&&rB!=null&&rR!=null)?(rB-rR>1.5?`Com recuperação boa você nada em média <b>${(rB-rR).toFixed(0)}%</b> mais perto do seu melhor tempo do que com recuperação ruim.`:'Sem diferença clara entre recuperação boa e ruim ainda.'):null};

  const loadSem={},pctSem={};

/* ── BASELINE INDIVIDUAL MÓVEL ──────────────────────────────────────────────

function baselineSerie(pts,janela,recentes){
  if(!pts||!pts.length)return null;
  const s=[...pts].sort((a,b)=>b.data.localeCompare(a.data));
  const h0=new Date(hoje()+'T00:00:00'), dd=d=>(h0-new Date(d+'T00:00:00'))/86400000;
  const at=s.slice(0,recentes||3), base=s.filter(p=>dd(p.data)<(janela||28));
  if(!at.length||base.length<3)return null;
  const avg=a=>a.reduce((t,x)=>t+x.v,0)/a.length;
  const a=avg(at), b=avg(base);
  return {atual:a,base:b,desvio:b?(a-b)/b*100:0,n:base.length};
}
function baselinesResumo(pro,comPct){
  const gar=pro.garmin||[], bio=(pro.bioimp||[]).filter(b=>!bioSuspeita(b));
  const spec=[
    ['VFC','ms',1, gar.filter(x=>x.hrv!=null).map(x=>({data:x.data,v:x.hrv})),1],
    ['FC repouso','bpm',-1, gar.filter(x=>x.fc!=null).map(x=>({data:x.data,v:x.fc})),1],
    ['Sono','h',1, gar.filter(x=>x.sono!=null).map(x=>({data:x.data,v:x.sono})),1],
    ['Peso','kg',0, bio.filter(b=>b.peso!=null).map(b=>({data:b.data,v:b.peso})),1],
    ['Massa magra','kg',1, bio.filter(b=>b.peso!=null&&b.gordura!=null).map(b=>({data:b.data,v:+(b.peso*(1-b.gordura/100)).toFixed(1)})),1],
    ['%PB','%',1, (comPct||[]).map(e=>({data:e.data,v:e.pct})),0]
  ];
  return spec.map(([nome,un,sinal,pts,dec])=>{const bl=baselineSerie(pts,28,nome==='%PB'?5:3);return bl?{nome,un,sinal,dec,atual:bl.atual,desvio:bl.desvio,n:bl.n}:null}).filter(Boolean);

function cardBaseline(pro,comPct){
  const rs=baselinesResumo(pro,comPct); if(!rs.length)return'';

    <div class="small muted" style="margin:4px 0 6px">Valor recente comparado à sua linha de base de 28 dias.</div>

    <div class="xs muted" style="margin-top:8px">Verde = variação favorável para você; vermelho = desfavorável. Peso é neutro (depende do objetivo).</div>

/* média dos tiros MAIS RÁPIDOS (topo 20%) numa prova, nos últimos `dias` — melhor
   sinal do que a média, porque o treino tem muito nado leve. */
function melhorTempo(comPct,d,e,dias,ate){
  const h0=new Date((ate||hoje())+'T00:00:00');
  const rec=comPct.filter(x=>{
    if(x.dist!==d||x.estilo!==e)return false;
    const dt=(h0-new Date(x.data+'T00:00:00'))/86400000;
    if(ate&&dt<0)return false;   /* autocalibração: só os tiros que existiam ANTES da prova */
    return !dias||dt<dias;
  }).map(x=>x.tempo).sort((a,b)=>a-b);
  if(!rec.length)return null; const n=Math.max(1,Math.ceil(rec.length*0.2));
  return rec.slice(0,n).reduce((t,x)=>t+x,0)/n;
}
function melhorPct(comPct,d,e,dias){
  const h0=new Date(hoje()+'T00:00:00');
  const rec=comPct.filter(x=>x.dist===d&&x.estilo===e&&(!dias||(h0-new Date(x.data+'T00:00:00'))/86400000<dias)).map(x=>x.pct).sort((a,b)=>b-a);

/* ── PREDIÇÃO das provas-alvo (faixa + qualidade dos dados) ─────────────────

     1) raceEst  → FORMA DE TREINO: o que seus tiros dizem que você faz HOJE,
        em condições de treino (saída na borda, dentro da sessão).
     2) baseProva → converte treino→prova (saída de bloco + taper). O ganho da
        saída é ABSOLUTO (~0,6 s por prova), por isso pesa ~2% num 50 e ~0,4%
        num 200 — modelar isso como % era o principal viés lento do modelo.
     3) calibProva → AUTOCALIBRAÇÃO: aprende, das suas competições passadas,
        o quanto você de fato rende na prova vs. o que os tiros previam.
   A FAIXA reflete a evidência (poucos tiros, métodos discordantes ou ausência
   de histórico de prova ALARGAM a faixa) e nunca exclui o seu PB sem sinal de
   destreino. O % ao lado é QUALIDADE DOS DADOS, não probabilidade. */
function raceEst(comPct,pbs,d,e,ate){
  const pbAny=dd=>pbs[`${dd} ${e} SC25`]||pbs[`${dd} ${e} LC50`]||null;

/* Treino → prova. Saída de bloco: ganho ABSOLUTO (costas parte da água, ganha

function ganhoSaida(e){ return /costas/i.test(e||'')?250:600; }   /* em ms (unidade interna): 0,25 s / 0,60 s */
const GANHO_TAPER=0.020;
function baseProva(estTreino,d,e){
  if(!(estTreino>0))return null;
  return Math.max(estTreino*0.70,estTreino-ganhoSaida(e))*(1-GANHO_TAPER);

/* AUTOCALIBRAÇÃO — o item que impede o erro de se repetir.

   histórico geral. */

  const res=(pro&&pro.resultados)||[], pbs=(pro&&pro.pbs)||{};

    {rs:colher(r=>r.dist===d&&r.estilo===e&&(r.piscina||'SC25')===pis),esc:'nesta prova e piscina'},
    {rs:colher(r=>r.dist===d&&r.estilo===e),esc:'nesta prova'},
    {rs:colher(()=>true),esc:'no seu histórico de provas'}

/* ── O QUE MUDOU EM 28 DIAS + POR QUÊ ───────────────────────────────────────
   Compara a janela atual (0–28d) com a anterior (28–56d) por variável e liga a

function janelaStat(pts,ini,fim,mode){
  const h0=new Date(hoje()+'T00:00:00'), dd=d=>(h0-new Date(d+'T00:00:00'))/86400000;
  const s=pts.filter(p=>{const x=dd(p.data);return x>=ini&&x<fim;}).map(p=>p.v);
  if(!s.length)return null;
  return mode==='sum'?s.reduce((t,x)=>t+x,0):s.reduce((t,x)=>t+x,0)/s.length;
}
function mudancas28d(pro,comPct){
  const gar=pro.garmin||[], bio=(pro.bioimp||[]).filter(b=>!bioSuspeita(b)), carga=[];
  for(const s of (SESSOES||[]))carga.push({data:s.data,v:s.load});
  for(const s of (pro.seco||[]))if(s.rpe!=null&&s.dur&&s.data)carga.push({data:s.data,v:s.rpe*s.dur});
  const spec=[
    ['Capacidade (%PB)',1,'%',0,'avg',(comPct||[]).map(e=>({data:e.data,v:e.pct}))],
    ['VFC',1,'ms',0,'avg',gar.filter(x=>x.hrv!=null).map(x=>({data:x.data,v:x.hrv}))],
    ['FC repouso',-1,'bpm',0,'avg',gar.filter(x=>x.fc!=null).map(x=>({data:x.data,v:x.fc}))],
    ['Sono',1,'h',1,'avg',gar.filter(x=>x.sono!=null).map(x=>({data:x.data,v:x.sono}))],
    ['Carga (UA)',0,'',0,'sum',carga],
    ['Peso',0,'kg',1,'avg',bio.filter(b=>b.peso!=null).map(b=>({data:b.data,v:b.peso}))],
    ['Massa magra',1,'kg',1,'avg',bio.filter(b=>b.peso!=null&&b.gordura!=null).map(b=>({data:b.data,v:+(b.peso*(1-b.gordura/100)).toFixed(1)}))]
  ];

    else f+=cg&&cg.dPct>10?' — pode refletir fadiga do aumento de carga.':vfc&&vfc.dPct<0?' — recuperação (VFC) mais baixa acompanhou a queda.':'.';

    const cor=fav==null?'var(--ink-2)':(fav?'var(--ok)':'var(--clock)');
    return`<tr><td>${x.nome}</td><td class="n">${x.anterior.toFixed(x.dec)}${x.un?' '+x.un:''}</td><td class="n" style="font-weight:700">${x.atual.toFixed(x.dec)}${x.un?' '+x.un:''}</td><td class="n" style="color:${cor}">${seta} ${x.dPct>=0?'+':''}${x.dPct.toFixed(0)}%</td></tr>`;}).join('');
  return`<div class="card"><div class="eyebrow">o que mudou — últimos 28 dias</div>
    <div class="small muted" style="margin:4px 0 6px">Janela atual (0–28 dias) comparada à anterior (28–56 dias).</div>
    <table><thead><tr><th>indicador</th><th class="n">antes</th><th class="n">agora</th><th class="n">Δ</th></tr></thead><tbody>${linhas}</tbody></table>
    ${m.porque.length?`<div class="note" style="margin-top:10px"><b>Por quê:</b> ${m.porque.join(' ')} <span class="muted">(leitura de apoio, não causa comprovada)</span></div>`:''}

/* ── SPRINT FINGERPRINT (radar) — só dimensões observáveis ───────────────────*/
/* Velocidade = seus MELHORES tiros nas provas-alvo (%PB), não a média. */
function velocFingerprint(pro,comPct){

  for(const a of alvos){const m=melhorPct(comPct,a.d,a.e,120); if(m!=null)vals.push(m);}
  if(!vals.length&&comPct.length){const s=comPct.map(x=>x.pct).sort((a,b)=>b-a),n=Math.max(1,Math.ceil(s.length*0.2));vals.push(s.slice(0,n).reduce((t,x)=>t+x,0)/n);}

}
/* Manutenção = constância dos tempos numa SÉRIE (coef. de variação).
   Agrupa por dia+distância+estilo e, dentro do grupo, considera só o "bloco de
   qualidade" (tempos até 8% acima do mais rápido) — assim aquecimento/soltura no
   mesmo dia não inflam a variação. CV% médio ponderado pelo tamanho da série. */
function manutencaoCV(comPct){
  const g={};
  for(const e of comPct){const k=e.data+'|'+e.dist+'|'+e.estilo;(g[k]=g[k]||[]).push(e.tempo);}
  let somaCV=0,somaW=0;
  for(const k in g){let a=g[k].slice().sort((x,y)=>x-y); const rap=a[0];
    a=a.filter(t=>t<=rap*1.08); if(a.length<3)continue;
    const m=a.reduce((t,x)=>t+x,0)/a.length, sd=Math.sqrt(a.reduce((t,x)=>t+(x-m)*(x-m),0)/a.length);

function fingerprintDims(velPct,manutCV,pront,composicao,tend){

  return[
    {eixo:'Velocidade', score: velPct!=null?Math.round(cl(velPct)):null, txt: velPct!=null?velPct.toFixed(0)+'% do PB':'s/ dado'},
    {eixo:'Manutenção', score: manutCV!=null?Math.round(cl(100-manutCV*12)):null, txt: manutCV!=null?'variação '+manutCV.toFixed(1)+'% ('+qCV+')':'s/ dado'},
    {eixo:'Recuperação', score: pront!=null?Math.round(cl(pront)):null, txt: pront!=null?'prontidão '+pront:'s/ dado'},
    {eixo:'Composição', score: composicao&&composicao.score!=null?composicao.score:null, txt: composicao?`~${composicao.gordura}% gordura${composicao.estimada?' (est.)':''}`:'s/ dado'},

function cardFingerprint(m){

function volumePorSemana(){
  const m={};
  for(const meta of S.tridx.filter(t=>(t.para||[]).includes(S.u.id))){
    const d=new Date(meta.data+'T00:00:00'); const on=new Date(d); on.setDate(d.getDate()-((d.getDay()+6)%7));
    const k=on.toISOString().slice(0,10);
    m[k]=(m[k]||0)+(meta.vol||0);
  }
  return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0])).slice(-8).map(([k,v])=>({rot:brCurta(k),m:v}));
}
function diagnostico(comPct,brk,sem,pro){
  const foco=[];
  const md=comPct.length?comPct.reduce((t,e)=>t+e.pct,0)/comPct.length:null;
  const deltaMd=brk.length?brk.slice(-10).reduce((t,e)=>t+e.delta,0)/Math.min(brk.length,10):null;
  const g=[...(pro.garmin||[])].sort((a,b)=>b.data.localeCompare(a.data));
  const h=g.filter(x=>x.hrv!=null);
  let hrvBaixa=false;
  if(h.length>=4){
    const rec=h.slice(0,3).reduce((t,x)=>t+x.hrv,0)/3;
    const base=h.slice(3,17).reduce((t,x)=>t+x.hrv,0)/Math.max(1,h.slice(3,17).length);
    hrvBaixa=((rec-base)/base)<-0.08;
  }
  const subindo=sem.length>=2&&sem[sem.length-1].m>sem[sem.length-2].m*1.25;
  const exUlt=[...(pro.exames||[])].sort((a,b)=>b.data.localeCompare(a.data))[0];
  const exFlags=exUlt?flagsExame(exUlt):[];
  const exameForte=exFlags.some(f=>f.forte);

  if(deltaMd!=null){
    if(deltaMd>2600)foco.push({t:'warn',txt:`O segundo 25 está custando em média <b>+${fmt(deltaMd,true)}</b> a mais que o primeiro. Esse é o seu maior ponto de perda: o limitador é manutenção de velocidade, não velocidade de largada.`});
    else foco.push({t:'ok',txt:`Diferencial médio de <b>+${fmt(deltaMd,true)}</b> entre os 25. A manutenção está sob controle — dá para apertar o primeiro trecho sem medo.`});
  }
  if(md!=null){
    if(md<90)foco.push({t:'',txt:`Os tiros estão saindo a <b>${md.toFixed(0)}%</b> da sua melhor marca. Volume de qualidade acumulado, mas pouco tempo em ritmo real de prova — vale trocar parte do limiar por séries curtas com descanso completo.`});
    else if(md>=95)foco.push({t:'ok',txt:`Média de <b>${md.toFixed(0)}%</b> do seu melhor tempo nos tiros. Você está treinando perto do ritmo de prova; o ganho agora vem de frescor, não de mais carga.`});
    else foco.push({t:'',txt:`Média de <b>${md.toFixed(0)}%</b> do melhor tempo. Faixa saudável de treino: mantenha e concentre a intensidade em menos repetições, com mais descanso.`});
  }
  if(hrvBaixa)foco.push({t:'warn',txt:'A VFC está abaixo da sua linha de base. Trabalho de tolerância ao lactato agora tende a render pouco e cobrar caro.'});
  if(subindo)foco.push({t:'warn',txt:'O volume subiu mais de 25% em relação à semana anterior. Segure a progressão por uma semana antes de somar carga.'});
  exFlags.forEach(f=>foco.push({t:f.t,txt:f.txt}));
  const bioUlt=[...(pro.bioimp||[])].sort((a,b)=>b.data.localeCompare(a.data))[0];
  if(bioUlt)flagsBio(bioUlt).forEach(f=>foco.push({t:f.t,txt:f.txt}));
  const evP=evolucaoProvas(pro);
  const evoluiu=evP.filter(e=>e.melhora),regrediu=evP.filter(e=>!e.melhora);
  if(evoluiu.length)foco.push({t:'ok',txt:`Em competição, evolução em <b>${[...new Set(evoluiu.map(e=>e.prova))].join(', ')}</b>. Mantenha o que está funcionando nessas provas.`});
  if(regrediu.length)foco.push({t:'warn',txt:`Queda de rendimento em <b>${[...new Set(regrediu.map(e=>e.prova))].join(', ')}</b> ao longo das competições. Vale revisar a preparação específica dessas provas.`});
  if(!foco.length)foco.push({t:'',txt:'Ainda não há tiros suficientes registrados para um diagnóstico firme. Lance os tempos de mais algumas sessões.'});

  let sessao,descanso,descansoTipo;
  if(hrvBaixa||exameForte){
    sessao=`Aquecimento\n400 livre solto\n4x50 pernada 1'10\n\nPrincipal (leve)\n8x50 técnica 1'15\n4x25 progressivo pausa 40"\n\nSoltura\n300 livre`;
    descanso='Priorize 48 horas de carga reduzida e sono acima de sete horas antes da próxima sessão forte.';
    descansoTipo='warn';
  }else if(deltaMd!=null&&deltaMd>2600){
    sessao=`Aquecimento\n400 livre\n6x50 pernada peito 1'05\n\nPrincipal — manutenção de velocidade\n6x50 peito ritmo de prova saída 3'00 (parciais 25/25)\n8x25 peito máximo pausa 45"\n4x50 peito broken 10" no 25\n\nSoltura\n300 livre`;
    descanso='Descanso completo entre os 50: o objetivo é repetir o segundo 25, não acumular fadiga.';
    descansoTipo='';
  }else{
    sessao=`Aquecimento\n300 livre\n4x50 pernada peito 1'10\n\nPrincipal — velocidade\n10x25 peito máximo pausa 50"\n4x50 peito ritmo de prova saída 2'30\n2x50 peito com saída de bloco\n\nSoltura\n200 costas`;
    descanso='Um dia leve entre sessões de velocidade. Mantenha o volume total estável nesta semana.';
    descansoTipo='ok';
  }
  return{foco,sessao,descanso,descansoTipo};
}
function graficoBarras(arr,crescerBom){
  if(!arr.length)return'';
  const W=600,H=155,P=28,mx=Math.max(...arr.map(a=>a.v)),mn=Math.min(...arr.map(a=>a.v)),rg=(mx-mn)||1;
  const bw=(W-2*P)/arr.length;
  const bom=crescerBom?mx:mn;
  return`<svg class="chart" viewBox="0 0 ${W} ${H}">
    ${arr.map((a,i)=>{const h=20+((a.v-mn)/rg)*(H-2*P-20);
      return`<rect x="${(P+i*bw+bw*.16).toFixed(1)}" y="${(H-P-h).toFixed(1)}" width="${(bw*.68).toFixed(1)}" height="${h.toFixed(1)}"
        fill="${a.v===bom?'#1B7F5A':'#0E6E8C'}" rx="3"/>
      <text x="${(P+i*bw+bw*.5).toFixed(1)}" y="${H-P+14}" font-size="10" fill="#5A6670" text-anchor="middle" font-family="Barlow,sans-serif">${a.rot}</text>
      <text x="${(P+i*bw+bw*.5).toFixed(1)}" y="${(H-P-h-5).toFixed(1)}" font-size="11" fill="#12181C" text-anchor="middle" font-family="JetBrains Mono,monospace">${crescerBom?(a.v/1000).toFixed(1)+'k':fmt(a.v,true)}</text>`}).join('')}
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#D8D3C9"/></svg>`;
}
/* PDF/impressão que funciona no CELULAR: monta uma página isolada só com o
   relatório (sem nav) e imprime nela. Tenta uma nova aba (melhor no iOS/Android);
   se o popup for bloqueado, cai para um iframe oculto. Assim "Salvar como PDF"
   do próprio navegador funciona no telefone. */
function imprimirRelatorio(){
  try{ window.scrollTo(0,0); }catch(e){}
  const app=document.getElementById('app'); if(!app)return toast('Abra o Relatório primeiro.');
  const clone=app.cloneNode(true); clone.querySelectorAll('.noprint').forEach(n=>n.remove());
  const estilos=[...document.querySelectorAll('style')].map(s=>s.outerHTML).join('');
  const nome=nomeLaudo();
  const corpo=clone.innerHTML;
  const cabeca=`<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(nome)} — relatório</title>${estilos}<style>body{padding:14px;background:#fff}@media print{body{padding:0}}</style>`;
  const script='<scr'+'ipt>window.onload=function(){setTimeout(function(){try{window.focus();window.print();}catch(e){}},500);};window.onafterprint=function(){setTimeout(function(){try{window.close();}catch(e){}},300);};</scr'+'ipt>';
  const doc='<!doctype html><html lang="pt-BR"><head>'+cabeca+'</head><body>'+corpo+script+'</body></html>';
  let w=null; try{ w=window.open('','_blank'); }catch(e){}
  if(w&&w.document){ w.document.open(); w.document.write(doc); w.document.close(); return; }
  /* fallback: iframe oculto (popup bloqueado — comum em PWA no celular) */
  const ifr=document.createElement('iframe');
  ifr.setAttribute('aria-hidden','true');
  ifr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0';
  document.body.appendChild(ifr);
  const d=ifr.contentWindow.document;
  d.open(); d.write('<!doctype html><html><head>'+cabeca+'</head><body>'+corpo+'</body></html>'); d.close();
  const go=()=>{ try{ ifr.contentWindow.focus(); ifr.contentWindow.print(); }
    catch(e){ toast('Não consegui abrir o PDF. Use o menu do navegador → Imprimir/Compartilhar.'); }
    setTimeout(()=>{ try{ifr.remove();}catch(e){} }, 2000); };
  setTimeout(go, 600);
}
async function compartilharRelatorio(){
  const pro=S.pro||{};
  const e=ESF||await coletarEsforcos({dias:120});
  const tec=e.filter(x=>['pernada','técnica','braçada','filipina'].some(t=>x.tags.includes(t)));
  const int=e.filter(x=>!tec.includes(x));
  const comPct=int.map(x=>{const pb=pbDe(pro,x.dist,x.estilo);return{...x,pct:pb?pb/x.tempo*100:null}}).filter(x=>x.pct);
  const brk=int.filter(x=>x.p1!=null&&x.dist===50).map(x=>({...x,delta:x.tempo-2*x.p1}));
  const diag=diagnostico(comPct,brk,volumePorSemana(),pro);
  const semTags=s=>String(s).replace(/<[^>]+>/g,'');
  let t=`*Relatório de performance — ${S.u.nome}*\n${brData(hoje())}\n`;
  t+=`\n*Onde concentrar*\n`+diag.foco.slice(0,5).map(f=>'• '+semTags(f.txt)).join('\n')+'\n';
  const ev=evolucaoProvas(pro);
  if(ev.length)t+=`\n*Evolução em competições*\n`+ev.map(x=>`• ${x.prova} ${x.piscina}: ${x.melhora?'melhorou':'piorou'} ${fmt(Math.abs(x.delta),true)}`).join('\n')+'\n';
  const exUlt=[...(pro.exames||[])].sort((a,b)=>b.data.localeCompare(a.data))[0];
  if(exUlt){const fl=flagsExame(exUlt); if(fl.length)t+=`\n*Saúde — exame de ${brData(exUlt.data)}*\n`+fl.map(f=>'• '+semTags(f.txt)).join('\n')+'\n';}
  const bioUlt=[...(pro.bioimp||[])].sort((a,b)=>b.data.localeCompare(a.data))[0];
  if(bioUlt){const susp=bioSuspeita(bioUlt),tm=tmbDe(bioUlt),imc=imcDe(bioUlt),ps=[];
    if(bioUlt.peso!=null)ps.push(`peso ${bioUlt.peso}kg`);
    if(bioUlt.gordura!=null&&!susp)ps.push(`gordura ${bioUlt.gordura}%`);
    if(imc!=null)ps.push(`IMC ${imc}`); if(tm)ps.push(`TMB ~${tm}kcal`);
    t+=`\n*Composição — ${brData(bioUlt.data)}*\n${susp?`(bioimpedância com valor suspeito: ${susp} — verificar)\n`:''}${ps.join(' · ')||'—'}\n`;}
  const pbs=Object.entries(pro.pbs||{}).slice(0,8);
  if(pbs.length)t+=`\n*Melhores marcas*\n${pbs.map(([k,v])=>`  ${k}: ${fmt(v,true)}`).join('\n')}\n`;
  t+=`\n_Análise automática de apoio — não substitui avaliação médica._\nPARCIAL ${VER}`;
  enviar(t,S.tecnico?[{nome:S.tecnico.nome+' (técnico)',tel:S.tecnico.telefone}]:[]);
}
