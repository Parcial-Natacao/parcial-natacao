function prontidao(){
  const g=[...(S.pro?.garmin||[])].sort((a,b)=>b.data.localeCompare(a.data));
  /* uma fonte só de VFC: comparar média semanal com medida da noite produz
     "variação" que não existe */
  const sh=serieHRV(S.pro&&S.pro.garmin), h=sh?sh.serie:[], f=g.filter(x=>x.fc!=null);
  if(h.length<4&&f.length<4)return'<div class="small muted">Poucos dias para uma leitura confiável.</div>';
  const m=[];let alerta=false;
  if(h.length>=4){
    const rec=h.slice(0,3).reduce((t,x)=>t+x.hrv,0)/3;
    const base=h.slice(3,17).reduce((t,x)=>t+x.hrv,0)/Math.max(1,h.slice(3,17).length);
    const d=((rec-base)/base)*100;
    const qual=sh.fonte==='semana'?' <span class="xs muted">(média semanal do relógio — menos sensível que a medida da noite)</span>':'';
    /* A FAIXA diz o que a porcentagem sozinha nao diz: 9% abaixo e ruido em
       quem oscila muito e sinal claro em quem e estavel. Com faixa, a leitura
       sai em ms e com o intervalo do proprio atleta; sem ela (historico curto),
       cai na comparacao antiga por porcentagem. */
    const fx=faixaHRV(S.pro&&S.pro.garmin);
    if(fx&&fx.posicao){
      const marcas=ctxDoDia(S.pro&&S.pro.garmin,fx.data);
      const expl=marcas.length?` Você marcou <b>${marcas.map(ctxRotulo).join(', ')}</b> nesse dia.`:'';
      if(fx.posicao==='abaixo'){
        m.push(`VFC em ${fx.hoje} ms, <b>abaixo</b> da sua faixa habitual (${fx.de} a ${fx.ate} ms, ${fx.n} dias).${expl}${qual}`);
        /* com explicacao marcada o dia nao vira alarme: o alerta existe para
           o que nao tem causa conhecida */
        alerta=!marcas.length;
      }
      else if(fx.posicao==='acima')m.push(`VFC em ${fx.hoje} ms, acima da sua faixa habitual (${fx.de} a ${fx.ate} ms) — boa janela para intensidade.${qual}`);
      else m.push(`VFC em ${fx.hoje} ms, dentro da sua faixa habitual (${fx.de} a ${fx.ate} ms).${qual}`);
    }
    else if(d<-8){m.push(`VFC ${Math.abs(d).toFixed(0)}% abaixo da linha de base.${qual}`);alerta=true}
    else if(d>8)m.push(`VFC ${d.toFixed(0)}% acima da linha de base — boa janela para intensidade.${qual}`);
    else m.push(`VFC estável em relação à linha de base.${qual}`);
    if(sh.misturado)m.push('<span class="xs muted">Há dias com procedência diferente de VFC; a leitura usa só uma.</span>');
  }
  if(f.length>=4){
    const rec=f.slice(0,3).reduce((t,x)=>t+x.fc,0)/3;
    const base=f.slice(3,17).reduce((t,x)=>t+x.fc,0)/Math.max(1,f.slice(3,17).length);
    if(rec>base+3){m.push(`FC de repouso ${(rec-base).toFixed(0)} bpm acima do habitual.`);alerta=true}
  }
  const sono=g.filter(x=>x.sono!=null).slice(0,7);
  if(sono.length>=3){
    const md=sono.reduce((t,x)=>t+x.sono,0)/sono.length;
    const ref=refSono(S.pro);
    /* ── A REFERÊNCIA É DO ATLETA, NÃO DO MANUAL ───────────────────────────
       Aqui havia um 6,5 h fixo para todo mundo. Mas "dormir pouco" é relativo
       a quem dorme: um atleta cuja referência é 7h39 está mal com 7h, e o app
       diria que está tudo bem. Quando existe base própria — definida por ele
       ou a mediana dos próprios dias — é ela que manda; o 6,5 h só continua
       valendo enquanto não há história suficiente para ter base. */
    if(ref){
      const d=md-ref.h;
      if(d<=-0.5){ m.push(`Sono de ${md.toFixed(1)}h nos últimos dias, ${Math.abs(d).toFixed(1)}h abaixo da sua referência de ${ref.h}h.`); alerta=true; }
      else if(d>=0.5)m.push(`Sono de ${md.toFixed(1)}h, acima da sua referência de ${ref.h}h.`);
    } else if(md<6.5){ m.push(`Média de sono de ${md.toFixed(1)}h nos últimos dias.`); alerta=true; }
  }
  return`<div class="note ${alerta?'warn':'ok'}">${m.join(' ')}</div>`;
}
/* Referência pessoal de sono: o que o atleta declara, ou a mediana dos
   próprios dias quando há história suficiente. Devolve null enquanto não dá
   para falar em base — e nesse caso ninguém finge que dá. */
function refSono(pro){
  const dec=pro&&pro.refSono;
  if(dec&&isFinite(dec))return {h:+(+dec).toFixed(1),fonte:'definida por você'};
  const g=[...((pro&&pro.garmin)||[])].filter(x=>x&&x.sono!=null)
    .sort((a,b)=>b.data.localeCompare(a.data));
  const base=g.slice(7,45).map(x=>x.sono).sort((a,b)=>a-b);
  if(base.length<10)return null;
  return {h:+base[Math.floor(base.length/2)].toFixed(1),fonte:`mediana dos seus ${base.length} dias`};
}
function abrirRefSono(){
  const r=refSono(S.pro);
  sheet(`<h2>Sua referência de sono</h2>
    <p class="xs muted" style="margin:4px 0 10px">Quantas horas são o <b>seu</b> normal. O app passa a comparar com isto em vez de usar um número igual para todo mundo.</p>
    <div class="field"><label>Horas <span class="xs muted">ex.: 7,65 para 7h39</span></label>
      <input id="rsH" inputmode="decimal" value="${S.pro&&S.pro.refSono?String(S.pro.refSono).replace('.',','):''}" placeholder="${r?String(r.h).replace('.',','):'7,5'}"></div>
    ${r?`<div class="xs muted" style="margin:-4px 0 10px">Hoje em uso: <b>${r.h}h</b> (${esc(r.fonte)}).</div>`:'<div class="xs muted" style="margin:-4px 0 10px">Ainda sem base própria: com menos de 10 dias de sono registrado o app usa 6,5h como referência provisória.</div>'}
    <button class="primary full" onclick="salvarRefSono(val('rsH'))">Salvar</button>
    ${S.pro&&S.pro.refSono?`<button class="ghost full" style="margin-top:8px" onclick="salvarRefSono('')">Voltar a calcular pelos meus dias</button>`:''}`);
}
async function salvarRefSono(txt){
  const s=String(txt||'').trim();
  S.pro=S.pro||proVazio();
  if(!s)delete S.pro.refSono;
  else{
    const v=parseFloat(s.replace(',','.'));
    if(!isFinite(v)||v<3||v>14)return toast('Informe entre 3 e 14 horas');
    S.pro.refSono=+v.toFixed(2);
  }
  if(await salvarSaude()===false)return;
  fecharSheet(); toast('Referência de sono atualizada'); render();
}
/* ── CHECK-IN DIÁRIO SUBJETIVO (prontidão sem relógio) ───────────────────────
   5 perguntas 1-5 (sono, energia, dor, estresse, humor). Vira um score 0-100.
   Salvo no mesmo registro diário (S.pro.garmin[data]); entra no relatório. */
function checkinScore(x){
  if(!x)return null;
  const need=['sonoQ','energia','dor','estresse','humor'];
  if(need.some(k=>x[k]==null))return null;
  const s=x.sonoQ+x.energia+x.humor+(6-x.dor)+(6-x.estresse); /* 5..25 (dor/estresse invertidos) */
  return Math.round((s-5)/20*100);
}
/* Prontidão 0–100 a partir do Garmin (VFC, FC de repouso, sono e salto de
   volume). Extraída de estadoPerformance para que o SNAPSHOT DO TÉCNICO possa
   usar a mesma fórmula — antes o técnico só via prontidão de quem preenchia o
   check-in, e quem usa Garmin aparecia como "sem dados". Devolve só o placar e
   os motivos; os dados brutos de Saúde continuam privados do atleta. */
function prontidaoGarmin(pro,sem){
  const md=(a,k)=>a.reduce((t,x)=>t+x[k],0)/Math.max(1,a.length);
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  const g=[...((pro&&pro.garmin)||[])].sort((a,b)=>b.data.localeCompare(a.data));
  const h=g.filter(x=>x.hrv!=null), f=g.filter(x=>x.fc!=null);
  if(h.length<4&&f.length<4)return null;
  let s=72; const mot=[];
  if(h.length>=4){const d=(md(h.slice(0,3),'hrv')-md(h.slice(3,17),'hrv'))/md(h.slice(3,17),'hrv')*100;const c=cl(d*1.2,-22,16);s+=c;mot.push({c,txt:`VFC ${d>=0?'+':''}${d.toFixed(0)}% vs base`});}
  if(f.length>=4){const d=md(f.slice(0,3),'fc')-md(f.slice(3,17),'fc');const c=cl(-d*2,-14,8);s+=c;mot.push({c,txt:`FC repouso ${d>=0?'+':''}${d.toFixed(0)} bpm`});}
  const sn=g.filter(x=>x.sono!=null).slice(0,7);
  if(sn.length>=3){const m=md(sn,'sono');const c=m<6.5?-8:(m>=7.5?4:0);if(c){s+=c;mot.push({c,txt:`sono ${m.toFixed(1)}h`});}}
  if(sem&&sem.length>=2&&sem[sem.length-1].m>sem[sem.length-2].m*1.25){s-=8;mot.push({c:-8,txt:'volume +25%'});}
  return {score:Math.round(cl(s,0,100)),mot,dias:Math.max(h.length,f.length)};
}
/* ── Objetiva × percebida ──────────────────────────────────────────────────
   São medidas de coisas diferentes: o relógio mede o corpo (VFC, FC, sono); o
   check-in mede como VOCÊ se sente. Fazer média das duas apagaria justamente a
   informação mais útil — a DISCORDÂNCIA. Corpo bem e percepção ruim (ou o
   inverso) é sinal que merece atenção, não um número intermediário. */
function concordanciaProntidao(pro){
  const g=prontidaoGarmin(pro,null);
  const s=(typeof prontidaoSubj==='function')?prontidaoSubj(7):null;
  const obj=g&&g.score!=null?g.score:null;
  const per=s&&s.media!=null?s.media:null;
  if(obj==null&&per==null)return null;
  if(obj==null||per==null)return{obj,per,delta:null,nivel:null,txt:null};
  const delta=per-obj, a=Math.abs(delta);
  const nivel=a<=10?'alta':a<=20?'média':'baixa';
  const txt=a<=10
    ? 'Corpo e percepção contando a mesma história — é o cenário em que os números são mais confiáveis.'
    : (delta<0
      ? 'Você está <b>se sentindo pior do que o corpo indica</b>. Costuma aparecer com estresse fora da piscina, sono ruim ou monotonia de treino. Vale olhar antes de subir carga.'
      : 'Você está <b>se sentindo melhor do que os sinais do corpo</b>. Motivação alta é ótima, mas é assim que se passa do ponto sem perceber.');
  return{obj,per,delta,nivel,txt,dias:g?g.dias:null,n:s?s.n:null};
}
function cardConcordancia(pro){
  const c=concordanciaProntidao(pro); if(!c)return'';
  const cor=v=>v==null?'':v>=75?'color:var(--ok)':v<55?'color:var(--clock)':'';
  return`<div class="card"><div class="eyebrow">prontidão: corpo × percepção</div>
    <div class="grid3" style="margin-top:8px">
      <div class="kpi"><div class="v" style="${cor(c.obj)}">${c.obj??'—'}</div><div class="l">objetiva ${c.obj!=null?'<span class="xs muted">relógio</span>':''}</div></div>
      <div class="kpi"><div class="v" style="${cor(c.per)}">${c.per??'—'}</div><div class="l">percebida ${c.per!=null?'<span class="xs muted">check-in</span>':''}</div></div>
      <div class="kpi"><div class="v">${c.delta!=null?((c.delta>0?'+':'')+c.delta):'—'}</div><div class="l">diferença</div></div>
    </div>
    ${c.txt?`<div class="note ${c.nivel==='baixa'?'warn':''}" style="margin-top:10px"><b>Concordância ${c.nivel}:</b> ${c.txt}</div>`
      :`<div class="xs muted" style="margin-top:8px">Só uma das duas fontes tem dado. ${c.obj==null?'Sem o relógio, a leitura vem do check-in.':'Faça o <b>check-in diário</b> para o app comparar o que o corpo mostra com o que você sente.'}</div>`}
  </div>`;
}
function prontidaoSubj(dias){
  dias=dias||7; const h0=new Date(hoje()+'T00:00:00');
  const arr=(S.pro?.garmin||[]).filter(x=>{const d=(h0-new Date(x.data+'T00:00:00'))/86400000;return d>=0&&d<dias&&checkinScore(x)!=null;});
  if(!arr.length)return null;
  const sc=arr.map(checkinScore), media=Math.round(sc.reduce((t,s)=>t+s,0)/sc.length);
  const hj=(S.pro?.garmin||[]).find(x=>x.data===hoje());
  return {media,n:arr.length,hoje:hj?checkinScore(hj):null};
}
function veredictoProntidao(score){
  if(score==null)return {nivel:'sem check-in',cor:'var(--ink-2)',txt:'Faça o check-in diário na aba Saúde para acompanhar a prontidão sem relógio.'};
  if(score>=75)return {nivel:'pronto',cor:'var(--ok)',txt:'Bem recuperado — dá para treinar forte e progredir a carga.'};
  if(score>=50)return {nivel:'moderado',cor:'var(--rope)',txt:'Prontidão média — mantenha a carga, evite picos e cuide do sono.'};
  return {nivel:'baixa prontidão',cor:'var(--clock)',txt:'Indicadores abaixo da sua faixa habitual. Leitura de estado, não diagnóstico — vale considerar recuperação antes de progredir carga.'};
}
/* ── MEDIDOR DE PRONTIDÃO ────────────────────────────────────────────────
   Um ponteiro só, e logo abaixo o que o sustenta.

   REGRA QUE IMPORTA: SEM BASE NÃO HÁ PONTEIRO. Um medidor que sempre aponta
   para algum lugar ensina a confiar no desenho em vez do dado — e aqui há
   dias sem relógio sincronizado e sem check-in respondido. Nesses dias o arco
   aparece apagado, sem agulha, dizendo o que falta.

   POR QUE NÃO FAZ MÉDIA entre relógio e check-in: a discordância entre os
   dois é a informação mais útil (ver concordanciaProntidao). O ponteiro
   mostra o corpo quando há medida do corpo, mostra o check-in quando é só o
   que existe, e DIZ qual dos dois está mostrando. Quando os dois existem e
   discordam muito, isso vira aviso — nunca um número intermediário, que
   apagaria justamente o que os dois tinham de diferente. */
const PRONT_FAIXAS=[[0,40,'muito baixa','var(--clock)'],[40,55,'baixa','var(--rope)'],
                    [55,75,'normal','var(--water)'],[75,100,'alto','var(--ok)']];
function faixaProntidao(s){
  for(const f of PRONT_FAIXAS)if(s<f[1]||f[1]===100)return{nome:f[2],cor:f[3]};
  return{nome:'normal',cor:'var(--water)'};
}
/* O relógio para de falar do HOJE depois de alguns dias sem sincronizar: o
   cálculo compara os 3 registros mais recentes com os 14 anteriores, e se os
   "recentes" forem de duas semanas atrás o número continua saindo — só que
   sobre outro dia. Três dias é o limite. */
const PRONT_ATRASO_MAX=3;
function prontidaoAgora(pro){
  pro=pro||S.pro;
  const g=[...((pro&&pro.garmin)||[])].filter(x=>x&&x.data).sort((a,b)=>b.data.localeCompare(a.data));
  const h0=new Date(hoje()+'T00:00:00');
  const og=prontidaoGarmin(pro,null);
  const ult=(g.find(x=>x.hrv!=null||x.fc!=null)||{}).data||null;
  const atraso=ult?Math.round((h0-new Date(ult+'T00:00:00'))/86400000):null;
  const velho=!!og&&(atraso==null||atraso>PRONT_ATRASO_MAX);
  const obj=(og&&!velho)?og.score:null;
  const sub=(typeof prontidaoSubj==='function')?prontidaoSubj(7):null;
  const per=sub&&sub.hoje!=null?sub.hoje:null;
  const base={obj,per,marcas:ctxDoDia(pro&&pro.garmin,hoje()),
              dias:og?og.dias:null,atraso,
              velho:velho?{score:og.score,atraso}:null,
              media7:sub?sub.media:null,n7:sub?sub.n:null};
  if(obj==null&&per==null){
    const falta=[];
    if(!og)falta.push('o relógio ainda não tem 4 dias de VFC ou de FC de repouso');
    else if(velho)falta.push(atraso==null?'a medida do relógio não tem data'
      :`a última medida do relógio é de ${atraso} dia${atraso===1?'':'s'} atrás`);
    falta.push('o check-in de hoje não foi respondido');
    return Object.assign(base,{score:null,fonte:null,delta:null,falta});
  }
  return Object.assign(base,{
    score:obj!=null?obj:per,
    fonte:(obj!=null&&per!=null)?'ambos':(obj!=null?'relogio':'checkin'),
    delta:(obj!=null&&per!=null)?per-obj:null});
}
/* ── FATIAS IGUAIS NO ARCO (v179) ──────────────────────────────────
   As faixas têm larguras diferentes em PONTOS (muito baixa tem 40, baixa tem
   15), e mapear ponto direto em ângulo deixava "baixa" com um quarto do arco
   de "muito baixa". Duas consequências ruins: o desenho ficava torto, e a
   faixa estreita — que é onde a diferença entre 41 e 54 mais importa — era
   justamente a que tinha menos espaço para mostrar onde o atleta caiu.

   Agora cada faixa ocupa um quarto do semicírculo e o placar se posiciona
   DENTRO da sua faixa. A escala do arco deixa de ser linear em pontos: 45°
   valem 40 pontos na primeira faixa e 15 na segunda. O número no meio
   continua sendo o número; o arco diz em que faixa ele cai e onde dentro
   dela. */
function angProntidao(v){
  const F=PRONT_FAIXAS, fatia=180/F.length;
  v=Math.max(0,Math.min(100,v));
  for(let i=0;i<F.length;i++){
    const ini=F[i][0], fim=(i===F.length-1)?100:F[i][1];
    if(v<fim||i===F.length-1){
      const dentro=fim>ini?Math.max(0,Math.min(1,(v-ini)/(fim-ini))):0;
      return 180+(i+dentro)*fatia;
    }
  }
  return 360;
}
/* os limites de cada faixa no arco: fatias iguais, independentes dos pontos */
const angFaixa=i=>[180+i*(180/PRONT_FAIXAS.length),180+(i+1)*(180/PRONT_FAIXAS.length)];
/* Cada medidor precisa de ids próprios: dois cartões na mesma página fariam
   os textPath do segundo apontarem para os caminhos do primeiro. */
let _mpSeq=0;
/* O desenho. Semicírculo de 180° (esquerda) a 360° (direita); o placar 0–100
   vira ângulo direto. O NOME de cada faixa vai escrito na PRÓPRIA faixa, em
   textPath, como no HRV4Training: assim a leitura não depende de decorar que
   vermelho é ruim nem de uma legenda solta embaixo. A faixa do atleta fica
   acesa, as outras apagadas, e um entalhe marca o ponto exato dentro dela —
   o ponteiro grosso que havia antes passava por cima justamente do número. */
function svgMedidorProntidao(score){
  const CX=100,CY=96,R=74,W=18,GAP=1.4,ID='mp'+(++_mpSeq);
  const pt=(a,r)=>[(CX+r*Math.cos(a*Math.PI/180)).toFixed(2),(CY+r*Math.sin(a*Math.PI/180)).toFixed(2)];
  const arco=(a1,a2,r)=>{const p=pt(a1,r),q=pt(a2,r);return `M${p[0]} ${p[1]} A${r} ${r} 0 0 1 ${q[0]} ${q[1]}`;};
  const vivo=score!=null, fx=vivo?faixaProntidao(score):null;
  let faixas='',rotulos='',marca='';
  PRONT_FAIXAS.forEach((f,i)=>{
    const lim=angFaixa(i), a1=lim[0]+GAP, a2=lim[1]-GAP, aceso=vivo&&f[2]===fx.nome;
    /* Todas as faixas ficam COLORIDAS — apagar as outras tirava o contraste do
       nome escrito em cima delas, que é justamente o que faz o desenho ser lido
       sem legenda. Quem diz onde o atleta está é a faixa mais grossa, o entalhe
       e o número no meio. Sem base, todas apagam por igual. */
    faixas+=`<path d="${arco(a1,a2,R)}" fill="none" stroke="${f[3]}" stroke-width="${aceso?W+4:W}" opacity="${vivo?1:.22}"/>`;
    /* o caminho do rótulo fica um pouco para dentro do centro do traço: o
       textPath assenta a BASE das letras na linha, e elas crescem para fora */
    rotulos+=`<path id="${ID}-${i}" d="${arco(a1,a2,R-3.2)}" fill="none"/>`
      +`<text font-size="${f[2].length>8?6.3:7.2}" font-weight="800" letter-spacing="${f[2].length>8?.05:.35}" fill="#fff"`
      +` stroke="rgba(0,0,0,.42)" stroke-width=".75" paint-order="stroke"`
      +` opacity="${vivo?(aceso?1:.9):.55}">`
      +`<textPath href="#${ID}-${i}" startOffset="50%" text-anchor="middle">${f[2].toUpperCase()}</textPath></text>`;
    if(aceso){
      /* A marca fica FORA do arco, apontando para dentro. Atravessando o traço
         ela cortava o nome escrito na faixa bem no meio ("BAI|XA"), e perto das
         pontas sumia. O vão entre faixas também engolia a marca quando o placar
         caía exatamente no limite (75), daí o recuo de 1,5°. */
      const a=Math.max(a1+1.5,Math.min(a2-1.5,angProntidao(score)));
      const ponta=pt(a,R+(W+4)/2+1), e=pt(a-2.6,R+(W+4)/2+5.4), d=pt(a+2.6,R+(W+4)/2+5.4);
      marca=`<polygon class="mp-marca" points="${ponta[0]},${ponta[1]} ${e[0]},${e[1]} ${d[0]},${d[1]}" fill="var(--ink)"/>`;
    }
  });
  const cor=vivo?fx.cor:'var(--ink-3)';
  const centro=`<text x="${CX}" y="53" text-anchor="middle" font-size="8" font-weight="800" letter-spacing="2.2" fill="var(--ink-3)">HOJE</text>`
    +`<text x="${CX}" y="82" text-anchor="middle" font-size="31" font-weight="800" fill="${cor}">${vivo?score:'—'}</text>`
    +`<text x="${CX}" y="93.5" text-anchor="middle" font-size="8.4" font-weight="800" letter-spacing="1.1" fill="${cor}">${(vivo?fx.nome:'sem base').toUpperCase()}</text>`;
  return `<svg viewBox="0 0 200 104" width="222" height="115" role="img" aria-label="${vivo?'prontidão de hoje '+score+' de 100, faixa '+fx.nome:'sem base para medir a prontidão hoje'}">${faixas}${rotulos}${marca}${centro}</svg>`;
}
/* As linhas de procedência saíram de baixo do medidor e foram para um toque:
   "80 em 486 dias de base" embaixo do ponteiro era ruído diário — e estava
   errado, porque 486 é quanto histórico existe, não o que a conta usa (3
   registros recentes contra 14 anteriores). Elas não podem simplesmente
   sumir: procedência viaja com o dado (SDD §1.3). Ficam a um toque. */
function linhasProcedenciaProntidao(p){
  const L=[];
  if(p.score!=null){
    if(p.fonte==='ambos'){
      L.push(`<b>Relógio: ${p.obj}.</b> VFC, FC de repouso e sono.`);
      L.push(`<b>Check-in de hoje: ${p.per}.</b> Como você disse que está.`);
      L.push('O ponteiro mostra o <b>relógio</b>. O app não tira média dos dois: a diferença entre eles é informação, e a média apagaria as duas.');
    } else if(p.fonte==='relogio'){
      L.push(`<b>Relógio: ${p.obj}.</b> VFC, FC de repouso e sono.`);
      L.push('Sem o check-in de hoje não dá para comparar o que o corpo mostra com o que você sente.');
    } else {
      L.push(`<b>Check-in de hoje: ${p.per}.</b>`);
      L.push(p.velho?`O relógio não entra: a última medida é de ${p.velho.atraso} dias atrás.`
                    :'O relógio ainda não entra: faltam 4 dias de VFC ou de FC de repouso.');
    }
  } else {
    L.push(`<b>Sem base para apontar hoje.</b> ${p.falta.join(' e ')}.`);
    if(p.velho)L.push(`O último placar do relógio foi ${p.velho.score}, mas é de ${p.velho.atraso} dias atrás — não serve para falar de hoje.`);
  }
  if(p.dias)L.push(`${p.dias} dia${p.dias===1?'':'s'} de VFC ou FC no histórico. A conta compara os <b>3 registros mais recentes</b> com os <b>14 anteriores</b> — não o histórico inteiro.`);
  L.push(p.marcas.length
    ? `Marcadores de hoje: <b>${p.marcas.map(ctxRotulo).join(', ')}</b> — explicam o número, não mudam o cálculo.`
    : 'Nenhum marcador de contexto hoje.');
  return L;
}

  const L=linhasProcedenciaProntidao(prontidaoAgora(S.pro));

/* ═══════════════════════════════════════════════════════════════════════════
   MEDIÇÕES DO DIA — hidratação, glicemia e lactato

   Vieram de uma lista de um atleta de ponta: do que ele acompanha no dia a
   dia, o app já tinha sono, FC, VFC, prontidão e carga — faltavam estes três.

   Moram no MESMO registro diário do check-in e do relógio (pro.garmin[data]),
   que desde a v160 fica no documento de Saúde separado. Um registro por dia,
   com as coletas dentro: glicemia e lactato não são medidos uma vez — a
   glicemia é antes E durante o treino, e o lactato sai em série depois do
   esforço, que é justamente onde está a informação.

   O que o app calcula a partir disso:
     • lactato PICO do dia e, com duas ou mais coletas, a REMOÇÃO
       (mmol/L por minuto) — é ela que diz como o organismo está limpando o
       esforço, e para um velocista vale mais que o valor isolado;
     • glicemia: a variação de antes para durante o treino.
   O resto é série temporal, como os exames já fazem.

   Nada aqui é diagnóstico. O app registra, calcula e mostra; interpretação
   clínica é do médico, e a tela diz isso. ═══════════════════════════════ */
const MOMENTOS_GLI=[['antes','antes do treino'],['durante','durante'],['depois','depois']];
function regDia(d){
  S.pro=S.pro||proVazio();
  S.pro.garmin=S.pro.garmin||[];
  let r=S.pro.garmin.find(x=>x.data===d);
  if(!r){ r={data:d}; S.pro.garmin.push(r); }
  return r;
}
/* pico e remoção: a remoção só existe com duas coletas em horários diferentes,
   e é calculada do PICO para a última — é a janela que interessa. */
function lactatoResumo(rec){
  const l=[...((rec&&rec.lac)||[])].filter(x=>x&&x.v!=null&&x.h).sort((a,b)=>a.h.localeCompare(b.h));
  if(!l.length)return null;
  const pico=l.reduce((a,b)=>b.v>a.v?b:a);
  const ult=l[l.length-1];
  const min=(h1,h2)=>{const p=s=>{const [a,b]=String(s).split(':').map(Number);return a*60+(b||0)};return p(h2)-p(h1)};
  const dt=min(pico.h,ult.h);
  const remocao=(l.length>1&&dt>0&&ult.v<pico.v)?+((pico.v-ult.v)/dt).toFixed(3):null;
  return {n:l.length,pico:pico.v,hPico:pico.h,ultimo:ult.v,hUltimo:ult.h,minutos:dt,remocao};
}
function glicemiaResumo(rec){
  const g=((rec&&rec.gli)||[]).filter(x=>x&&x.v!=null);
  if(!g.length)return null;
  const de=q=>{const a=g.filter(x=>x.q===q); return a.length?a[a.length-1].v:null;};
  const antes=de('antes'), durante=de('durante');
  return {n:g.length,antes,durante,
          delta:(antes!=null&&durante!=null)?+(durante-antes).toFixed(0):null};
}
/* ── PESO DIÁRIO ───────────────────────────────────────────────────────────
   Diferente do peso da bioimpedância, que é de avaliação em avaliação. Quem
   compete acompanha a FAIXA: "oscilo entre 88,5 e 89,5" é a forma como o
   atleta pensa o próprio peso, e é ela que o app mostra. Uma queda súbita em
   relação à média recente costuma ser água, não massa — o app aponta o fato,
   sem concluir nada por conta própria. */
function pesoResumo(garmin,dias){
  const n=dias||7;
  const g=[...(garmin||[])].filter(x=>x&&x.peso!=null).sort((a,b)=>b.data.localeCompare(a.data));
  if(!g.length)return null;
  const jan=g.slice(0,n), vs=jan.map(x=>x.peso);
  const media=vs.reduce((t,v)=>t+v,0)/vs.length;
  const hoje_=g[0];
  return {hoje:hoje_.peso,data:hoje_.data,n:jan.length,
          media:+media.toFixed(1),min:+Math.min(...vs).toFixed(1),max:+Math.max(...vs).toFixed(1),
          delta:+(hoje_.peso-media).toFixed(1),
          deltaPct:+(((hoje_.peso-media)/media)*100).toFixed(1)};
}
/* ── DOR PERSISTENTE E PIORA INCOMUM ───────────────────────────────────────
   Isto não precisa de campo novo: a dor já é respondida todo dia no check-in
   (1 nenhuma … 5 muita). O que faltava era LER a série.
     • persistente = dias seguidos com dor alta, contados a partir de hoje;
     • piora incomum = a dor de hoje bem acima do que costuma ser.
   Um dia ruim é um dia ruim. Três seguidos é outra conversa, e é essa que o
   app passa a puxar. */
const DOR_ALTA=4;
function dorPersistente(garmin,limiar){
  const lim=limiar||DOR_ALTA;
  const g=[...(garmin||[])].filter(x=>x&&x.dor!=null).sort((a,b)=>b.data.localeCompare(a.data));
  if(!g.length)return null;
  let dias=0;
  for(const x of g){ if(x.dor>=lim)dias++; else break; }
  return dias?{dias,desde:g[dias-1].data,nivel:g[0].dor}:null;
}
function pioraIncomum(garmin){
  const g=[...(garmin||[])].filter(x=>x&&x.dor!=null).sort((a,b)=>b.data.localeCompare(a.data));
  if(g.length<5)return null;                      /* sem linha de base, sem juízo */
  const hoje_=g[0].dor;
  const base=g.slice(1,15).map(x=>x.dor).sort((a,b)=>a-b);
  const med=base[Math.floor(base.length/2)];
  return (hoje_-med)>=2?{hoje:hoje_,habitual:med,n:base.length}:null;
}

/* ── URINÁLISE ──────────────────────────────────────────────────────────────
   Perguntaram ao Nicholas como ele acompanha hidratação e glicemia, e ele
   respondeu: "Urinálise e Glicosímetro". Volume de líquido ao acordar é o que
   se BEBE; urinálise é o que o corpo mostra — e é esta que os atletas de
   ponta usam. O app passa a aceitar as duas, com a urinálise na frente.

   Referências (não são diagnóstico, e a tela diz isso):
   • densidade ≤ 1.020 é o corte de euidratação adotado pela NATA e pela NCAA;
     há quem proponha 1.025 para ganhar especificidade, e amostra da primeira
     urina do dia é naturalmente mais concentrada;
   • a escala de cor de 8 tons é a de Armstrong (1994). Cor e densidade NÃO
     concordam sempre, e a iluminação do banheiro desloca a leitura da cor em
     até dois tons — por isso as duas aparecem lado a lado, sem fundir numa
     nota só. */
const UCOR=['#f6f3c8','#f2eca3','#ede07a','#e8d24f','#ddbf35','#cfa32a','#b5831f','#8d5a14'];
function leituraUrina(rec){
  if(rec.uDens==null&&rec.uCor==null)
    return'<div class="xs muted" style="margin:4px 0">Sem urinálise hoje. É o marcador que o atleta de ponta usa — mais informativo que o volume bebido.</div>';
  const p=[];
  if(rec.uDens!=null){
    const d=rec.uDens;
    const nota=d<=1.020?'dentro do corte de euidratação (≤ 1.020)'
      :d<=1.025?'acima de 1.020 — zona em que as referências divergem'
      :'acima de 1.025, onde as referências convergem para desidratação';
    p.push(`<div class="row"><span class="grow">Densidade</span><b>${d.toFixed(3)}</b></div>
      <div class="muted" style="margin-top:2px">${nota}</div>`);
  }
  if(rec.uCor!=null)
    p.push(`<div class="row" style="margin-top:6px"><span class="grow">Cor</span>
      <span style="display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid var(--line);background:${UCOR[rec.uCor-1]};margin-right:6px;vertical-align:-3px"></span>

/* ── IMPORT DO GARMIN: o atrito era ACHAR os arquivos ──────────────────────
   O export GDPR do Garmin vem como um ZIP com centenas de arquivos, e só
   quatro famílias interessam. Até aqui o atleta tinha de descompactar, achar
   cada um no meio do resto e selecionar à mão — toda vez.
   Agora ele entrega a PASTA inteira (ou o ZIP) e o app procura sozinho. */
const ARQ_GARMIN=[
  {re:/TrainingReadinessDTO/i, rot:'VFC'},
  {re:/UDSFile/i,              rot:'FC de repouso'},
  {re:/sleepData/i,            rot:'sono'},
  {re:/summarizedActivities/i, rot:'nados e atividades'}
];
function garminRelevante(nome){
  const base=String(nome||'').split(/[\\/]/).pop();
  if(!/\.json$/i.test(base))return null;
  const m=ARQ_GARMIN.find(x=>x.re.test(base));
  return m?m.rot:null;
}
/* Núcleo compartilhado: recebe {nome, texto()} e devolve o relatório do que
   entrou. Serve para a pasta, para o ZIP e para arquivos avulsos. */
async function importarGarminLote(itens,diz){
  const antes=new Set(((S.pro&&S.pro.garmin)||[]).map(x=>x.data));
  const porTipo={}, tocados=new Set();
  /* um lote só para todos os arquivos: dentro da mesma importação os dias
     somam normalmente; entre importações, substituem */
  const lote={limpos:new Set()};
  let lidos=0, ignorados=0, falhas=0;
  for(const it of itens){
    const rot=garminRelevante(it.nome);
    if(!rot){ ignorados++; continue; }
    if(diz)diz(`Lendo ${rot}… (${lidos+1})`);
    let txt; try{ txt=await it.texto(); }catch(_){ falhas++; continue; }
    const r=await importarGarmin(txt,true,lote);
    if(!r||!r.n){ falhas++; continue; }
    porTipo[rot]=(porTipo[rot]||0)+r.n;
    r.dias.forEach(d=>tocados.add(d));
    lidos++;
  }
  const dias=[...tocados].sort();
  return{lidos,ignorados,falhas,porTipo,
    novos:dias.filter(d=>!antes.has(d)).length,
    atualizados:dias.filter(d=>antes.has(d)).length,
    de:dias[0]||null, ate:dias[dias.length-1]||null, total:dias.length};
}
function relatorioGarmin(r){
  if(!r.total)return`<b>Nada foi importado.</b> ${r.ignorados?`${r.ignorados} arquivo(s) foram ignorados por não serem os do Garmin.`:''} Os arquivos que o app procura são <b>${ARQ_GARMIN.map(x=>x.re.source.replace(/\\/g,'')).join('</b>, <b>')}</b> — eles ficam dentro de <code>DI_CONNECT</code> no export.`;
  const tipos=Object.entries(r.porTipo).map(([k,v])=>`${k} (${v})`).join(' · ');
  return`<b>${r.total} dia(s)</b> — ${r.novos} novo(s), ${r.atualizados} atualizado(s).<br>
    <span class="xs muted">${brCurta(r.de)} a ${brCurta(r.ate)} · ${tipos}${r.ignorados?` · ${r.ignorados} arquivo(s) irrelevante(s) ignorado(s)`:''}${r.falhas?` · ${r.falhas} não deu para ler`:''}</span>`;
}
function dizGarmin(html,cor){
  const el=document.getElementById('garSt');
  if(el){ el.className='note '+(cor||''); el.innerHTML=html; }
}
/* arquivos avulsos OU a pasta inteira — o mesmo manipulador serve aos dois,
   porque webkitdirectory só muda o que o seletor devolve */
async function arquivoGarmin(inp){
  const fs=[...(inp.files||[])]; inp.value='';
  if(!fs.length)return;
  dizGarmin(`Procurando nos ${fs.length} arquivo(s)…`);
  const r=await importarGarminLote(fs.map(f=>({nome:f.webkitRelativePath||f.name,texto:()=>f.text()})),dizGarmin);
  if(r.total)await salvarSaude();
  dizGarmin(relatorioGarmin(r),r.total?'ok':'warn');
  if(r.total)render();
}
/* ZIP: lê o índice primeiro e só descomprime os quatro que interessam — o
   export tem centenas de FIT de atividade que não servem para nada aqui. */
let _jszip=null;
function carregarJSZip(){
  if(_jszip)return Promise.resolve(_jszip);
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload=()=>{ _jszip=window.JSZip; _jszip?res(_jszip):rej(new Error('JSZip não carregou')); };
    s.onerror=()=>rej(new Error('sem conexão para carregar o leitor de ZIP'));
    document.head.appendChild(s);
  });
}
async function zipGarmin(inp){
  const f=(inp.files||[])[0]; inp.value='';
  if(!f)return;
  const mb=f.size/1048576;
  dizGarmin(`Abrindo o ZIP (${mb.toFixed(0)} MB)…`);
  let JZ; try{ JZ=await carregarJSZip(); }catch(e){ return dizGarmin(esc(e.message),'warn'); }
  let zip;
  try{ zip=await JZ.loadAsync(await f.arrayBuffer()); }
  catch(e){
    return dizGarmin(`Não consegui abrir este ZIP${mb>150?` — ele tem ${mb.toFixed(0)} MB, e o navegador pode não dar conta. <b>Descompacte no computador e use "Escolher a pasta"</b>, que não carrega tudo na memória.`:`: ${esc(e.message)}`}`,'warn');
  }
  const itens=[];
  zip.forEach((caminho,entry)=>{ if(!entry.dir&&garminRelevante(caminho))itens.push({nome:caminho,texto:()=>entry.async('string')}); });
  if(!itens.length)return dizGarmin(relatorioGarmin({total:0,ignorados:Object.keys(zip.files).length}),'warn');
  const r=await importarGarminLote(itens,dizGarmin);
  if(r.total)await salvarSaude();
  dizGarmin(relatorioGarmin(r),r.total?'ok':'warn');
  if(r.total)render();
}
/* devolve {n, dias} — quantos registros entraram e QUAIS datas foram tocadas.
   O lote precisa das datas para dizer quantos dias são novos e quantos foram
   atualizados; antes só havia uma contagem bruta de registros. */
/* ── REIMPORTAR NÃO PODE SOMAR DUAS VEZES ──────────────────────────────────
   Sono, FC e VFC são atribuídos (`g.fc=...`), então reimportar sobrescreve e
   nada muda. Mas nado, duração de atividade e FC média ACUMULAM — e têm de
   acumular mesmo, porque um dia pode ter três treinos em arquivos diferentes.
   O problema é a segunda importação do MESMO export: ela somava tudo de novo,
   dobrando o volume e a carga sem nenhum aviso.

   E isto não é hipótese: eu mesmo mandei o Bruno reimportar o export do
   Garmin para recuperar a Saúde perdida em 14/10.

   Conserto: o acumulador de cada dia é zerado na PRIMEIRA vez que aquele dia
   aparece na importação corrente. Dentro da mesma importação vários arquivos
   continuam somando; reimportar o mesmo conjunto dá exatamente o mesmo
   resultado. `ctx` carrega quais dias já foram zerados nesta passada. */
const CAMPOS_ACUM=['nado','ativDur','ativFc','_fcMin','_min'];
/* ── CONFERIR O VOLUME VINDO DO RELÓGIO ─────────────────────────────────────
   Até a v166, reimportar o export somava de novo: nado e duração de atividade
   dobravam. A v167 passou a guardar cada atividade com chave e a DERIVAR os
   totais dela — então o dia se conserta sozinho assim que recebe a primeira
   atividade identificada.

   Falta saber quais dias ainda estão no modelo antigo. Dia com total mas SEM
   lista de atividades é exatamente isso: veio do acúmulo, e pode estar
   inflado. Esta conferência é só leitura — ela não corrige nada, porque quem
   corrige é a reimportação, com o dado real do relógio na mão. */
function conferirVolumeGarmin(pro){
  const g=((pro||S.pro||{}).garmin)||[];
  const comTotal=g.filter(x=>x&&(x.nado!=null||x.ativDur!=null));
  const legado=comTotal.filter(x=>!Array.isArray(x.ativs)||!x.ativs.length);
  const conferidos=comTotal.filter(x=>Array.isArray(x.ativs)&&x.ativs.length);
  /* mais de 5h de atividade num dia, ou mais de 15 km nadados, é quase sempre
     contagem dobrada — não é regra, é triagem para o olho humano */
  const suspeitos=legado.filter(x=>(x.ativDur||0)>300||(x.nado||0)>150)
    .sort((a,b)=>b.data.localeCompare(a.data));
  const porMes={};
  for(const x of legado){ const m=x.data.slice(0,7);
    porMes[m]=porMes[m]||{n:0,nado:0,dur:0};
    porMes[m].n++; porMes[m].nado+=(x.nado||0); porMes[m].dur+=(x.ativDur||0); }
  return {total:comTotal.length,legado:legado.length,conferidos:conferidos.length,
    suspeitos,porMes:Object.keys(porMes).sort().reverse().map(m=>Object.assign({ym:m},porMes[m]))};
}
function cardConferirGarmin(){
  const c=conferirVolumeGarmin(S.pro);
  const nDias=((S.pro&&S.pro.garmin)||[]).length;
  /* Silencio nao e informacao: sem nenhum dia com volume o cartao sumia da
     tela, e quem procurava a conferencia concluia que ela nao existia. */
  if(!c.total)
    return nDias
      ? '<div class="note xs" style="margin-top:10px"><b>Nenhum dia com volume de atividade vindo do relogio.</b> '+
        'Voce tem '+nDias+' dia(s) de Saude importados (VFC, sono, FC), mas nenhuma atividade com distancia ou duracao. '+
        'Os nados vem do arquivo <b>summarizedActivities.json</b> — confira se ele veio dentro do ZIP do export.</div>'
      : '<div class="note xs" style="margin-top:10px">Nada importado do relogio ainda. Depois da primeira importacao esta conferencia mostra se o volume esta integro.</div>';
  if(!c.legado)
    return '<div class="note ok xs" style="margin-top:10px"><b>Volume conferido.</b> Os '+
      c.conferidos+' dia(s) com atividade já estão no modelo por atividade — reimportar não soma de novo.</div>';
  const meses=c.porMes.slice(0,6).map(m=>
    '<div class="row xs" style="padding:3px 0;border-top:1px solid var(--line)">'+
      '<span class="grow">'+(MESES[+m.ym.slice(5,7)-1]||m.ym)+' '+m.ym.slice(0,4)+'</span>'+
      '<span class="muted" style="margin-right:10px">'+m.n+' dia(s)</span>'+
      '<b>'+(m.nado?(m.nado/10).toFixed(1)+' km':'—')+'</b></div>').join('');
  return '<div class="note warn xs" style="margin-top:10px">'+
    '<b>'+c.legado+' dia(s) ainda no modelo antigo de volume.</b> '+
    'Eles guardam só o total somado, sem a lista de atividades — se você reimportou o export do Garmin mais de uma vez antes da v167, o volume e a duração desses dias podem estar contados em dobro.'+
    (c.suspeitos.length?'<div style="margin-top:6px"><b>'+c.suspeitos.length+' dia(s) com valor improvável</b> (mais de 5h de atividade ou 15 km): '+
      c.suspeitos.slice(0,5).map(x=>brCurta(x.data)+(x.ativDur?' · '+x.ativDur+'min':'')+(x.nado?' · '+(x.nado/10).toFixed(1)+'km':'')).join(' | ')+'.</div>':'')+
    '<div style="margin-top:6px">Para corrigir: <b>reimporte o export do Garmin inteiro</b> (o botão acima). Cada dia que receber atividade tem os totais recalculados do zero.</div>'+
    (meses?'<div class="sep" style="margin:8px 0 4px"></div><div class="eyebrow">volume por mês nos dias ainda não conferidos</div>'+meses:'')+
    '</div>';
}

/* Os totais do dia passam a ser CALCULADOS da lista de atividades. Dia antigo,
   que só tem os totais somados, continua valendo como está até receber a
   primeira atividade com chave — aí o cálculo assume e, de quebra, corrige o
   número inflado por reimportações anteriores. */
function derivarTotaisDoDia(g){
  const a=(g&&g.ativs)||[];
  if(!a.length)return g;
  const nado=a.filter(x=>/swim|nata/i.test(x.tipo||'')).reduce((t,x)=>t+(x.dist||0),0);
  if(nado)g.nado=Math.round(nado/100); else delete g.nado;
  const min=a.reduce((t,x)=>t+(x.min||0),0);
  if(min)g.ativDur=Math.round(min); else delete g.ativDur;
  const comFc=a.filter(x=>x.fc!=null&&x.min);
  if(comFc.length){
    const tot=comFc.reduce((t,x)=>t+x.min,0);
    g.ativFc=Math.round(comFc.reduce((t,x)=>t+x.fc*x.min,0)/tot);
  } else delete g.ativFc;
  delete g._fcMin; delete g._min;      /* herança do modelo somado */
  return g;
}
/* ── QUAL VFC ESTOU COMPARANDO ──────────────────────────────────────────────
   Média semanal e medida da noite não são a mesma grandeza, e comparar uma
   com a outra inventa variação. Esta função escolhe UMA fonte — a da noite,
   se houver o bastante — e diz qual é, para a tela poder declarar. */
function serieHRV(garmin){
  const g=[...(garmin||[])].filter(x=>x&&x.hrv!=null).sort((a,b)=>b.data.localeCompare(a.data));
  if(!g.length)return null;
  const cont={};
  g.slice(0,30).forEach(x=>{ const f=x.hrvF||'legado'; cont[f]=(cont[f]||0)+1; });
  const fonte=['noite','legado','semana'].find(f=>(cont[f]||0)>=4)
    ||Object.keys(cont).sort((a,b)=>cont[b]-cont[a])[0];
  return {serie:g.filter(x=>(x.hrvF||'legado')===fonte),fonte,
          misturado:Object.keys(cont).length>1};
}
/* ── FAIXA DE NORMALIDADE DA VFC ────────────────────────────────────────────
   "VFC 9% abaixo da base" é um número sem contexto: 9% pode ser ruído num
   atleta que oscila muito e sinal claro em quem é estável. O que informa é a
   FAIXA — quanto a VFC costuma variar nesta pessoa — e se hoje caiu fora
   dela. Ideia emprestada do HRV4Training, que mostra a média móvel junto de
   uma banda de normalidade em vez de um desvio solto.

   Média ± 1 desvio-padrão dos últimos 60 dias, excluindo hoje (senão o dia
   que se quer julgar entra no próprio julgamento). Mínimo de 14 dias: abaixo
   disso o desvio-padrão é instável e a faixa mentiria. Uma fonte só de VFC,
   como em todo o resto. */
const FAIXA_HRV_MIN=14;
function faixaHRV(garmin){
  const sh=serieHRV(garmin); if(!sh)return null;
  const s=sh.serie;                       /* do mais novo para o mais antigo */
  const referencia=s[0]?.data||hoje(),inicio=new Date(referencia+'T00:00:00');inicio.setDate(inicio.getDate()-60);
  const base=s.filter(x=>x.data<referencia&&x.data>=isoDia(inicio)).map(x=>x.hrv);
  if(base.length<FAIXA_HRV_MIN)return null;
  const media=base.reduce((a,b)=>a+b,0)/base.length;
  const dp=Math.sqrt(base.reduce((t,x)=>t+Math.pow(x-media,2),0)/base.length);
  const de=media-dp, ate=media+dp, hoje=s[0]?s[0].hrv:null;
  return {media:Math.round(media),dp:+dp.toFixed(1),
    de:Math.round(de),ate:Math.round(ate),n:base.length,fonte:sh.fonte,
    hoje,data:s[0]?s[0].data:null,
    posicao:hoje==null?null:(hoje<de?'abaixo':(hoje>ate?'acima':'dentro'))};
}

/* ── MARCADORES DE CONTEXTO ─────────────────────────────────────────────────
   VFC baixa com "viagem" marcada não é a mesma coisa que VFC baixa sem
   explicação. Sem isso o app trata as duas igual e o atleta aprende a
   ignorar o aviso — que é o pior desfecho possível para um alerta.
   São marcas do DIA, no mesmo registro do check-in e do relógio. Nenhuma
   delas muda cálculo nenhum: elas explicam, não corrigem. */
const CTX_MARCAS=[['doenca','doença'],['alcool','álcool'],['viagem','viagem'],
                  ['estresse','estresse fora do treino'],['ciclo','ciclo menstrual']];
const ctxRotulo=k=>{const m=CTX_MARCAS.find(x=>x[0]===k); return m?m[1]:k;};
function ctxDoDia(garmin,data){
  const r=(garmin||[]).find(x=>x&&x.data===data);
  return (r&&Array.isArray(r.ctx))?r.ctx:[];
}
async function alternarCtx(k){
  const r=regDia(hoje());
  const atual=Array.isArray(r.ctx)?r.ctx:[];
  const tem=atual.includes(k);
  const novo=tem?atual.filter(x=>x!==k):atual.concat([k]);
  if(novo.length)r.ctx=novo; else delete r.ctx;
  if(await salvarSaude(tem?{apagando:true}:undefined)===false)return;
  render();
}
/* Quantos dias de VFC fora da faixa tinham explicação marcada. É o que
   transforma uma contagem em leitura: "5 dias baixos, 3 deles com viagem". */
function ctxNoPeriodo(garmin,ini,fim){
  const g=(garmin||[]).filter(x=>x&&x.data>=ini&&x.data<=fim);
  const cont={};
  for(const d of g)for(const k of (d.ctx||[]))cont[k]=(cont[k]||0)+1;
  const lista=Object.keys(cont).sort((a,b)=>cont[b]-cont[a]).map(k=>({k,rot:ctxRotulo(k),n:cont[k]}));
  return {lista,dias:g.filter(x=>(x.ctx||[]).length).length};
}
function cardContexto(){
  const d=hoje(), marcas=ctxDoDia(S.pro&&S.pro.garmin,d);
  const f=faixaHRV(S.pro&&S.pro.garmin);
  const botoes=CTX_MARCAS.map(function(m){
    const on=marcas.includes(m[0]);
    return '<button class="'+(on?'on':'')+'" onclick="alternarCtx(\''+m[0]+'\')">'+m[1]+'</button>';
  }).join('');
  return '<div class="sep"></div><div class="eyebrow">o que mais houve hoje</div>'+
    '<div class="xs muted" style="margin:4px 0 6px">Marque o que pode explicar um número fora do normal. '+
    'Isso <b>não muda cálculo nenhum</b> — serve para o app não tratar uma noite de viagem como se fosse queda de forma.</div>'+
    '<div class="opt">'+botoes+'</div>'+
    (f&&f.posicao&&f.posicao!=='dentro'&&marcas.length
      ? '<div class="xs muted" style="margin-top:6px">A VFC de hoje está <b>'+f.posicao+'</b> da sua faixa habitual, e você marcou <b>'+
        marcas.map(ctxRotulo).join(', ')+'</b>. O app registra os dois lado a lado.</div>'
      : '');
}

async function importarGarmin(raw,silencioso,ctx){
  const vazio={n:0,dias:[]};
  if(!raw||!raw.trim()){if(!silencioso)toast('Cole os dados');return vazio}
  let j; try{j=JSON.parse(raw)}catch(e){if(!silencioso)toast('JSON inválido');return vazio}
  S.pro=S.pro||proVazio();
  const lote=ctx||{limpos:new Set()};    /* sem lote, cada chamada é o seu */
  const arr=Array.isArray(j)?j.flat():[j],mapa={};
  (S.pro.garmin||[]).forEach(x=>mapa[x.data]=x);
  let n=0; const tocados=new Set();
  arr.forEach(o=>{
    if(!o||typeof o!=='object')return;
    const d=o.calendarDate||o.calendar_date||o.sleepStartTimestampLocal?.slice?.(0,10)||
      (o.startTimeLocal?String(o.startTimeLocal).slice(0,10):null);
    if(!d||!/^\d{4}-\d{2}-\d{2}/.test(d))return;
    const dia=d.slice(0,10);
    const g=mapa[dia]||{data:dia};
    /* primeira vez que este dia aparece NESTA importação: zera o que acumula,
       para que reimportar substitua em vez de somar por cima */
    if(!lote.limpos.has(dia)){ lote.limpos.add(dia); for(const k of CAMPOS_ACUM)delete g[k]; }
    if(o.restingHeartRate!=null)g.fc=Math.round(o.restingHeartRate);
    /* ── DE ONDE VEIO A VFC ────────────────────────────────────────────────
       Estava assim: `o.hrvWeeklyAverage ?? o.lastNightAvg ?? ...` — a MÉDIA
       SEMANAL tinha precedência sobre a medida da noite, e as duas caíam no
       mesmo campo sem rótulo. Como prontidao() compara os 3 dias recentes
       contra a base dos dias 4 a 17, dava para estar comparando média de sete
       dias com medição de uma noite e chamar a diferença de "variação".
       É o mesmo erro de misturar SDNN com RMSSD, dentro de uma fonte só.
       Agora a noite vem primeiro, e a procedência viaja junto. */
    const hrvNoite=o.lastNightAvg??o.avgOvernightHrv;
    const hrvSemana=o.hrvWeeklyAverage??o.weeklyAvg;
    if(hrvNoite!=null){ g.hrv=Math.round(hrvNoite); g.hrvF='noite'; }
    else if(hrvSemana!=null&&g.hrvF!=='noite'){ g.hrv=Math.round(hrvSemana); g.hrvF='semana'; }
    if(o.sleepTimeSeconds!=null)g.sono=+(o.sleepTimeSeconds/3600).toFixed(1);
    if(o.deepSleepSeconds!=null&&o.sleepTimeSeconds==null)g.sono=+((o.deepSleepSeconds+(o.lightSleepSeconds||0)+(o.remSleepSeconds||0))/3600).toFixed(1);
    /* ── REGISTRO POR ATIVIDADE, NÃO CAMPO SOMADO NO DIA ───────────────────
       O dia guardava só os totais (`nado`, `ativDur`, `ativFc`), e total não
       tem identidade: não dá para saber o que já entrou, de onde veio, nem
       corrigir uma atividade sem refazer tudo. Era isso que fazia reimportar
       somar de novo, e é o que impediria qualquer integração automática —
       a mesma atividade chegando pelo relógio e pelo celular contaria duas
       vezes, sem jeito de perceber.
       Agora cada atividade é um registro com CHAVE própria, e os totais do
       dia são DERIVADOS dela. Reimportar substitui pela chave; dois arquivos
       do mesmo lote somam; e amanhã dá para acrescentar origem e dispositivo
       sem mexer em mais nada. */
    const durB=o.duration??o.movingDuration??o.elapsedDuration;
    const fcAt=o.averageHR??o.avgHr??o.averageHeartRate;
    if(durB!=null&&o.activityType){
      const min=durB>100000?durB/60000:durB/60;          /* aceita ms ou s */
      if(min>3&&min<600){
        const k=o.activityId??o.activityUuid??
          (o.startTimeLocal?`${String(o.startTimeLocal).slice(0,19)}|${o.activityType}`
                           :`${dia}|${o.activityType}|${Math.round(min)}|${Math.round(o.distance||0)}`);
        const at={k:String(k),tipo:o.activityType,min:+min.toFixed(1),origem:'garmin'};
        if(fcAt!=null)at.fc=Math.round(fcAt);
        if(o.distance!=null)at.dist=Math.round(o.distance);
        g.ativs=[...(g.ativs||[]).filter(x=>x.k!==at.k),at];
        derivarTotaisDoDia(g);
      }
    }
    mapa[dia]=g;n++;tocados.add(dia);
  });
  S.pro.garmin=Object.values(mapa);
  if(!silencioso){if(await salvarSaude()===false)return {n:0,dias:[],erro:true};toast(`${n} registro(s) lido(s)`);render()}
  return {n,dias:[...tocados]};
}
async function lancarDia(){
  const d=val('gD'); if(!d)return;
  S.pro=S.pro||proVazio();
  let g=(S.pro.garmin||[]).find(x=>x.data===d); if(!g){g={data:d};S.pro.garmin.push(g)}
  const nm=id=>{const v=val(id);return v?parseFloat(v):undefined};
  if(nm('gFC')!==undefined)g.fc=nm('gFC'); if(nm('gH')!==undefined)g.hrv=nm('gH');
  const sh=horasFlex(val('gS')); if(sh!=null)g.sono=sh; if(nm('gP')!==undefined)g.pse=nm('gP');
  S.sonoSel=null;                     /* senão a faixa fica marcada no dia seguinte */
  if(await salvarSaude()===false)return; toast('Gravado'); render();
}
let FOTO=null,SECOPDF=null;
function fotoSeco(inp){
  const f=inp.files[0]; if(!f)return;
  const esp=espacoPro();
  if(f.type==='application/pdf'){
    const p=document.getElementById('skPrev');
    /* em base64 o arquivo cresce ~33%: é esse tamanho que ocupa o documento */
    const ocupa=Math.round(f.size*1.37);
    if(f.size>TETO_ANEXO_PDF){ SECOPDF=null;
      if(p)p.innerHTML=`<b>PDF grande demais</b> (${kb(f.size)}; máximo ${kb(TETO_ANEXO_PDF)}). Enquanto os anexos ficam dentro do cadastro, o limite é apertado. <b>Prefira uma foto</b> — o app comprime sozinho.`; return; }
    if(ocupa>esp.livre){ SECOPDF=null;
      if(p)p.innerHTML=`<b>Sem espaço.</b> Este PDF ocuparia ${kb(ocupa)} e restam ${kb(esp.livre)} no seu cadastro. Apague algum anexo antigo em Saúde › fora d'água.`; return; }
    const rp=new FileReader(); rp.onload=()=>{ SECOPDF=rp.result; FOTO=null;
      if(p)p.innerHTML=`PDF anexado ✓ <span class="muted">(${kb(ocupa)} · restam ${kb(esp.livre-ocupa)})</span>`; }; rp.readAsDataURL(f); return;
  }
  const r=new FileReader();
  r.onload=()=>{
    SECOPDF=null;
    const img=new Image();
    img.onload=()=>{
      /* Comprime até caber no orçamento: uma foto de ficha de musculação
         precisa ser LEGÍVEL, não bonita. Vai baixando qualidade e, se ainda
         assim não couber, reduz a dimensão — em vez de recusar o anexo. */
      const p=document.getElementById('skPrev');
      const render=(lado,q)=>{
        const e=Math.min(1,lado/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*e); cv.height=Math.round(img.height*e);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        return cv.toDataURL('image/jpeg',q);
      };
      let d=null;
      for(const [lado,q] of [[720,.55],[720,.45],[600,.45],[520,.4],[420,.4]]){
        d=render(lado,q);
        if(bytesDe(d)<=ALVO_FOTO)break;
      }
      const ocupa=bytesDe(d), livre=espacoPro().livre;
      if(ocupa>livre){ FOTO=null;
        if(p)p.innerHTML=`<b>Sem espaço.</b> Restam ${kb(livre)} no seu cadastro. Apague algum anexo antigo em Saúde › fora d'água.`;
        return; }
      FOTO=d;
      if(p)p.innerHTML=`<img src="${urlSegura(FOTO)}" style="max-width:130px;border-radius:9px;border:1px solid var(--line)">
        <div class="xs muted" style="margin-top:3px">${kb(ocupa)} · restam ${kb(livre-ocupa)}</div>`;
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
}
/* Treino extra (fora d'água / cross-training) como FOLHA — não é apagado pelo sync,
   corrigindo o antigo bug do formulário inline. Abre novo (data) ou edita (id). */
function abrirTreinoExtra(data,id){
  const ed=id?(((S.pro&&S.pro.seco)||[]).find(x=>x.id===id)):null;
  S.secoEdit=ed?ed.id:null;

    ?{tipo:ed.tipo,data:ed.data,rpe:ed.rpe,durTxt:ed.durTxt||minParaHMS(ed.dur),fc:ed.fc,calorias:ed.calorias,obs:ed.obs||'',trans:ed.transcricao||''}
    :{tipo:'Musculação',data:data||hoje(),rpe:null,durTxt:'',fc:null,calorias:null,obs:'',trans:''};
  FOTO=null; SECOPDF=null;
  sheet(formTreinoExtra());
}
function formTreinoExtra(){
  const d=S.secoDraft||{};

/* ── Conserto em lote das durações fora d'água ─────────────────────────────
   Até a v96 uma duração de duas partes era SEMPRE lida como mm:ss: "1:10"
   (1h10) virava 1,17 minuto em vez de 70. Isso não é um número feio na tela —
   é carga de treino, e uma sessão de 70 min contando como 1 min some do
   cálculo de fadiga inteiro.

   Dá para consertar sem reabrir sessão por sessão por dois caminhos:
   • o TEXTO digitado fica guardado em `durTxt` — é só reinterpretar, e aí o
     resultado é exato;
   • onde o texto não existe (sessão antiga ou importada), a conta é direta: o
     valor errado é exatamente 60× menor, porque a leitura velha era h+m/60 e
     a certa é h×60+m. */
const fmtDur=m=>m==null?'—':(m>=60?`${Math.floor(m/60)}h${String(Math.round(m%60)).padStart(2,'0')}`:`${+m.toFixed(m<10?1:0)} min`);
function duracoesSuspeitas(){
  const out=[];
  for(const s of ((S.pro&&S.pro.seco)||[])){
    if(s.dur==null)continue;
    if(s.durTxt){
      const novo=durMin(s.durTxt);
      if(novo!=null&&Math.abs(novo-s.dur)>0.5)out.push({id:s.id,data:s.data,tipo:s.tipo,txt:s.durTxt,de:s.dur,para:novo,exato:true});
      continue;
    }
    /* sem o texto original: só mexemos no que é implausível de verdade */
    if(s.dur<8){ const novo=+(s.dur*60).toFixed(2);
      if(novo>=10&&novo<=300)out.push({id:s.id,data:s.data,tipo:s.tipo,txt:null,de:s.dur,para:novo,exato:false}); }
  }
  return out;
}
function revisarDuracoes(){
  const l=duracoesSuspeitas();

  const exatos=l.filter(x=>x.exato), estimados=l.filter(x=>!x.exato);
  const linha=x=>`<div class="row" style="gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)">

  sheet(`<h2>Durações fora d'água</h2>
    <div class="small muted">${l.length} sessão(ões) com a duração lida errado. Até a v96 o app entendia <b>1:10</b> como 1 minuto e 10 segundos, não como 1h10.</div>
    <div class="note" style="margin:10px 0">Isso mexe na <b>carga</b>: uma sessão de 70 min valendo 1 min praticamente desaparece do cálculo de fadiga.</div>
    ${exatos.length?`<div class="eyebrow" style="margin-top:10px">reinterpretadas do que você digitou (${exatos.length})</div>${exatos.map(linha).join('')}`:''}
    ${estimados.length?`<div class="eyebrow" style="margin-top:14px">sem o texto original (${estimados.length})</div>
      <div class="xs muted" style="margin-bottom:4px">Aqui o app refaz a conta: o valor guardado é exatamente 60× menor que o certo. Confira um a um antes de aplicar.</div>

    <button class="primary full" style="margin-top:14px" onclick="corrigirDuracoes()">Corrigir as ${l.length} sessões</button>
    <button class="ghost full" style="margin-top:8px" onclick="fecharSheet()">Agora não</button>`);
}
async function corrigirDuracoes(){
  const l=duracoesSuspeitas(); if(!l.length)return;
  const porId=new Map(l.map(x=>[x.id,x.para]));
  S.pro.seco=(S.pro.seco||[]).map(s=>porId.has(s.id)?{...s,dur:porId.get(s.id)}:s);
  if(await salvarSaude()===false)return;
  ESF=null; SESSOES=[];                   /* a carga é recalculada com os valores novos */
  fecharSheet(); toast(`${l.length} duração(ões) corrigida(s)`); render();
}
/* ── O que está faltando nos seus dados ────────────────────────────────────
   Carga de treino = duração × RPE. Faltando um dos dois, a sessão não entra na
   conta — e o relatório passa a dizer que você treinou menos do que treinou,
   sem avisar de onde vem o buraco.
   Os avisos já existiam, mas espalhados (um dentro do card de carga, outro no
   de duração) e sem dizer QUAL dia. Aqui viram uma lista só, com data e um
   toque para abrir e corrigir. */
function pendenciasSeco(){
  const out=[], h=hoje(), corrig=new Map(duracoesSuspeitas().map(x=>[x.id,x]));
  for(const s of ((S.pro&&S.pro.seco)||[])){
    const base={id:s.id,data:s.data,tipo:s.tipo||'Sessão',onde:'seco'};
    const c=corrig.get(s.id);
    /* duração errada é erro em qualquer data: o número já está gravado torto */
    if(c){out.push({...base,o:`duração gravada como ${fmtDur(c.de)}`,fazer:`corrige para ${fmtDur(c.para)}`,auto:true});continue}
    /* FALTA é diferente de AINDA NÃO ACONTECEU. Sessão marcada para depois de
       hoje é planejamento: cobrar RPE e duração de um treino que o atleta nem
       fez transforma a agenda dele numa lista de pendências. */
    if((s.data||'')>h)continue;
    const falta=[]; if(s.dur==null)falta.push('duração'); if(s.rpe==null)falta.push('RPE');
    if(falta.length){out.push({...base,o:`sem ${falta.join(' nem ')}`,fazer:'não entra na carga'});continue}
    if(s.dur>240)out.push({...base,o:`duração de ${fmtDur(s.dur)}`,fazer:'acima de 4h é raro — confira'});
  }
  return out.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
}
/* Natação: dia com tempo anotado (logo, treino feito) que não aparece em
   SESSOES — que é onde só entra quem tem RPE **e** duração preenchidos. */

  if(!ESF)return null;                    /* ainda não consolidado */
  const comCarga=new Set((SESSOES||[]).map(s=>s.data));
  return [...new Set(ESF.map(e=>e.data))].filter(d=>d&&!comCarga.has(d)).sort().reverse()
    .map(d=>{const t=S.tridx.find(x=>x.data===d&&(x.para||[]).includes(S.u.id));
      return {id:t?t.id:null,data:d,tipo:t?(t.titulo||'Treino'):'Treino de piscina',
        o:'sem RPE e duração da sessão',fazer:'entra só por estimativa',onde:'nat'};});
}

/* =====================================================================
   PRO — RELATÓRIO DE PERFORMANCE
   ===================================================================== */
async function coletarEsforcos(opts){
  const out=[]; const ses=[];
  /* janela TEMPORAL opcional: coletarEsforcos({dias:56}). Sem argumento mantém o
     comportamento antigo (os 25 treinos mais recentes) por compatibilidade. */
  const dias=opts&&opts.dias, h0=new Date(hoje()+'T00:00:00');
  const noPrazo=d=>{ if(!dias)return true; const x=(h0-new Date((d||'')+'T00:00:00'))/86400000; return x>=0&&x<dias; };
  const alvo=_alvoId();
  const metas=S.tridx.filter(t=>(t.para||[]).includes(alvo)&&noPrazo(t.data));
  const lista=dias?metas:metas.slice(0,25);
  const falhas=[];
  for(const meta of lista){
    /* Um treino problemático não pode zerar a consolidação dos outros 60. A
       leitura é por documento, então o erro é por documento: anotamos qual e
       seguimos. Era isto que transformava um dado estranho em "não foi
       possível montar o relatório", sem dizer de onde vinha. */
    let t=null;
    try{
      /* O relatório do próprio PRO combina duas origens: prescrições recebidas
         da equipe e treinos pessoais. O metadado identifica qual documento ler. */
      t=await DB.get(meta._pessoal?kPTr(S.u.id,meta.id):kTr(_alvoEq(),meta.id));
    }
    catch(e){ falhas.push(meta.id); continue; }
    if(!t)continue;
    if(!t.data&&meta.data)t.data=meta.data;      /* sem data o esforço quebra a ordenação */
    if(!t.data)continue;
    try{
    if(!treinoFeito(t,alvo))continue;   /* só consolida treino marcado como feito */
    const sj=t.sessao&&t.sessao[alvo];
    if(sj&&sj.rpe!=null&&sj.dur)ses.push({data:t.data||meta.data,tipo:'natação',load:sj.rpe*sj.dur});
    for(const b of t.blocos||[])for(const i of b.itens){
      const r=t.registros?.[alvo]?.[i.id]; if(!r)continue;
      const series=r.rd?r.rd:[r];   /* achata rodadas (do interpretador OU manuais) */
      /* BROKEN: os tempos são TRECHOS, não repetições. Entra UM esforço, a soma,
         marcado broken — e marcado é o que importa: com descanso no meio ele sai
         mais rápido que a prova, então não pode disputar com os tiros normais o
         papel de referência em %PB e projeção. */
      const bkI=brokenDe(i,r,ctxBloco(b,i.id));
      if(bkI){
        for(const s of series){
          const tp=tempoBroken(s,bkI.n);   /* cronômetro se houver, senão a soma */
          if(tp!=null)out.push({data:t.data,pis:t.piscina==='LC50'?'LC50':'SC25',dist:bkI.dist,estilo:i.estilo,tags:i.tags,
            tempo:tp,p1:(s.tempos||[])[0]??null,forte:true,vol:i.vol,
            broken:true,trecho:bkI.trecho,trechos:(s.tempos||[]).slice(0,bkI.n),desc:bkI.desc});
        }
        continue;
      }
      for(const s of series)(s.tempos||[]).forEach((x,k)=>{ if(x==null)return;
        const pk=s.parciais?.[k];
        /* p1 = split de 25m dos 50m (para o "custo do segundo 25"): escalar (legado) ou 1ª passagem do array */
        const p1=(i.parcial&&i.dist===50)?(Array.isArray(pk)?(pk[0]??null):(typeof pk==='number'?pk:null)):null;
        /* A PISCINA DO TREINO viaja com o esforco. Sem ela, um tiro de 50m numa
           piscina de 25m (uma virada) era comparado com prova de 50m longa
           (nenhuma virada) como se fossem a mesma coisa -- e a virada e parte
           grande do tempo num sprint. */
        out.push({data:t.data,pis:t.piscina==='LC50'?'LC50':'SC25',dist:i.dist,estilo:i.estilo,tags:i.tags,tempo:x,p1,forte:i.forte,vol:i.vol})});
    }
    }catch(e){ falhas.push(meta.id); try{console.warn('[consolidação] treino',meta.id,e)}catch(_){} }
  }
  SESSOES=ses;
  if(falhas.length)try{console.warn('[consolidação]',falhas.length,'treino(s) ignorado(s):',falhas)}catch(_){}
  ESF_FALHAS=falhas;
  return out.sort((a,b)=>String(a.data||'').localeCompare(String(b.data||'')));
}
let ESF_FALHAS=[];
let ESF=null, ESF_ERRO=null, SESSOES=[];
/* Carga total (session-RPE = duração × RPE) por modalidade, últimos N dias */
function cargaTotal(dias,ate){
  /* `ate` fecha a janela numa data qualquer: sem ele a conta é sempre "os
     ultimos N dias ate hoje", e o extrato precisa fechar o mes de setembro
     estando em outubro. Sem `ate`, nada muda para quem ja chamava. */
  dias=dias||28; const h0=new Date((ate||hoje())+'T00:00:00');
  const dentro=d=>{const x=(h0-new Date(d+'T00:00:00'))/86400000;return x>=0&&x<dias;};
  let natacao=0,forca=0,nSeco=0;
  for(const s of (SESSOES||[]))if(dentro(s.data))natacao+=s.load;
  /* duração implausível entra na carga como se fosse real e domina tudo: uma
     sessão de "330" (lida como 330 min) vale 10× uma de 60. Sinalizamos em vez
     de descartar — o dado é do usuário, quem corrige é ele. */
  const secoSuspeito=[];
  for(const s of ((S.pro&&S.pro.seco)||[]))if(s.rpe!=null&&s.dur&&dentro(s.data)){
    forca+=s.rpe*s.dur; nSeco++;
    if(s.dur>240)secoSuspeito.push({data:s.data,tipo:s.tipo||'sessão',dur:Math.round(s.dur),rpe:s.rpe});
  }
  /* SESSOES só recebe o treino de natação quando RPE **e** duração foram
     preenchidos (ver coletarEsforcos). Contamos quantos treinos existiam no
     período para revelar a cobertura: sem isso a natação aparece com uma
     fatia minúscula e parece erro de cálculo, quando é dado faltando. */
  /* Denominador: só treinos REALMENTE FEITOS. Antes contávamos tudo que estava
     na agenda (S.tridx), então treino que o atleta não fez entrava como "RPE
     faltando" e inflava o buraco. Usamos os dias com esforço registrado — se
     houve tempo anotado, o treino aconteceu. */
  let nNatCom=(SESSOES||[]).filter(s=>dentro(s.data)).length;
  const diasFeitos=new Set(((typeof ESF!=='undefined'&&ESF)||[]).filter(e=>dentro(e.data)).map(e=>e.data));
  const nNat=Math.max(diasFeitos.size,nNatCom);
  /* estimativa do relógio para os dias sem nada informado */
  let estimado=0,nEst=0;
  const jaTem=diasComCargaInformada(), id=idadeDoUsuario();
  for(const g of ((S.pro&&S.pro.garmin)||[])){
    if(jaTem[g.data]||!dentro(g.data))continue;
    const e=loadGarminDia(g,id); if(e){estimado+=e.load;nEst++;}
  }
  /* EXTRAPOLAÇÃO: treino feito sem RPE não vale ZERO — ele aconteceu. Mostrar
     "12% natação × 88% fora d'água" quando metade dos treinos de piscina não
     tem RPE é apresentar um número distorcido como se fosse fato. Estimamos os
     que faltam pela média dos que existem, e deixamos isso EXPLÍCITO. */
  const mediaNat=nNatCom?natacao/nNatCom:0;
  const nSemRPE=Math.max(0,nNat-nNatCom);

/* carga diária (session-RPE) somando natação + treinos fora d'água → índice por dias-atrás */
function loadDiario(dias){
  dias=dias||42; const h0=new Date(hoje()+'T00:00:00');
  const dd=d=>Math.floor((h0-new Date((d||'')+'T00:00:00'))/86400000);
  const dia={}; const push=(d,v)=>{const k=dd(d); if(k>=0&&k<dias)dia[k]=(dia[k]||0)+v;};
  for(const s of (SESSOES||[]))push(s.data,s.load||0);
  for(const s of ((S.pro&&S.pro.seco)||[]))if(s.rpe!=null&&s.dur)push(s.data,s.rpe*s.dur);
  /* completa com a estimativa do relógio os dias sem nada informado — senão
     ACWR, monotonia e a recomendação de intensidade saem de uma carga que
     ignora a maior parte dos treinos. */
  const jaTem=diasComCargaInformada(), id=idadeDoUsuario();
  for(const g of ((S.pro&&S.pro.garmin)||[])){
    if(jaTem[g.data])continue;
    const e=loadGarminDia(g,id); if(e)push(g.data,e.load);

/* ── Carga estimada pelo relógio ───────────────────────────────────────────

   repouso (que o app já importa) e a idade, estima-se o esforço pela RESERVA
   de frequência cardíaca (Karvonen) e converte-se em RPE 0–10.
   Usada SÓ nos dias em que o atleta não preencheu RPE e duração: dado medido
   tem prioridade sobre dado estimado, sempre. */
function rpeDeFC(fcMedia,fcRepouso,idade){
  if(fcMedia==null)return null;
  const fcMax=208-0.7*(idade||40);                 /* Tanaka */
  const rep=(fcRepouso!=null&&fcRepouso>30)?fcRepouso:60;
  const reserva=fcMax-rep; if(reserva<=0)return null;
  const pct=(fcMedia-rep)/reserva;
  return Math.max(1,Math.min(10,Math.round(pct*100)/10));

function loadGarminDia(g,idade){
  if(!g||!g.ativDur)return null;
  const rpe=rpeDeFC(g.ativFc,g.fc,idade);

  return {load:Math.round(g.ativDur*rpe),dur:g.ativDur,rpe,fc:g.ativFc};

function diasComCargaInformada(){
  const m={};

  for(const s of ((S.pro&&S.pro.seco)||[]))if(s.rpe!=null&&s.dur)m[s.data]=true;

function idadeDoUsuario(){ try{ return (typeof anos==='function'&&S.u)?anos(S.u):null; }catch(_){ return null; } }

   sessão dividida por 4: a semana sendo comparada consigo mesma. O primeiro
   treino da vida do atleta virava alarme de excesso de carga — ao lado de um
   "cobertura dos dados 3%" que o próprio app escrevia.
   A razão só diz algo quando existe carga ANTES da semana corrente. Seis dias
   com carga nos 21 dias anteriores (≈ 2 por semana) é o mínimo assumido aqui;

function fadigaCarga(){

function normalizarExercicio(nome){
  const n=(nome||'').toLowerCase().trim();
  if(n)for(const[id,def]of EXERCICIOS)if(def.rx.test(n))return{idExercicio:id,nomeCanonico:def.nome,grupoMuscular:def.grupo};
  return{idExercicio:null,nomeCanonico:null,grupoMuscular:null};
}
/* e-1RM estimado (NÃO é força máxima medida). Epley + Brzycki, 1–10 reps. */
function estimarE1RM(carga,reps){
  if(carga==null||!(carga>0)||reps==null||reps<1||reps>10)return{valor:null,metodo:null,carga,reps,confianca:0};
  if(reps===1)return{valor:Math.round(carga),metodo:'direto (1RM)',carga,reps,confianca:1};
  const epley=carga*(1+reps/30), brzycki=carga*36/(37-reps);
  return{valor:Math.round((epley+brzycki)/2),metodo:'Epley+Brzycki',carga,reps,confianca:reps<=6?0.9:reps<=8?0.8:0.7}; // apresentação em kg inteiro
}
/* Interpreta a ficha de força. Carga SÓ entra nos cálculos com unidade explícita
   de kg. Número solto (ex.: "Supino 4x8 60") vira `cargaAmbigua` e NÃO conta em
   tonelagem/e-1RM (fica guardado para confirmação futura). Descanso/pausa nunca é
   carga. Reps em segundos (prancha) = isométrico → sem carga e tonelagem 0.
   Mantém campos antigos (ex/ton). */
function parseForca(txt){
  if(!txt)return{itens:[],tonelagem:0};
  const itens=[]; let ton=0;
  for(let ln of String(txt).split(/\n|;/)){
    ln=ln.trim(); if(!ln)continue;
    const m=ln.match(/(\d{1,2})\s*[x×]\s*(\d{1,3})/i); if(!m)continue;
    const series=+m[1], reps=+m[2], resto=ln.slice(m.index+m[0].length);
    const tempoReps=/^\s*(s|seg|segundos|"|”)\b/i.test(resto)||/^\s*(s|seg)/i.test(resto);  // reps em segundos → isométrico
    let carga=null, unidade=null, cargaAmbigua=null;
    if(!tempoReps){
      const semSR=ln.replace(m[0],' ');
      const mkg=semSR.match(/(\d{1,3}(?:[.,]\d{1,2})?)\s*kg\b/i);
      if(mkg){carga=parseFloat(mkg[1].replace(',','.'));unidade='kg';}
      else{
        const limpo=semSR
          .replace(/\b(descanso|pausa|desc\.?|rest|intervalo|int\.?|sa[íi]da|pace)\b\D{0,4}\d{1,3}\s*(s|seg|min|'|"|”)?/ig,' ')
          .replace(/\d{1,3}\s*(s|seg|min|'|"|”)\b/ig,' ');   // remove qualquer tempo restante
        const mnum=limpo.match(/(\d{1,3}(?:[.,]\d{1,2})?)/);
        if(mnum)cargaAmbigua=parseFloat(mnum[1].replace(',','.'));   // guardado, NÃO entra nos cálculos
      }
    }
    const norm=normalizarExercicio(ln.slice(0,m.index));
    const nomeOriginal=ln.slice(0,m.index).replace(/[-–:]+$/,'').trim()||'exercício';
    const tonI=(carga!=null&&!tempoReps)?series*reps*carga:0; ton+=tonI;
    const e1=estimarE1RM(carga,reps);
    itens.push({idExercicio:norm.idExercicio,nomeOriginal,nomeCanonico:norm.nomeCanonico,grupoMuscular:norm.grupoMuscular,
      series,reps,carga,unidade,cargaAmbigua,tonelagem:Math.round(tonI),e1rm:e1.valor,confianca:carga!=null?0.9:0,
      ex:nomeOriginal,ton:Math.round(tonI)});   // compat
  }
  return{itens,tonelagem:Math.round(ton)};
}
/* itens de força de uma sessão: usa os estruturados salvos, ou reprocessa a ficha
   (compatibilidade com sessões antigas sem `exercicios`). */
function itensForca(s){
  if(s&&Array.isArray(s.exercicios)&&s.exercicios.length)return s.exercicios;
  return parseForca((s&&(s.transcricao||s.texto||s.obs))||'').itens;
}
function tonForcaSessao(s){
  if(s&&s.cargaEstruturada&&s.cargaEstruturada.tonelagem!=null)return s.cargaEstruturada.tonelagem;
  return itensForca(s).reduce((a,i)=>a+(i.tonelagem||i.ton||0),0);
}
function tonelagem(dias){
  dias=dias||28; const h0=new Date(hoje()+'T00:00:00');
  const dentro=d=>{const x=(h0-new Date(d+'T00:00:00'))/86400000;return x>=0&&x<dias;};
  let total=0,n=0;
  for(const s of ((S.pro&&S.pro.seco)||[])){ if(!s.data||!dentro(s.data))continue;
    const t=tonForcaSessao(s); if(t>0){total+=t;n++;} }
  return total>0?{total:Math.round(total),sessoes:n}:null;
}
/* ── HISTÓRICO E PROGRESSÃO DE FORÇA (por exercício canônico) ────────────────*/
const med=a=>{const s=[...a].filter(x=>x!=null).sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):null;};
/* Tendência ROBUSTA pela série temporal: mediana da 1ª metade vs 2ª metade.
   Precisa de ≥3 sessões, senão "insuficiente". Sem machine learning. */
function tendenciaForca(vals){
  const v=vals.filter(x=>x!=null); if(v.length<3)return{dir:'insuficiente',pct:null};
  const mid=Math.floor(v.length/2);
  const a=med(v.slice(0,mid)), b=med(v.slice(mid));
  const pct=a?(b-a)/Math.abs(a)*100:0;
  return{dir:pct>3?'↑':pct<-3?'↓':'→',pct:+pct.toFixed(1)};
}
const confRotulo=n=>n>=5?'alta':n>=3?'média':'baixa';
function historicoForcaExercicio(pro,idExercicio,dias){
  dias=dias||90; const h0=new Date(hoje()+'T00:00:00');
  const dentro=d=>{const x=(h0-new Date(d+'T00:00:00'))/86400000;return x>=0&&x<dias;};
  const secos=[...((pro&&pro.seco)||[])].filter(s=>s.data&&dentro(s.data)).sort((a,b)=>a.data.localeCompare(b.data));
  const sessoes=[]; let nome=null;
  for(const s of secos){
    const its=itensForca(s).filter(i=>i.idExercicio===idExercicio&&i.carga!=null);
    if(!its.length)continue;
    nome=nome||its[0].nomeCanonico;
    const melhor=its.slice().sort((a,b)=>(b.e1rm||0)-(a.e1rm||0)||(b.carga||0)-(a.carga||0))[0];
    sessoes.push({data:s.data,carga:melhor.carga,reps:melhor.reps,series:its.reduce((a,i)=>a+(i.series||0),0),
      tonelagem:Math.round(its.reduce((a,i)=>a+(i.tonelagem||0),0)),
      e1rm:melhor.e1rm!=null?melhor.e1rm:(estimarE1RM(melhor.carga,melhor.reps).valor)});
  }
  if(!sessoes.length)return null;
  const cargas=sessoes.map(x=>x.carga), e1s=sessoes.map(x=>x.e1rm).filter(x=>x!=null);
  const tend=tendenciaForca(sessoes.map(x=>x.e1rm));
  return {exercicio:nome,idExercicio,sessoes,
    melhorE1RM:e1s.length?Math.max(...e1s):null, e1RMRecente:e1s.length?e1s[e1s.length-1]:null,
    e1RMInicial:e1s.length?e1s[0]:null, melhorCarga:Math.max(...cargas), ultimaCarga:cargas[cargas.length-1],
    tendencia:tend.dir, tendenciaPct:tend.pct, confianca:Math.min(1,sessoes.length/5), confiancaRotulo:confRotulo(sessoes.length)};
}
function progressaoForca(pro,dias){
  dias=dias||90;
  const ids=new Set();
  const h0=new Date(hoje()+'T00:00:00'), dentro=d=>{const x=(h0-new Date(d+'T00:00:00'))/86400000;return x>=0&&x<dias;};
  for(const s of ((pro&&pro.seco)||[])){ if(!s.data||!dentro(s.data))continue;
    for(const i of itensForca(s))if(i.idExercicio&&i.carga!=null)ids.add(i.idExercicio); }
  const exercicios=[];
  for(const id of ids){
    const h=historicoForcaExercicio(pro,id,dias); if(!h||h.sessoes.length<2)continue;
    const a=h.sessoes[0], b=h.sessoes[h.sessoes.length-1];
    const pct=(x,y)=>x&&y!=null?+((y-x)/Math.abs(x)*100).toFixed(1):null;
    exercicios.push({idExercicio:id,nome:h.exercicio,nSessoes:h.sessoes.length,
      inicio:{data:a.data,carga:a.carga,e1rm:a.e1rm}, atual:{data:b.data,carga:b.carga,e1rm:b.e1rm},
      e1RMInicial:h.e1RMInicial, e1RMRecente:h.e1RMRecente, melhorE1RM:h.melhorE1RM,
      variacaoPct:pct(h.e1RMInicial,h.e1RMRecente),
      delta:{cargaPct:pct(a.carga,b.carga),e1rmPct:pct(h.e1RMInicial,h.e1RMRecente),tonelagemPct:pct(a.tonelagem,b.tonelagem)},
      tendencia:h.tendencia, tendenciaPct:h.tendenciaPct, confianca:h.confianca, confiancaRotulo:h.confiancaRotulo});
  }
  return {exercicios:exercicios.sort((x,y)=>(y.variacaoPct||-999)-(x.variacaoPct||-999)), dias};
}
function cardEvolucaoForca(pro){
  const p=progressaoForca(pro,90); if(!p.exercicios.length)return'';
  const seta=d=>d==='↑'?'↑':d==='↓'?'↓':d==='→'?'→':'—';
  const linhas=p.exercicios.map(e=>{const v=e.variacaoPct, cor=v>0?'var(--ok)':v<0?'var(--clock)':'var(--ink-2)';
    const tcor=e.tendencia==='↑'?'var(--ok)':e.tendencia==='↓'?'var(--clock)':'var(--ink-2)';
    return`<div style="border-top:1px solid var(--line);padding:9px 0">
      <div class="row" style="justify-content:space-between;align-items:baseline"><b>${esc(e.nome)}</b>
        <span class="xs muted">${e.nSessoes} sessão(ões) · ${p.dias} dias</span></div>
      <div class="row" style="justify-content:space-between;align-items:baseline;margin-top:3px">
        <span class="n">e-1RM <b>${e.e1RMInicial!=null?e.e1RMInicial:'—'} → ${e.e1RMRecente!=null?e.e1RMRecente:'—'} kg</b> <span class="xs muted">· melhor ${e.melhorE1RM!=null?e.melhorE1RM:'—'} kg</span></span>
        <span class="n" style="font-weight:700;color:${cor}">${v>0?'+':''}${v!=null?v+'%':'—'}</span></div>
      <div class="xs muted" style="margin-top:3px">tendência <span style="color:${tcor};font-weight:700">${e.tendencia==='insuficiente'?'insuficiente':seta(e.tendencia)}</span> · confiança ${e.confiancaRotulo}</div></div>`;}).join('');
  /* Cabeçalho: sessões e exercícios primeiro; TONELAGEM como dado secundário.
     Tonelagem é volume, não força — sobe só por fazer mais séries, e sozinha
     já sugeriu progresso onde a carga não tinha mudado. */
  const nSes=((pro.seco||[]).filter(s=>{const h=new Date(hoje()+'T00:00:00');
    const x=(h-new Date((s.data||'')+'T00:00:00'))/86400000;
    return x>=0&&x<p.dias&&(typeof tonForcaSessao==='function')&&tonForcaSessao(s)>0;})).length;
  const ton=(typeof tonelagem==='function')?tonelagem(p.dias):null;
  const subindo=p.exercicios.filter(e=>e.tendencia==='↑').length;
  const caindo=p.exercicios.filter(e=>e.tendencia==='↓').length;
  return`<div class="card" data-dom="corpo" id="c-forca"><div class="eyebrow">evolução de força</div>
    <div class="grid3" style="margin-top:8px">
      <div class="kpi"><div class="v">${nSes}</div><div class="l">sessões (${p.dias}d)</div></div>
      <div class="kpi"><div class="v">${p.exercicios.length}</div><div class="l">exercícios</div></div>
      <div class="kpi"><div class="v" style="${subindo>caindo?'color:var(--ok)':caindo>subindo?'color:var(--clock)':''}">${subindo}↑ ${caindo}↓</div><div class="l">tendência</div></div>
    </div>
    <div class="small muted" style="margin:8px 0 4px">Progresso por exercício. e-1RM = 1RM <b>estimado</b> (Epley+Brzycki), não medido. Sem ranking entre exercícios diferentes.</div>
    ${linhas}
    ${ton&&ton.total?`<div class="xs muted" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)"><b>Tonelagem no período:</b> ${(ton.total/1000).toFixed(1)} t em ${ton.sessoes} sessão(ões) <span style="opacity:.8">— dado secundário. Tonelagem é volume, não força: ela sobe só por você fazer mais séries, com a mesma carga.</span></div>`:''}
    ${cardForcaPerformance(pro,p)}
    <div class="xs muted" style="margin-top:8px">Tendência = mediana da 1ª metade vs 2ª metade das sessões (precisa de ≥3). Registre a ficha com as cargas em <b>kg</b> para acompanhar.</div>
  </div>`;
}
/* ── FORÇA × PERFORMANCE ───────────────────────────────────────────────────
   Só aparece com dado suficiente dos DOIS lados, e descreve CO-OCORRÊNCIA —
   nunca causa. Força subindo junto com %PB subindo pode ser a força, pode ser
   o taper, pode ser os dois, pode ser nenhum: um app que mede carga e tempo
   não tem como separar isso, e dizer "a força melhorou o seu tempo" seria
   inventar a parte que falta. */
function cardForcaPerformance(pro,p){
  const dias=p.dias||90, h0=new Date(hoje()+'T00:00:00');
  const idade=d=>(h0-new Date((d||'')+'T00:00:00'))/86400000;
  const comF=p.exercicios.filter(e=>e.tendencia==='↑'||e.tendencia==='↓'||e.tendencia==='→');
  if(comF.length<2)return'';
  const esf=(ESF||[]).filter(e=>e.pct==null?false:true);
  /* %PB por metade do período, dos tiros fortes */
  const pts=((typeof ESF!=='undefined'&&ESF)||[]).map(e=>{const pb=pbDe(pro,e.dist,e.estilo,e.pis);
    return pb?{d:idade(e.data),pct:pb/e.tempo*100}:null}).filter(x=>x&&x.d>=0&&x.d<dias);
  if(pts.length<6)return'';
  const meio=dias/2;
  const velha=pts.filter(x=>x.d>=meio), nova=pts.filter(x=>x.d<meio);
  if(velha.length<3||nova.length<3)return'';
  const md=a=>a.reduce((t,x)=>t+x.pct,0)/a.length;
  const dPct=+(md(nova)-md(velha)).toFixed(1);
  const subindo=comF.filter(e=>e.tendencia==='↑').length, caindo=comF.filter(e=>e.tendencia==='↓').length;
  const dirF=subindo>caindo?'subiu':caindo>subindo?'caiu':'ficou estável';
  const dirP=dPct>0.8?'subiu':dPct<-0.8?'caiu':'ficou estável';
  const junto=(dirF===dirP&&dirF!=='ficou estável');
  return`<div class="note" style="margin-top:10px">
    <b>Força × performance (${dias}d):</b> a força ${dirF} (${subindo}↑ / ${caindo}↓ entre ${comF.length} exercícios) e o seu %PB nos tiros ${dirP} (${dPct>0?'+':''}${dPct} pontos entre a 1ª e a 2ª metade do período).
    ${junto?' As duas coisas andaram <b>no mesmo sentido</b>.':' As duas <b>não</b> andaram no mesmo sentido.'}
    <span class="xs muted" style="display:block;margin-top:4px">Isto é co-ocorrência observada, não causa: taper, volume na água, sono e idade entram na mesma conta e o app não consegue separá-los. ${pts.length} tiro(s) e ${comF.length} exercício(s) na janela.</span></div>`;
}
