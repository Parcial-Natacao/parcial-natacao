   `25m peito forte / 10" parado / 25m peito forte`. Lemos cada pedaço e ficamos
   com os que COMEÇAM por uma distância — o do meio, sem distância, é a pausa.
   A distância tem que estar logo no início do pedaço (só pontuação ou emoji
   antes dela): no fim da linha dele ainda vem "...tempos dos dois 25m
   separadamente", e esse 25 não é um trecho, é instrução. */
function trechosDaLinha(l){
  /* tira um rótulo na frente ("Broken 100: 50m forte / ...") — sem isso o
     primeiro trecho some, porque ele deixa de ser o começo do pedaço. Começar
     por LETRA é o que separa um rótulo de um tempo como "1:10". */
  const out=[]; let desc=null;
  const txt=String(l||'').replace(/^\s*[A-Za-zÀ-ÿ][^:/]{0,40}:\s*/,'');
  for(const s of txt.split('/')){
    const md=s.match(/^\s*(?:[^\w\s]\s*)*(\d{2,4})\s*(m\b|mts?\b|metros)?/i);
    const d=md?+md[1]:null;
    if(d&&(md[2]||(d>=25&&d%25===0))){out.push(d);continue}
    /* pedaço sem distância = o descanso ("10" parado", "10\" de pausa") */
    const mp=s.match(/(\d{1,3})\s*(?:["″]|s\b|seg)/i);
    if(mp&&desc==null)desc=+mp[1];

function parseBroken(l,tit){
  const txt=String(l||''), cab=String(tit||'');
  const re=/\b(broken|quebrad[oa]s?)\b/i;
  if(!re.test(txt)&&!re.test(cab))return null;
  const rx=/(\d{1,2})\s*[x×]\s*(?:broken|quebrad)/i;
  const mr=txt.match(rx)||cab.match(rx);
  const rodadas=mr?Math.min(+mr[1],12):1;

  let dist=null,trechos=null,desc=seg.desc,viaSegmentos=false;
  /* 1) estrutura explícita "4x25", desde que os trechos somem uma prova */
  const me=txt.match(/(\d{1,2})\s*[x×]\s*(\d{2,4})/);
  if(me&&+me[1]>=2&&+me[1]<=8&&PROVAS_BK.includes((+me[1])*(+me[2]))){
    dist=(+me[1])*(+me[2]); trechos=Array(+me[1]).fill(+me[2]);
  }
  /* 2) trechos escritos um a um */
  if(!trechos&&seg.trechos.length>=2&&seg.trechos.length<=8){
    const s=seg.trechos.reduce((a,b)=>a+b,0);
    if(PROVAS_BK.includes(s)){trechos=seg.trechos;dist=s;viaSegmentos=true}
  }
  /* 3) só "broken 100": divisão padrão */
  if(!trechos){
    const nums=[...txt.matchAll(/(\d{2,4})/g),...cab.matchAll(/(\d{2,4})/g)].map(m=>+m[1]);
    const d=nums.find(n=>PROVAS_BK.includes(n));
    if(d){const tr=BROKEN_PADRAO[d]||Math.round(d/4), n=Math.round(d/tr);
      if(n>=2&&n<=8){dist=d;trechos=Array(n).fill(tr)}}
  }
  if(!trechos)return null;
  /* a pausa do broken é em SEGUNDOS. "c/5' entre cada bloco" é o intervalo
     entre as rodadas, em minutos — ler aquele 5 como descanso daria 5s. */
  if(desc==null){const md=txt.match(/(?:desc(?:anso)?|pausa|rest)\s*(?:de\s*)?(\d{1,3})\s*(['′]|min\b)?/i);
    if(md&&!md[2])desc=+md[1];}
  /* a pausa também vem escrita ao contrário: "10" de pausa" */
  if(desc==null){const mp=txt.match(/(\d{1,3})\s*["″]\s*(?:de\s*)?(?:pausa|descanso|parad)/i); if(mp)desc=+mp[1];}
  /* Se a palavra "broken" está SÓ no título do bloco, ela vale para o bloco,
     não para cada linha dele: um "4x25 progressivo" ali dentro somaria 100 e
     viraria broken de 100 por tabela. Então a linha tem que trazer a própria
     prova — os trechos escritos um a um, ou uma pausa curta explícita. */
  if(!re.test(txt)&&!viaSegmentos&&desc==null)return null;
  const unif=trechos.every(x=>x===trechos[0]);
  return {dist,trechos,n:trechos.length,trecho:unif?trechos[0]:null,desc:desc==null?10:desc,rodadas};
}
function linhaParaItem(l,tit){
  const bk=parseBroken(l,tit);
  if(bk){
    let estilo='livre'; for(const[re,v]of ESTILOS){if(re.test(l)){estilo=v;break}}
    const tags=[]; for(const[re,v]of RECURSOS){if(re.test(l))tags.push(v)}
    const rod=bk.rodadas||1;   /* "3x BROKEN" vale no título do bloco também */
    return{id:uid(),rodadas:rod,reps:1,dist:bk.dist,estilo,tags,intervalo:null,
      pausa:bk.desc*1000,broken:bk,parcial:false,forte:true,obs:'',texto:l,vol:rod*bk.dist};
  }
  let rodadas=1,reps=1,dist=null;
  /* série dupla: "2x 4x50" → 2 rodadas de 4×50 */
  const m2=l.match(/(\d{1,2})\s*[x×]\s*(\d{1,3})\s*[x×]\s*(\d{2,5})/i);
  const mx=l.match(/(\d{1,3})\s*[x×]\s*(\d{2,5})/i);
  if(m2){rodadas=Math.min(+m2[1],12)||1;reps=+m2[2];dist=+m2[3]}
  else if(mx){reps=+mx[1];dist=+mx[2]}
  else{const md=l.match(/(?:^|[^\d.,:'])(\d{2,5})\s*(m\b|mts?\b|metros)?/i); if(md&&+md[1]>=25)dist=+md[1];else return null}
  if(!dist||dist<20)return null;
  let estilo='livre'; for(const[re,v]of ESTILOS){if(re.test(l)){estilo=v;break}}
  const tags=[]; for(const[re,v]of RECURSOS){if(re.test(l))tags.push(v)}
  let intervalo=null;
  const mi=l.match(/(?:sa[íi]da|int\.?|s\/|@|c\/)\s*(\d{1,2})\s*[:'′h]\s*(\d{2})/i)||l.match(/(\d{1,2})\s*[:'′h]\s*(\d{2})(?!\d)/);
  if(mi)intervalo=(+mi[1]*60+ +mi[2])*1000;
  const forte=/máxim|maxim|all\s*out|tiro|forte|sprint|ritmo de prova|\brp\b|9[0-9]\s*%|100\s*%/i.test(l);
  const parcial=/parcia|broken|quebrad|25\s*a\s*25|split/i.test(l)||(forte&&dist>=50&&dist<=100);
  const mo=l.match(/\(([^)]+)\)/); const obs=mo?mo[1].trim():'';
  return{id:uid(),rodadas,reps,dist,estilo,tags,intervalo,pausa:parsePausa(l),parcial,forte,obs,texto:l,vol:rodadas*reps*dist};
}
const volTreino=t=>(t.blocos||[]).reduce((a,b)=>a+b.itens.reduce((x,i)=>x+i.vol,0),0);
const piscinaLabel=p=>p==='AA'?'águas abertas':p==='LC50'?'piscina 50m':'piscina 25m';
/* aplica as regras de parcial de 25m conforme o tipo de treino:
   - águas abertas: sem parcial (usa ritmo /100m);
   - piscina 25m: mantém a parcial detectada nos tiros, se o técnico quiser;
   - piscina 50m: só nos tiros da SÉRIE PRINCIPAL, e só se o técnico quiser. */
function aplicarParciais(blocos,piscina,parcial25){
  const principalRe=/principal|série|serie|main|conjunto/i;
  for(const b of blocos){
    const ehPrincipal=principalRe.test(b.titulo||'');
    for(const it of b.itens){
      if(piscina==='AA')it.parcial=false;
      else if(piscina==='LC50')it.parcial=!!(it.parcial&&parcial25&&ehPrincipal);
      else it.parcial=!!(it.parcial&&parcial25);
    }
  }
}

/* =====================================================================
   MARCAS E ZONAS
   ===================================================================== */
const pbKey=(d,e,p)=>`${d} ${e} ${p||'SC25'}`;
/* `pis` é opcional e MUDA a resposta: o PB da piscina em que o esforço foi
   nadado é o único denominador comparável. Sem ele, um tiro de 50 m numa
   piscina de 25 m (uma virada) era dividido pelo melhor PB de qualquer
   piscina — às vezes o de 50 m, que não tem virada nenhuma — e o %PB saía
   sistematicamente distorcido para um dos lados. Quando não existe PB na
   piscina do esforço, voltamos ao melhor disponível, que é melhor que nada. */
function pbDe(dados,dist,estilo,pis){
  if(!dados)return null;
  const p=dados.pbs||{};
  if(pis&&p[`${dist} ${estilo} ${pis}`]!=null)return p[`${dist} ${estilo} ${pis}`];
  const c=Object.entries(p).filter(([k])=>{const[d,e]=k.split(' ');return +d===dist&&e===estilo}).map(([,v])=>v);
  if(c.length)return Math.min(...c);
  const p50=Object.entries(p).find(([k])=>k.startsWith(`50 ${estilo}`));
  if(p50&&dist>=25){const b=p50[1];
    if(dist===25)return b*.465; if(dist===100)return b*2.22; if(dist===200)return b*4.75;
    return b*(dist/50)*1.06}
  return null;
}
/* Zonas por %PB (velocidade relativa ao seu melhor tempo — é o que o app mede).
   Aproxima as zonas aeróbias A1/A2/A3 (base→ritmo→potência) e o ritmo de prova.
   Os cortes de %PB podem ser calibrados. */
function zona(p){ if(p==null)return null;
  if(p>=96)return{n:'ritmo de prova',c:'z4',dsc:'sprint / velocidade máxima'};
  if(p>=90)return{n:'A3',c:'z3',dsc:'potência aeróbica (perto do limiar)'};
  if(p>=84)return{n:'A2',c:'z2',dsc:'ritmo (aeróbico médio)'};
  return{n:'A1',c:'z1',dsc:'base aeróbica (leve)'} }
const ZONAS_INFO='Zonas por velocidade (%PB): A1 base aeróbica (leve) · A2 ritmo · A3 potência aeróbica (perto do limiar) · ritmo de prova = sprint. %PB = seu tempo em relação ao seu melhor — quanto mais perto de 100%, mais rápido.';

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
/* rola até o treino de hoje na primeira montagem da lista */
let _rolarHoje=false;
function _irAteHoje(){
  if(!_rolarHoje)return; _rolarHoje=false;
  setTimeout(()=>{
    const h=hoje();
    let el=document.querySelector(`[data-dia="${h}"]`);
    if(!el){ /* sem treino hoje: vai para o mais próximo já passado */
      const todos=[...document.querySelectorAll('[data-dia]')].filter(x=>x.dataset.dia&&x.dataset.dia<=h);
      el=todos[0];
    }
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
  },90);
}
/* agrupa treinos por Ano → Mês, com mês recolhível (o mais recente já aberto) */
function grupoTreinos(lista,cardFn){
  if(!lista.length)return'';
  const ord=[...lista].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  /* Abre no MÊS DE HOJE, não no do treino mais recente: como os treinos são
     lançados com antecedência, o app abria num mês futuro (ex.: outubro no dia
     27/09). Sem treino no mês atual, cai no mês mais recente ATÉ hoje. */
  if(S.mesAberto==null){
    const h=hoje(), mesHoje=h.slice(0,7);
    const temNoMes=ord.some(t=>(t.data||'').slice(0,7)===mesHoje);
    const passado=ord.find(t=>(t.data||'')<=h);
    const alvo=temNoMes?mesHoje:((passado&&passado.data.slice(0,7))||(ord[0].data||'').slice(0,7));
    S.mesAberto={[alvo]:true};
    if(temNoMes)_rolarHoje=true;         /* e leva até o dia de hoje */
  }
  const anos={};
  for(const t of ord){ const y=(t.data||'').slice(0,4)||'—',m=(t.data||'').slice(5,7)||'--';
    (anos[y]=anos[y]||{}); (anos[y][m]=anos[y][m]||[]).push(t); }
  let html='';
  for(const y of Object.keys(anos).sort((a,b)=>b.localeCompare(a))){
    html+=`<div class="blk" style="margin-top:14px"><h3>${y}</h3><div class="ln"></div></div>`;
    for(const m of Object.keys(anos[y]).sort((a,b)=>b.localeCompare(a))){
      const key=y+'-'+m, arr=anos[y][m], aberto=!!S.mesAberto[key];
      html+=`<button class="card tight lst" style="width:100%;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--deck)" onclick="S.mesAberto=Object.assign({},S.mesAberto,{'${key}':${!aberto}});render()">
        <span class="grow" style="text-align:left"><b style="text-transform:capitalize">${MESES[+m-1]||m}</b> <span class="xs muted">· ${arr.length} treino${arr.length>1?'s':''}</span></span>
        <span class="tag o">${aberto?'▲ recolher':'▼ ver'}</span></button>`;
      /* o extrato do mes entra aqui, recolhido: a aba e consultada todo dia
         para ver o treino de hoje, e um painel analitico aberto no topo
         viraria ruido diario */
      if(aberto)html+=botaoExtrato(key)+arr.map(t=>`<div data-dia="${t.data||''}">${cardFn(t)}</div>`).join('');
    }
  }
  return html;
}
/* Calendário mês a mês (visão do técnico): marca os dias com treino; tocar no dia
   abre os treinos daquele dia. Mais organizado que a lista longa. */
function calendarioTreinos(lista,cardFn,criarFn){
  const porDia={}; for(const t of lista){const d=t.data||''; if(d)(porDia[d]=porDia[d]||[]).push(t);}
  if(!S.calYM){S.calYM=(lista.length?[...lista].sort((a,b)=>(b.data||'').localeCompare(a.data||''))[0].data:hoje()).slice(0,7);}
  const Y=+S.calYM.slice(0,4), M=+S.calYM.slice(5,7);
  const inicioSemana=new Date(Y,M-1,1).getDay(), diasNoMes=new Date(Y,M,0).getDate(), hj=hoje();
  const nav=dl=>{let y=Y,m=M+dl; if(m<1){m=12;y--} if(m>12){m=1;y++} return y+'-'+String(m).padStart(2,'0');};
  const cell=d=>{const ds=`${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`, arr=porDia[ds]||[], sel=S.calDia===ds, eHoje=ds===hj;
    const bg=sel?'var(--ink)':arr.length?'var(--deck)':'transparent', cor=sel?'var(--deck)':'inherit';
    /* `cal-d` zera o min-height do botão comum (48px). Com aspect-ratio:1 esse
       mínimo virava também a LARGURA, e sete células de 48px somavam 360px num
       espaço de 307 — o calendário saía torto e vazando para fora do cartão. */
    return`<button class="cal-d" onclick="S.calDia='${ds}';render()" style="border-color:${eHoje?'var(--water)':'var(--line)'};background:${bg};color:${cor}">
      <span style="font-size:13px;font-weight:${arr.length?'800':'400'}">${d}</span>
      ${arr.length?`<span style="font-size:8px;line-height:1;color:${sel?'var(--deck)':'var(--water)'}">●${arr.length>1?arr.length:''}</span>`:''}</button>`;};
  let cells=''; for(let i=0;i<inicioSemana;i++)cells+='<div></div>'; for(let d=1;d<=diasNoMes;d++)cells+=cell(d);
  const doDia=S.calDia?(porDia[S.calDia]||[]):null;
  return`<div class="card">
    <div class="row" style="align-items:center;margin-bottom:10px">
      <button class="sm ghost" onclick="S.calYM='${nav(-1)}';S.calDia=null;render()">‹</button>
      <div class="grow" style="text-align:center;font-weight:800;text-transform:capitalize">${MESES[M-1]} ${Y}</div>
      <button class="sm ghost" onclick="S.calYM='${nav(1)}';S.calDia=null;render()">›</button></div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:10px;color:var(--ink-2);margin-bottom:5px">${['dom','seg','ter','qua','qui','sex','sáb'].map(n=>`<div>${n}</div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div></div>
  ${/* O extrato mora AQUI, preso ao mes que o calendario esta mostrando: e
       esta a vista padrao, e e nela que o atleta navega mes a mes. Botei na
       lista primeiro e ele ficou invisivel para quem nunca troca de vista. */''}
  ${botaoExtrato(S.calYM)}
  ${S.calDia?`<div class="blk" style="margin-top:12px"><h3 style="text-transform:capitalize">${brData(S.calDia)}</h3><div class="ln"></div></div>
    ${doDia.length?doDia.map(cardFn).join(''):`<div class="small muted" style="margin:10px 0;text-align:center">Nenhum treino nesse dia.${criarFn?`<br><button class="sm ghost" style="margin-top:6px" onclick="${criarFn}('${S.calDia}')">+ Adicionar treino nesse dia</button>`:''}</div>`}`
    :`<div class="small muted" style="margin-top:12px;text-align:center">Toque num dia para ver os treinos.</div>`}`;
}

/* nº de rodadas EFETIVO: do interpretador (item.rodadas) OU adicionadas à mão

function nRodadas(item,rec,bk){ return Math.max((rec&&rec.nrd)||1,(item&&item.rodadas)||1,(bk&&bk.rodadas)||1,1); }
/* tempos de um item (achata rodadas quando há mais de uma) */
function temposItem(rec,item){

function linhaSerie(t,i,at,blocoSolto,tituloBloco){

  const aa=t.piscina==='AA';
  const bkLinha=aa?null:brokenDe(i,rec,tituloBloco);
  const nrd=nRodadas(i,rec,bkLinha), multi=nrd>1&&!aa;
  const rds=multi?Array.from({length:nrd},(_,k)=>(rec.rd&&rec.rd[k])||{tempos:[],parciais:[]}):null;
  /* sem botão só em NADO SOLTO (aquecimento/soltura contínuo, 1 repetição);
     educativos/técnica e qualquer série com repetições ganham "+". Um esforço cronometrado
     (parcial/forte/simulação) SEMPRE ganha o botão, mesmo se o bloco foi rotulado como solto —
     conserta treinos já salvos com a estrutura de blocos antiga. */
  const semCrono=!!blocoSolto&&(i.reps||1)<=1&&(i.rodadas||1)<=1&&!i.parcial&&!i.forte;

  const med=ts.length?ts.reduce((a,b)=>a+b,0)/ts.length:null;                /* %PB da SÉRIE = média dos tiros */
  const pbSerie=dadosPB?(pbDe(dadosPB,bkSerie?bkSerie.dist:i.dist,i.estilo)||0):0;

    ? (rec.ritmo100!=null?`<div class="chips"><span class="chip">ritmo /100m · ${fmt(rec.ritmo100,true)}</span></div>`:'')
    : bkSerie
      /* o destaque é o tempo da prova; os trechos ficam ao lado, menores */
      ? (()=>{const bkI=bkSerie, rr=multi?rds:[rec];

            const s=tempoBroken(r,bkI.n); if(s==null)return'';

      ? rds.map((r,ri)=>(r.tempos||[]).some(x=>x!=null)?`<div class="chips" style="margin-top:4px"><span class="chip" style="background:var(--deck);font-weight:800">R${ri+1}</span>${(r.tempos||[]).map((x,ix)=>{ if(x==null)return''; const pa=r.parciais&&r.parciais[ix]; const extra=Array.isArray(pa)?` <span style="color:var(--water)">(${pa.map((v,k)=>v==null?'—':fmt(k===0?v:v-pa[k-1],true)).join(' · ')})</span>`:''; return`<span class="chip ${x===mel?'best':''}">${fmt(x,true)}${extra}</span>`;}).join('')}</div>`:'').join('')
      : (ts.length?`<div class="chips">${(rec.tempos||[]).map((x,ix)=>{ if(x==null)return'';
        const pa=rec.parciais&&rec.parciais[ix];
        const extra=Array.isArray(pa)
          ? ` <span style="color:var(--water)">(${pa.map((v,k)=>v==null?'—':fmt(k===0?v:v-pa[k-1],true)).join(' · ')})</span>`
          : (i.parcial&&pa!=null?` <span style="color:var(--water)">(${fmt(pa,true)}+${fmt(x-pa,true)})</span>`:'');
        return`<span class="chip ${x===mel?'best':''}">${ix+1}· ${fmt(x,true)}${extra}</span>`;}).join('')}</div>`:'');
  return`<div class="item ${logged?'sel':''}">
    <div class="row" style="align-items:baseline;flex-wrap:wrap;gap:6px">
      <span class="grow" style="min-width:58%"><b>${esc(i.texto||((i.rodadas>1?i.rodadas+'x ':'')+(i.reps>1?i.reps+'×':'')+i.dist+' '+i.estilo))}</b></span>
      ${z?`<span class="z ${z.c}" title="${pct.toFixed(0)}% do PB de ${bkSerie?bkSerie.dist:i.dist}m — média ${bkSerie?`dos ${ts.length} broken(s)`:`dos ${ts.length} tiro(s) da série`}${pctMel?` · melhor ${pctMel.toFixed(0)}%`:''}">${pct.toFixed(0)}%</span>`:''}

/* tabela de repetições com ✓/✕ por linha (rd=null série simples; número = rodada) */
/* ── PASSAGEM SOB DEMANDA ───────────────────────────────────────────────────
   A coluna da passagem só aparecia quando o TÉCNICO tinha ligado as parciais
   no treino inteiro (`item.parcial`). Num 1×100 em A3 o atleta anotava só o
   tempo final — e a passagem dos primeiros 50 é o dado que diz como foi a
   prova: com ela e o total, o app calcula a segunda metade e o desequilíbrio.
   Agora o próprio atleta liga a passagem naquele tiro, sem depender de
   ninguém, e o relatório passa a ter o que analisar. */
function podeParcialAvulsa(item,piscina){
  return !!(piscina!=='AA'&&item&&item.dist>=100&&item.dist%2===0);
}
function parcialLigada(item,itemId){

}
function alternarParcialAvulsa(itemId,atletaId,rd){

  abrirLancamento(itemId,atletaId,rd==null?undefined:rd);
}
function tabelaReps(item,r,itemId,atletaId,rd){
  const arg=rd==null?'':(','+rd);

        ${cp?`<td><input inputmode="decimal" id="lp${i}" placeholder="—" value="${r.parciais&&r.parciais[i]!=null?fmt(r.parciais[i],true):''}"></td>`:''}
        <td><input inputmode="decimal" id="lt${i}" placeholder="—" value="${r.tempos&&r.tempos[i]!=null?fmt(r.tempos[i],true):''}"></td>
        <td style="white-space:nowrap;text-align:right">

          ${r.tempos&&r.tempos[i]!=null?`<button class="sm" style="background:var(--clock);color:var(--sobre-acento);padding:6px 11px;margin-left:5px;font-weight:800" onclick="delTempo('${itemId}','${atletaId}',${i}${arg})">✕</button>`:''}
        </td></tr>`).join('')}

}
/* ── Lançamento de BROKEN ──────────────────────────────────────────────────
   Um campo por trecho e a SOMA calculada na hora. É a soma que importa: ela é
   o tempo "de prova" simulado, e é com ela que o técnico compara. Cada broken
   repetido é uma RODADA, não um novo item — era isso que obrigava o atleta a
   abrir nove rodadas para um treino só. */
function somaBroken(arr){
  const v=(arr||[]).filter(x=>x!=null);
  return v.length?v.reduce((a,b)=>a+b,0):null;
}
/* Trechos possíveis: têm que dividir a prova em 2 a 8 pedaços. Num broken de
   50 só existe 25; de 100 para cima quem decide é o técnico com o atleta. */
function intervalosBroken(dist){
  /* 2×100 num broken de 200 é quase a prova inteira — não é quebrar, é cortar
     ao meio. Fora isso a divisão em dois vale (num 50 é a única; num 100,
     2×50 é clássico), por isso a regra mira o trecho longo, não o número. */
  return [25,50,100].filter(iv=>iv<dist&&dist%iv===0&&dist/iv>=2&&dist/iv<=8
    &&!(iv>=100&&dist/iv===2));
}
/* Descritor EFETIVO do broken. A ÚNICA fonte é a prescrição; do registro vem
   só a escolha da metragem das parciais (25m ou 50m), que é combinada na beira
   da piscina e não muda o treino que o técnico escreveu.
   Relemos `item.texto` quando `item.broken` não existe porque os blocos ficam
   congelados na publicação: treino salvo ANTES do interpretador de broken
   existir continua com a palavra "broken" no texto, e é justo que valha. */
function brokenDe(item,rec,tit){
  if(!item)return null;
  const bk=item.broken||parseBroken(item.texto||'',tit||'');
  if(!bk)return null;
  const dist=bk.dist||item.dist; if(!dist)return null;
  const opts=intervalosBroken(dist);
  /* a escolha do atleta (25m ou 50m) uniformiza os trechos; sem escolha vale a
     divisão que o técnico escreveu, que pode até ser desigual (50+25+25) */
  const esc=(rec&&rec.bkTrecho&&opts.includes(rec.bkTrecho))?rec.bkTrecho:null;
  let trechos=esc?Array(Math.round(dist/esc)).fill(esc)
    :((bk.trechos&&bk.trechos.length)?bk.trechos.slice():null);
  if(!trechos){ const tr=bk.trecho||opts[0]; if(!tr)return null;
    trechos=Array(Math.round(dist/tr)).fill(tr); }
  if(trechos.length<2||trechos.length>8)return null;
  const unif=trechos.every(x=>x===trechos[0]);
  const desc=(rec&&rec.bkDesc!=null)?rec.bkDesc:(bk.desc||10);
  return {dist,trechos,n:trechos.length,trecho:unif?trechos[0]:null,desc,opts,rodadas:bk.rodadas||1};
}
/* Contexto do item: o título do bloco MAIS as linhas soltas que vêm antes dele
   ali dentro. O "3x BROKEN" aparece nos três lugares conforme o técnico
   escreve — no título ("PRINCIPAL – 3x BROKEN"), numa linha própria logo
   abaixo, ou na própria série — e nos dois primeiros casos a linha da série
   não repete a palavra. Ler só o título deixava o treino do meio de fora.
   Isto roda na LEITURA, então vale para treino já publicado. */
function ctxBloco(b,itemId){
  let s=b.titulo||'';
  for(const i of b.itens||[]){ if(i.id===itemId)break; if(i.nota)s+=' '+(i.texto||''); }
  return s;
}
function ctxDoItem(t,itemId){
  for(const b of (t&&t.blocos)||[])if((b.itens||[]).some(i=>i.id===itemId))return ctxBloco(b,itemId);
  return '';
}
/* Tempo da prova simulada: o que o CRONÔMETRO marcou, se foi anotado; senão a
   soma dos trechos. Os dois quase nunca batem na casa do centésimo — 14.02 +
   16.31 = 30.33 com o relógio marcando 30.29 — e inventar que a soma é a
   verdade seria descartar a única medida direta que existe. */
function tempoBroken(reg,n){
  if(!reg)return null;
  if(reg.tot!=null)return reg.tot;
  return somaBroken((reg.tempos||[]).slice(0,n));
}

/* Trocar a metragem das parciais é decisão do atleta com o técnico, então fica
   no REGISTRO, não no item — o treino continua como foi escrito. Zera os
   trechos porque um broken de 4×25 não vira 2×50 reaproveitando números; o
   tempo TOTAL sobrevive, porque a prova simulada é a mesma. */
async function setTrechoBroken(itemId,atletaId,iv){
  const t=S.treino; if(!t)return;
  const rec=(t.registros?.[atletaId]?.[itemId])||{};
  const tinha=(rec.tempos||[]).some(x=>x!=null)||(rec.rd||[]).some(r=>(r.tempos||[]).some(x=>x!=null));
  if(tinha&&!confirm('Trocar a metragem das parciais apaga os trechos já anotados deste broken (o tempo total fica). Continuar?'))return;
  await mutarRegistro(itemId,atletaId,r=>{ r.bkTrecho=iv; r.tempos=[]; r.parciais=[];
    (r.rd||[]).forEach(x=>{x.tempos=[];x.parciais=[]}); });
  S.rd=S.rd||0; abrirLancamento(itemId,atletaId);
}
/* Tempo lançado ANTES de o app entender o broken ficou como uma rodada por
   TRECHO: seis rodadas de um tempo só, quando na verdade são três brokens de
   dois 25m. O reagrupamento é mecânico, mas o dado é do atleta — então ele vê
   o resultado e confirma, em vez de o app reescrever por conta própria. */
function podeReagrupar(rec,n){
  if(!rec||!rec.rd||!(n>=2))return null;
  const ts=rec.rd.map(r=>(r.tempos||[]).filter(x=>x!=null));
  if(ts.some(x=>x.length!==1))return null;          /* já tem mais de um trecho: nada a fazer */
  if(ts.length<n*2||ts.length%n!==0)return null;    /* tem que fechar em brokens inteiros */
  const pl=ts.map(x=>x[0]), out=[];
  for(let k=0;k<pl.length;k+=n)out.push(pl.slice(k,k+n));
  return out;
}
async function reagruparBroken(itemId,atletaId,confirmado){
  const t=S.treino; if(!t)return;
  const item=(t.blocos.flatMap(b=>b.itens)).find(i=>i.id===itemId); if(!item)return;
  const rec=(t.registros?.[atletaId]?.[itemId])||{};
  const bk=brokenDe(item,rec,ctxDoItem(t,itemId)); if(!bk)return;
  const g=podeReagrupar(rec,bk.n); if(!g)return toast('Não há o que reagrupar aqui');
  if(!confirmado)return sheet(`<h2>Reagrupar os tempos</h2>
    <div class="small muted">${rec.rd.length} rodadas de um tempo só viram <b>${g.length} broken(s)</b> de ${bk.n} trechos, na ordem em que foram lançadas.</div>

  await mutarRegistro(itemId,atletaId,r=>{
    r.rd=g.map(x=>({tempos:x.slice(),parciais:[]})); r.nrd=g.length;

  S.rd=0; toast(`${g.length} broken(s) reagrupado(s)`); abrirLancamento(itemId,atletaId);

/* FALTAVA: não havia como apagar uma rodada criada por engano — só dava para
   limpar os tempos, e a rodada vazia continuava lá para sempre. */
async function apagarRodada(itemId,atletaId,idx){
  const t=S.treino; if(!t)return;
  const rec=(t.registros?.[atletaId]?.[itemId])||{};
  const it=(t.blocos.flatMap(b=>b.itens)).find(i=>i.id===itemId);
  const n=nRodadas(it,rec,brokenDe(it,rec,ctxDoItem(t,itemId)));
  if(n<=1)return toast('Só há uma rodada');
  if(!confirm(`Apagar a rodada ${idx+1} e os tempos dela?`))return;
  await mutarRegistro(itemId,atletaId,r=>{
    const arr=(r.rd||[]).slice(); arr.splice(idx,1);
    if(arr.length<=1){ const u=arr[0]||{tempos:[],parciais:[]};
      r.tempos=u.tempos||[]; r.parciais=u.parciais||[];
      if(u.tot!=null)r.tot=u.tot; else delete r.tot;   /* o total é da rodada, não do item */
      delete r.rd; delete r.nrd; }
    else { r.rd=arr; r.nrd=arr.length; }
  });
  S.rd=Math.max(0,idx-1);
  toast(`Rodada ${idx+1} apagada`); abrirLancamento(itemId,atletaId);
}
/* alteração atômica de um registro, reaproveitando a transação dos tempos */
async function mutarRegistro(itemId,atletaId,fn){
  const trId=S.treino.id;
  /* Cópia do estado ANTES da alteração otimista. Sem isso, quando a transação
     cai no caminho de contingência (offline) o `muta` recebe null e partia do
     S.treino JÁ alterado — aplicando a mudança duas vezes. Gravar tempo
     aguentava (grava o mesmo valor), mas apagar rodada removia duas. */
  const original=JSON.stringify(S.treino);
  const aplicar=base=>{ const t=base||JSON.parse(original);
    t.registros=t.registros||{}; t.registros[atletaId]=t.registros[atletaId]||{};
    const r=t.registros[atletaId][itemId]||{}; fn(r); r.em=Date.now(); r.por=S.u.nome;
    t.registros[atletaId][itemId]=r; t.atualizado=Date.now(); return t; };
  S.treino=aplicar(null);
  const salvo=await transacaoTreinoUsuario(trId,serv=>aplicar(serv||null));
  if(salvo)S.treino=salvo;
}

  /* Confere soma × cronômetro. Diferença de alguns centésimos é cronometragem
     manual e não é erro; acima de 1s por trecho é tempo digitado na linha
     errada, e é melhor o atleta ver isso na hora do que o técnico descobrir

      +(Math.abs(d)>lim?' — confira se algum trecho ficou trocado':'');
}

/* intervalos de parcial válidos p/ uma distância (25/50/100 que dividem e são < dist) */
function intervalosValidos(dist){ return [25,50,100].filter(iv=>iv<dist&&dist%iv===0); }
/* série que aceita parciais por passagem (marcada como parcial, com ao menos 1 intervalo válido) */
function splitElegivel(item,piscina){
  return !!(piscina!=='AA'&&item&&item.parcial&&item.dist>=50&&intervalosValidos(item.dist).length);
}
/* intervalo escolhido: escolha atual (S.splitReg) > inferido do array salvo (dist/nº passagens)
   > padrão (50m se válido, senão o menor válido, ex.: 25m no 50m). */
function intervaloSplit(itemId,item,rec){
  const opts=intervalosValidos(item.dist);
  const pref=S.splitReg&&S.splitReg[itemId];
  if(pref&&opts.includes(pref))return pref;
  const arr=rec&&Array.isArray(rec.parciais)?rec.parciais.find(a=>Array.isArray(a)):null;
  if(arr&&arr.length){ const iv=item.dist/arr.length; if(opts.includes(iv))return iv; }
  return opts.includes(50)?50:opts[0];
}
function setSplitInt(itemId,atletaId,iv){ S.splitReg=S.splitReg||{}; S.splitReg[itemId]=iv; abrirLancamento(itemId,atletaId); }
/* lançamento com parciais por passagem (tempos ACUMULADOS); escolha 50m ou 100m */
function abrirSplits(itemId,atletaId,item,at,rec){
  const reps=item.reps||1, iv=intervaloSplit(itemId,item,rec), np=item.dist/iv;
  const opts=intervalosValidos(item.dist);

  if(S.rd==null||S.rd<0||S.rd>=nrd)S.rd=0;
  /* com rodadas, edita a rodada atual (rec.rd[S.rd]); sem rodadas, o próprio rec */
  const alvo=nrd>1?((rec.rd&&rec.rd[S.rd])||{tempos:[],parciais:[]}):rec;
  const par=(alvo&&Array.isArray(alvo.parciais))?alvo.parciais:[];
  const toggle=opts.length>1?`<div class="eyebrow" style="margin-top:8px">parcial a cada</div><div class="opt" style="margin:6px 0 4px">
    ${opts.map(o=>`<button class="${iv===o?'on':''}" onclick="setSplitInt('${itemId}','${atletaId}',${o})">${o}m</button>`).join('')}</div>`:'';
  const abas=nrd>1?`<div class="row" style="gap:6px;margin:8px 0;flex-wrap:wrap">

  </div>`:'';
  const corpo=Array.from({length:reps},(_,r)=>{
    const arr=(Array.isArray(par[r])&&par[r].length===np)?par[r]:[];   /* só pré-preenche se o intervalo bate */
    const inputs=Array.from({length:np},(_,k)=>`<div class="field" style="margin:0"><label>${(k+1)*iv}m</label>
      <input inputmode="decimal" id="sp_${r}_${k}" placeholder="—" value="${arr[k]!=null?fmt(arr[k],true):''}"></div>`).join('');
    return`${reps>1?`<div class="eyebrow" style="margin-top:12px">repetição ${r+1}</div>`:''}<div class="grid2">${inputs}</div>`;
  }).join('');
  sheet(`<h2>${reps>1?reps+'×':''}${item.dist} ${item.estilo}${nrd>1?' · rodada '+(S.rd+1):''}</h2>
    <div class="small muted">${esc(at.nome)} · parciais a cada ${iv}m${nrd>1?' · '+nrd+' rodadas':''}</div>

    ${abas}
    <div class="xs muted" style="margin-top:6px">Digite o tempo <b>acumulado</b> em cada passagem (como no painel da prova). O último = tempo total. Pode deixar em branco o que não pegou.</div>
    ${corpo}
    <button class="primary full" style="margin-top:12px" onclick="salvarSplits('${itemId}','${atletaId}')">Salvar${nrd>1?' rodada '+(S.rd+1):''}</button>

    ${nrd>1?`<button class="ghost full" style="margin-top:8px" onclick="apagarRodada('${itemId}','${atletaId}',${S.rd||0})">Apagar a rodada ${(S.rd||0)+1}</button>`:''}

async function salvarSplits(itemId,atletaId){
  const item=(S.treino.blocos.flatMap(b=>b.itens)).find(x=>x.id===itemId); if(!item)return;
  const rec=(S.treino.registros?.[atletaId]?.[itemId])||{};
  const iv=intervaloSplit(itemId,item,rec), np=item.dist/iv, reps=item.reps||1;
  const nrd=nRodadas(item,rec), rdIdx=nrd>1?(S.rd||0):null;
  const tempos=[],parciais=[];
  for(let r=0;r<reps;r++){
    const arr=[]; for(let k=0;k<np;k++){const el=document.getElementById('sp_'+r+'_'+k); arr.push((el&&el.value.trim())?parseTempoDist(el.value,(k+1)*iv):null);}
    /* monotonia: passagem acumulada não pode ser menor que a anterior preenchida */
    let ant=null,ok=true; for(const v of arr){ if(v!=null){ if(ant!=null&&v<ant)ok=false; ant=v; } }
    if(!ok)return toast('As parciais acumuladas devem crescer (cada passagem ≥ a anterior).');
    parciais.push(arr);
    let tot=null; for(let k=arr.length-1;k>=0;k--){ if(arr[k]!=null){tot=arr[k];break;} }
    tempos.push(tot);
  }
  await gravarReg(itemId,atletaId,rdIdx,tempos,parciais);
  fecharSheet(); toast(rdIdx!=null?'Parciais da rodada '+(rdIdx+1)+' salvas':'Parciais salvas'); render();
}
/* adiciona uma rodada à série (para blocos que repetem, ex.: "2x"). Migra o
   registro simples para rodada 1 e cria a próxima; funciona em qualquer série. */
async function addRodada(itemId,atletaId){
  const t=await lerTreinoUsuario(S.treino.id)||S.treino;
  const item=(t.blocos.flatMap(b=>b.itens)).find(i=>i.id===itemId); if(!item)return;
  t.registros=t.registros||{}; t.registros[atletaId]=t.registros[atletaId]||{};
  const prev=t.registros[atletaId][itemId]||{};
  /* o registro simples vira a rodada 1 — levando o total do broken com ele */
  let rd=(prev.rd&&prev.rd.slice())||[{tempos:prev.tempos||[],parciais:prev.parciais||[],
    ...(prev.tot!=null?{tot:prev.tot}:{})}];
  const base=Math.max(nRodadas(item,prev),rd.length);
  while(rd.length<base)rd.push({tempos:[],parciais:[]});
  rd.push({tempos:[],parciais:[]});
  const novo={...prev,rd,nrd:rd.length,em:Date.now(),por:S.u.nome};
  delete novo.tempos; delete novo.parciais; delete novo.tot;
  t.registros[atletaId][itemId]=novo; t.atualizado=Date.now();
  await gravarTreinoUsuario(t); S.treino=t;
  S.rd=rd.length-1; abrirLancamento(itemId,atletaId); toast('Rodada '+rd.length+' adicionada');
}
/* lê todos os campos digitados na ficha (para não perder nada) */
function lerCamposLancamento(reps,temParcial,dist){
  const tempos=[],parciais=[];
  for(let k=0;k<reps;k++){
    const el=document.getElementById('lt'+k); tempos.push(el?parseTempoDist(el.value,dist):null);
    if(temParcial){const ep=document.getElementById('lp'+k); parciais.push(ep?parseTempoDist(ep.value,dist?dist/2:null):null);}
  }
  return {tempos,parciais};
}
/* `extra` são campos do PRÓPRIO lançamento que não são tempos de repetição —
   hoje só `tot`, o cronômetro do broken. Precisa passar por aqui porque a
   gravação SUBSTITUI o objeto da rodada: sem isso o total voltava a nulo
   sozinho na próxima vez que qualquer tempo daquela rodada fosse salvo. */
async function gravarReg(itemId,atletaId,rd,tempos,parciais,extra){
  const trId=S.treino.id, nome=S.u.nome;
  const item=(S.treino.blocos.flatMap(b=>b.itens)).find(x=>x.id===itemId);
  /* aplica SEMPRE sobre a versão que vier (a do servidor, dentro da
     transação), mexendo só na subárvore DESTE atleta — assim o registro de
     quem lançou junto é preservado. Função pura: pode ser reexecutada. */
  const original=JSON.stringify(S.treino);   /* base limpa: ver nota em mutarRegistro */
  const aplicar=base=>{
    const t=base||JSON.parse(original);
    t.registros=t.registros||{}; t.registros[atletaId]=t.registros[atletaId]||{};
    const prev=t.registros[atletaId][itemId]||{};
    if(rd==null){
      t.registros[atletaId][itemId]={...prev,tempos,parciais,...(extra||{}),em:Date.now(),por:nome};
    }else{
      const n=Math.max((item&&item.rodadas)||1,(prev.nrd||0),rd+1), arr=(prev.rd||[]).slice();
      while(arr.length<n)arr.push({tempos:[],parciais:[]});
      arr[rd]={...(arr[rd]||{}),tempos,parciais,...(extra||{})};
      const novo={...prev,rd:arr,nrd:arr.length,em:Date.now(),por:nome};
      delete novo.tempos; delete novo.parciais; delete novo.tot;   /* o total passa a ser por rodada */
      t.registros[atletaId][itemId]=novo;
    }
    t.atualizado=Date.now();
    return t;
  };
  /* tela responde na hora (é o que evita a sensação de lapso)… */
  S.treino=aplicar(null);
  /* …e a gravação é atômica em cima do que está no servidor. */
  const salvo=await transacaoTreinoUsuario(trId,serv=>aplicar(serv||null));
  if(salvo)S.treino=salvo;
}
/* ✓ verde: grava o tempo daquela linha (e tudo que estiver digitado) na hora */
async function confTempo(itemId,atletaId,i,rd){
  const item=(S.treino.blocos.flatMap(b=>b.itens)).find(x=>x.id===itemId); if(!item)return;
  const {tempos,parciais}=lerCamposLancamento(item.reps,parcialLigada(item,itemId),item.dist);
  if(tempos[i]==null)return toast('Digite o tempo da linha '+(i+1)+' antes do ✓');
  await gravarReg(itemId,atletaId,rd==null?null:rd,tempos,parciais);
  toast('Tempo '+(i+1)+' salvo');
  abrirLancamento(itemId,atletaId);
}
/* ✕ vermelho: apaga o tempo daquela linha */
async function delTempo(itemId,atletaId,i,rd){
  const item=(S.treino.blocos.flatMap(b=>b.itens)).find(x=>x.id===itemId); if(!item)return;
  const {tempos,parciais}=lerCamposLancamento(item.reps,parcialLigada(item,itemId),item.dist);
  tempos[i]=null; if(item.parcial)parciais[i]=null;
  await gravarReg(itemId,atletaId,rd==null?null:rd,tempos,parciais);
  toast('Tempo '+(i+1)+' apagado');
  abrirLancamento(itemId,atletaId);
}

const cardTreinoExtra=s=>`<button class="card tight lst" style="border:1px solid var(--line);border-left:4px solid var(--rope);border-radius:14px;box-shadow:var(--sh);margin:10px 0" onclick="abrirTreinoExtra(null,'${s.id}')">

  <span class="tag o">meu</span></button>`;
/* ── Semana do atleta ──────────────────────────────────────────────────────
   A faixa da semana precisa saber o que foi FEITO, e isso só existe dentro do
   documento do treino — o índice não carrega. São poucos documentos (os da
   semana corrente), mas a sincronia silenciosa roda a cada 12s: reler todos a
   cada volta multiplicaria as leituras do banco sem necessidade. Então:
   documento novo entra na hora, e a releitura geral acontece no máximo uma vez
   por minuto. Para a faixa de uma semana, um minuto de atraso não muda nada —
   e o que o próprio aparelho grava já atualiza o cache na hora. */
let _semDocs={}, _semEm=0;
async function carregarSemana(eq,metas){
  const dias=semanaDe(hoje());
  const ids=(metas||[]).filter(t=>dias.includes(t.data)).map(t=>t.id);
  const agora=Date.now(), reler=(agora-_semEm)>60000;
  for(const id of (reler?ids:ids.filter(id=>!_semDocs[id]))){
    try{ const meta=(metas||[]).find(x=>x.id===id),d=await DB.get(meta?._pessoal?kPTr(S.u.id,id):kTr(eq,id)); if(d)_semDocs[id]=d; }catch(_){}
  }
  if(reler)_semEm=agora;
  for(const k of Object.keys(_semDocs))if(!ids.includes(k))delete _semDocs[k];   /* virou a semana */
  if(S.treino&&_semDocs[S.treino.id])_semDocs[S.treino.id]=S.treino;             /* o aberto é o mais fresco */
}
const semDoc=id=>_semDocs[id]||(S.treino&&S.treino.id===id?S.treino:null);
/* ── Cartão do treino da vez ───────────────────────────────────────────────
   A lista de treinos trata todos os dias como iguais, e o dia que importa é
   um só. Escolhemos, nesta ordem: um treino de HOJE ainda não concluído; o
   de hoje, concluído; o mais recente que ficou pendente; o mais recente.
   Treino futuro não entra — o app só o libera quando chega a data. */
function heroTreino(metas){
  const h=hoje(), lista=(metas||[]).slice().sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  if(!lista.length)return'';
  const doDia=lista.filter(t=>t.data===h);
  const t=doDia.find(x=>feitoConhecido(x)===false)||doDia[0]
    ||lista.find(x=>feitoConhecido(x)===false)||lista[0];
  const feito=feitoConhecido(t), d=semDoc(t.id);
  const blocos=d&&d.blocos?d.blocos.length:0;
  return`<button class="hero ${feito?'ok':''}" onclick="abrirTreino('${t.id}')">
    <div class="hero-top">
      <span class="hero-badge">${feito?'concluído':(t.data===h?'treino de hoje':'pendente')}</span>
      <span class="hero-data">${brData(t.data)}</span>
    </div>
    <b class="hero-tit">${esc(t.titulo||'Treino')}</b>
    <div class="hero-meta">${(t.vol/1000).toFixed(1)}k${blocos?` · ${blocos} bloco${blocos>1?'s':''}`:''}${t.nivel?` · nível ${esc(t.nivel)}`:''}</div>
    <span class="hero-cta">${feito?'Rever treino':'Abrir treino'}</span>
  </button>`;
}
/* ── Faixa da semana ───────────────────────────────────────────────────────
   Segunda a domingo. Verde cheio = feito; contorno = programado e ainda não
   feito; apagado = dia sem treino. Quando o documento do treino ainda não
   chegou, o dia fica como programado em vez de "não feito": "não sei" não é
   "não fez", e riscar um treino que o atleta fez seria pior do que omitir. */
function faixaSemana(){
  const dias=semanaDe(hoje()), h=hoje();
  const meus=S.tridx.filter(t=>(t.para||[]).includes(S.u.id));
  /* Sessão fora d'água com data futura é PLANO, não treino feito — o atleta
     pode deixar a semana montada na agenda. Pintar de verde um dia que ainda
     nem chegou faria a faixa mentir sobre o que já foi cumprido. */
  const secoF=new Set(((S.pro&&S.pro.seco)||[]).filter(s=>(s.data||'')<=h).map(s=>s.data));
  const secoP=new Set(((S.pro&&S.pro.seco)||[]).filter(s=>(s.data||'')>h).map(s=>s.data));
  const feitoDia=d=>secoF.has(d)||meus.some(t=>t.data===d&&feitoConhecido(t)===true);
  const temDia=d=>secoF.has(d)||secoP.has(d)||meus.some(t=>t.data===d);
  const cels=dias.map((d,k)=>{
    const cls=feitoDia(d)?'ok':(temDia(d)?'prog':'off');
    return`<span class="dia ${cls}${d===h?' hj':''}" title="${brData(d)}">${DIA_CURTO[k]}</span>`;
  }).join('');
  /* O denominador conta DIAS com treino — de piscina ou fora d'água. Contar só
     os de piscina deixava "1 de 2" com a musculação de terça no numerador e
     fora do total, o que não fecha para quem está olhando. */
  const ativos=dias.filter(temDia).length;
  const fez=dias.filter(feitoDia).length;
  const faltam=dias.filter(d=>d>=h&&temDia(d)&&!feitoDia(d)).length;
  if(!ativos)return'';
  return`<div class="card tight">
    <div class="row" style="align-items:baseline"><span class="eyebrow grow">esta semana</span>
      <b class="t" style="font-size:15px">${fez} de ${ativos}</b></div>
    ${faltam?`<div class="small muted" style="margin-top:2px">${faltam===1?'1 treino restante':faltam+' treinos restantes'}</div>`:''}
    <div class="dias">${cels}</div></div>`;
}
/* Concluído? Só respondemos quando temos o documento — "não sei" é diferente de
   "não fez", e pintar de cinza um treino que o atleta fez seria pior que omitir. */
function feitoConhecido(meta){ const d=semDoc(meta.id); return d?treinoFeito(d,S.u.id):null; }

/* ═══════════════════════════════════════════════════════════════════════════
   EXTRATO MENSAL

   A pergunta que ele responde não é "como estou hoje" — isso é o relatório.
   É "como foi o mês, e o que isso diz sobre o próximo". Mês de calendário,
   porque é assim que atleta e técnico pensam; comparação normalizada POR
   SEMANA, porque fevereiro tem 28 dias e março tem 31, e somar os dois como
   se fossem iguais produz uma "queda de carga" que não existe.

   REGRA QUE VALE PARA TUDO AQUI: o extrato descreve sempre, mas só COMPARA
   com história suficiente, e só emite leitura quando o mês está registrado.
   Mês mal registrado não vira conclusão fraca — vira recusa explicada.
   ═══════════════════════════════════════════════════════════════════════ */
const EXTRATO_MIN_SEMANAS=8;
const EXTRATO_COBERTURA_MIN=0.6;
function limitesMes(ym){
  const Y=+String(ym).slice(0,4), M=+String(ym).slice(5,7);
  const dias=new Date(Y,M,0).getDate();
  return {ini:ym+'-01',fim:ym+'-'+String(dias).padStart(2,'0'),dias,semanas:dias/7};
}
function mesAnterior(ym){
  const Y=+String(ym).slice(0,4), M=+String(ym).slice(5,7);
  const d=new Date(Y,M-2,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
/* semana 1 = dias 1-7 do mês. A semana ISO cruzaria o mês e misturaria dias de
   fevereiro na primeira semana de março. */
function semanaDoMes(data){ return Math.floor((+String(data).slice(8,10)-1)/7)+1; }

/* Janela própria de esforços: o cache ESF é de 120 dias e serve outras telas;
   o extrato precisa alcançar meses anteriores sem alterar aquilo. */
let ESF_EXT=null;
async function esforcosLongos(){
  if(!ESF_EXT)ESF_EXT=await coletarEsforcos({dias:500});
  return ESF_EXT;
}
function tirosDoMes(pro,esf,ym){
  const L=limitesMes(ym);
  return (esf||[]).filter(e=>e.data>=L.ini&&e.data<=L.fim&&e.tempo)
    .map(e=>{const pb=pbDe(pro,e.dist,e.estilo,e.pis); return Object.assign({},e,{pct:pb?pb/e.tempo*100:null});})
    .sort((a,b)=>a.data.localeCompare(b.data));
}
function mediaPct(arr){
  const v=(arr||[]).map(x=>x.pct).filter(x=>x!=null);
  return v.length?+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):null;
}
async function extratoMes(ym){
  const pro=S.pro||proVazio();
  const L=limitesMes(ym);
  const esf=await esforcosLongos();
  const tiros=tirosDoMes(pro,esf,ym);
  const ant=mesAnterior(ym), LA=limitesMes(ant);
  const tirosAnt=tirosDoMes(pro,esf,ant);

  /* história disponível: do primeiro dado registrado até o fim do mês */
  const datas=[].concat(esf.map(e=>e.data),(pro.garmin||[]).map(g=>g.data),
                        (pro.seco||[]).map(x=>x.data)).filter(Boolean).sort();
  const semanasHist=datas.length?(new Date(L.fim)-new Date(datas[0]))/604800000:0;

  const porSemana=[1,2,3,4,5].map(function(w){
    const t=tiros.filter(x=>semanaDoMes(x.data)===w);
    return {sem:w,n:t.length,pct:mediaPct(t)};
  }).filter(x=>x.n);

  const carga=cargaTotal(L.dias,L.fim), cargaAnt=cargaTotal(LA.dias,LA.fim);
  const porSemana_=c=>c?Math.round((c.totalAjust||c.total)/(L.dias/7)):null;
  const cargaSem=porSemana_(carga);
  const porSemAnt=cargaAnt?Math.round((cargaAnt.totalAjust||cargaAnt.total)/(LA.dias/7)):null;
  const deltaCarga=(cargaSem!=null&&porSemAnt)?Math.round((cargaSem-porSemAnt)/porSemAnt*100):null;

  const dentro=d=>d&&d>=L.ini&&d<=L.fim;
  const g=(pro.garmin||[]).filter(x=>dentro(x.data));
  const sh=serieHRV(pro.garmin);
  const med=a=>a.length?a.reduce((t,v)=>t+v,0)/a.length:null;
  const hrvMes=g.filter(x=>x.hrv!=null&&(!sh||(x.hrvF||'legado')===sh.fonte)).map(x=>x.hrv);
  const hrvBase=(sh?sh.serie:[]).filter(x=>x.data<L.ini).slice(0,30).map(x=>x.hrv);
  const hrvM=med(hrvMes), hrvB=med(hrvBase);
  const sono=g.filter(x=>x.sono!=null).map(x=>x.sono);
  const ref=refSono(pro);
  const ck=g.map(x=>checkinScore(x)).filter(x=>x!=null);

  return {ym,ini:L.ini,fim:L.fim,dias:L.dias,
    comparavel:semanasHist>=EXTRATO_MIN_SEMANAS,semanasHist:Math.round(semanasHist),
    tiros,porSemana,pct:mediaPct(tiros),pctAnt:mediaPct(tirosAnt),nAnt:tirosAnt.length,
    carga,cargaSem,porSemAnt,deltaCarga,
    cobertura:carga?carga.cobertura:null,
    acwr:cargaACWR(),
    hrv:{mes:hrvM!=null?Math.round(hrvM):null,base:hrvB!=null?Math.round(hrvB):null,
         delta:(hrvM!=null&&hrvB)?Math.round((hrvM-hrvB)/hrvB*100):null,
         fonte:sh?sh.fonte:null},
    sono:{media:sono.length?+med(sono).toFixed(1):null,ref:ref?ref.h:null,n:sono.length},
    prontidao:ck.length?Math.round(med(ck)):null,
    peso:pesoResumo(pro.garmin,L.dias),
    dor:dorPersistente(pro.garmin),
    faixa:faixaHRV(pro.garmin),
    ctx:ctxNoPeriodo(pro.garmin,L.ini,L.fim),
    nSeco:(pro.seco||[]).filter(x=>dentro(x.data)).length};
}

/* ── A LINHA DOS DOZE MESES ─────────────────────────────────────────────────
   O extrato compara com o mês anterior; esta é a vista longa, que é onde
   temporada aparece. Duas séries no mesmo desenho porque a pergunta é uma só:
   a carga subiu e o desempenho acompanhou, ou não?

   Carga em barras, %PB em linha. As escalas são DIFERENTES e isso é dito —
   cada série é normalizada pela sua própria faixa, senão uma esmagaria a
   outra. O que se lê aqui é a FORMA das duas, não a distância entre elas.
   Mês sem tiro medido não vira ponto: a linha abre buraco em vez de ligar
   dois meses distantes e fingir continuidade. */
async function serieMeses(ym,n){
  n=n||12;
  const pro=S.pro||proVazio();
  const esf=await esforcosLongos();
  const out=[]; let cur=ym;
  for(let i=0;i<n;i++){
    const L=limitesMes(cur);
    const t=tirosDoMes(pro,esf,cur);
    const c=cargaTotal(L.dias,L.fim);
    out.unshift({ym:cur,n:t.length,pct:mediaPct(t),
      cargaSem:c?Math.round((c.totalAjust||c.total)/(L.dias/7)):null,
      cobertura:c?c.cobertura:null});
    cur=mesAnterior(cur);
  }
  return out;
}
function graficoMeses(serie){
  const s=(serie||[]).filter(m=>m.n||m.cargaSem);
  if(s.length<3)return '<div class="xs muted" style="margin-top:6px">Menos de três meses com registro — a linha longa aparece quando houver histórico.</div>';
  const W=300,H=108,base=H-18,topo=10;
  const cargas=s.map(m=>m.cargaSem||0), maxC=Math.max.apply(null,cargas)||1;
  const pcts=s.map(m=>m.pct).filter(v=>v!=null);
  const mn=pcts.length?Math.min.apply(null,pcts):0, mx=pcts.length?Math.max.apply(null,pcts):1;
  const faixa=(mx-mn)||1;
  const larg=(W-16)/s.length, bw=Math.max(6,larg*0.52);
  const cx=i=>8+larg*i+larg/2;
  const by=v=>base-(v/maxC)*(base-topo);
  const ly=v=>base-((v-mn)/faixa)*(base-topo);
  const barras=s.map((m,i)=>{
    const h=Math.max(1,base-by(m.cargaSem||0));
    const fraco=m.cobertura!=null&&m.cobertura<EXTRATO_COBERTURA_MIN;
    return '<rect x="'+(cx(i)-bw/2).toFixed(1)+'" y="'+by(m.cargaSem||0).toFixed(1)+
      '" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="var(--water)" opacity="'+(fraco?'.22':'.42')+'"/>';
  }).join('');
  /* trechos contínuos: cada sequência de meses COM %PB vira um caminho */
  const tramos=[]; let atual=[];
  s.forEach((m,i)=>{ if(m.pct!=null)atual.push({i,v:m.pct}); else {if(atual.length)tramos.push(atual);atual=[];} });
  if(atual.length)tramos.push(atual);
  const linha=tramos.filter(t=>t.length>1).map(t=>
    '<path d="'+t.map((p,k)=>(k?'L':'M')+cx(p.i).toFixed(1)+' '+ly(p.v).toFixed(1)).join(' ')+
    '" fill="none" stroke="var(--ok)" stroke-width="2.5" stroke-linejoin="round"/>').join('');
  const pontos=s.map((m,i)=>m.pct==null?'':
    '<circle cx="'+cx(i).toFixed(1)+'" cy="'+ly(m.pct).toFixed(1)+'" r="3" fill="var(--ok)"/>').join('');
  const rot=s.map((m,i)=>'<text x="'+cx(i).toFixed(1)+'" y="'+(H-4)+'" font-size="8" text-anchor="middle" fill="currentColor" opacity=".55">'+
    (MESES[+m.ym.slice(5,7)-1]||'').slice(0,3)+'</text>').join('');
  const fracos=s.filter(m=>m.cobertura!=null&&m.cobertura<EXTRATO_COBERTURA_MIN).length;
  const semTiro=s.filter(m=>!m.n).length;
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;margin-top:8px">'+
      barras+linha+pontos+rot+'</svg>'+
    '<div class="xs muted" style="margin-top:2px">'+
      '<span style="color:var(--water)">▇</span> carga por semana (UA) · '+
      '<span style="color:var(--ok)">—</span> %PB médio dos tiros (<b>maior é melhor</b>). '+
      'As duas escalas são independentes: compare o <b>formato</b> das séries, não a distância entre elas.'+
      (fracos?' '+fracos+' mês(es) com cobertura baixa aparecem esmaecidos.':'')+
      (semTiro?' '+semTiro+' mês(es) sem tiro medido ficam sem ponto na linha.':'')+
    '</div>'+
    '<div class="xs muted" style="margin-top:4px">'+s.filter(m=>m.pct!=null).map(m=>
      (MESES[+m.ym.slice(5,7)-1]||'').slice(0,3)+' <b>'+m.pct+'%</b>').join(' · ')+'</div>';
}

/* ── O EXTRATO NA TELA ──────────────────────────────────────────────────────
   Mora dentro do mês, no calendário de Treinos: é lá que o atleta já navega
   mês a mês, então a navegação sai de graça. Vem RECOLHIDO de propósito — a
   aba Treinos é consultada todo dia para ver o treino de hoje, e um painel
   analítico aberto no topo viraria ruído diário. Um toque, e ele abre.

   Também é calculado só quando abre: fechar o mês custa percorrer esforços,
   carga e Saúde, e fazer isso para todos os meses da lista travaria a tela. */
function extratoAberto(ym){ return !!(S.extratoAberto&&S.extratoAberto[ym]); }
async function alternarExtrato(ym){
  S.extratoAberto=Object.assign({},S.extratoAberto);
  if(S.extratoAberto[ym]){ delete S.extratoAberto[ym]; render(); return; }
  S.extratoAberto[ym]=true;
  S.extratoCalc=Object.assign({},S.extratoCalc); delete S.extratoCalc[ym];
  render();
  try{
    const x=await extratoMes(ym);
    S.extratoCalc=Object.assign({},S.extratoCalc,{[ym]:x});
    const serie=await serieMeses(ym,12);
    S.extratoSerie=Object.assign({},S.extratoSerie,{[ym]:serie});
  }catch(e){
    S.extratoCalc=Object.assign({},S.extratoCalc,{[ym]:{erro:(e&&e.message)||'falhou'}});
  }
  render();
}
function botaoExtrato(ym){
  const ab=extratoAberto(ym);
  return '<button class="sm ghost full" style="margin:2px 0 8px" onclick="alternarExtrato(\''+ym+'\')">'+
    (ab?'▲ Fechar o extrato':'▼ Extrato do mês')+'</button>'+
    (ab?cardExtrato(ym):'');
}
/* gráfico das semanas: %PB médio por semana do mês. Menor tempo = maior %PB,
   então subir é melhorar — o contrário do gráfico de tempos, e por isso o
   rótulo diz o que significa. */
function graficoSemanas(x){
  const pts=(x.porSemana||[]).filter(s=>s.pct!=null).map(s=>({rot:'S'+s.sem,v:s.pct}));
  if(pts.length<2)return '<div class="xs muted" style="margin-top:6px">Menos de duas semanas com tiros medidos — sem linha para traçar.</div>';
  const vs=pts.map(p=>p.v), mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  const faixa=(mx-mn)||1, W=280, H=70;
  const px=(i)=>pts.length>1?(i*(W-20)/(pts.length-1))+10:W/2;
  const py=(v)=>H-10-((v-mn)/faixa)*(H-24);
  const d=pts.map((p,i)=>(i?'L':'M')+px(i).toFixed(1)+' '+py(p.v).toFixed(1)).join(' ');
  const sobe=pts[pts.length-1].v>=pts[0].v;
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;margin-top:8px">'+
    '<path d="'+d+'" fill="none" stroke="'+(sobe?'var(--ok)':'var(--clock)')+'" stroke-width="2.5" stroke-linejoin="round"/>'+
    pts.map((p,i)=>'<circle cx="'+px(i).toFixed(1)+'" cy="'+py(p.v).toFixed(1)+'" r="3.5" fill="'+(sobe?'var(--ok)':'var(--clock)')+'"/>').join('')+
    pts.map((p,i)=>'<text x="'+px(i).toFixed(1)+'" y="'+(H-1)+'" font-size="9" text-anchor="middle" fill="currentColor" opacity=".55">'+p.rot+'</text>').join('')+
    '</svg>'+
    '<div class="xs muted">'+pts.map(p=>p.rot+': <b>'+p.v+'%</b>').join(' · ')+
    ' — %PB do tiro: <b>maior é melhor</b>.</div>';
}
function cardExtrato(ym){
  const x=(S.extratoCalc||{})[ym];
  if(!x)return '<div class="card"><div class="small muted">Fechando o mês…</div></div>';
  if(x.erro)return '<div class="card"><div class="note warn xs">Não consegui fechar este mês: '+esc(x.erro)+'</div></div>';
  const sinais=sinaisDoMes(x), leitura=leituraDoMes(x,sinais);
  const cor={ok:'ok',atencao:'warn',recusa:'warn',parcial:'',dividido:''}[leitura.nivel]||'';
  const ico={favor:'✓',contra:'!',neutro:'·'};
  const linhaSinal=s=>'<div class="row xs" style="padding:5px 0;border-top:1px solid var(--line)">'+
    '<span style="width:18px;font-weight:800;color:'+(s.estado==='contra'?'var(--clock)':s.estado==='favor'?'var(--ok)':'var(--ink-2)')+'">'+ico[s.estado]+'</span>'+
    '<span class="grow">'+s.txt+'</span></div>';
  const t=x.tiros||[];
  const linhaTiro=e=>'<div class="row xs" style="padding:4px 0;border-top:1px solid var(--line)">'+
    '<span class="muted" style="width:44px">'+brCurta(e.data)+'</span>'+
    '<span class="grow">'+e.dist+'m '+esc(e.estilo||'')+' <span class="muted">'+(e.pis==='LC50'?'50m':'25m')+'</span></span>'+
    '<b style="margin-right:8px">'+fmt(e.tempo,true)+'</b>'+
    '<span style="width:46px;text-align:right">'+(e.pct!=null?'<b>'+e.pct.toFixed(0)+'%</b>':'—')+'</span></div>';
  return '<div class="card" style="margin-bottom:10px">'+
    '<div class="eyebrow">extrato · '+(MESES[+ym.slice(5,7)-1]||ym)+' '+ym.slice(0,4)+'</div>'+
    '<div class="note '+cor+'" style="margin:8px 0">'+leitura.txt+'</div>'+
    '<div class="grid3" style="margin:10px 0">'+
      '<div class="kpi"><div class="v">'+t.length+'</div><div class="l">tiros medidos</div></div>'+
      '<div class="kpi"><div class="v">'+(x.pct!=null?x.pct+'<span class="xs muted">%</span>':'—')+'</div><div class="l">%PB médio</div></div>'+
      '<div class="kpi"><div class="v">'+(x.cargaSem!=null?x.cargaSem:'—')+'</div><div class="l">carga/semana (UA)</div></div>'+
    '</div>'+
    (x.deltaCarga!=null?'<div class="xs muted">Mês anterior: '+x.porSemAnt+' UA/semana ('+(x.deltaCarga>=0?'+':'')+x.deltaCarga+'%).</div>':'')+
    (x.cobertura!=null?'<div class="xs muted" style="margin-top:2px">Cobertura de esforço registrado: <b>'+Math.round(x.cobertura*100)+'%</b>'+(x.nSeco?' · '+x.nSeco+' sessão(ões) fora d\'água':'')+'.</div>':'')+
    graficoSemanas(x)+
    (x.faixa?'<div class="xs muted" style="margin-top:6px">Faixa habitual de VFC: <b>'+x.faixa.de+' a '+x.faixa.ate+' ms</b> (média '+x.faixa.media+', '+x.faixa.n+' dias).</div>':'')+
    (x.ctx&&x.ctx.lista.length?'<div class="xs muted" style="margin-top:2px">Marcado no mês: '+
      x.ctx.lista.map(c=>c.rot+' ('+c.n+')').join(' · ')+'.</div>':'')+
    (sinais.length?'<div class="sep"></div><div class="eyebrow">sinais do mês</div>'+sinais.map(linhaSinal).join(''):'')+
    (t.length?'<div class="sep"></div>'+acc('ex_t_'+ym,'Todos os tiros do mês',t.length+' tiro(s)',t.map(linhaTiro).join('')):'')+
    (function(){const sr=(S.extratoSerie||{})[ym];
      return sr?'<div class="sep"></div><div class="eyebrow">os últimos 12 meses</div>'+graficoMeses(sr):'';})()+
    '<div class="xs muted" style="margin-top:10px">O extrato descreve e aponta padrões a partir dos seus dados. Decisão de carga é sua e do seu técnico.</div>'+
  '</div>';
}

/* ── O PLACAR DE SINAIS ─────────────────────────────────────────────────────
   Cada sinal é uma frase verificável com o dado que a sustenta. Nenhum vira
   nota; o extrato diz quantos apontam para cada lado — e quando estão
   divididos, DIZ que estão divididos, em vez de inventar um veredito. */
function sinaisDoMes(x){
  const s=[];
  const add=(k,estado,txt)=>s.push({k,estado,txt});
  if(x.deltaCarga!=null)
    add('carga',x.deltaCarga>30?'contra':'favor',
      'Carga por semana '+(x.deltaCarga>=0?'+':'')+x.deltaCarga+'% em relação ao mês anterior.');
  if(x.acwr){
    const r=x.acwr.acwr;
    add('acwr',r>1.5?'contra':(r<0.8?'neutro':'favor'),
      'Agudo:crônico em '+r.toFixed(2)+(r>1.5?' — acima de 1,5':(r<0.8?' — abaixo de 0,8':' — dentro de 0,8 a 1,3'))+'.');
  }
  if(x.hrv.delta!=null){
    /* se o mes teve dias marcados (viagem, doenca, alcool), a queda tem
       candidato a explicacao e o sinal diz isso em vez de so acusar */
    const marcados=(x.ctx&&x.ctx.dias)||0;
    const expl=(x.hrv.delta<=-8&&marcados)
      ? ' Em '+marcados+' dia(s) do mês você marcou '+x.ctx.lista.slice(0,2).map(c=>c.rot).join(' / ')+'.'
      : '';
    add('vfc',x.hrv.delta<=-8?'contra':'favor',
      'VFC do mês '+(x.hrv.delta>=0?'+':'')+x.hrv.delta+'% em relação à sua base'+
      (x.hrv.fonte==='semana'?' (média semanal do relógio)':'')+'.'+expl);
  }
  if(x.sono.media!=null&&x.sono.ref!=null){
    const d=+(x.sono.media-x.sono.ref).toFixed(1);
    add('sono',d<=-0.5?'contra':'favor',
      'Sono médio de '+x.sono.media+'h contra a sua referência de '+x.sono.ref+'h.');
  }
  if(x.pct!=null&&x.pctAnt!=null&&x.nAnt>=5){
    const d=+(x.pct-x.pctAnt).toFixed(1);
    add('tiros',d<-1?'contra':'favor',
      '%PB médio dos tiros em '+x.pct+'% contra '+x.pctAnt+'% no mês anterior.');
  }
  if(x.dor&&x.dor.dias>=3)
    add('dor','contra','Dor '+x.dor.nivel+'/5 por '+x.dor.dias+' dias seguidos.');
  else if(x.dor)add('dor','neutro','Dor alta em '+x.dor.dias+' dia(s).');
  return s;
}
/* A dissociação é o padrão que mais importa: carga subindo E desempenho caindo
   E o corpo dando sinal contrário, no mesmo mês. Nomear o padrão é diferente
   de diagnosticar — e a frase diz exatamente isso. */
function leituraDoMes(x,sinais){
  if(x.cobertura!=null&&x.cobertura<EXTRATO_COBERTURA_MIN)
    return {nivel:'recusa',txt:'Só <b>'+Math.round(x.cobertura*100)+'%</b> dos treinos de piscina do mês têm esforço registrado. Com essa cobertura, qualquer leitura sobre carga seria chute — preencha o RPE dos treinos e o extrato passa a responder.'};
  if(!x.comparavel)
    return {nivel:'parcial',txt:'Você tem <b>'+x.semanasHist+' semana(s)</b> de histórico. O extrato descreve o mês, mas só compara a partir de '+EXTRATO_MIN_SEMANAS+' semanas — antes disso não há base sua para dizer o que é muito ou pouco.'};
  const contra=sinais.filter(s=>s.estado==='contra'), favor=sinais.filter(s=>s.estado==='favor');
  const dissociacao=(x.deltaCarga!=null&&x.deltaCarga>15)&&
    (x.pct!=null&&x.pctAnt!=null&&x.pct<x.pctAnt)&&
    (sinais.some(s=>s.k==='vfc'&&s.estado==='contra')||!!(x.dor&&x.dor.dias>=3));
  if(dissociacao)
    return {nivel:'atencao',txt:'A carga subiu, o desempenho nos tiros caiu e o corpo deu sinal contrário no mesmo mês. É o conjunto que costuma preceder excesso de treino. <b>Com base no seu histórico, vale verificar a possibilidade de overtraining</b> e conversar com o seu técnico antes de subir a carga. Diagnóstico preciso é clínico; o app mostra o padrão, não conclui.'};
  if(contra.length>favor.length)
    return {nivel:'atencao',txt:contra.length+' sinal(is) pedindo cautela contra '+favor.length+' favorável(is). O mês não sugere aumentar carga.'};
  if(contra.length&&contra.length===favor.length)
    return {nivel:'dividido',txt:'Os sinais estão divididos: '+favor.length+' a favor e '+contra.length+' contra. Não dá para concluir pelo conjunto — olhe linha a linha e decida com o técnico.'};
  if(!contra.length&&favor.length>=3)
    return {nivel:'ok',txt:favor.length+' sinais favoráveis e nenhum contrário. As condições do mês permitem progredir a carga, com o aumento gradual de sempre.'};
  return {nivel:'dividido',txt:'Dados insuficientes para uma leitura de conjunto neste mês.'};
}

/* ═══════════════════════════════════════════════════════════════════════════
   SUÍTE DE TESTES

   Por que ela vive dentro do index.html: o app é UM arquivo, sem build e sem
   módulos. Um test runner externo precisaria extrair as funções do HTML ou
   duplicá-las — e teste que roda sobre uma cópia do código não testa o código.
   Aqui ela roda no mesmo ambiente de produção, contra as funções de verdade.

   Cobertura: cada regressão consertada desta conversa tem um caso. É isso que
   impede o conserto de hoje de voltar no mês que vem.
   Abrir: Conta › Diagnóstico › Rodar testes. Só o desenvolvedor vê.
   ═══════════════════════════════════════════════════════════════════════════ */
const _T=[];                                     /* casos registrados */
const teste=(grupo,nome,fn)=>_T.push({grupo,nome,fn});
function _assert(){
  const falhas=[];
  const eq=(a,b,msg)=>{const A=JSON.stringify(a),B=JSON.stringify(b);
    if(A!==B)falhas.push(`${msg||''} esperado ${B}, veio ${A}`)};
  const ok=(v,msg)=>{if(!v)falhas.push(msg||'esperado verdadeiro')};
  const quase=(a,b,tol,msg)=>{if(a==null||Math.abs(a-b)>(tol??0.5))falhas.push(`${msg||''} esperado ~${b}, veio ${a}`)};
  return{falhas,eq,ok,quase};
}
/* Isola o estado global: os testes mexem em S/ESF/SESSOES e não podem deixar
   o app num estado inventado depois de rodar. */
async function rodarTestes(){
  const bk={pro:S.pro,u:S.u,tridx:S.tridx,cidx:S.cidx,acc:S.acc,provaPC:S.provaPC,
    esf:typeof ESF!=='undefined'?ESF:null,ses:typeof SESSOES!=='undefined'?SESSOES:null,
    compFut:typeof _compFut!=='undefined'?_compFut:null};
  const res=[];
  for(const c of _T){
    const a=_assert();
    try{ await c.fn(a); }
    catch(e){ a.falhas.push('EXCEÇÃO: '+((e&&e.message)||String(e))); }
    res.push({...c,falhas:a.falhas});
  }
  S.pro=bk.pro;S.u=bk.u;S.tridx=bk.tridx;S.cidx=bk.cidx;S.acc=bk.acc;S.provaPC=bk.provaPC;
  if(bk.esf!==null)ESF=bk.esf; if(bk.ses!==null)SESSOES=bk.ses; if(bk.compFut!==null)_compFut=bk.compFut;
  return res;
}
async function abrirTestes(){
  if(!ehDev())return toast('Só o desenvolvedor roda os testes');
  sheet(`<h2>Suíte de testes</h2><div class="small muted">Rodando ${_T.length} caso(s) contra as funções reais…</div>`);
  const res=await rodarTestes();
  const falhos=res.filter(r=>r.falhas.length);
  const grupos=[...new Set(res.map(r=>r.grupo))];
  sheet(`<h2>Suíte de testes</h2>
    <div class="note ${falhos.length?'warn':'ok'}" style="margin:8px 0">
      <b>${res.length-falhos.length} de ${res.length} passaram.</b>
      ${falhos.length?` ${falhos.length} falhou(aram) — a lista abaixo diz o quê.`:' Nenhuma regressão nas funções cobertas.'}</div>
    ${grupos.map(g=>{const rs=res.filter(r=>r.grupo===g);
      return`<div class="eyebrow" style="margin-top:12px">${esc(g)} · ${rs.filter(r=>!r.falhas.length).length}/${rs.length}</div>
      ${rs.map(r=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)">
        <span style="color:${r.falhas.length?'var(--clock)':'var(--ok)'};font-weight:800">${r.falhas.length?'✕':'✓'}</span>
        <span class="small"> ${esc(r.nome)}</span>
        ${r.falhas.map(f=>`<div class="xs t" style="color:var(--clock);margin-left:16px">${esc(f)}</div>`).join('')}
      </div>`).join('')}`;}).join('')}
    <button class="ghost full" style="margin-top:14px" onclick="abrirTestes()">Rodar de novo</button>
    <button class="ghost full" style="margin-top:8px" onclick="fecharSheet();render()">Fechar</button>`);
}

const _dAtras=k=>{const d=new Date();d.setDate(d.getDate()-k);return isoDia(d)};
const _daqui=k=>{const d=new Date();d.setDate(d.getDate()+k);return isoDia(d)};
const _tiro=(k,dist,t,pis,p1)=>({data:_dAtras(k),pis:pis||'SC25',dist,estilo:'peito',tags:[],
  tempo:parseTempo(t),p1:p1?parseTempo(p1):null,forte:true,vol:dist*4});
const _comPct=(pro,arr)=>arr.map(e=>{const pb=pbDe(pro,e.dist,e.estilo,e.pis);
  return{...e,pct:pb?pb/e.tempo*100:null}}).filter(e=>e.pct);

  return S.pro;
}

/* ── P1 — AUDITORIA DO MOTOR DE PREVISÃO (v131) ──────────────────────────── */
const _logItem=(d,pis,data,central,real,origem,low,high)=>({
  k:`${d}|peito|${pis}|${data}`,d,es:'peito',pis,data,central:parseTempo(central),
  low:low?parseTempo(low):null,high:high?parseTempo(high):null,real:parseTempo(real),
  erro:parseTempo(real)-parseTempo(central),
  erroPct:+(((parseTempo(real)-parseTempo(central))/parseTempo(real))*100).toFixed(2),
  dentro:(low&&high)?(parseTempo(real)>=parseTempo(low)&&parseTempo(real)<=parseTempo(high)):null,
  origem});

/* ── ACWR PRECISA DE PASSADO (v177) ──────────────────────────────
   Uma sessão na vida dava "4.0× a média das 4 semanas anteriores" e abria o
   relatório do atleta novo com REAVALIAR A CARGA. */
function _diasCarga(mapa){const d=[];for(let i=0;i<42;i++)d[i]=mapa[i]||0;return d;}
teste('carga','uma sessão só não vira razão de carga',a=>{
  const dia=_diasCarga({0:455});
  const r=acwrComBase(dia,455,455/4);
  a.eq(r.acwr,null,'sem passado, sem razão');
  a.eq(r.baseDias,0,'nenhum dia de base nas 3 semanas anteriores');});
teste('carga','com base suficiente a razão volta a sair',a=>{
  const m={}; for(let i=0;i<28;i+=2)m[i]=400;      /* 14 dias com carga */
  const dia=_diasCarga(m);
  const ag=dia.slice(0,7).reduce((t,x)=>t+x,0), cr=dia.slice(0,28).reduce((t,x)=>t+x,0)/4;
  const r=acwrComBase(dia,ag,cr);
  a.ok(r.baseDias>=ACWR_DIAS_BASE_MIN,'passa do mínimo de dias de base');
  a.ok(r.acwr!=null,'e a razão existe');
  a.quase(r.acwr,ag/cr,0.0001,'e é a divisão normal');});
teste('carga','base no limite: 5 dias não, 6 dias sim',a=>{
  const mk=n=>{const m={};for(let i=0;i<n;i++)m[7+i*2]=400;return _diasCarga(m)};
  a.eq(acwrComBase(mk(5),400,500).acwr,null,'5 dias ainda é pouco');
  a.ok(acwrComBase(mk(6),400,500).acwr!=null,'6 dias já serve');});
teste('carga','sem razão o app não fala de carga',a=>{
  _atleta();
  const r=recomendaIntensidade({fadiga:{acwr:null,monotonia:null},estado:{pr:{score:80}}});
  a.ok(!/sustentável|reduzir|redução|progressão/i.test(r.txt),'nada de veredicto sobre carga');
  a.ok(/semanas suficientes/.test(r.txt),'e diz o que falta');
  const r2=recomendaIntensidade({fadiga:{acwr:null,monotonia:null},estado:{pr:{score:30}}});
  a.eq(r2.t,'warn','prontidão baixa continua avisando');
  a.ok(!/carga dos últimos 7 dias/.test(r2.txt),'mas sem inventar razão de carga');});

/* ── SEMANA DO ATLETA SEM EQUIPE (v177) ──────────────────────────
   Achado testando o cadastro novo do zero: um PRO sem equipe marcava o treino
   como feito e a faixa seguia dizendo "0 de 1". `_semDocs` nunca era
   preenchido, porque `carregarDados` saltava `carregarSemana` no ramo sem
   equipe — e nada realimentava o cache depois de gravar. */
teste('semana','marca de feito entra no cache da semana na hora',a=>{
  _atleta();
  const bk=Object.keys(_semDocs); bk.forEach(k=>delete _semDocs[k]);
  const t={id:'tq1',data:hoje(),_pessoal:true,para:['A1'],feito:{A1:true}};
  a.eq(lembrarDocSemana(t),true,'treino da semana entra');
  a.eq(semDoc('tq1'),t,'e semDoc passa a enxergar');
  a.eq(feitoConhecido({id:'tq1'}),true,'feitoConhecido deixa de devolver null');
  delete _semDocs['tq1'];});
teste('semana','o cache guarda só a semana corrente',a=>{
  _atleta();
  const velho={id:'tq2',data:_dAtras(30),_pessoal:true,para:['A1'],feito:{A1:true}};
  a.eq(lembrarDocSemana(velho),false,'treino de 30 dias atrás fica de fora');
  a.eq(semDoc('tq2'),null,'e não aparece no cache');
  a.eq(lembrarDocSemana(null),false,'nulo não quebra');
  a.eq(lembrarDocSemana({id:'x'}),false,'sem data não entra');});
teste('semana','sem feito conhecido a faixa não inventa conclusão',a=>{
  _atleta();
  const bk=Object.keys(_semDocs); bk.forEach(k=>delete _semDocs[k]);
  a.eq(feitoConhecido({id:'inexistente'}),null,'sem documento, null — nem true nem false');});

/* ── MEDIDOR DE PRONTIDÃO (v175) ───────────────────────────────────────────
   O que estes casos protegem: o ponteiro só existe quando há base, o número
   diz de onde veio, e relógio parado não fala do hoje. */
/* dias de relógio recentes o bastante para prontidaoGarmin (4+ com VFC e FC) */
function _relogio(hrv,fc,ini){const o=[];for(let i=(ini||0);i<(ini||0)+20;i++)
  o.push({data:_dAtras(i),hrv:(typeof hrv==='function'?hrv(i):hrv),hrvF:'noite',fc:(typeof fc==='function'?fc(i):fc)});
  return o;}
function _checkin(d,v){return{data:d,sonoQ:v,energia:v,humor:v,dor:6-v,estresse:6-v};}

  a.ok(p.falta.length>=2,'e diz o que falta');
  a.ok(/check-in de hoje/.test(p.falta.join(' ')),'o check-in está entre o que falta');
  a.ok(!/mp-marca/.test(svgMedidorProntidao(null)),'o desenho sai sem a marca que aponta o ponto');});

/* ── FAIXA DE NORMALIDADE E CONTEXTO (v173) ────────────────────────────────
   "VFC 9% abaixo da base" e um numero sem contexto: 9% e ruido em quem
   oscila muito e sinal claro em quem e estavel. A faixa resolve isso. E o
   marcador de contexto impede que viagem e queda de forma virem a mesma
   frase — que e como um alerta perde credibilidade. */
function _hrvDias(n,valor){
  const out=[]; for(let i=0;i<n;i++){
    const d=new Date(2026,9,20-i).toISOString().slice(0,10);
    out.push({data:d,hrv:(typeof valor==='function'?valor(i):valor),hrvF:'noite'});}
  return out;
}

  const f=faixaHRV(g);
  a.eq(f.media,50,'media da base, sem contar hoje');
  a.eq(f.hoje,30,'hoje fica de fora da base mas aparece');
  a.eq(f.posicao,'abaixo','30 esta abaixo da faixa');});

/* ── QUEM FAZ GESTÃO DE EQUIPE (v165) ───────────────────────────────────────
   Decisão do dono do produto, escrita aqui para não se perder: gestão de
   equipe é do TÉCNICO da respectiva equipe, ou do administrador. PRO é atleta
   competitivo — tem espaço próprio, treino pessoal e relatório, e não
   administra ninguém.

   Isto não é preferência de tela: as regras do Firestore publicadas exigem
   `perfil == 'tecnico'` para escrever documentos de equipe. Se o cliente
   voltar a oferecer gestão ao PRO, ele passa a mostrar um botão que o
   servidor recusa — a pior combinação possível, porque falha depois do
   usuário já ter feito o trabalho. */
/* ⚠️ _atleta() cria o usuário com o e-mail do ADMINISTRADOR, então todo teste
   daqui precisa dizer explicitamente de quem está falando — e zerar gestão e
   contexto administrativo, que são estado global e vazam de um teste para o
   outro (foi o que me pegou ao escrever estes). */
function _naoAdmin(perfil){
  _atleta(); S.u.perfil=perfil; S.u.email='rene@x.com'; S.u.equipe='a3';
  S.gestao=false; S.adminOrig=null; S.modoAtleta=false; return S.u;
}
teste('gestão','PRO não administra equipe, nem forçando o estado',a=>{
  _naoAdmin('pro');
  a.ok(!ehAdmin(),'PRO comum não é administrador');
  S.gestao=true;
  a.ok(!ehGestor(),'não vira gestor com S.gestao ligado na marra');
  S.adminOrig={equipe:'a3'};
  a.ok(!ehGestor(),'nem com contexto administrativo forjado');
  S.gestao=false; S.adminOrig=null;});
teste('gestão','o técnico administra a própria equipe',a=>{
  _naoAdmin('tecnico');
  a.ok(ehGestor(),'técnico no comando é gestor');
  S.modoAtleta=true;
  a.ok(!ehGestor(),'e deixa de ser enquanto está na própria área de atleta');
  S.modoAtleta=false;});
teste('gestão','o administrador administra, mesmo sendo PRO',a=>{
  _naoAdmin('pro'); S.u.email=ADMIN_EMAILS[0];
  a.ok(ehAdmin(),'reconhecido pelo e-mail, não pelo perfil');
  a.ok(!ehGestor(),'mas só quando LIGA a gestão — ser admin não tira o chapéu de atleta');
  S.gestao=true;

/* ── ESPELHO: DADOS DE UM ATLETA NÃO VAZAM PARA OUTRO (v151) ────────────────
   O bug mais grave da série: o técnico/PRO abria as marcas de um atleta
   (S.pro passa a apontar para os dados DELE), trocava de chapéu, e o app
   seguia com os dados do outro na vista de atleta — com permissão de gravar
   no pro_ de quem estava olhando. Resultado: marcas de um aparecendo para
   outro, e um currículo ABMN importado em seguida somando-se ao do colega. */
function _espelhoDe(id,meu){
  S.laudoAtleta=id; S._proBak=meu;
  S.pro={_espelho:id,pbs:{'50 livre SC25':24120},
    resultados:[{chave:'abmn_x',comp:'Dele',data:'2025-06-27',dist:50,estilo:'livre',piscina:'SC25',tempo:24120}]};
}
/* _limparContexto mexe na navegação; a suíte não guarda aba/pilha, então
   quem o chama devolve o que estava aberto. */
function _semMexerNaNav(fn){
  const g={aba:S.aba,sub:S.sub,pilha:S.pilha,treino:S.treino,comp:S.comp,
           provaSel:S.provaSel,atletaSel:S.atletaSel};
  try{ fn(); } finally{ Object.assign(S,g); }
}
teste('espelho','trocar de chapéu devolve os meus dados, não os do atleta',a=>{
  const meu={pbs:{'50 peito SC25':31350},resultados:[],marcaMinha:true};
  _espelhoDe('outro',meu);
  _semMexerNaNav(_limparContexto);         /* é o que alternarModoAtleta faz */
  a.eq(S.laudoAtleta,null,'o espelho foi fechado');
  a.ok(S.pro&&S.pro.marcaMinha===true,'S.pro voltou a ser o meu');
  a.ok(!(S.pro&&S.pro._espelho),'sem resíduo de espelho no dado');});
teste('espelho','sem backup, o espelho nunca é devolvido como se fosse meu',a=>{
  _espelhoDe('outro',undefined);
  _semMexerNaNav(_limparContexto);
  a.ok(!(S.pro&&S.pro._espelho),'espelho descartado');
  a.eq((S.pro&&S.pro.resultados||[]).length,0,'pro vazio — a sincronia recarrega o verdadeiro');
  a.ok(S.pro&&S.pro.pbs&&typeof S.pro.pbs==='object','e com a forma certa, para nada quebrar no render');});
teste('espelho','_limparLaudo age mesmo se laudoAtleta já foi zerado',a=>{
  const meu={pbs:{},resultados:[],marcaMinha:true};
  _espelhoDe('outro',meu);
  S.laudoAtleta=null;                      /* o descuido que causou o bug */
  _limparLaudo();
  a.ok(S.pro&&S.pro.marcaMinha===true,'a marca no dado basta para desfazer');});
teste('espelho','a trava de gravação olha a marca no dado',a=>{
  /* salvarPro() é async e toca o banco: aqui travamos a CONDIÇÃO que ela usa,
     que é o que precisa continuar valendo se alguém mexer na navegação. */
  const bloqueia=(laudo,pro)=>!!(laudo||(pro&&pro._espelho));
  a.ok(bloqueia('outro',{}),'bloqueia no modo espelho');
  a.ok(bloqueia(null,{_espelho:'outro'}),'bloqueia só pela marca, sem laudoAtleta');

/* ── CAIXA-PRETA (v153) ─────────────────────────────────────────────────────
   A fotografia do cache antes da sincronia. Testo a DECISÃO: quando avisar,
   quando calar, e que ela nunca confunda a cópia de outra conta com a minha —
   restaurar o pro_ de outra pessoa seria repetir o bug na recuperação. */
function _decideCaixa(cacheId,meuId,cache,agora){
  if(!cache||cacheId!=='pro_'+meuId)return null;
  const falta=[];
  for(const k of COLECOES_PRO){
    const c=Array.isArray(cache[k])?cache[k].length:0;
    const a=Array.isArray(agora&&agora[k])?agora[k].length:0;
    if(c>=3&&a===0)falta.push({campo:k,n:c});
  }
